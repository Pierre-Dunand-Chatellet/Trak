    for (let d = new Date(s.debut.getTime()); ymd(d) <= au && ymd(d) <= State.today; d = addDays(d, 1)) {
      const day = ymd(d);
      if (State.habits.length && State.habits.every((h) => isDone(h.id, day))) full++;
    }

    // Navigation : la saison précédente seulement si le journal remonte jusque-là.
    const premier = premierJourNote();
    const avant = !!premier && premier < du;
    const nav = avant || !enCours ? `<div class="saison-nav" role="group" aria-label="Changer de saison">
        <button type="button" class="btn" data-action="saison-prec" aria-label="Saison précédente"${avant ? "" : " disabled"}>← Précédente</button>
        <button type="button" class="btn" data-action="saison-suiv" aria-label="Saison suivante"${enCours ? " disabled" : ""}>Suivante →</button>
      </div>` : "";

    const nage = State.habits.some((h) => h.dist);
    SaisonVue.semaines = nage ? semainesSaison(s) : [];
    const totalM = SaisonVue.semaines.reduce((a, x) => a + x.m, 0);
    const parfaits = full ? full + " jour" + (full > 1 ? "s" : "") + " parfait" + (full > 1 ? "s" : "") : "Aucun jour parfait";
    const resume = enCours
      ? (nage ? `<strong>${formatDistance(totalM)}</strong> nagés depuis le 1er septembre. ` : "") + parfaits + " depuis le début de la saison."
      : "Du 1er septembre " + s.an + " au 31 août " + (s.an + 1) + " : " + (nage ? `<strong>${formatDistance(totalM)}</strong> nagés, ` : "") + parfaits.toLowerCase() + ".";

    // Volume par semaine : une barre par semaine de la saison (habitudes « Compter les mètres »).
    let volumeHtml = "";
    if (nage) {
      const choisissables = SaisonVue.semaines.filter((x) => !x.futur).length;
      if (SaisonVue.cle !== s.nom || SaisonVue.sel < 0 || SaisonVue.sel >= choisissables) {
        // Au départ : la dernière semaine nagée (ou la semaine en cours si rien n'est noté).
        let sel = choisissables - 1;
        for (let i = choisissables - 1; i >= 0; i--) if (SaisonVue.semaines[i].m) { sel = i; break; }
        SaisonVue.sel = sel;
        SaisonVue.cle = s.nom;
      }
      volumeHtml = `<div class="card vol-carte">
          <p class="eyebrow" style="margin:0 0 4px">Volume nagé par semaine</p>
          ${totalM
            ? `<p class="vol-lecture" id="vol-lecture"></p>
               <div class="vol-graph" id="vol-saison" tabindex="0" role="slider" aria-label="Volume nagé par semaine, saison ${s.nom}" aria-valuemin="1" aria-valuemax="${choisissables}"></div>
               <p class="vol-aide">Survolez ou touchez une barre ; au clavier, les flèches passent d'une semaine à l'autre.</p>`
            : `<p class="p-muted" style="margin:6px 0 0">Aucune distance notée sur cette saison. Notez les mètres d'une séance dans l'écran du jour.</p>`}
        </div>`;
    }

    const streakHtml = enCours ? State.habits.map((h) => {
      const st = streak(h.id), rec = best(h.id);
      return `
      <div class="streak-card">
        <div class="name">${esc(h.name)}</div>
        <div class="num">${st} <span class="unite">semaine${st > 1 ? "s" : ""}</span></div>
        <div class="detail">Record : ${libelleSemaines(rec)}. Objectif : ${objectifDe(h)} j par semaine.</div>
      </div>`;
    }).join("") : "";

    el.innerHTML = `
      <div class="week-head-row saison-tete">
        <h1 class="num">Saison ${s.nom}</h1>
        ${nav}
      </div>
      <p class="p-muted saison-resume">${resume}</p>
      <div class="card year-card">
        <div class="year-inner">
          <div class="month-row">${monthsHtml}</div>
          <div class="year-grid">${colsHtml}</div>
        </div>
      </div>
      <div class="legend-row">
        <span>Aucune</span>${legendHtml}<span>Toutes</span>
        <span class="legend-note">Une case par jour : plus le rouge est foncé, plus vous avez coché d'habitudes ce jour-là.</span>
      </div>
      ${volumeHtml}
      ${enCours ? `<h2 class="saison-h2">Séries en cours</h2>
      <p class="p-muted saison-aide">Une série compte les semaines d'affilée où l'objectif de l'habitude est tenu. La semaine en cours s'ajoute dès que l'objectif y est atteint.</p>
      <div class="streak-grid">${streakHtml || "<p class=\"p-muted\">—</p>"}</div>` : ""}`;

    el.querySelectorAll('[data-action="saison-prec"], [data-action="saison-suiv"]').forEach((b) => b.addEventListener("click", () => {
      State.saisonOffset += b.dataset.action === "saison-prec" ? -1 : 1;
      SaisonVue.vu = false;
      renderYear();
      const suite = el.querySelector('[data-action="' + b.dataset.action + '"]:not([disabled])')
        || el.querySelector('.saison-nav .btn:not([disabled])');
      if (suite) suite.focus();
    }));
    brancherVolumeSaison();
    caleAnnee();
  }

  // Mètres et séances de chaque semaine de la saison s (les colonnes de la grille, lundi → dimanche).
  // Les jours hors saison des semaines du bord ne comptent pas : la somme des barres égale le total.
  function semainesSaison(s) {
    const debut = mondayOf(s.debut);
    const n = Math.round((mondayOf(s.fin) - debut) / (7 * 864e5)) + 1;
    const du = ymd(s.debut), au = ymd(s.fin);
    const semaines = [];
    for (let w = 0; w < n; w++) {
      const lundi = addDays(debut, w * 7), dimanche = addDays(lundi, 6);
      semaines.push({
        de: lundi < s.debut ? s.debut : lundi, a: dimanche > s.fin ? s.fin : dimanche, m: 0, seances: 0,
        futur: ymd(lundi) > State.today, enCours: ymd(lundi) <= State.today && State.today <= ymd(dimanche)
      });
    }
    const dist = {};
    State.habits.forEach((h) => { if (h.dist) dist[h.id] = 1; });
    Object.keys(State.log).forEach((k) => {
      const i = k.lastIndexOf("|");
      const day = k.slice(i + 1);
      if (day < du || day > au || day > State.today || !dist[k.slice(0, i)]) return;
      const e = State.log[k];
      if (!e || e.del || !e.m) return;
      const x = semaines[Math.floor(Math.round((new Date(day + "T12:00:00") - debut) / 864e5) / 7)];
      if (x) { x.m += e.m; x.seances += Math.max(1, seancesDe(e).filter((v) => v > 0).length); }
    });
    return semaines;
  }

  // État du graphique du volume : semaines de la saison affichée et barre choisie.
  // vu = déjà dessiné depuis l'ouverture de l'écran : les barres ne montent qu'au premier tracé.
  const SaisonVue = { semaines: [], sel: -1, cle: "", vu: false };

  function texteSemaine(x) {
    const quand = periodeCourte(x.de, x.a) + (x.enCours ? " (semaine en cours)" : "");
    if (!x.m) return { court: "Rien de noté", reste: quand };
    return { court: formatDistance(x.m), reste: quand + ", " + x.seances + " séance" + (x.seances > 1 ? "s" : "") };
  }
  function formatKm(m) {
    return m ? (m / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " km" : "0";
  }

  // Histogramme SVG dessiné à la largeur réelle de son conteneur (le texte garde sa taille
  // sur téléphone). Sans effet tant que l'écran est caché : redessiné à l'ouverture.
  function dessinerVolumeSaison() {
    const box = document.getElementById("vol-saison");
    if (!box || !box.clientWidth) return;
    const sem = SaisonVue.semaines, N = sem.length;
    if (!N) return;
    // Déjà tracé à cette largeur avec cette semaine choisie : on garde le tracé (et son animation d'entrée).
    const cle = box.clientWidth + "|" + SaisonVue.sel;
    if (box.dataset.cle === cle && box.firstElementChild) return;
    box.dataset.cle = cle;
    const etroit = window.innerWidth <= 560;
    const W = box.clientWidth, H = etroit ? 170 : 210;
    const g = { l: 44, r: 4, t: 22, b: 24 };
    const max = sem.reduce((a, x) => Math.max(a, x.m), 0);
    // Graduations rondes en km : 4 intervalles au plus.
    const pasKm = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100].find((p) => max / 1000 / p <= 4) || 250;
    const pas = pasKm * 1000;
    const haut = Math.max(pas, Math.ceil(max / pas) * pas);
    const pw = (W - g.l - g.r) / N;
    const X = (i) => g.l + i * pw;
    const Y = (m) => g.t + (1 - m / haut) * (H - g.t - g.b);

    let grille = "";
    for (let v = 0; v <= haut; v += pas) {
      const y = Y(v).toFixed(1);
      grille += `<line class="grille" x1="${g.l}" x2="${W - g.r}" y1="${y}" y2="${y}"/><text class="axe" x="${g.l - 8}" y="${y}" dy="4" text-anchor="end">${formatKm(v)}</text>`;
    }
    // Mois sous l'axe : un repère au 1er de chaque mois (un mois sur deux si la place manque).
    let mois = "";
    const unSurDeux = pw * 4.35 < 34;
    sem.forEach((x, i) => {
      // Le 1er d'un mois tombe dans cette semaine quand son dimanche est un 1er à 7.
      const debutMois = i === 0 ? x.de : (x.a.getDate() <= 7 ? x.a : null);
      if (!debutMois) return;
      const rang = (debutMois.getMonth() + 4) % 12; // septembre = 0
      if (unSurDeux && rang % 2) return;
      const xm = X(i).toFixed(1);
      mois += `<line class="repere" x1="${xm}" x2="${xm}" y1="${H - g.b}" y2="${H - g.b + 4}"/><text class="axe" x="${xm}" y="${H - 6}">${MONTHS[debutMois.getMonth()]}</text>`;
    });

    const bas = Y(0);
    let barres = "";
    sem.forEach((x, i) => {
      if (x.futur || !x.m) return;
      const y = Y(x.m);
      const cls = "barre" + (x.enCours ? " en-cours" : "") + (i === SaisonVue.sel ? " sel" : "");
      barres += `<rect class="${cls}" style="animation-delay:${Math.min(i * 6, 320)}ms" x="${(X(i) + pw * 0.14).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1.5, pw * 0.72).toFixed(1)}" height="${Math.max(1, bas - y).toFixed(1)}" rx="${Math.min(2, pw * 0.2).toFixed(1)}"/>`;
    });
    // Repère de la semaine choisie : bande claire derrière, valeur au-dessus de la barre.
    let choix = "", valeur = "";
    const xs = sem[SaisonVue.sel];
    if (xs) {
      choix = `<rect class="bande" x="${X(SaisonVue.sel).toFixed(1)}" y="${g.t - 18}" width="${pw.toFixed(1)}" height="${(bas - g.t + 18).toFixed(1)}"/>`;
      const cx = Math.min(Math.max(X(SaisonVue.sel) + pw / 2, g.l + 18), W - 18);
      const ty = Math.max(12, (xs.m ? Y(xs.m) : bas) - 6);
      valeur = `<text class="valeur" x="${cx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle">${xs.m ? formatKm(xs.m).replace(" km", "") : "0"}</text>`;
    }

    const entree = !SaisonVue.vu;
    SaisonVue.vu = true;
    box.innerHTML = `<svg class="${entree ? "entree" : ""}" viewBox="0 0 ${W} ${H}" height="${H}" aria-hidden="true" focusable="false">${grille}${choix}${barres}${valeur}`
      + `<line class="axe-x" x1="${g.l}" x2="${W - g.r}" y1="${bas.toFixed(1)}" y2="${bas.toFixed(1)}"/>${mois}</svg>`;
    box.dataset.gl = g.l; box.dataset.pw = pw;
    majLectureSaison();
  }

  function majLectureSaison() {
    const box = document.getElementById("vol-saison");
    const lecture = document.getElementById("vol-lecture");
    const x = SaisonVue.semaines[SaisonVue.sel];
    if (!box || !lecture || !x) return;
    const t = texteSemaine(x);
    lecture.innerHTML = `<strong>${esc(t.court)}</strong> ${esc(t.reste)}`;
    box.setAttribute("aria-valuenow", String(SaisonVue.sel + 1));
    box.setAttribute("aria-valuetext", t.court + ", " + t.reste);
  }

  function choisirSemaine(i) {
    const der = SaisonVue.semaines.filter((x) => !x.futur).length - 1;
    i = Math.max(0, Math.min(der, i));
    if (i === SaisonVue.sel) return;
    SaisonVue.sel = i;
    dessinerVolumeSaison();
  }

  // Souris : survol ; doigt : toucher ou glisser le long des barres (le défilement vertical reste libre) ;
  // clavier : flèches, Début, Fin, Page préc./suiv. (4 semaines).
  function brancherVolumeSaison() {
    const box = document.getElementById("vol-saison");
    if (!box) return;
    const indice = (ev) => {
      const r = box.getBoundingClientRect();
      const gl = Number(box.dataset.gl) || 44, pw = Number(box.dataset.pw) || 1;
      return Math.floor((ev.clientX - r.left - gl) / pw);
    };
    box.addEventListener("pointerdown", (ev) => { choisirSemaine(indice(ev)); });
    box.addEventListener("pointermove", (ev) => {
      if (ev.pointerType === "mouse" || ev.buttons) choisirSemaine(indice(ev));
    });
    box.addEventListener("keydown", (ev) => {
      const pas = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageUp: -4, PageDown: 4 }[ev.key];
      if (pas) { ev.preventDefault(); choisirSemaine(SaisonVue.sel + pas); }
      else if (ev.key === "Home") { ev.preventDefault(); choisirSemaine(0); }
      else if (ev.key === "End") { ev.preventDefault(); choisirSemaine(1e6); }
    });
  }

  // Sur un écran étroit la grille de la saison défile de côté : on l'ouvre sur les
  // dernières semaines (aujourd'hui aux trois quarts) plutôt que sur septembre.
  // Sans effet tant que l'onglet est caché (largeur nulle) : rappelé à l'ouverture,
  // qui redessine aussi l'histogramme du volume à la bonne largeur.
  function caleAnnee() {
    dessinerVolumeSaison();
    const carte = document.querySelector("#view-year .year-card");
    const auj = carte && carte.querySelector(".year-cell.auj");
    if (!carte || !auj || !carte.clientWidth) return;
    const x = auj.getBoundingClientRect().left - carte.getBoundingClientRect().left + carte.scrollLeft;
    carte.scrollLeft = Math.max(0, x - carte.clientWidth * 0.75);
  }

  // --- Écran « Réglages » ------------------------------------------------------
  // Ouvert par la roue dentée de l'en-tête (ce n'est pas un onglet de la barre) : habitudes,
  // sauvegarde, compte, et « Vider toutes les données ». « Retour » rouvre l'onglet d'avant.
  function ouvrirReglages() {
    if (State.tab === "reglages") return;
    State.avantReglages = State.tab;
    State.tab = "reglages";
    renderTabs();
    window.scrollTo(0, 0);
    // Le libellé du retour dépend de l'onglet quitté : l'écran a pu être dessiné avant.
    const retour = document.querySelector("#view-reglages .reglages-retour");
    if (retour) retour.innerHTML = `<span aria-hidden="true">←</span> ${esc(libelleRetour())}`;
    const w = document.querySelector("#view-reglages .reglages-wrap");
    if (w) { w.classList.remove("reglages-entre"); void w.offsetWidth; w.classList.add("reglages-entre"); }
    const titre = document.getElementById("reglages-titre");
    if (titre) titre.focus({ preventScroll: true });
  }
  function fermerReglages() {
    if (State.tab !== "reglages") return;
    State.tab = State.avantReglages && State.avantReglages !== "reglages" ? State.avantReglages : "today";
    renderTabs(); retracerCourbe(); caleAnnee();
    window.scrollTo(0, 0);
    document.getElementById("reglages-btn").focus({ preventScroll: true });
  }
  function libelleRetour() {
    const t = State.avantReglages;
    if (t === "week" || t === "year") return "Retour au bilan";
    if (t === "chronos") return "Retour aux chronos";
    return State.jour === State.today ? "Retour à Aujourd'hui" : "Retour au jour affiché";
  }

  function compteReglagesHtml() {
    if (Account.token) {
      return `
        <p class="p-muted">Connecté avec <strong>${esc(Account.email)}</strong> : votre carnet se synchronise entre vos appareils.
          Supprimer le compte efface vos données du serveur ; elles restent sur cet appareil.</p>
        <div class="reglages-actions">
          <button type="button" class="btn" data-action="compte-ouvrir">Gérer le compte</button>
          <button type="button" class="btn btn-alerte" data-action="compte-supprimer">Supprimer mon compte</button>
        </div>`;
    }
    return `
      <p class="p-muted">Pas de compte sur cet appareil : tout reste dans ce navigateur. Un compte, facultatif, synchronise votre carnet entre téléphone et ordinateur.</p>
      <div class="reglages-actions">
        <button type="button" class="btn" data-action="compte-ouvrir">Se connecter</button>
      </div>`;
  }
  // Seule la partie Compte change à la connexion ou à la synchro : on ne redessine qu'elle,
  // pour ne pas effacer un nom d'habitude en cours de saisie.
  function majCompteReglages() {
    const el = document.getElementById("reglages-compte");
    if (el) el.innerHTML = compteReglagesHtml();
  }
  function msgSauvegardeHtml() {
    return State.sauvegardeMsg ? `<p class="form-msg ${State.sauvegardeMsgType}" id="sauvegarde-msg" role="status">${esc(State.sauvegardeMsg)}</p>`
      : `<p class="form-msg" id="sauvegarde-msg" role="status" hidden></p>`;
  }
  function majMsgSauvegarde(msg, type) {
    State.sauvegardeMsg = msg || ""; State.sauvegardeMsgType = type || "";
    const el = document.getElementById("sauvegarde-msg");
    if (!el) return;
    el.className = "form-msg " + State.sauvegardeMsgType;
    el.textContent = State.sauvegardeMsg;
    el.hidden = !State.sauvegardeMsg;
  }

  function renderReglages() {
    const el = document.getElementById("view-reglages");
    const rowsHtml = State.habits.map((h) => `
      <div class="manage-row" data-id="${esc(h.id)}">
        <input class="input" type="text" data-action="name" data-id="${esc(h.id)}" value="${esc(h.name)}" aria-label="Nom de l'habitude">
        <input class="input goal-input" type="number" min="1" max="7" data-action="goal" data-id="${esc(h.id)}" value="${h.goal}" aria-label="Objectif, jours par semaine">
        <span class="manage-unit">j/sem.</span>
        <label class="manage-dist"><input type="checkbox" data-action="dist" data-id="${esc(h.id)}"${h.dist ? " checked" : ""}>Compter les mètres</label>
        <button type="button" class="btn btn-ghost" data-action="delete" data-id="${esc(h.id)}" style="color:var(--color-accent-700)">Supprimer</button>
      </div>`).join("");

    el.innerHTML = `
      <div class="reglages-wrap">
        <button type="button" class="btn btn-ghost reglages-retour" data-action="reglages-retour"><span aria-hidden="true">←</span> ${esc(libelleRetour())}</button>
        <h1 id="reglages-titre" tabindex="-1">Réglages</h1>

        <section class="reglages-bloc" aria-labelledby="rg-habitudes">
          <h2 id="rg-habitudes">Habitudes</h2>
          <p class="p-muted">Le nom, l'objectif en jours par semaine, et pour les séances dans l'eau, la distance nagée.</p>
          <div>${rowsHtml || "<p class=\"p-muted\">Aucune habitude pour l'instant.</p>"}</div>
          <div class="manage-add">
            <input class="input" type="text" id="new-habit-name" placeholder="Nouvelle habitude" aria-label="Nouvelle habitude" value="${esc(State.newName)}">
            <button type="button" class="btn btn-primary" data-action="add">Ajouter</button>
          </div>
        </section>

        <section class="reglages-bloc" aria-labelledby="rg-sauvegarde">
          <h2 id="rg-sauvegarde">Sauvegarde</h2>
          <p class="p-muted">Un fichier avec tout votre carnet : habitudes, jours cochés, mètres et notes, chronos, objectifs et compétitions.
            Gardez-le pour changer d'appareil ou revenir en arrière. Restaurer remplace les données actuelles par celles du fichier.</p>
          <div class="reglages-actions">
            <button type="button" class="btn" data-action="sauvegarder">Télécharger une sauvegarde</button>
            <button type="button" class="btn" data-action="restaurer">Restaurer une sauvegarde</button>
            <input type="file" id="restaurer-fichier" accept=".json,application/json" hidden>
          </div>
          ${msgSauvegardeHtml()}
        </section>

        <section class="reglages-bloc" aria-labelledby="rg-compte">
          <h2 id="rg-compte">Compte</h2>
          <div id="reglages-compte">${compteReglagesHtml()}</div>
        </section>

        <section class="reglages-bloc" aria-labelledby="rg-vider">
          <h2 id="rg-vider">Repartir de zéro</h2>
          <p class="p-muted">Efface habitudes, journal, chronos, objectifs et compétitions sur cet appareil, et sur votre compte si vous êtes connecté. Pensez à télécharger une sauvegarde avant.</p>
          <div class="reglages-actions">
            <button type="button" class="btn btn-alerte" data-action="reset">Vider toutes les données</button>
          </div>
        </section>
      </div>`;
  }

  // Gestes de l'écran Réglages, branchés une seule fois sur la section (le contenu est redessiné).
  function wireReglages() {
    document.getElementById("reglages-btn").addEventListener("click", () => {
      if (State.tab === "reglages") fermerReglages(); else ouvrirReglages();
    });
    const el = document.getElementById("view-reglages");
    el.addEventListener("change", (ev) => {
      const inp = ev.target;
      const act = inp.dataset && inp.dataset.action;
      if (inp.id === "restaurer-fichier") {
        const f = inp.files && inp.files[0];
        inp.value = "";
        if (f) restaurerFichier(f);
        return;
      }
      const h = act && findHabit(inp.dataset.id);
      if (!h) return;
      if (act === "name") {
        h.name = inp.value;
        touchHabit(h); renderToday(); renderWeek(); renderYear();
      } else if (act === "goal") {
        const v = Math.max(1, Math.min(7, Number(inp.value) || 1));
        h.goal = v;
        inp.value = v;
        // L'objectif juge aussi les séries et les objectifs tenus : écran du jour et saison à refaire.
        touchHabit(h); renderToday(); renderYear();
      } else if (act === "dist") {
        h.dist = inp.checked ? 1 : 0;
        touchHabit(h); renderToday(); renderWeek(); renderYear();
      }
    });
    el.addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-action]");
      if (!b) return;
      const act = b.dataset.action;
      if (act === "reglages-retour") fermerReglages();
      else if (act === "delete") {
        const id = b.dataset.id;
        const idx = State.habits.findIndex((h) => h.id === id);
        if (idx < 0) return;
        if (!window.confirm("Supprimer « " + State.habits[idx].name + " » ? Ses jours cochés ne seront plus comptés.")) return;
        State.habits.splice(idx, 1);
        State.gone[id] = { u: nowMs() };
        State.dirtyH[id] = 1;
        persist(); Sync.schedule(); renderReglages(); renderToday(); renderWeek(); renderYear();
      } else if (act === "add") {
        const nameInput = document.getElementById("new-habit-name");
        const n = nameInput.value.trim();
        if (!n) return;
        // Identifiant aleatoire : deux appareils peuvent creer une habitude
        // en meme temps sans se retrouver avec le meme id.
        const id = "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const h = { id: id, name: n.slice(0, 120), goal: 5, dist: 0, pos: nextPos(), u: nowMs() };
        State.habits.push(h);
        State.newName = "";
        touchHabit(h); renderReglages(); renderToday(); renderWeek(); renderYear();
      } else if (act === "reset") {
        const warning = Account.token
          ? "Vider toutes les données de votre compte Trak ? Cela effacera aussi vos autres appareils synchronisés."
          : "Vider toutes les données enregistrées sur cet appareil ?";
        if (!window.confirm(warning)) return;
        wipeAll();
        majMsgSauvegarde("");
      } else if (act === "sauvegarder") telechargerSauvegarde();
      else if (act === "restaurer") document.getElementById("restaurer-fichier").click();
      else if (act === "compte-ouvrir") openAccount();
      else if (act === "compte-supprimer") openAccount("delete");
    });
    el.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && ev.target.id === "new-habit-name") {
        ev.preventDefault();
        el.querySelector('[data-action="add"]').click();
      }
    });
  }

  // --- Sauvegarde complète dans un fichier JSON ---------------------------------
  // Format 1 : { app: "trak", format: 1, date (ISO), habits: [{ id, name, goal, dist, pos }],
  // log: { "habitude|AAAA-MM-JJ": { done, note, m, s? } }, times: { id: { ev, pool, t, d, comp, lieu, sp, cid? } },
  // items: { id: { k, data } } (objectifs k « obj », compétitions k « comp ») }.
  // Ni horodatages ni marques de synchro : à la restauration, tout est daté du moment et part au compte.
  const SAUVEGARDE_FORMAT = 1;
  const RE_JOUR = /^\d{4}-\d{2}-\d{2}$/;
  const RE_CID = /^[A-Za-z0-9:_-]{1,64}$/;

  function donneesSauvegarde() {
    const habits = State.habits.map((h) => ({ id: h.id, name: h.name, goal: objectifDe(h), dist: h.dist ? 1 : 0, pos: h.pos || 0 }));
    const log = {};
    Object.keys(State.log).sort().forEach((k) => {
      const e = State.log[k];
      if (!e || e.del || !(e.done || e.note || e.m)) return;
      const x = { done: e.done ? 1 : 0, note: e.note || "", m: e.m || 0 };
      if (Array.isArray(e.s) && e.s.length > 1) x.s = e.s.slice();
      log[k] = x;
    });
    const times = {};
    Object.keys(State.times).forEach((id) => {
      const x = State.times[id];
      if (!x || x.del) return;
      const t = { ev: x.ev, pool: x.pool === 50 ? 50 : 25, t: x.t, d: x.d, comp: contexteDe(x.comp), lieu: x.lieu || "", sp: x.sp || [] };
      if (x.cid) t.cid = x.cid;
      times[id] = t;
    });
    const items = {};
    Object.keys(State.items).forEach((id) => {
      const x = State.items[id];
      if (x && !x.del) items[id] = { k: x.k, data: x.data || {} };
    });
    return { app: "trak", format: SAUVEGARDE_FORMAT, date: new Date().toISOString(), habits: habits, log: log, times: times, items: items };
  }

  function resumeSauvegarde(d) {
    const nb = (n, un, plusieurs) => n + " " + (n > 1 ? plusieurs : un);
    const items = Object.keys(d.items).map((id) => d.items[id].k);
    const jours = new Set(Object.keys(d.log).map((k) => k.slice(k.lastIndexOf("|") + 1))).size;
    return [
      nb(d.habits.length, "habitude", "habitudes"),
      nb(jours, "jour noté", "jours notés"),
      nb(Object.keys(d.times).length, "chrono", "chronos"),
      nb(items.filter((k) => k === "obj").length, "objectif", "objectifs"),
      nb(items.filter((k) => k === "comp").length, "compétition", "compétitions")
    ].join(", ");
  }

  function telechargerSauvegarde() {
    const d = donneesSauvegarde();
    try {
      const blob = new Blob([JSON.stringify(d, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "trak-sauvegarde-" + State.today + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      majMsgSauvegarde("Sauvegarde téléchargée : " + resumeSauvegarde(d) + ".", "ok");
    } catch (e) {
      majMsgSauvegarde("Le téléchargement a échoué sur ce navigateur.", "err");
    }
  }

  // Lit et nettoie un fichier de sauvegarde. Renvoie { ok: true, d } ou { ok: false, err }.
  // Mêmes bornes que le serveur (store.php) : un fichier retouché à la main ne peut rien glisser d'invalide.
  function validerSauvegarde(texte) {
    const etranger = { ok: false, err: "Ce fichier n'est pas une sauvegarde Trak. Choisissez un fichier « trak-sauvegarde-….json » téléchargé depuis les Réglages." };
    let o;
    try { o = JSON.parse(texte); } catch (e) { return etranger; }
    if (!o || typeof o !== "object" || o.app !== "trak" || !Number.isInteger(o.format) || o.format < 1
      || !Array.isArray(o.habits) || !o.log || typeof o.log !== "object" || Array.isArray(o.log)) return etranger;
    if (o.format > SAUVEGARDE_FORMAT) {
      return { ok: false, err: "Cette sauvegarde vient d'une version plus récente de Trak. Rechargez la page pour la mettre à jour, puis réessayez." };
    }
    const objet = (x) => x && typeof x === "object" && !Array.isArray(x) ? x : {};
    const entier = (x, min, max) => Math.max(min, Math.min(max, Math.round(Number(x) || 0)));
    const texteBorne = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
    const idValide = (x) => typeof x === "string" && x.length > 0 && x.length <= 64 && x.indexOf("|") < 0;

    const d = { date: typeof o.date === "string" ? o.date : "", habits: [], log: {}, times: {}, items: {} };
    const vus = new Set();
    o.habits.forEach((h, i) => {
      if (!h || !idValide(h.id) || vus.has(h.id)) return;
      vus.add(h.id);
      d.habits.push({ id: h.id, name: texteBorne(h.name, 120) || "Habitude", goal: entier(h.goal, 1, 7), dist: h.dist ? 1 : 0,
        pos: h.pos == null ? i : entier(h.pos, 0, 9999) });
    });
    Object.keys(o.log).forEach((k) => {
      const i = k.lastIndexOf("|");
      const e = o.log[k];
      if (i < 1 || !idValide(k.slice(0, i)) || !RE_JOUR.test(k.slice(i + 1)) || !e || typeof e !== "object") return;
      const x = { done: !!e.done, note: texteBorne(e.note, 2000), m: entier(e.m, 0, 100000) };
      const s = nettoyerSeances(e.s).filter((v) => v > 0);
      if (s.length > 1) { x.s = s; x.m = totalSeances(s); }
      if (x.done || x.note || x.m) d.log[k] = x;
    });
    const times = objet(o.times);
    Object.keys(times).forEach((id) => {
      const x = times[id];
      if (!idValide(id) || !x || typeof x !== "object" || typeof x.ev !== "string" || !/^[a-z0-9-]{1,20}$/.test(x.ev)
        || typeof x.d !== "string" || !RE_JOUR.test(x.d)) return;
      const t = entier(x.t, 0, 360000);
      if (!t) return;
      const c = { ev: x.ev, pool: Number(x.pool) === 50 ? 50 : 25, t: t, d: x.d, comp: contexteDe(Number(x.comp) || 0),
        lieu: texteBorne(x.lieu, 120), sp: Array.isArray(x.sp) ? x.sp.slice(0, 30).map((v) => entier(v, 1, 360000)) : [] };
      if (typeof x.cid === "string" && RE_CID.test(x.cid)) c.cid = x.cid;
      d.times[id] = c;
    });
    const items = objet(o.items);
    Object.keys(items).forEach((id) => {
      const x = items[id];
      if (!idValide(id) || !x || typeof x.k !== "string" || !/^[a-z]{1,12}$/.test(x.k)) return;
      const data = objet(x.data);
      if (JSON.stringify(data).length > 4000) return;
      d.items[id] = { k: x.k, data: data };
    });
    return { ok: true, d: d };
  }

  function restaurerFichier(f) {
    if (f.size > 8 * 1024 * 1024) {
      majMsgSauvegarde("Ce fichier est bien trop gros pour une sauvegarde Trak.", "err");
      return;
    }
    const lecteur = new FileReader();
    lecteur.onerror = () => majMsgSauvegarde("Impossible de lire ce fichier.", "err");
    lecteur.onload = () => {
      const r = validerSauvegarde(String(lecteur.result || ""));
      if (!r.ok) { majMsgSauvegarde(r.err, "err"); return; }
      const quand = r.d.date && !isNaN(new Date(r.d.date)) ? dateCourte(ymd(new Date(r.d.date))) : "";
      const question = "Restaurer la sauvegarde" + (quand ? " du " + quand : "") + " ?\n\n" + resumeSauvegarde(r.d) + ".\n\n"
        + "Elle remplacera toutes les données de cet appareil"
        + (Account.token ? ", et celles de votre compte Trak (vos autres appareils suivront)." : ".");
      if (!window.confirm(question)) return;
      appliquerSauvegarde(r.d);
      majMsgSauvegarde("Sauvegarde restaurée : " + resumeSauvegarde(r.d) + "."
        + (Account.token ? " Envoi au compte en cours." : ""), "ok");
    };
    lecteur.readAsText(f);
  }

  // Remplace les données locales par celles de la sauvegarde. Ce qui n'y est pas est supprimé
  // (avec une trace, comme « Vider toutes les données »), tout est daté de maintenant et mis en
  // file d'envoi : une fois connecté, le compte et les autres appareils prennent la sauvegarde.
  function appliquerSauvegarde(d) {
    const t = nowMs();
    const ids = new Set(d.habits.map((h) => h.id));
    State.habits.forEach((h) => { if (!ids.has(h.id)) { State.gone[h.id] = { u: t }; State.dirtyH[h.id] = 1; } });
    State.habits = d.habits.map((h) => Object.assign({}, h, { u: t })).sort((a, b) => (a.pos - b.pos) || String(a.id).localeCompare(String(b.id)));
    State.habits.forEach((h) => { delete State.gone[h.id]; State.dirtyH[h.id] = 1; });

    Object.keys(State.log).forEach((k) => {
      if (!d.log[k]) { State.log[k] = { done: false, note: "", del: 1, u: t }; State.dirtyE[k] = 1; }
    });
    Object.keys(d.log).forEach((k) => { State.log[k] = Object.assign({}, d.log[k], { u: t }); State.dirtyE[k] = 1; });

    Object.keys(State.times).forEach((id) => {
      if (!d.times[id]) { State.times[id] = { del: 1, u: t }; State.dirtyT[id] = 1; }
    });
    Object.keys(d.times).forEach((id) => { State.times[id] = Object.assign({}, d.times[id], { u: t }); State.dirtyT[id] = 1; });

    Object.keys(State.items).forEach((id) => {
      if (!d.items[id]) { State.items[id] = { del: 1, u: t }; State.dirtyI[id] = 1; }
    });
    Object.keys(d.items).forEach((id) => { State.items[id] = { k: d.items[id].k, data: d.items[id].data, u: t }; State.dirtyI[id] = 1; });

    Object.assign(State.chrono, { sel: "", edit: null, compEdit: null, annuler: null, saisie: null, formOuvert: false, brouillon: null });
    State.openNote = null; State.seancePlus = null;
    persist(); Sync.schedule(200); renderAll();
  }

  // Après la suppression du compte, les données restent ici : tout est remis en file d'envoi,
  // pour partir vers un compte qu'on créerait plus tard sur cet appareil.
  function toutAEnvoyer() {
    State.habits.forEach((h) => { State.dirtyH[h.id] = 1; });
    Object.keys(State.log).forEach((k) => { if (!State.log[k].del) State.dirtyE[k] = 1; });
    Object.keys(State.times).forEach((id) => { if (!State.times[id].del) State.dirtyT[id] = 1; });
    Object.keys(State.items).forEach((id) => { if (!State.items[id].del) State.dirtyI[id] = 1; });
    persist();
  }

  function wipeAll() {
    const t = nowMs();
    State.habits.forEach((h) => { State.gone[h.id] = { u: t }; State.dirtyH[h.id] = 1; });
    Object.keys(State.log).forEach((k) => {
      State.log[k] = { done: false, note: "", del: 1, u: t };
      State.dirtyE[k] = 1;
    });
    Object.keys(State.times).forEach((id) => { State.times[id] = { del: 1, u: t }; State.dirtyT[id] = 1; });
    Object.keys(State.items).forEach((id) => { State.items[id] = { del: 1, u: t }; State.dirtyI[id] = 1; });
    State.chrono.sel = "";
    State.habits = defaultHabits();
    State.habits.forEach((h) => { h.u = t; delete State.gone[h.id]; State.dirtyH[h.id] = 1; });
    persist(); Sync.schedule(200); renderAll();
  }

  function renderAll() {
    renderTabs();
    renderToday();
    renderWeek();
    renderYear();
    renderChronos();
    renderReglages();
    placerVisite();
  }

  /* =========================================================================
     Chronos : les temps realises, par epreuve et par bassin (25 et 50 m ne se
     comparent pas). Le meilleur temps d'un couple epreuve + bassin est le
     record personnel (RP) ; la courbe montre la progression.
     ========================================================================= */
  function tempsVivants() {
    return Object.keys(State.times).map((id) => Object.assign({ id: id }, State.times[id])).filter((x) => !x.del);
  }
  // Temps d'une epreuve dans un bassin, du plus ancien au plus recent ; chacun
  // marque rp s'il battait tous ceux d'avant (le premier compte comme RP).
  // Les relais (départ lancé) en sont exclus : ils ne comptent ni pour le RP ni pour la courbe.
  function serie(ev, pool) {
    const liste = tempsVivants().filter((x) => x.ev === ev && x.pool === pool && x.comp !== 2)
      .sort((a, b) => a.d.localeCompare(b.d) || a.u - b.u);
    let meilleur = Infinity;
    liste.forEach((x) => { x.rp = x.t < meilleur; if (x.rp) meilleur = x.t; });
    return liste;
  }
  // Tous les temps d'une épreuve dans un bassin, relais compris, du plus ancien au plus récent ;
  // rp vient de serie (un relais ne l'est jamais).
  function historique(ev, pool) {
    const rp = new Set(serie(ev, pool).filter((x) => x.rp).map((x) => x.id));
    return tempsVivants().filter((x) => x.ev === ev && x.pool === pool)
      .sort((a, b) => a.d.localeCompare(b.d) || a.u - b.u)
      .map((x) => Object.assign(x, { rp: rp.has(x.id) }));
  }
  // Une épreuve qui n'a que des relais garde sa carte (best = null) : ses temps restent consultables.
  function records() {
    const groupes = {};
    tempsVivants().forEach((x) => { const k = x.ev + "|" + x.pool; (groupes[k] = groupes[k] || []).push(x); });
    return Object.keys(groupes).map((k) => {
      const [ev, pool] = [k.split("|")[0], Number(k.split("|")[1])];
      const s = serie(ev, pool);
      const best = s.length ? s.reduce((m, x) => (x.t < m.t ? x : m), s[0]) : null;
      return { cle: k, ev: ev, pool: pool, best: best, n: s.length, relais: groupes[k].length - s.length,
        premier: s[0] || null, dernier: s[s.length - 1] || null };
    }).sort((a, b) => {
      const ia = EPREUVES.findIndex((e) => e.id === a.ev), ib = EPREUVES.findIndex((e) => e.id === b.ev);
      return ia - ib || a.pool - b.pool;
    });
  }

  // --- Objectifs et competitions : « items » synchronises ------------------
  function itemsDe(kind) {
    return Object.keys(State.items).map((id) => Object.assign({ id: id }, State.items[id]))
      .filter((x) => !x.del && x.k === kind && x.data);
  }
  function ecrireItem(id, k, data) {
    State.items[id] = { k: k, data: data, u: nowMs() };
    State.dirtyI[id] = 1;
    persist(); Sync.schedule();
  }
  function retirerItem(id) {
    if (!State.items[id]) return;
    State.items[id] = { del: 1, u: nowMs() };
    State.dirtyI[id] = 1;
    persist(); Sync.schedule();
  }
  function cleObjectif(ev, pool) { return "obj:" + ev + ":" + pool; }
  function objectif(ev, pool) {
    const x = State.items[cleObjectif(ev, pool)];
    return x && !x.del && x.data && x.data.t > 0 ? x.data.t : null;
  }
  // « Objectif 1:05.00 · encore 1.51 s », ou « atteint ».
  function texteObjectif(best, obj) {
    if (!obj) return "";
    if (!best) return "Objectif " + formatTemps(obj);
    return best <= obj ? "Objectif " + formatTemps(obj) + " atteint"
      : "Objectif " + formatTemps(obj) + " · encore " + ((best - obj) / 100).toFixed(2) + " s";
  }
  function meilleurTemps(ev, pool) {
    const s = serie(ev, pool);
    return s.length ? Math.min.apply(null, s.map((x) => x.t)) : null;
  }
  function competsAVenir() {
    return itemsDe("comp").filter((c) => c.data.d >= State.today).sort((a, b) => a.data.d.localeCompare(b.data.d));
  }
  // Compétitions passées : la plus récente en premier. Elles restent, avec les temps qui y ont été nagés.
  function competsPassees() {
    return itemsDe("comp").filter((c) => c.data.d < State.today).sort((a, b) => b.data.d.localeCompare(a.data.d));
  }
  function joursAvant(d) {
    return Math.round((new Date(d + "T12:00:00") - new Date(State.today + "T12:00:00")) / 864e5);
  }
  function competDe(cid) {
    const c = cid && State.items[cid];
    return c && !c.del && c.k === "comp" && c.data ? Object.assign({ id: cid }, c) : null;
  }
  // Temps rattachés à une compétition, dans l'ordre des épreuves.
  function tempsDeCompet(cid) {
    const ordre = (ev) => EPREUVES.findIndex((e) => e.id === ev);
    return tempsVivants().filter((x) => x.cid === cid).sort((a, b) => ordre(a.ev) - ordre(b.ev) || a.d.localeCompare(b.d));
  }
  // Épreuves engagées qui n'ont encore aucun temps rattaché à la compétition.
  function epreuvesSansTemps(c) {
    const faites = new Set(tempsDeCompet(c.id).map((x) => x.ev));
    return (c.data.evs || []).filter((ev) => !faites.has(ev));
  }
  // Compétition dont on attend les temps : finie depuis 7 jours au plus (le jour même compris),
  // rappel pas fermé, au moins une épreuve engagée sans temps. La plus récente d'abord.
  function competASaisir() {
    return itemsDe("comp").filter((c) => {
      const j = joursAvant(c.data.d);
      return j <= 0 && j >= -7 && !c.data.fermee && epreuvesSansTemps(c).length;
    }).sort((a, b) => b.data.d.localeCompare(a.data.d))[0] || null;
  }
  // Compétitions à 7 jours au plus d'une date, la plus proche d'abord (choix du rattachement).
  function competsProches(d) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return [];
    const t = new Date(d + "T12:00:00").getTime();
    const ecart = (c) => Math.abs(new Date(c.data.d + "T12:00:00").getTime() - t) / 864e5;
    return itemsDe("comp").filter((c) => ecart(c) <= 7.5).sort((a, b) => ecart(a) - ecart(b) || b.data.d.localeCompare(a.data.d));
  }
  function libelleJours(n) { return n === 0 ? "Aujourd'hui" : n === 1 ? "Demain" : "J-" + n; }

  // --- Temps de passage ---------------------------------------------------
  // Temps cumules tous les 50 m, separes par des espaces, « ; » ou « / » (la virgule
  // sert aussi de decimale : « 31,20, 1:06,51 » marche grace a l'espace qui suit).
  // Le temps final peut etre repete en dernier : il est retire. null = illisible.
  function parsePassages(texte, ev, t) {
    const brut = String(texte || "").trim();
    if (!brut) return [];
    const morceaux = brut.replace(/,\s+/g, " ").split(/[\s;/|]+/).filter(Boolean);
    const sp = [];
    for (let i = 0; i < morceaux.length; i++) {
      const x = parseTemps(morceaux[i]);
      if (!x) return null;
      sp.push(x);
    }
    if (sp[sp.length - 1] === t) sp.pop();
    if (sp.length > Number(ev.split("-")[0]) / 50 - 1) return null;
    for (let i = 0; i < sp.length; i++) if (sp[i] >= t || (i && sp[i] <= sp[i - 1])) return null;
    return sp;
  }
  // Passages complets : le temps de chaque 50 m ; incomplets : les cumules tels quels.
  function textePassages(x) {
    if (!x.sp || !x.sp.length) return "";
    if (x.sp.length === Number(x.ev.split("-")[0]) / 50 - 1) {
      const tous = x.sp.concat([x.t]);
      return "Par 50 m : " + tous.map((v, i) => formatTemps(v - (i ? tous[i - 1] : 0))).join(" · ");
    }
    return "Passages : " + x.sp.map(formatTemps).join(" · ");
  }

  function nouvelId(prefixe) {
    return prefixe + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function mouvementReduit() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function amener(el) {
    if (el) el.scrollIntoView({ block: "start", behavior: mouvementReduit() ? "auto" : "smooth" });
  }

  // Ajoute un temps, ou enregistre la modification du temps C.edit : même identifiant,
  // u = maintenant, et la version d'avant est gardée pour « Annuler la modification ».
  function enregistrerTemps() {
    const C = State.chrono;
    const val = (id) => { const c = document.getElementById(id); return c ? c.value : ""; };
    const ev = val("ch-ev");
    const pool = Number(val("ch-pool")) === 50 ? 50 : 25;
    const d = val("ch-date");
    const comp = contexteDe(Number(val("ch-comp")));
    const lieu = val("ch-lieu").trim().slice(0, 120);
    const cid = competDe(val("ch-cid")) ? val("ch-cid") : "";
    C.ev = ev; C.pool = pool; C.comp = comp;
    // Ce qui a ete tape survit au redessin en cas d'erreur.
    C.brouillon = { temps: val("ch-temps"), d: d, lieu: val("ch-lieu"), pass: val("ch-pass"), cid: cid };
    const erreur = (m, champ) => {
      C.msg = m; C.msgType = "err"; C.annuler = null; renderChronos();
      const c = document.getElementById(champ);
      if (c) c.focus();
    };
    const t = parseTemps(C.brouillon.temps);
    if (!epreuvePossible(ev, pool)) return erreur(MSG_100_4N, "ch-pool");
    if (!t) return erreur("Temps illisible. Écrivez par exemple 1:05.32, 1,05,32 ou 31,84.", "ch-temps");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > State.today) return erreur("Date invalide (pas dans le futur).", "ch-date");
    const sp = parsePassages(C.brouillon.pass, ev, t);
    if (!sp) return erreur("Passages illisibles : les temps cumulés tous les 50 m, du plus petit au plus grand, par exemple 31.20 1:06.51.", "ch-pass");

    const avant = C.edit && State.times[C.edit] && !State.times[C.edit].del ? State.times[C.edit] : null;
    const id = avant ? C.edit : nouvelId("t");
    const ancienRp = meilleurTemps(ev, pool);
    const x = { ev: ev, pool: pool, t: t, d: d, comp: comp, lieu: lieu, sp: sp, u: nowMs() };
    if (cid) x.cid = cid;
    State.times[id] = x;
    State.dirtyT[id] = 1;
    C.sel = ev + "|" + pool; C.vuePool = pool; C.histoTout = false;
    C.brouillon = null;
    const nom = nomEpreuve(ev) + " (" + pool + " m)";
    if (avant) {
      const copie = Object.assign({}, avant);
      delete copie.tx;
      C.annuler = { type: "t", id: id, avant: copie };
      C.edit = null; C.formOuvert = false;
      C.msg = "Temps modifié : " + nom + ", " + formatTemps(t) + "."; C.msgType = "ok";
    } else {
      C.annuler = null;
      if (comp === 2) { C.msg = "Relais noté : " + formatTemps(t) + " sur " + nom + ", hors record et hors objectif (départ lancé)."; C.msgType = ""; }
      else if (ancienRp === null) { C.msg = "Premier temps sur " + nom + " : " + formatTemps(t) + "."; C.msgType = "ok"; }
      else if (t < ancienRp) { C.msg = "Record personnel sur " + nom + " : " + formatTemps(t) + " (" + formatEcart(t - ancienRp) + ")."; C.msgType = "ok"; }
      else { C.msg = formatTemps(t) + " noté. Record : " + formatTemps(ancienRp) + " (" + formatEcart(t - ancienRp) + ")."; C.msgType = ""; }
      const obj = objectif(ev, pool);
      if (comp !== 2 && obj && t <= obj && (ancienRp === null || ancienRp > obj)) C.msg += " Objectif de " + formatTemps(obj) + " atteint !";
    }
    persist(); Sync.schedule(); renderChronos(); renderToday();
    const suite = avant ? document.querySelector('[data-action="annuler-modif"]') : document.getElementById("ch-temps");
    if (suite) suite.focus();
  }

  function ouvrirEditionTemps(id) {
    const x = State.times[id];
    if (!x || x.del) return;
    const C = State.chrono;
    C.edit = id; C.formOuvert = true; C.annuler = null; C.msg = "";
    C.ev = x.ev; C.pool = x.pool; C.comp = contexteDe(x.comp);
    C.brouillon = { temps: formatTemps(x.t), d: x.d, lieu: x.lieu || "", pass: (x.sp || []).map(formatTemps).join(" "), cid: x.cid || "" };
    renderChronos();
    amener(document.getElementById("chrono-form"));
    const champ = document.getElementById("ch-temps");
    if (champ) champ.focus({ preventScroll: true });
  }
  // Ferme le formulaire (et abandonne une modification en cours, rien n'est écrit).
  function fermerFormTemps() {
    const C = State.chrono;
    const edite = C.edit;
    C.edit = null; C.brouillon = null; C.formOuvert = false; C.msg = "";
    renderChronos(); retracerCourbe();
    const retour = (edite && document.querySelector('[data-action="chrono-edit"][data-id="' + CSS.escape(edite) + '"]'))
      || document.querySelector('[data-action="chrono-form-ouvrir"]');
    if (retour) retour.focus();
  }

  // Défait la dernière modification d'un temps ou d'une compétition (nouvelle version, u = maintenant).
  function annulerModif() {
    const C = State.chrono, A = C.annuler;
    if (!A) return;
    C.annuler = null;
    if (A.type === "t") {
      const x = Object.assign({}, A.avant, { u: nowMs() });
      State.times[A.id] = x;
      State.dirtyT[A.id] = 1;
      C.sel = x.ev + "|" + x.pool; C.vuePool = x.pool;
      C.msg = "Modification annulée : le temps est revenu à " + formatTemps(x.t) + " du " + dateCourte(x.d) + "."; C.msgType = "";
      persist(); Sync.schedule();
    } else {
      ecrireItem(A.id, "comp", A.avant);
      C.compMsg = "Modification annulée : « " + A.avant.nom + " » est revenue comme avant."; C.compMsgType = "";
    }
    renderChronos(); retracerCourbe(); renderToday();
    const m = document.querySelector(A.type === "t" ? "#chrono-retour" : "#compet-retour");
    if (m) m.focus();
  }

  function supprimerTemps(id) {
    const x = State.times[id];
    if (!x || x.del) return;
    if (!window.confirm("Supprimer le temps " + formatTemps(x.t) + " du " + dateCourte(x.d) + " ?")) return;
    const C = State.chrono;
    State.times[id] = { del: 1, u: nowMs() };
    State.dirtyT[id] = 1;
    if (C.edit === id) { C.edit = null; C.brouillon = null; C.formOuvert = false; }
    C.msg = ""; C.annuler = null;
    persist(); Sync.schedule(); renderChronos(); retracerCourbe(); renderToday();
  }

  function enregistrerObjectif(ev, pool) {
    const C = State.chrono;
    const brut = document.getElementById("obj-temps").value;
    const t = parseTemps(brut);
    if (!t) {
      C.objMsg = "Objectif illisible, par exemple 1:05.00."; C.objMsgType = "err"; renderChronos();
      const c = document.getElementById("obj-temps");
      if (c) { c.value = brut; c.focus(); }
      return;
    }
    ecrireItem(cleObjectif(ev, pool), "obj", { t: t });
    C.objMsg = "Objectif enregistré."; C.objMsgType = "ok";
    renderChronos(); renderToday();
  }

  // Ajoute une compétition, ou enregistre la modification de C.compEdit (même identifiant).
  // Temps limites facultatifs, par épreuve engagée : data.lim = { "100-pap": 6600 }.
  function enregistrerCompet() {
    const C = State.chrono;
    const form = document.getElementById("compet-form");
    const val = (id) => document.getElementById(id).value;
    const msg = document.getElementById("co-msg");
    const err = (m, champ) => {
      msg.textContent = m; msg.className = "form-msg err"; msg.hidden = false;
      if (champ) champ.focus();
    };
    const nom = val("co-nom").trim().slice(0, 80);
    const d = val("co-date");
    if (!nom) return err("Donnez un nom à la compétition.", document.getElementById("co-nom"));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return err("Date invalide.", document.getElementById("co-date"));
    const pool = Number(val("co-pool")) === 50 ? 50 : 25;
    const evs = Array.from(form.querySelectorAll('input[name="co-ev"]:checked')).map((i) => i.value)
      .filter((ev) => epreuvePossible(ev, pool));
    const lim = {};
    for (const ev of evs) {
      const champ = form.querySelector('[data-lim="' + ev + '"]');
      const brut = champ ? champ.value.trim() : "";
      if (!brut) continue;
      const t = parseTemps(brut);
      if (!t) return err(nomEpreuve(ev) + " : temps limite illisible, par exemple 1:05.00.", champ);
      lim[ev] = t;
    }
    const ancien = competDe(C.compEdit);
    const id = ancien ? C.compEdit : nouvelId("c");
    const data = Object.assign({}, ancien ? ancien.data : {}, { nom: nom, d: d, lieu: val("co-lieu").trim().slice(0, 80), pool: pool, evs: evs });
    if (Object.keys(lim).length) data.lim = lim; else delete data.lim;
    ecrireItem(id, "comp", data);
    C.compOuvert = false;
    if (ancien) {
      C.annuler = { type: "c", id: id, avant: JSON.parse(JSON.stringify(ancien.data)) };
      C.compEdit = null;
      C.compMsg = "« " + nom + " » modifiée.";
    } else {
      C.annuler = null;
      C.compMsg = "« " + nom + " » ajoutée.";
    }
    C.compMsgType = "ok";
    renderChronos(); renderToday();
    const m = document.getElementById("compet-retour");
    if (m) m.focus();
  }
  function ouvrirEditionCompet(id) {
    if (!competDe(id)) return;
    const C = State.chrono;
    C.compEdit = id; C.compOuvert = true; C.annuler = null; C.compMsg = ""; C.vue = "compets";

  // --- Après une compétition : saisie rapide de tous ses temps -------------
  function ouvrirSaisie(cid) {
    if (!competDe(cid)) return;
    const C = State.chrono;
    C.saisie = cid; C.saisieMsg = ""; C.saisieB = null; C.vue = "compets";
    State.tab = "chronos"; renderTabs(); renderChronos();
    window.scrollTo(0, 0);
    const champ = document.querySelector('#saisie-form [data-role="temps"]') || document.getElementById("saisie-form");
    if (champ) champ.focus();
  }
  function fermerSaisie() {
    const C = State.chrono, id = C.saisie;
    C.saisie = null; C.saisieMsg = ""; C.saisieB = null;
    renderChronos();
    const retour = document.querySelector('[data-action="saisie-ouvrir"][data-id="' + CSS.escape(id || "") + '"]')
      || document.querySelector('[data-action="chronos-vue"][data-vue="compets"]');
