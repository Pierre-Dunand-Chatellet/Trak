  function renderAccountButton() {
    const dot = document.getElementById("sync-dot");
    const label = document.getElementById("account-label");
    if (!Account.token) {
      dot.className = "sync-dot";
      label.textContent = "Se connecter";
      return;
    }
    dot.className = "sync-dot " + (Sync.state === "busy" ? "busy" : Sync.state === "err" ? "err" : "ok");
    label.textContent = Account.email;
  }

  function serverFieldHtml() {
    if (!AccountUI.showServer) {
      return `<p class="switch-mode"><button type="button" data-act="show-server">Changer l'adresse du serveur</button></p>`;
    }
    return `
      <label class="field">
        <span>Adresse du serveur</span>
        <input class="input" type="url" id="ac-base" placeholder="https://exemple.fr/trak/api/" value="${esc(Account.base)}">
      </label>
      <p class="switch-mode" style="margin-top:-4px">Le dossier <code>api/</code> déposé sur votre hébergement.</p>`;
  }

  function msgHtml() {
    if (!AccountUI.msg) return "";
    return `<p class="form-msg ${AccountUI.msgType}">${esc(AccountUI.msg)}</p>`;
  }

  function renderAccountModal() {
    const el = document.getElementById("account-body");
    el.innerHTML = Account.token ? accountViewHtml() : authViewHtml();
    wireAccountModal(el);
  }

  function authViewHtml() {
    const isRegister = AccountUI.mode === "register";
    return `
      <h2 id="account-title">${isRegister ? "Créer un compte" : "Se connecter"}</h2>
      <p class="p-muted">Vos habitudes et vos jours cochés vous suivent sur tous vos appareils.</p>
      <form id="ac-form">
        <label class="field">
          <span>Adresse e-mail</span>
          <input class="input" type="email" id="ac-email" autocomplete="username" required value="${esc(Account.lastEmail)}">
        </label>
        <label class="field">
          <span>Mot de passe</span>
          <input class="input" type="password" id="ac-pass" autocomplete="${isRegister ? "new-password" : "current-password"}" required minlength="8">

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" ${AccountUI.busy ? "disabled" : ""}>

          </button>
          <button type="button" class="btn btn-ghost" data-act="close">Annuler</button>
        </div>
      </form>
      ${msgHtml()}
      <p class="switch-mode">
        ${isRegister ? "Vous avez déjà un compte ?" : "Pas encore de compte ?"}

  function devicesHtml() {
    if (AccountUI.devices === null) return `<p class="switch-mode">Chargement des appareils…</p>`;

      <h2 style="font-size:15px;margin:22px 0 0">Appareils connectés</h2>

            <span>${esc(d.label)}</span>

      </ul>
      ${AccountUI.devices.length > 1

  function accountViewHtml() {
    if (AccountUI.mode === "password") {
      return `
        <h2 id="account-title">Changer le mot de passe</h2>
        <p class="p-muted">Vos autres appareils devront se reconnecter.</p>
        <form id="ac-form">

            <span>Mot de passe actuel</span>
            <input class="input" type="password" id="ac-current" autocomplete="current-password" required>

      <div class="modal-actions" style="margin-top:12px">
        <button type="button" class="btn btn-primary" data-act="sync" ${Sync.state === "busy" ? "disabled" : ""}>Synchroniser maintenant</button>
        <button type="button" class="btn btn-ghost" data-act="close">Fermer</button>
      </div>
      ${msgHtml()}
      ${devicesHtml()}
      <div class="modal-actions" style="margin-top:22px">
        <button type="button" class="btn btn-ghost" data-act="password" style="padding-left:0">Changer le mot de passe</button>
        <button type="button" class="btn btn-ghost spacer" data-act="logout" style="color:var(--color-accent-700)">Se déconnecter</button>
      </div>
      ${serverFieldHtml()}`;
  }

  function wireAccountModal(el) {
    const form = el.querySelector("#ac-form");
    if (form) form.addEventListener("submit", (ev) => { ev.preventDefault(); submitAccountForm(); });

    el.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
      const act = b.dataset.act;
      if (act === "close") closeAccount();
      else if (act === "switch") { AccountUI.mode = AccountUI.mode === "register" ? "login" : "register"; AccountUI.msg = ""; renderAccountModal(); }
      else if (act === "show-server") { AccountUI.showServer = true; renderAccountModal(); }
      else if (act === "password") { AccountUI.mode = "password"; AccountUI.msg = ""; renderAccountModal(); }
      else if (act === "back") { AccountUI.mode = "account"; AccountUI.msg = ""; renderAccountModal(); }
      else if (act === "sync") { commitServerField(); Sync.run(); }
      else if (act === "logout") doLogout();
      else if (act === "revoke") doRevokeOthers();
    }));
  }

  function commitServerField() {
    const input = document.getElementById("ac-base");
    if (!input) return;
    const v = input.value.trim();
    if (v && v !== Account.base) { Account.base = v; saveAccount(); }
  }

  function setBusy(busy, msg, type) {
    AccountUI.busy = busy;
    AccountUI.msg = msg || "";
    AccountUI.msgType = type || "";
    renderAccountModal();
  }

  async function submitAccountForm() {
    if (AccountUI.busy) return;
    commitServerField();

    if (AccountUI.mode === "password") return doChangePassword();

    const email = (document.getElementById("ac-email").value || "").trim();
    const pass = document.getElementById("ac-pass").value || "";
    const isRegister = AccountUI.mode === "register";

    if (isRegister && pass.length < 8) return setBusy(false, "8 caractères minimum.", "err");
    if (!Account.base) {
      return setBusy(false, "Cette page est ouverte en local : la synchronisation a besoin du site en ligne, ou d'une adresse renseignée dans SERVER_URL en haut du fichier.", "err");
    }

    setBusy(true, "");
    try {
      const data = await api("auth.php", { action: isRegister ? "register" : "login", email: email, password: pass });

      // Changement de compte sur cet appareil : on repart des données du compte
      // rejoint plutôt que de mélanger les deux historiques.
      if (Account.lastEmail && Account.lastEmail !== data.user.email) resetLocalData();

      Account.token = data.token;
      Account.email = data.user.email;
      Account.lastSync = 0;
      saveAccount();

      AccountUI.mode = "account";
      setBusy(false, "");
      renderAccountButton();
      await Sync.run();
      loadDevices();
    } catch (e) {
      setBusy(false, e.message, "err");
    }
  }

  function resetLocalData() {
    State.habits = defaultHabits();
    State.log = {};
    State.gone = {};
    State.dirtyH = {};
    State.dirtyE = {};
    persist();
  }

  async function doChangePassword() {
    const current = document.getElementById("ac-current").value || "";
    const next = document.getElementById("ac-pass").value || "";
    if (next.length < 8) return setBusy(false, "8 caractères minimum.", "err");

    setBusy(true, "");
    try {
      await api("auth.php", { action: "password", current: current, password: next });
      AccountUI.mode = "account";
      setBusy(false, "Mot de passe modifié. Les autres appareils ont été déconnectés.", "ok");
      loadDevices();
    } catch (e) {
      setBusy(false, e.message, "err");
    }
  }

  async function doLogout() {
    const pending = pendingCount();
    if (pending && !window.confirm(pending + " modification(s) ne sont pas encore synchronisées. Se déconnecter quand même ?")) return;
    setBusy(true, "");
    try { await api("auth.php", { action: "logout" }); } catch (e) { /* on se déconnecte localement de toute façon */ }
    forgetSession();
    AccountUI.mode = "login";
    AccountUI.devices = null;
    Sync.setState("idle");
    setBusy(false, "Vous êtes déconnecté. Vos données restent sur cet appareil.", "ok");
    renderAccountButton();
  }

  async function doRevokeOthers() {
    setBusy(true, "");
    try {
      const data = await api("auth.php", { action: "revoke_others" });
      setBusy(false, data.revoked ? data.revoked + " appareil(s) déconnecté(s)." : "Aucun autre appareil connecté.", "ok");
      loadDevices();
    } catch (e) {
      setBusy(false, e.message, "err");
    }
  }

  async function loadDevices() {
    if (!Account.token) return;
    AccountUI.devices = null;
    try {
      const data = await api("auth.php", { action: "devices" });
      AccountUI.devices = data.devices || [];
    } catch (e) {
      AccountUI.devices = [];
    }
    if (isModalOpen()) renderAccountModal();
  }

  // --- Déclencheurs de synchronisation -------------------------------------
  function wireAccount() {
    document.getElementById("account-btn").addEventListener("click", () => openAccount());
    document.getElementById("account-modal").addEventListener("click", (ev) => {
      if (ev.target.id === "account-modal") closeAccount();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && isModalOpen()) closeAccount();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Account.token) {
        // Le jour a pu changer pendant que l'onglet dormait.
        State.today = ymd(new Date());
        Sync.schedule(100);
      }
    });
    window.addEventListener("online", () => Sync.schedule(200));
    window.addEventListener("focus", () => Sync.schedule(400));
    setInterval(() => { if (!document.hidden) Sync.schedule(0); }, 60000);
  }

  /* =========================================================================
     Visite guidee : explique chaque onglet a la premiere ouverture. Elle
     bascule sur l'onglet concerne et met en evidence la zone decrite.
     Relancable avec le bouton « ? » de l'en-tete.
     ========================================================================= */
  const VKEY = "trak.visite.v1";
  const VISITE = [
    { tab: "today", titre: "Bienvenue sur Trak",
      texte: "Trak vous aide à tenir vos habitudes, un jour après l'autre. Voici un petit tour des écrans : une minute, pas plus." },
    { tab: "today", cible: "#view-today .today-grid > div:first-child", titre: "Aujourd'hui",
      texte: "Cochez le rond d'une habitude dès qu'elle est faite. « + note » garde un mot sur la journée. Sous chaque habitude s'affiche votre série : le nombre de jours d'affilée." },
    { tab: "today", cible: "#mascotte-carte", titre: "Votre mascotte",
      texte: "Elle dort tant que rien n'est coché, sourit quand vous avancez et jubile quand la journée est complète. Vos meilleures séries lui débloquent des couleurs et des accessoires : bouton « Personnaliser »." },
    { tab: "week", cible: "#view-week .week-table-wrap", titre: "Semaine",
      texte: "Toute la semaine d'un coup d'œil. Une case oubliée ? Cliquez-la pour cocher un jour passé. Les flèches remontent aux semaines précédentes." },
    { tab: "year", cible: "#view-year .year-card", titre: "Année",
      texte: "Une case par jour : plus le vert est foncé, plus la journée était remplie. En dessous, la série en cours et le record de chaque habitude." },
    { tab: "manage", cible: "#view-manage .manage-wrap", titre: "Habitudes",
      texte: "Ajoutez, renommez ou supprimez vos habitudes, et réglez combien de jours par semaine vous visez pour chacune." },
    { tab: "today", cible: "#account-btn", titre: "Sur tous vos appareils",
      texte: "Facultatif : avec un compte, vos habitudes se synchronisent entre téléphone et ordinateur. Sans compte, tout reste dans ce navigateur." },
    { tab: "today", cible: "#aide-btn", titre: "C'est parti !",
      texte: "Ce bouton relance cette visite quand vous voulez." }
  ];
  const Visite = { i: -1 };

  function visiteActive() { return Visite.i >= 0; }

  function lancerVisite() {
    if (isModalOpen()) closeAccount();
    if (isMascotteOuverte()) fermerMascotte();
    document.getElementById("visite").hidden = false;
    allerEtape(0);
  }

  function finirVisite() {
    Visite.i = -1;
    document.getElementById("visite").hidden = true;
    try { localStorage.setItem(VKEY, "1"); } catch (e) { /* stockage indisponible */ }
    State.tab = "today"; renderTabs();
    window.scrollTo(0, 0);
    document.getElementById("aide-btn").focus();
  }

  function allerEtape(i) {
    Visite.i = i;
    const e = VISITE[i];
    if (State.tab !== e.tab) { State.tab = e.tab; renderTabs(); }
    const der = i === VISITE.length - 1;
    const points = VISITE.map((_, k) => `<span class="${k === i ? "actif" : ""}"></span>`).join("");
    const t = tenueEffective(etatMascotte().record);
    const bulle = document.getElementById("visite-bulle");
    bulle.innerHTML = `
      ${e.cible ? "" : mascotteSVG({ humeur: "ravie", couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 84, decoratif: true })}
      <p class="visite-etape">${i === 0 ? "Visite guidée" : `Étape ${i} sur ${VISITE.length - 1}`}</p>
      <h2 id="visite-titre">${esc(e.titre)}</h2>
      <p class="visite-texte">${esc(e.texte)}</p>
      <div class="visite-points" aria-hidden="true">${points}</div>
      <div class="visite-actions">
        ${der ? "" : `<button type="button" class="btn btn-ghost" data-v="passer">Passer</button>`}
        <span class="spacer"></span>
        ${i > 0 ? `<button type="button" class="btn" data-v="prec">Précédent</button>` : ""}
        <button type="button" class="btn btn-primary" data-v="suiv">${i === 0 ? "C'est parti" : der ? "Terminer" : "Suivant"}</button>
      </div>`;
    const cible = e.cible && document.querySelector(e.cible);
    // Sur telephone la bulle occupe le bas de l'ecran : on remonte la zone en haut.
    if (cible) cible.scrollIntoView({ block: window.innerWidth <= 560 ? "start" : "center", behavior: "instant" });
    else window.scrollTo(0, 0);
    placerVisite();
    bulle.querySelector('[data-v="suiv"]').focus();
  }

  // Place le trou sur la cible et la bulle dessous, sinon dessus, sinon en bas.
  function placerVisite() {
    if (!visiteActive()) return;
    const e = VISITE[Visite.i];
    const fond = document.getElementById("visite");
    const trou = document.getElementById("visite-trou");
    const bulle = document.getElementById("visite-bulle");
    const cible = e.cible && document.querySelector(e.cible);
    const r = cible ? cible.getBoundingClientRect() : null;
    const vw = window.innerWidth, vh = window.innerHeight;
    const sansCible = !r || !r.width;
    fond.classList.toggle("sans-cible", sansCible);
    if (sansCible) {
      bulle.style.left = Math.max(16, (vw - bulle.offsetWidth) / 2) + "px";
      bulle.style.top = Math.max(16, (vh - bulle.offsetHeight) / 2) + "px";
      return;
    }
    const m = 8;
    const top = Math.max(r.top - m, 4), bas = Math.min(r.bottom + m, vh - 4);
    trou.style.left = (r.left - m) + "px";
    trou.style.top = top + "px";
    trou.style.width = (r.width + 2 * m) + "px";
    trou.style.height = Math.max(0, bas - top) + "px";
    const bw = bulle.offsetWidth, bh = bulle.offsetHeight, ecart = 14;
    const auMilieu = Math.min(Math.max(16, r.left + r.width / 2 - bw / 2), vw - bw - 16);
    const enFace = Math.min(Math.max(8, top), vh - bh - 8);
    let x = auMilieu, y;
    if (bas + ecart + bh <= vh - 8) y = bas + ecart;
    else if (top - ecart - bh >= 8) y = top - ecart - bh;
    // Zone trop haute pour loger la bulle dessus ou dessous : on la met a cote.
    else if (r.right + m + ecart + bw <= vw - 16) { x = r.right + m + ecart; y = enFace; }
    else if (r.left - m - ecart - bw >= 16) { x = r.left - m - ecart - bw; y = enFace; }
    else y = Math.max(8, vh - bh - 16);
    bulle.style.left = x + "px";
    bulle.style.top = y + "px";
  }

  function wireVisite() {
    document.getElementById("aide-btn").addEventListener("click", lancerVisite);
    const bulle = document.getElementById("visite-bulle");
    bulle.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-v]");
      if (!b) return;
      if (b.dataset.v === "passer") finirVisite();
      else if (b.dataset.v === "prec") allerEtape(Visite.i - 1);
      else if (Visite.i === VISITE.length - 1) finirVisite();
      else allerEtape(Visite.i + 1);
    });
    document.addEventListener("keydown", (ev) => {
      if (!visiteActive()) return;
      if (ev.key === "Escape") { ev.preventDefault(); finirVisite(); return; }
      if (ev.key === "ArrowRight" && Visite.i < VISITE.length - 1) { ev.preventDefault(); allerEtape(Visite.i + 1); return; }
      if (ev.key === "ArrowLeft" && Visite.i > 0) { ev.preventDefault(); allerEtape(Visite.i - 1); return; }
      if (ev.key !== "Tab") return;
      // Le focus reste dans la bulle tant que la visite est ouverte.
      const f = Array.from(bulle.querySelectorAll("button"));
      const dedans = bulle.contains(document.activeElement);
      if (ev.shiftKey && (!dedans || document.activeElement === f[0])) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && (!dedans || document.activeElement === f[f.length - 1])) { ev.preventDefault(); f[0].focus(); }
    });
    let attente = 0;
    const replacer = () => { cancelAnimationFrame(attente); attente = requestAnimationFrame(placerVisite); };
    window.addEventListener("resize", replacer);
    window.addEventListener("scroll", replacer, { passive: true });
  }

  document.querySelectorAll(".tabs .btn").forEach((b) => {
    b.addEventListener("click", () => { State.tab = b.dataset.tab; renderTabs(); });
  });

  load();
  chargerMascotte();
  loadAccount();
  renderAll();
  wireAccount();
  wireMascotte();
  wireVisite();
  renderAccountButton();
  if (Account.token) Sync.run();
  // Premiere ouverture sur cet appareil : la visite se lance d'elle-meme.
  let visiteVue = true;
  try { visiteVue = localStorage.getItem(VKEY) === "1"; } catch (e) { /* stockage indisponible */ }
  if (!visiteVue) lancerVisite();
})();
</script>
