        + `<ellipse cx="50" cy="68.8" rx="3.8" ry="2.4" fill="#ef8c7a"/>`;
    } else {
      yeux = `<ellipse class="m-encre" cx="38" cy="53" rx="4.3" ry="5.6"/><ellipse class="m-encre" cx="62" cy="53" rx="4.3" ry="5.6"/>`
        + `<circle cx="39.6" cy="51" r="1.6" fill="#fff"/><circle cx="63.6" cy="51" r="1.6" fill="#fff"/>`;
      bouche = `<path class="m-trait" stroke-width="2.8" d="M45 62 Q50 67 55 62"/>`;
    }
    const visage = `<ellipse class="m-joue" cx="28" cy="64" rx="6" ry="3.6"/><ellipse class="m-joue" cx="72" cy="64" rx="6" ry="3.6"/>`
      + `<g class="m-yeux">${yeux}</g>${bouche}`;

    // Devant le corps : l'accessoire.
    let devant = "";
    if (acc.id === "echarpe") {
      devant = `<path d="M15 68 Q50 86 85 68 L86.5 77 Q50 96 13.5 77 Z" fill="#d9573b"/>`
        + `<path d="M29 74.5 L28.5 83.5 M50 77.5 L50 86.5 M71 74.5 L71.5 83.5" stroke="#f6c7a4" stroke-width="2.6" stroke-linecap="round"/>`
        + `<path d="M60 82 L71 79.5 L74 95 L63.5 97 Z" fill="#b8452f"/>`
        + `<path d="M64.5 97 L64 99.5 M68.8 96.2 L68.8 98.7 M73 95.3 L73.3 97.8" stroke="#b8452f" stroke-width="1.6" stroke-linecap="round"/>`;
    } else if (acc.id === "lunettes") {
      devant = `<g fill="#fff" fill-opacity=".18" stroke="#2b2620" stroke-width="2.6" stroke-linecap="round">`
        + `<circle cx="38" cy="53" r="9"/><circle cx="62" cy="53" r="9"/>`
        + `<path fill="none" d="M47 52 Q50 49.5 53 52 M29.2 51 L16 47 M70.8 51 L84 47"/></g>`;
    } else if (acc.id === "chapeau") {
      devant = `<g transform="rotate(-8 50 22)">`
        + `<ellipse cx="50" cy="23" rx="23" ry="5" fill="#2b2620"/>`
        + `<path d="M37 22 L39 4 Q50 1 61 4 L63 22 Q50 25 37 22 Z" fill="#40382f"/>`
        + `<path d="M37.6 15.5 Q50 18.5 62.4 15.5 L63 22 Q50 25 37 22 Z" fill="#e79a3a"/>`
        + `<path class="m-feuille" d="M58 17 Q63 10 70 12 Q66 18 58 17 Z"/></g>`;
    } else if (acc.id === "couronne") {
      devant = `<g stroke="#b8861a" stroke-width="1.5" stroke-linejoin="round" fill="#f2c230">`
        + `<path d="M32 27 L30 10 L40.5 18.5 L50 6 L59.5 18.5 L70 10 L68 27 Q50 30.5 32 27 Z"/>`
        + `<circle cx="30" cy="10" r="2.6"/><circle cx="50" cy="6" r="2.8"/><circle cx="70" cy="10" r="2.6"/></g>`
        + `<circle cx="50" cy="21.5" r="3" fill="#d9573b"/>`
        + `<circle cx="40" cy="23" r="1.9" fill="#72a6d9"/><circle cx="60" cy="23" r="1.9" fill="#72a6d9"/>`;
    } else if (acc.id === "cape") {
      devant = `<path d="M20 69 Q50 84 80 69" fill="none" stroke="#93361f" stroke-width="2.6" stroke-linecap="round"/>`
        + `<circle cx="50" cy="76.5" r="3.8" fill="#f2c230" stroke="#b8861a" stroke-width="1.3"/>`;
    }

    // Autour : zzz si elle dort, etincelles si elle est doree (grandes tailles seulement).
    let autour = "";
    if (details && humeur === "endormie") {
      autour += `<g class="m-z"><path class="m-trait" stroke-width="2.2" d="M76 18 H83 L76 26 H83"/>`
        + `<path class="m-trait" stroke-width="1.8" d="M86 6 H91 L86 12 H91"/></g>`;
    }
    if (details && coul.id === "dore") {
      autour += `<path class="m-etincelle" d="M90 24.4 L91.6 28.4 L95.6 30 L91.6 31.6 L90 35.6 L88.4 31.6 L84.4 30 L88.4 28.4 Z" fill="#f6dc85" stroke="#c7962a" stroke-width=".8"/>`
        + `<path class="m-etincelle" d="M10 35.8 L11.2 38.8 L14.2 40 L11.2 41.2 L10 44.2 L8.8 41.2 L5.8 40 L8.8 38.8 Z" fill="#f6dc85" stroke="#c7962a" stroke-width=".8"/>`;
    }
    const sol = details ? `<ellipse cx="50" cy="97" rx="27" ry="3" fill="#2b2620" opacity=".1"/>` : "";

    const label = "Mascotte " + coul.adj + " " + humeur + (acc.avec ? ", avec " + acc.avec : "");
    const a11y = o.decoratif ? `aria-hidden="true" focusable="false"` : `role="img" aria-label="${esc(label)}"`;
    const cls = "mascotte humeur-" + humeur + (o.fixe ? " fixe" : "") + (o.saute ? " saute" : "");
    return `<svg class="${cls}" viewBox="0 0 100 100" width="${taille}" height="${taille}" ${a11y}`
      + ` style="--m-corps:${coul.corps};--m-ombre:${coul.ombre};--m-clair:${coul.clair}">`
      + `${sol}<g class="m-saut"><g class="m-balance">${derriere}${corps}${pousse}${visage}${devant}</g></g>${autour}</svg>`;
  }

  function palierAtteint(km) {
    let p = 0;
    M_PALIERS.forEach((x) => { if (x.palier <= km) p = x.palier; });
    return p;
  }
  function prochainPalier(niveau) {
    for (let i = 0; i < M_PALIERS.length; i++) if (M_PALIERS[i].palier > niveau) return M_PALIERS[i];
    return null;
  }
  // metres / km : nagés depuis le 1er septembre ; niveau : plus haut palier débloqué
  // (celui de la saison, ou plus haut s'il a été atteint une saison passée sur cet appareil).
  function etatMascotte() {
    const total = State.habits.length;
    const fait = State.habits.filter((h) => isDone(h.id, State.today)).length;
    const humeur = !total || !fait ? "endormie" : fait === total ? "ravie" : "contente";
    const metres = metresSaison();
    const km = metres / 1000;
    return {
      total: total, fait: fait, humeur: humeur, metres: metres, km: km,
      niveau: Math.max(Mascotte.dernierPalier || 0, palierAtteint(km)),
      nage: State.habits.some((h) => h.dist)
    };
  }
  // Ce qui est reellement porte. Un choix verrouille (donnees pas encore
  // synchronisees...) laisse place au defaut, sans que le choix soit oublie.
  function tenueEffective(niveau) {
    const c = trouverTenue(M_COULEURS, Mascotte.couleur);
    const a = trouverTenue(M_ACCESSOIRES, Mascotte.accessoire);
    return {
      couleur: c && c.palier <= niveau ? c : M_COULEURS[0],
      accessoire: a && a.palier <= niveau ? a : M_ACCESSOIRES[0]
    };
  }

  function chargerMascotte() {
    try {
      const d = JSON.parse(localStorage.getItem(MKEY) || "null");
      if (d && typeof d === "object") {
        if (trouverTenue(M_COULEURS, d.couleur)) Mascotte.couleur = d.couleur;
        if (trouverTenue(M_ACCESSOIRES, d.accessoire)) Mascotte.accessoire = d.accessoire;
        // Paliers en km depuis le 2026-11-16 (avant : en jours, puis en semaines de série) :
        // sans unite "km", le palier est recalculé en silence.
        if (d.unite === "km" && typeof d.dernierPalier === "number" && isFinite(d.dernierPalier)) Mascotte.dernierPalier = Math.max(0, d.dernierPalier);
      }
    } catch (e) { /* stockage illisible : on repart du defaut */ }
    // Premier passage avec les paliers en km : ce qui est déjà acquis est noté
    // sans toast, sinon on fêterait d'un coup des semaines de kilomètres.
    if (Mascotte.dernierPalier === null) {
      Mascotte.dernierPalier = palierAtteint(metresSaison() / 1000);
      sauverMascotte();
    }
  }
  function sauverMascotte() {
    try {
      localStorage.setItem(MKEY, JSON.stringify({
        couleur: Mascotte.couleur, accessoire: Mascotte.accessoire, dernierPalier: Mascotte.dernierPalier, unite: "km"
      }));
    } catch (e) { /* ignore */ }
  }

  // Appelee a chaque renderToday. Le toast ne part que si le palier vient d'une
  // coche ou de mètres notés ici : ce qui arrive par la synchro ou au chargement est
  // noté en silence (le toast a déjà eu lieu sur l'appareil où l'on a noté).
  // Une nouvelle saison repart de 0 km, mais dernierPalier reste : rien n'est reverrouillé.
  function majMascotte(etat) {
    const atteint = palierAtteint(etat.km);
    if (atteint > Mascotte.dernierPalier) {
      const nouveaux = M_PALIERS.filter((p) => p.palier > Mascotte.dernierPalier && p.palier <= etat.km);
      Mascotte.dernierPalier = atteint;
      sauverMascotte();
      if (Mascotte.action && nouveaux.length) afficherToast(nouveaux, atteint);
    }
    majMascotteEntete(etat);
    Mascotte.action = false;
    Mascotte.saute = false;
  }

  // En-tete : hors des sections, donc jamais recree par les rendus. On ne remplace
  // le SVG que si l'humeur ou la tenue change, pour ne pas relancer ses animations.
  function majMascotteEntete(etat) {
    const el = document.getElementById("mascotte-entete");
    const t = tenueEffective(etat.niveau);
    const cle = etat.humeur + "|" + t.couleur.id + "|" + t.accessoire.id;
    if (cle !== Mascotte.cleEntete) {
      Mascotte.cleEntete = cle;
      el.innerHTML = mascotteSVG({ humeur: etat.humeur, couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 36, saute: Mascotte.saute });
    } else if (Mascotte.saute && el.firstElementChild) {
      rejouerSaut(el.firstElementChild);
    }
  }
  function rejouerSaut(svg) {
    svg.classList.remove("saute");
    void svg.getBoundingClientRect(); // oblige le navigateur a oublier l'ancien saut
    svg.classList.add("saute");
  }

  // Carte compacte, en bas de l'écran du jour : l'humeur se lit sur le dessin,
  // le texte dit où en sont les kilomètres et le prochain cadeau.
  function renderMascotteCarte(etat) {
    const el = document.getElementById("mascotte-carte");
    if (!el) return;
    etat = etat || etatMascotte();
    const t = tenueEffective(etat.niveau);
    const suivant = prochainPalier(etat.niveau);
    const km = etat.metres ? formatDistance(etat.metres) : "0 km";
    const titre = etat.nage ? km + " nagés cette saison" : "Votre mascotte";
    const detail = !etat.nage ? "Ses tenues se débloquent avec les kilomètres : cochez « Compter les mètres » pour une habitude dans les Réglages."
      : suivant ? "Prochain cadeau : " + suivant.le + " à " + kmPalier(suivant.palier) + "."
      : "Toutes les tenues sont débloquées.";
    el.innerHTML = `
      <div class="mascotte-card-img">${mascotteSVG({ humeur: etat.humeur, couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 72, saute: Mascotte.saute })}</div>
      <div class="mascotte-card-texte">
        <p class="mascotte-km">${esc(titre)}</p>
        <p class="mascotte-record">${esc(detail)}</p>
        <button type="button" class="btn" data-action="mascotte-perso">Personnaliser</button>
      </div>`;
    el.querySelector('[data-action="mascotte-perso"]').addEventListener("click", ouvrirMascotte);
  }

  // --- Modale « Personnaliser » -------------------------------------------
  function isMascotteOuverte() { return !document.getElementById("mascotte-modal").hidden; }

  function ouvrirMascotte() {
    if (isModalOpen()) closeAccount();
    Mascotte.retourFocus = document.activeElement;
    masquerToast();
    document.getElementById("mascotte-modal").hidden = false;
    renderMascotteModal();
    const cible = document.querySelector("#mascotte-body input:checked") || document.querySelector("#mascotte-body button");
    if (cible) cible.focus();
  }
  function fermerMascotte() {
    document.getElementById("mascotte-modal").hidden = true;
    // Le bouton d'origine a pu etre redessine (ou le toast avoir disparu) :
    // on retombe alors sur le bouton de la carte, s'il est visible.
    let cible = Mascotte.retourFocus;
    if (!cible || !document.body.contains(cible) || !cible.offsetParent) {
      cible = document.querySelector('[data-action="mascotte-perso"]');
    }
    if (cible && cible.offsetParent) cible.focus();
    Mascotte.retourFocus = null;
  }

  function dessinVignette(couleur, accessoire) {
    return mascotteSVG({ humeur: "contente", couleur: couleur, accessoire: accessoire, taille: 52, fixe: true, decoratif: true });
  }
  function optionTenue(nom, item, choisi, niveau, dessin, dataAttr) {
    const verrou = item.palier > niveau;
    const info = verrou ? kmPalier(item.palier) + " requis" : item.palier ? kmPalier(item.palier) : "Dès le départ";
    return `<label class="tenue-option${verrou ? " verrouille" : ""}">
        <input class="sr-only" type="radio" name="${nom}" value="${item.id}"${choisi ? " checked" : ""}${verrou ? " disabled" : ""}>
        <span class="tenue-carte">
          <span ${dataAttr}>${dessin}</span>
          <span class="tenue-nom">${esc(item.nom)}</span>
          <span class="tenue-info">${info}</span>
        </span>
      </label>`;
  }

  function renderMascotteModal() {
    const el = document.getElementById("mascotte-body");
    const etat = etatMascotte();
    const t = tenueEffective(etat.niveau);
    const suivant = prochainPalier(etat.niveau);
    const kmSaison = (Math.floor(etat.km * 10) / 10).toLocaleString("fr-FR");

    let progression;
    if (suivant) {
      const pct = Math.min(100, Math.round(etat.km / suivant.palier * 100));
      const manque = Math.max(0, suivant.palier * 1000 - etat.metres);
      progression = `
        <div class="goal-head"><span>Prochain : ${esc(suivant.le)}</span><span class="count">${kmSaison} / ${kmPalier(suivant.palier)}</span></div>
        <div class="goal-bar-bg" role="progressbar" aria-label="Kilomètres de la saison vers le prochain cadeau" aria-valuemin="0" aria-valuemax="${suivant.palier}" aria-valuenow="${Math.floor(etat.km * 10) / 10}"><div class="goal-bar" style="width:${pct}%"></div></div>
        <p class="mascotte-note">${etat.nage ? "Encore " + formatDistance(manque) + " à nager cette saison pour le débloquer." : "Aucune habitude ne compte les mètres : cochez « Compter les mètres » dans les Réglages."}</p>`;
    } else {
      progression = `<p class="mascotte-note">Tout est débloqué : 1 000 km dans une saison, chapeau bas.</p>`;
    }

    const couleursHtml = M_COULEURS.map((c) =>
      optionTenue("m-couleur", c, c.id === t.couleur.id, etat.niveau, dessinVignette(c.id, "aucun"), "")).join("");
    const accessoiresHtml = M_ACCESSOIRES.map((a) =>
      optionTenue("m-accessoire", a, a.id === t.accessoire.id, etat.niveau, dessinVignette(t.couleur.id, a.id), `data-acc="${a.id}"`)).join("");

    el.innerHTML = `
      <h2 id="mascotte-title">Personnaliser la mascotte</h2>
      <p class="p-muted">Les tenues se débloquent avec les kilomètres nagés depuis le 1er septembre (cette saison : ${kmSaison} km). Une tenue débloquée le reste, même la saison suivante. Votre choix reste propre à cet appareil.</p>
      <div class="mascotte-apercu" id="mascotte-apercu">${mascotteSVG({ humeur: "contente", couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 140 })}</div>
      <div class="mascotte-progression">${progression}</div>
      <fieldset class="tenue-groupe"><legend>Couleur</legend><div class="tenue-grille">${couleursHtml}</div></fieldset>
      <fieldset class="tenue-groupe"><legend>Accessoire</legend><div class="tenue-grille">${accessoiresHtml}</div></fieldset>
      <div class="modal-actions"><button type="button" class="btn btn-primary" data-act="fermer">Terminé</button></div>`;

    el.querySelectorAll('input[type="radio"]').forEach((inp) => inp.addEventListener("change", () => {
      if (inp.name === "m-couleur") Mascotte.couleur = inp.value; else Mascotte.accessoire = inp.value;
      sauverMascotte();
      majApresChoix(inp.name === "m-couleur");
    }));
    el.querySelector('[data-act="fermer"]').addEventListener("click", fermerMascotte);
  }

  // Apres un choix : on ne redessine que l'apercu, les vignettes d'accessoires
  // (si la couleur a change) et la mascotte hors modale, le focus reste en place.
  function majApresChoix(couleurChangee) {
    const etat = etatMascotte();
    const t = tenueEffective(etat.niveau);
    document.getElementById("mascotte-apercu").innerHTML =
      mascotteSVG({ humeur: "contente", couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 140 });
    if (couleurChangee) {
      document.querySelectorAll("#mascotte-body [data-acc]").forEach((s) => {
        s.innerHTML = dessinVignette(t.couleur.id, s.dataset.acc);
      });
    }
    renderMascotteCarte(etat);
    majMascotteEntete(etat);
  }

  // --- Toast de deblocage --------------------------------------------------
  function listeFr(mots) {
    if (mots.length < 2) return mots.join("");
    return mots.slice(0, -1).join(", ") + " et " + mots[mots.length - 1];
  }

  function afficherToast(nouveaux, niveau) {
    const zone = document.getElementById("mascotte-toast");
    const t = tenueEffective(niveau);
    // Apercu : la tenue actuelle avec les nouveautes enfilees.
    const essai = { couleur: t.couleur.id, accessoire: t.accessoire.id };
    nouveaux.forEach((p) => { essai[p.type] = p.id; });
    const titre = (nouveaux.length > 1 ? "Débloqués : " : "Débloqué : ") + listeFr(nouveaux.map((p) => p.le));
    const palier = nouveaux[nouveaux.length - 1].palier;

    zone.innerHTML = `
      <div class="toast">
        ${mascotteSVG({ humeur: "ravie", couleur: essai.couleur, accessoire: essai.accessoire, taille: 48, decoratif: true })}
        <div class="toast-texte"><strong>${esc(titre)}</strong><span>${esc(kmPalier(palier))} nagés cette saison.</span></div>
        <button type="button" class="btn" data-act="essayer">Essayer</button>
        <button type="button" class="btn btn-ghost" data-act="fermer" aria-label="Fermer">×</button>
      </div>`;
    const toast = zone.firstElementChild;
    toast.querySelector('[data-act="essayer"]').addEventListener("click", () => {
      Mascotte.couleur = essai.couleur;
      Mascotte.accessoire = essai.accessoire;
      sauverMascotte();
      const etat = etatMascotte();
      renderMascotteCarte(etat);
      majMascotteEntete(etat);
      ouvrirMascotte();
    });
    toast.querySelector('[data-act="fermer"]').addEventListener("click", masquerToast);
    // Pas de disparition pendant qu'on le survole ou qu'on y est au clavier.
    const pause = () => clearTimeout(Mascotte.toastTimer);
    const reprise = () => { clearTimeout(Mascotte.toastTimer); Mascotte.toastTimer = setTimeout(masquerToast, 4000); };
    toast.addEventListener("mouseenter", pause);
    toast.addEventListener("focusin", pause);
    toast.addEventListener("mouseleave", reprise);
    toast.addEventListener("focusout", reprise);

    requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add("visible")));
    clearTimeout(Mascotte.toastTimer);
    Mascotte.toastTimer = setTimeout(masquerToast, 8000);
  }
  function masquerToast() {
    clearTimeout(Mascotte.toastTimer);
    const zone = document.getElementById("mascotte-toast");
    const toast = zone.firstElementChild;
    if (!toast) return;
    toast.classList.remove("visible");
    setTimeout(() => { if (zone.firstElementChild === toast) zone.innerHTML = ""; }, 300);
  }

  function wireMascotte() {
    const modal = document.getElementById("mascotte-modal");
    modal.addEventListener("click", (ev) => { if (ev.target === modal) fermerMascotte(); });
    document.addEventListener("keydown", (ev) => {
      if (!isMascotteOuverte()) return;
      if (ev.key === "Escape") { ev.preventDefault(); fermerMascotte(); return; }
      if (ev.key !== "Tab") return;
      // Le focus tourne dans la modale au lieu de filer vers la page derriere.
      // Un groupe de boutons radio ne compte qu'une fois : son bouton coche.
      const f = Array.from(modal.querySelectorAll('button:not([disabled]), input[type="radio"]:checked:not([disabled])'));
      if (!f.length) return;
      const dedans = modal.contains(document.activeElement);
      if (ev.shiftKey && (!dedans || document.activeElement === f[0])) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && (!dedans || document.activeElement === f[f.length - 1])) { ev.preventDefault(); f[0].focus(); }
    });
    // Le saut fini, on retire la classe pour pouvoir le rejouer a la prochaine coche.
    document.addEventListener("animationend", (ev) => {
      if (ev.animationName !== "m-saut") return;
      const svg = ev.target.closest ? ev.target.closest("svg") : null;
      if (svg) svg.classList.remove("saute");
    });
  }

  /* =========================================================================
     Compte et synchronisation multi-appareils
     ========================================================================= */

  // Le compte vit dans sa propre cle : « Vider toutes les données » efface les
  // habitudes, pas la session.
  const AKEY = "trak.account.v1";

  const Account = { base: "", token: "", email: "", lastEmail: "", lastSync: 0 };

  // Adresse du serveur. Laissée vide, l'application prend le dossier api/ placé
  // à côté de cette page, le cas normal une fois le site en ligne. À remplir
  // seulement pour ouvrir ce fichier en local (file://) tout en synchronisant,
  // par exemple : "https://exemple.fr/trak/api/".
  const SERVER_URL = "";

  function defaultApiBase() {
    if (SERVER_URL) return SERVER_URL;
    if (location.protocol === "http:" || location.protocol === "https:") {
      return location.href.split(/[?#]/)[0].replace(/[^/]*$/, "") + "api/";
    }
    return "";
  }

  function loadAccount() {
    try {
      const d = JSON.parse(localStorage.getItem(AKEY) || "null");
      if (d) {
        Account.base = d.base || "";
        Account.token = d.token || "";
        Account.email = d.email || "";
        Account.lastEmail = d.lastEmail || "";
        Account.lastSync = d.lastSync || 0;
      }
    } catch (e) { /* ignore */ }
    // L'adresse ne se règle plus dans l'interface : celle de la page (ou SERVER_URL)
    // prime, une adresse gardée d'avant ne sert plus qu'en file:// sans SERVER_URL.
    Account.base = defaultApiBase() || Account.base;
  }
  function saveAccount() {
    try { localStorage.setItem(AKEY, JSON.stringify(Account)); } catch (e) { /* ignore */ }
  }
  function forgetSession() {
    Account.token = "";
    Account.email = "";
    Account.lastSync = 0;
    saveAccount();
  }

  async function api(file, payload) {
    if (!Account.base) throw new Error("Adresse du serveur non renseignée.");
    let res;
    try {
      res = await fetch(Account.base.replace(/\/?$/, "/") + file, {
        method: "POST",
        headers: Object.assign(
          { "Content-Type": "application/json" },
          Account.token ? { Authorization: "Bearer " + Account.token } : {}
        ),
        // Le jeton part aussi dans le corps : beaucoup d'hebergements Apache ne
        // transmettent pas l'en-tete Authorization a PHP, et la synchro echouerait
        // silencieusement apres une connexion pourtant reussie.
        body: JSON.stringify(Account.token ? Object.assign({ token: Account.token }, payload) : payload)
      });
    } catch (e) {
      throw new Error("Serveur injoignable. Vérifiez votre connexion internet.");
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* réponse illisible */ }
    if (!res.ok || !data || data.ok !== true) {
      const err = new Error((data && data.error) || ("Erreur du serveur (" + res.status + ")."));
      err.code = (data && data.code) || String(res.status);
      throw err;
    }
    return data;
  }

  // --- Conversion état local <-> format d'échange -------------------------
  function payloadHabit(id) {
    const h = findHabit(id);
    if (h) return { id: h.id, name: h.name, goal: h.goal, dist: h.dist ? 1 : 0, pos: h.pos || 0, del: 0, u: h.u || 0 };
    const g = State.gone[id];
    if (g) return { id: id, name: "", goal: 5, dist: 0, pos: 0, del: 1, u: g.u || 0 };
    return null;
  }
  function payloadEntry(k) {
    const i = k.indexOf("|");
    if (i < 0) return null;
    const e = State.log[k];
    const base = { h: k.slice(0, i), d: k.slice(i + 1) };
    if (!e) return { h: base.h, d: base.d, done: 0, note: "", m: 0, s: [], del: 1, u: nowMs() };
    // s part toujours (même vide) : le serveur sait ainsi que ce client connaît les séances.
    return { h: base.h, d: base.d, done: e.done ? 1 : 0, note: e.note || "", m: e.m || 0,
      s: Array.isArray(e.s) && e.s.length > 1 ? e.s : [], del: e.del ? 1 : 0, u: e.u || 0 };
  }
  function payloadTime(id) {
    const x = State.times[id];
    if (!x) return null;
    if (x.del) return { id: id, ev: "", pool: 25, t: 0, d: "", comp: 0, lieu: "", sp: [], cid: "", del: 1, u: x.u || 0 };
    // comp : 0 entraînement, 1 compétition, 2 relais ; cid part toujours (même vide).
    return { id: id, ev: x.ev, pool: x.pool, t: x.t, d: x.d, comp: contexteDe(x.comp), lieu: x.lieu || "", sp: x.sp || [],
      cid: x.cid || "", del: 0, u: x.u || 0 };
  }
  function payloadItem(id) {
    const x = State.items[id];
    if (!x) return null;
    if (x.del) return { id: id, k: "", data: "", del: 1, u: x.u || 0 };
    return { id: id, k: x.k, data: JSON.stringify(x.data || {}), del: 0, u: x.u || 0 };
  }

  // Applique ce que renvoie le serveur. Le serveur a déjà tranché les conflits ;
  // on ne garde le local que s'il est plus récent (modifié pendant l'aller-retour).
  function applyRemote(data) {
    const appliedH = {}, appliedE = {};
    let touched = false;

    (data.habits || []).forEach((rh) => {
      const local = findHabit(rh.id);
      const known = local || State.gone[rh.id];
      if (known && (local ? local.u || 0 : State.gone[rh.id].u || 0) > rh.u) return;
      appliedH[rh.id] = 1; touched = true;
      if (rh.del) {
        if (local) State.habits.splice(State.habits.indexOf(local), 1);
        State.gone[rh.id] = { u: rh.u };
      } else {
        delete State.gone[rh.id];
        const dist = rh.dist ? 1 : 0;
        if (local) { local.name = rh.name; local.goal = rh.goal; local.dist = dist; local.pos = rh.pos; local.u = rh.u; }
        else State.habits.push({ id: rh.id, name: rh.name, goal: rh.goal, dist: dist, pos: rh.pos, u: rh.u });
      }
    });

    (data.entries || []).forEach((re) => {
      const k = re.h + "|" + re.d;
      const local = State.log[k];
      if (local && (local.u || 0) > re.u) return;
      appliedE[k] = 1; touched = true;
      if (re.del) { delete State.log[k]; return; }
      const e = { done: !!re.done, note: re.note || "", m: re.m || 0, u: re.u };
      let s = nettoyerSeances(re.s);
      // Une ancienne API ne renvoie pas « s » : on garde les séances d'ici tant que le
      // total qu'elle renvoie est bien le leur (sinon le total a changé ailleurs, il prime).
      if (!Array.isArray(re.s) && local && !local.del && Array.isArray(local.s) && local.s.length > 1
        && totalSeances(local.s) === e.m) {
        s = local.s.slice();
        if (local.sx) e.sx = 1;
      }
      if (s.length > 1 && totalSeances(s) === e.m) e.s = s;
      State.log[k] = e;
    });

    const appliedT = {};
    // API 3 : elle garde le relais (comp 2) et la compétition du temps (cid).
    const apiChronos = (data.api || 0) >= 3;
    (data.times || []).forEach((rt) => {
      const local = State.times[rt.id];
      if (local && (local.u || 0) > rt.u) return;
      appliedT[rt.id] = 1; touched = true;
      if (rt.del) { delete State.times[rt.id]; return; }
      const x = { ev: rt.ev, pool: rt.pool === 50 ? 50 : 25, t: rt.t, d: rt.d, comp: contexteDe(rt.comp), lieu: rt.lieu || "",
        sp: Array.isArray(rt.sp) ? rt.sp : [], u: rt.u };
      if (typeof rt.cid === "string" && rt.cid) x.cid = rt.cid.slice(0, 64);
      // Une API d'avant renvoie le relais en compétition et perd cid : tant que c'est la même
      // version du temps, on garde ceux d'ici, marqués tx pour repartir vers une API à jour.
      if (!apiChronos && local && !local.del && (local.u || 0) === rt.u && (local.comp === 2 || local.cid)) {
        if (local.comp === 2) x.comp = 2;
        if (local.cid) x.cid = local.cid;
        x.tx = 1;
      }
      State.times[rt.id] = x;
    });

    const appliedI = {};
    (data.items || []).forEach((ri) => {
      const local = State.items[ri.id];
      if (local && (local.u || 0) > ri.u) return;
      let contenu = null;
      if (!ri.del) { try { contenu = JSON.parse(ri.data); } catch (e) { return; } }
      appliedI[ri.id] = 1; touched = true;
      if (ri.del) delete State.items[ri.id];
      else State.items[ri.id] = { k: ri.k, data: contenu, u: ri.u };
    });

    if (touched) {
      State.habits.sort((a, b) => ((a.pos || 0) - (b.pos || 0)) || String(a.id).localeCompare(String(b.id)));
    }
    return { habits: appliedH, entries: appliedE, times: appliedT, items: appliedI };
  }

  // --- Moteur de synchronisation ------------------------------------------
  const Sync = {
    state: "idle",     // idle | busy | ok | err
    message: "",
    at: 0,
    timer: null,
    running: false,
    again: false
  };

  // Un redessin complet réinitialise les champs de saisie : on attend que
  // l'utilisateur ait fini de taper avant d'afficher ce qui vient du serveur.
  function renderAfterSync() {
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) {
      clearTimeout(Sync.renderTimer);
      Sync.renderTimer = setTimeout(renderAfterSync, 2000);
      return;
    }
    renderAll();
  }

  Sync.setState = function (state, message) {
    Sync.state = state;
    Sync.message = message || "";
    renderAccountButton();
    if (isModalOpen()) renderAccountModal();
  };

  Sync.schedule = function (delay) {
    if (!Account.token) return;
    clearTimeout(Sync.timer);
    Sync.timer = setTimeout(() => { Sync.run(); }, delay == null ? 1200 : delay);
  };

  Sync.run = async function () {
    if (!Account.token) return;
    if (Sync.running) { Sync.again = true; return; }
    Sync.running = true;
    clearTimeout(Sync.timer);
    Sync.setState("busy");

    const sentH = Object.keys(State.dirtyH);
    const sentE = Object.keys(State.dirtyE);
    const sentT = Object.keys(State.dirtyT);
    const stampH = {}, stampE = {}, stampT = {};
    sentH.forEach((id) => { stampH[id] = habitStamp(id); });
    sentE.forEach((k) => { stampE[k] = State.log[k] ? State.log[k].u || 0 : 0; });
    sentT.forEach((id) => { stampT[id] = State.times[id] ? State.times[id].u || 0 : 0; });
    const sentI = Object.keys(State.dirtyI), stampI = {};
    sentI.forEach((id) => { stampI[id] = State.items[id] ? State.items[id].u || 0 : 0; });

    try {
      const data = await api("sync.php", {
        since: Account.lastSync,
        habits: sentH.map(payloadHabit).filter(Boolean),
        entries: sentE.map(payloadEntry).filter(Boolean),
        times: sentT.map(payloadTime).filter(Boolean),
        items: sentI.map(payloadItem).filter(Boolean)
      });

      const applied = applyRemote(data);

      // On ne retire de la file d'envoi que ce qui n'a pas rebougé entre-temps.
      sentH.forEach((id) => {
        if (applied.habits[id] || habitStamp(id) === stampH[id]) delete State.dirtyH[id];
      });
      sentE.forEach((k) => {
        const cur = State.log[k] ? State.log[k].u || 0 : 0;
        if (applied.entries[k] || cur === stampE[k]) delete State.dirtyE[k];
      });
      // Séances (s) : une API d'avant (sans « api » >= 2 dans la réponse) n'a gardé que le
      // total m. Ces jours-là sont marqués sx et repartent dès que l'API sait les garder.
      if (data.api >= 2) {
        Object.keys(State.log).forEach((k) => {
          if (State.log[k].sx) { delete State.log[k].sx; State.dirtyE[k] = 1; }
        });
      } else {
        sentE.forEach((k) => {
          const e = State.log[k];
          if (e && !e.del && Array.isArray(e.s) && e.s.length > 1) e.sx = 1;
        });
      }
      // Un serveur d'avant les chronos ne renvoie pas « times » : il ne les a pas
      // gardes, on les laisse donc en file pour le jour ou l'API sera a jour.
      if (Array.isArray(data.times)) {
        sentT.forEach((id) => {
          const cur = State.times[id] ? State.times[id].u || 0 : 0;
          if (applied.times[id] || cur === stampT[id]) delete State.dirtyT[id];
        });
        // Premiere synchro de cet appareil : ses chronos partent au compte (le
        // serveur arbitre ceux qu'il connait deja).
        if (data.first) Object.keys(State.times).forEach((id) => { if (!State.times[id].del) State.dirtyT[id] = 1; });
        Object.keys(State.times).forEach((id) => { if (State.times[id].del && !State.dirtyT[id]) delete State.times[id]; });
        // Relais et compétition d'un temps (comp 2, cid) : une API d'avant (sans « api » >= 3)
        // ne les a pas gardés. Ces temps sont marqués tx et repartent dès que l'API sait les garder.
        if (data.api >= 3) {
          Object.keys(State.times).forEach((id) => {
            if (State.times[id].tx) { delete State.times[id].tx; State.dirtyT[id] = 1; }
          });
        } else {
          sentT.forEach((id) => {
            const x = State.times[id];
            if (x && !x.del && (x.comp === 2 || x.cid)) x.tx = 1;
          });
        }
      }
      // Meme prudence pour les objectifs et competitions face a une API qui ne connait pas « items ».
      if (Array.isArray(data.items)) {
        sentI.forEach((id) => {
          const cur = State.items[id] ? State.items[id].u || 0 : 0;
          if (applied.items[id] || cur === stampI[id]) delete State.dirtyI[id];
        });
        if (data.first) Object.keys(State.items).forEach((id) => { if (!State.items[id].del) State.dirtyI[id] = 1; });
        Object.keys(State.items).forEach((id) => { if (State.items[id].del && !State.dirtyI[id]) delete State.items[id]; });
      }

      // Compte tout neuf et vide côté serveur : on y envoie les habitudes de
      // cet appareil, sinon elles ne quitteraient jamais le navigateur.
      if (data.first && (data.habits || []).length === 0 && State.habits.length) {
        const t = nowMs();
        State.habits.forEach((h) => { if (!h.u) h.u = t; State.dirtyH[h.id] = 1; });
      }

      // Compte qui a déjà ses habitudes : celles par défaut de cet appareil,
      // jamais touchées (u = 0, aucune coche), sont retirées. Avant, elles
      // portaient les mêmes identifiants que celles du compte et se fondaient
      // dedans ; depuis le changement de la liste par défaut, elles
      // s'ajouteraient en double à celles d'un compte plus ancien.
      if (data.first && (data.habits || []).length) {
        const cochees = new Set(Object.keys(State.log).map((k) => k.split("|")[0]));
        State.habits = State.habits.filter((h) => h.u || State.dirtyH[h.id] || cochees.has(h.id));
        // Celles qu'on garde parce qu'elles ont des coches partent au serveur,
        // sinon ces coches arriveraient sur les autres appareils sans habitude.
        const t = nowMs();
        State.habits.forEach((h) => { if (!h.u) { h.u = t; State.dirtyH[h.id] = 1; } });
      }

      // Les suppressions parties au serveur n'ont plus besoin d'occuper le
      // stockage local : le serveur porte désormais la trace.
      Object.keys(State.log).forEach((k) => {
        if (State.log[k].del && !State.dirtyE[k]) delete State.log[k];
      });

      Account.lastSync = data.now;
      Account.lastEmail = Account.email;
      saveAccount(); persist();
      if (Object.keys(applied.habits).length || Object.keys(applied.entries).length || Object.keys(applied.times).length
        || Object.keys(applied.items).length) renderAfterSync();
      Sync.at = Date.now();
      Sync.setState("ok");

      // dirtyT reste plein face a une ancienne API : on ne relance pas en boucle pour lui.
      if (Object.keys(State.dirtyH).length || Object.keys(State.dirtyE).length
        || (Array.isArray(data.times) && Object.keys(State.dirtyT).length)
        || (Array.isArray(data.items) && Object.keys(State.dirtyI).length)) Sync.schedule(500);
    } catch (e) {
      if (e.code === "unauthorized") {
        forgetSession();
        Sync.setState("err", "Session expirée, reconnectez-vous.");
        renderAccountButton();
      } else {
        Sync.setState("err", e.message);
      }
    } finally {
      Sync.running = false;
      if (Sync.again) { Sync.again = false; Sync.schedule(400); }
    }
  };

  // --- Interface du compte -------------------------------------------------
  // mode : login | register | account | password | delete (suppression du compte).
  const AccountUI = { mode: "login", msg: "", msgType: "", busy: false, devices: null, appareilsOuverts: false };

  function isModalOpen() { return !document.getElementById("account-modal").hidden; }

  function openAccount(mode) {
    AccountUI.mode = mode || (Account.token ? "account" : "login");
    AccountUI.msg = ""; AccountUI.msgType = ""; AccountUI.busy = false; AccountUI.appareilsOuverts = false;
    document.getElementById("account-modal").hidden = false;
    renderAccountModal();
    if (Account.token) loadDevices();
    const first = document.querySelector("#account-body input");
    if (first) first.focus();
  }
  function closeAccount() {
    document.getElementById("account-modal").hidden = true;
    AccountUI.devices = null;
  }

  function agoText(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 10) return "à l'instant";
    if (s < 60) return "il y a " + s + " s";
    if (s < 3600) return "il y a " + Math.round(s / 60) + " min";
    if (s < 86400) return "il y a " + Math.round(s / 3600) + " h";
    return "il y a " + Math.round(s / 86400) + " j";
  }

  function pendingCount() {
    return Object.keys(State.dirtyH).length + Object.keys(State.dirtyE).length + Object.keys(State.dirtyT).length
      + Object.keys(State.dirtyI).length;
  }

  function syncText() {
    if (!Account.token) return "Non connecté";
    if (Sync.state === "busy") return "Synchronisation…";
    if (Sync.state === "err") return Sync.message || "Échec de la synchronisation";
    const pending = pendingCount();
    if (pending) return pending + " modification" + (pending > 1 ? "s" : "") + " en attente";
    if (Sync.at) return "À jour, synchronisé " + agoText(Sync.at);
    return "Connecté";
  }

  function renderAccountButton() {
    const dot = document.getElementById("sync-dot");
    const label = document.getElementById("account-label");
    majCompteReglages();
    if (!Account.token) {
      dot.className = "sync-dot";
      label.textContent = "Se connecter";
      return;
    }
    dot.className = "sync-dot " + (Sync.state === "busy" ? "busy" : Sync.state === "err" ? "err" : "ok");
    label.textContent = Account.email;
  }

  function msgHtml() {
    if (!AccountUI.msg) return "";
    return `<p class="form-msg ${AccountUI.msgType}">${esc(AccountUI.msg)}</p>`;
  }

  function renderAccountModal() {
    const el = document.getElementById("account-body");
    el.innerHTML = Account.token ? accountViewHtml() : authViewHtml();
    wireAccountModal(el);
  }

  function authViewHtml() {
    const isRegister = AccountUI.mode === "register";
    return `
      <h2 id="account-title">${isRegister ? "Créer un compte" : "Se connecter"}</h2>
      <p class="p-muted">Vos habitudes, vos jours cochés et vos chronos vous suivent sur tous vos appareils.</p>
      <form id="ac-form">
        <label class="field">
          <span>Adresse e-mail</span>
          <input class="input" type="email" id="ac-email" autocomplete="username" required value="${esc(Account.lastEmail)}">
        </label>
        <label class="field">
          <span>Mot de passe</span>
          <input class="input" type="password" id="ac-pass" autocomplete="${isRegister ? "new-password" : "current-password"}" required minlength="8">
        </label>
        ${isRegister ? `<p class="switch-mode" style="margin-top:-4px">8 caractères minimum. Votre e-mail et vos habitudes sont stockés sur le serveur pour la synchronisation : <a href="https://dunandchatellet.fr/mentions-legales.html#donnees" target="_blank" rel="noopener" style="text-decoration:underline">données personnelles</a>.</p>` : ""}
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" ${AccountUI.busy ? "disabled" : ""}>
            ${AccountUI.busy ? "Patientez…" : (isRegister ? "Créer le compte" : "Se connecter")}
          </button>
          <button type="button" class="btn btn-ghost" data-act="close">Annuler</button>
        </div>
      </form>
      ${msgHtml()}
      <p class="switch-mode">
        ${isRegister ? "Vous avez déjà un compte ?" : "Pas encore de compte ?"}
        <button type="button" data-act="switch">${isRegister ? "Se connecter" : "En créer un"}</button>
      </p>`;
  }

  function devicesHtml() {
    // Repliée par défaut : la fenêtre du compte reste courte. L'état ouvert survit aux redessins.
    if (AccountUI.devices === null) return `<details class="appareils"><summary>Appareils connectés</summary><p class="switch-mode" style="margin-top:0">Chargement…</p></details>`;
    if (!AccountUI.devices.length) return "";
    return `
      <details class="appareils" id="ac-appareils"${AccountUI.appareilsOuverts ? " open" : ""}>
      <summary>Appareils connectés (${AccountUI.devices.length})</summary>
      <ul class="device-list">
        ${AccountUI.devices.map((d) => `
          <li>
            <span>${esc(d.label)}</span>
            <span style="color:var(--color-neutral-600)">vu ${esc(agoText(d.seen * 1000))}</span>
            ${d.current ? `<span class="tag">cet appareil</span>` : ""}
          </li>`).join("")}
      </ul>
      ${AccountUI.devices.length > 1
        ? `<p class="switch-mode"><button type="button" data-act="revoke">Déconnecter les autres appareils</button></p>`
        : ""}
      </details>`;
  }

  function accountViewHtml() {
    if (AccountUI.mode === "password") {
      return `
        <h2 id="account-title">Changer le mot de passe</h2>
        <p class="p-muted">Vos autres appareils devront se reconnecter.</p>
        <form id="ac-form">
          <label class="field">
            <span>Mot de passe actuel</span>
            <input class="input" type="password" id="ac-current" autocomplete="current-password" required>
          </label>
          <label class="field">
            <span>Nouveau mot de passe</span>
            <input class="input" type="password" id="ac-pass" autocomplete="new-password" required minlength="8">
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary" ${AccountUI.busy ? "disabled" : ""}>
              ${AccountUI.busy ? "Patientez…" : "Enregistrer"}
            </button>
            <button type="button" class="btn btn-ghost" data-act="back">Retour</button>
          </div>
        </form>
        ${msgHtml()}`;
    }

    if (AccountUI.mode === "delete") {
      return `
        <h2 id="account-title">Supprimer le compte</h2>
        <p class="ac-avert">Le compte <strong>${esc(Account.email)}</strong>, ses sessions et toutes les données gardées sur le serveur
          seront effacés tout de suite. Vos autres appareils seront déconnectés.</p>
        <p class="ac-avert">Vos données restent sur cet appareil : vous pourrez en télécharger une sauvegarde depuis les Réglages, ou créer un autre compte plus tard.</p>
        <form id="ac-form">
          <label class="field">
            <span>Mot de passe actuel</span>
            <input class="input" type="password" id="ac-current" autocomplete="current-password" required>
          </label>
          <label class="ac-confirme">
            <input type="checkbox" id="ac-confirme" required>
            <span>Je comprends que la suppression est définitive.</span>
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary" ${AccountUI.busy ? "disabled" : ""}>
              ${AccountUI.busy ? "Patientez…" : "Supprimer définitivement"}
            </button>
            <button type="button" class="btn btn-ghost" data-act="back">Retour</button>
          </div>
        </form>
        ${msgHtml()}`;
    }

    return `
      <h2 id="account-title">Votre compte</h2>
      <p class="p-muted">${esc(Account.email)}</p>
      <p class="sync-line"><span class="sync-dot ${Sync.state === "busy" ? "busy" : Sync.state === "err" ? "err" : "ok"}"></span>${esc(syncText())}</p>
      <div class="modal-actions" style="margin-top:12px">
        <button type="button" class="btn btn-primary" data-act="sync" ${Sync.state === "busy" ? "disabled" : ""}>Synchroniser maintenant</button>
        <button type="button" class="btn btn-ghost" data-act="close">Fermer</button>
      </div>
      ${msgHtml()}
      ${devicesHtml()}
      <div class="modal-actions" style="margin-top:22px">
        <button type="button" class="btn btn-ghost" data-act="password" style="padding-left:0">Changer le mot de passe</button>
        <button type="button" class="btn btn-ghost spacer" data-act="logout" style="color:var(--color-accent-700)">Se déconnecter</button>
      </div>
      <div class="modal-actions" style="margin-top:4px">
        <button type="button" class="btn btn-ghost btn-alerte" data-act="delete" style="padding-left:0">Supprimer mon compte</button>
      </div>`;
  }

  function wireAccountModal(el) {
    const form = el.querySelector("#ac-form");
    if (form) form.addEventListener("submit", (ev) => { ev.preventDefault(); submitAccountForm(); });

    el.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
      const act = b.dataset.act;
      if (act === "close") closeAccount();
      else if (act === "switch") { AccountUI.mode = AccountUI.mode === "register" ? "login" : "register"; AccountUI.msg = ""; renderAccountModal(); }
      else if (act === "password") { AccountUI.mode = "password"; AccountUI.msg = ""; renderAccountModal(); }
      else if (act === "back") { AccountUI.mode = "account"; AccountUI.msg = ""; renderAccountModal(); }
      else if (act === "sync") Sync.run();
      else if (act === "logout") doLogout();
      else if (act === "revoke") doRevokeOthers();
      else if (act === "delete") { AccountUI.mode = "delete"; AccountUI.msg = ""; renderAccountModal(); focusPremierChamp(); }
    }));
    const app = el.querySelector("#ac-appareils");
    if (app) app.addEventListener("toggle", () => { AccountUI.appareilsOuverts = app.open; });
  }
  function focusPremierChamp() {
    const first = document.querySelector("#account-body input");
    if (first) first.focus();
  }

  function setBusy(busy, msg, type) {
    AccountUI.busy = busy;
    AccountUI.msg = msg || "";
    AccountUI.msgType = type || "";
    renderAccountModal();
  }

  async function submitAccountForm() {
    if (AccountUI.busy) return;

    if (AccountUI.mode === "password") return doChangePassword();
    if (AccountUI.mode === "delete") return doDeleteAccount();

    const email = (document.getElementById("ac-email").value || "").trim();
    const pass = document.getElementById("ac-pass").value || "";
    const isRegister = AccountUI.mode === "register";

    if (isRegister && pass.length < 8) return setBusy(false, "8 caractères minimum.", "err");
    if (!Account.base) {
      return setBusy(false, "Cette page est ouverte en local : la synchronisation a besoin du site en ligne, ou d'une adresse renseignée dans SERVER_URL en haut du fichier.", "err");
    }

    setBusy(true, "");
    try {
      const data = await api("auth.php", { action: isRegister ? "register" : "login", email: email, password: pass });

      // Changement de compte sur cet appareil : on repart des données du compte
      // rejoint plutôt que de mélanger les deux historiques.
      if (Account.lastEmail && Account.lastEmail !== data.user.email) resetLocalData();

      Account.token = data.token;
      Account.email = data.user.email;
      Account.lastSync = 0;
      saveAccount();

      AccountUI.mode = "account";
      setBusy(false, "");
      renderAccountButton();
      await Sync.run();
      loadDevices();
    } catch (e) {
      setBusy(false, e.message, "err");
    }
  }

  function resetLocalData() {
    State.habits = defaultHabits();
    State.log = {};
    State.gone = {};
    State.dirtyH = {};
    State.dirtyE = {};
    State.times = {};
    State.dirtyT = {};
    State.items = {};
    State.dirtyI = {};
    State.chrono.sel = "";
    persist();
  }

  async function doChangePassword() {
    const current = document.getElementById("ac-current").value || "";
    const next = document.getElementById("ac-pass").value || "";
    if (next.length < 8) return setBusy(false, "8 caractères minimum.", "err");

    setBusy(true, "");
    try {
      await api("auth.php", { action: "password", current: current, password: next });
      AccountUI.mode = "account";
      setBusy(false, "Mot de passe modifié. Les autres appareils ont été déconnectés.", "ok");
      loadDevices();
    } catch (e) {
      setBusy(false, e.message, "err");
    }
  }

  async function doLogout() {
    const pending = pendingCount();
    if (pending && !window.confirm(pending + " modification(s) ne sont pas encore synchronisées. Se déconnecter quand même ?")) return;
    setBusy(true, "");
    try { await api("auth.php", { action: "logout" }); } catch (e) { /* on se déconnecte localement de toute façon */ }
    forgetSession();
    AccountUI.mode = "login";
    AccountUI.devices = null;
    Sync.setState("idle");
    setBusy(false, "Vous êtes déconnecté. Vos données restent sur cet appareil.", "ok");
    renderAccountButton();
  }

  // Suppression du compte : mot de passe actuel et case cochée exigés. Le serveur efface
  // l'utilisateur, ses sessions et son fichier ; ici on se déconnecte en gardant les données.
  async function doDeleteAccount() {
    const pass = document.getElementById("ac-current").value || "";
    const coche = document.getElementById("ac-confirme").checked;
    if (!pass) return setBusy(false, "Entrez votre mot de passe actuel.", "err");
    if (!coche) return setBusy(false, "Cochez la case pour confirmer la suppression.", "err");
    clearTimeout(Sync.timer);
    setBusy(true, "");
    try {
      await api("auth.php", { action: "delete", password: pass });
    } catch (e) {
      setBusy(false, e.message, "err");
      return;
    }
    forgetSession();
    // Plus de compte « précédent » : un compte créé plus tard ici reprendra ces données
    // au lieu de les effacer comme lors d'un changement de compte.
    Account.lastEmail = "";
    saveAccount();
    toutAEnvoyer();
    AccountUI.mode = "login";
    AccountUI.devices = null;
    Sync.setState("idle");
    setBusy(false, "Compte supprimé. Vos données restent sur cet appareil : vous pouvez en télécharger une sauvegarde depuis les Réglages.", "ok");
    renderAccountButton();
  }

  async function doRevokeOthers() {
    setBusy(true, "");
    try {
      const data = await api("auth.php", { action: "revoke_others" });
      setBusy(false, data.revoked ? data.revoked + " appareil(s) déconnecté(s)." : "Aucun autre appareil connecté.", "ok");
      loadDevices();
    } catch (e) {
      setBusy(false, e.message, "err");
    }
  }

  async function loadDevices() {
    if (!Account.token) return;
    AccountUI.devices = null;
    try {
      const data = await api("auth.php", { action: "devices" });
      AccountUI.devices = data.devices || [];
    } catch (e) {
      AccountUI.devices = [];
    }
    if (isModalOpen()) renderAccountModal();
  }

  // --- Déclencheurs de synchronisation -------------------------------------
  function wireAccount() {
    document.getElementById("account-btn").addEventListener("click", () => openAccount());
    document.getElementById("account-modal").addEventListener("click", (ev) => {
      if (ev.target.id === "account-modal") closeAccount();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && isModalOpen()) closeAccount();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Account.token) {
        // Le jour a pu changer pendant que l'onglet dormait. L'écran du jour qui montrait
        // aujourd'hui suit ; un jour passé ouvert exprès reste affiché.
        const avant = State.today;
        State.today = ymd(new Date());
        if (State.jour === avant) State.jour = State.today;
        Sync.schedule(100);
      }
    });
    window.addEventListener("online", () => Sync.schedule(200));
    window.addEventListener("focus", () => Sync.schedule(400));
    setInterval(() => { if (!document.hidden) Sync.schedule(0); }, 60000);
  }

  /* =========================================================================
     Visite guidee : explique chaque onglet a la premiere ouverture. Elle
     bascule sur l'onglet concerne et met en evidence la zone decrite.
     Relancable avec le bouton « ? » de l'en-tete.
     ========================================================================= */
  const VKEY = "trak.visite.v1";
  // Cinq étapes au plus, une par écran. Sur téléphone, la bulle est en bas de l'écran :
  // la zone est remontée en haut et sa mise en évidence s'arrête au-dessus de la bulle.
  const VISITE = [
    { tab: "today", titre: "Bienvenue sur Trak",
      texte: "Votre carnet de nageur : les habitudes de chaque jour, les mètres nagés et vos chronos. La mascotte change de tenue au fil des kilomètres de la saison." },
    { tab: "today", cible: "#view-today .today-grid > div:first-child", titre: "Le jour",
      texte: "Cochez une habitude dès qu'elle est faite. Après une séance, notez la distance ; « + séance » en ajoute une deuxième. Les flèches près de la date ramènent aux jours passés." },
    { tab: "chronos", cible: "#chronos-tete", titre: "Chronos",
      texte: "« Ajouter un temps » note un chrono, avec ses passages si vous voulez. Trak garde votre record par épreuve et par bassin. Compétitions : les prochaines, leurs temps limites, et vos temps aux passées." },
    { tab: "week", cible: "#view-week .week-table-wrap", titre: "Bilan",
      texte: "Semaine : les sept jours en un tableau, une case oubliée se coche d'un clic. Saison : une case par jour depuis le 1er septembre, les kilomètres par semaine et vos séries." },
    { tab: "today", cible: "#reglages-btn", titre: "Réglages et compte",
      texte: "La roue dentée ouvre les Réglages : vos habitudes, leur objectif par semaine et la sauvegarde du carnet. À sa gauche, un compte facultatif synchronise téléphone et ordinateur. « ? » relance cette visite." }
  ];
  const Visite = { i: -1 };

  function visiteActive() { return Visite.i >= 0; }

  function lancerVisite() {
    if (isModalOpen()) closeAccount();
    if (isMascotteOuverte()) fermerMascotte();
    document.getElementById("visite").hidden = false;
    allerEtape(0);
  }

  function finirVisite() {
    Visite.i = -1;
    document.getElementById("visite").hidden = true;
    try { localStorage.setItem(VKEY, "1"); } catch (e) { /* stockage indisponible */ }
    State.tab = "today"; renderTabs();
    window.scrollTo(0, 0);
    document.getElementById("aide-btn").focus();
  }

  function allerEtape(i) {
    Visite.i = i;
    const e = VISITE[i];
    if (State.tab !== e.tab) { State.tab = e.tab; renderTabs(); }
    const der = i === VISITE.length - 1;
    const points = VISITE.map((_, k) => `<span class="${k === i ? "actif" : ""}"></span>`).join("");
    const t = tenueEffective(etatMascotte().niveau);
    const bulle = document.getElementById("visite-bulle");
    bulle.innerHTML = `
      ${e.cible ? "" : mascotteSVG({ humeur: "ravie", couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 84, decoratif: true })}
      <p class="visite-etape">${i === 0 ? "Visite guidée" : `Étape ${i} sur ${VISITE.length - 1}`}</p>
      <h2 id="visite-titre">${esc(e.titre)}</h2>
      <p class="visite-texte">${esc(e.texte)}</p>
      <div class="visite-points" aria-hidden="true">${points}</div>
      <div class="visite-actions">
        ${der ? "" : `<button type="button" class="btn btn-ghost" data-v="passer">Passer</button>`}
        <span class="spacer"></span>
        ${i > 0 ? `<button type="button" class="btn" data-v="prec">Précédent</button>` : ""}
        <button type="button" class="btn btn-primary" data-v="suiv">${i === 0 ? "C'est parti" : der ? "Terminer" : "Suivant"}</button>
      </div>`;
    const cible = e.cible && document.querySelector(e.cible);
    // Sur telephone la bulle occupe le bas de l'ecran : on remonte la zone en haut.
    if (cible) {
      cible.scrollIntoView({ block: window.innerWidth <= 560 ? "start" : "center", behavior: "instant" });
      // Ordinateur : centrée, une zone haute ne laisse la place à la bulle ni dessus ni dessous ;
      // remontée en haut de l'écran, la bulle tient dessous sans la cacher.
      const r = cible.getBoundingClientRect(), bh = bulle.offsetHeight, vh = window.innerHeight;
      if (window.innerWidth > 560 && r.bottom + 22 + bh > vh - 8 && r.top - 22 - bh < 8 && r.height + bh + 60 <= vh) {
        window.scrollBy({ top: r.top - 24, behavior: "instant" });
      }
    } else window.scrollTo(0, 0);
    placerVisite();
    bulle.querySelector('[data-v="suiv"]').focus();
  }

  // Place le trou sur la cible et la bulle dessous, sinon dessus, sinon en bas.
  function placerVisite() {
    if (!visiteActive()) return;
    const e = VISITE[Visite.i];
    const fond = document.getElementById("visite");
    const trou = document.getElementById("visite-trou");
    const bulle = document.getElementById("visite-bulle");
    const cible = e.cible && document.querySelector(e.cible);
    const r = cible ? cible.getBoundingClientRect() : null;
    const vw = window.innerWidth, vh = window.innerHeight;
    const sansCible = !r || !r.width;
    fond.classList.toggle("sans-cible", sansCible);
    if (sansCible) {
      bulle.style.left = Math.max(16, (vw - bulle.offsetWidth) / 2) + "px";
      bulle.style.top = Math.max(16, (vh - bulle.offsetHeight) / 2) + "px";
      return;
    }
    const m = 8;
    const top = Math.max(r.top - m, 4);
    let bas = Math.min(r.bottom + m, vh - 4);
    // Téléphone : la bulle est posée en bas (CSS). Une zone plus haute que la place
    // restante n'est mise en évidence que jusqu'au-dessus de la bulle, jamais dessous.
    if (vw <= 560) {
      bas = Math.min(bas, bulle.getBoundingClientRect().top - 10);
      trou.style.left = (r.left - m) + "px";
      trou.style.top = top + "px";
      trou.style.width = (r.width + 2 * m) + "px";
      trou.style.height = Math.max(0, bas - top) + "px";
      return;
    }
    trou.style.left = (r.left - m) + "px";
    trou.style.top = top + "px";
    trou.style.width = (r.width + 2 * m) + "px";
    trou.style.height = Math.max(0, bas - top) + "px";
    const bw = bulle.offsetWidth, bh = bulle.offsetHeight, ecart = 14;
    const auMilieu = Math.min(Math.max(16, r.left + r.width / 2 - bw / 2), vw - bw - 16);
    const enFace = Math.min(Math.max(8, top), vh - bh - 8);
    let x = auMilieu, y;
    if (bas + ecart + bh <= vh - 8) y = bas + ecart;
    else if (top - ecart - bh >= 8) y = top - ecart - bh;
    // Zone trop haute pour loger la bulle dessus ou dessous : on la met a cote.
    else if (r.right + m + ecart + bw <= vw - 16) { x = r.right + m + ecart; y = enFace; }
    else if (r.left - m - ecart - bw >= 16) { x = r.left - m - ecart - bw; y = enFace; }
    else y = Math.max(8, vh - bh - 16);
    bulle.style.left = x + "px";
    bulle.style.top = y + "px";
  }

  function wireVisite() {
    document.getElementById("aide-btn").addEventListener("click", lancerVisite);
    const bulle = document.getElementById("visite-bulle");
    bulle.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-v]");
      if (!b) return;
      if (b.dataset.v === "passer") finirVisite();
      else if (b.dataset.v === "prec") allerEtape(Visite.i - 1);
      else if (Visite.i === VISITE.length - 1) finirVisite();
      else allerEtape(Visite.i + 1);
    });
    document.addEventListener("keydown", (ev) => {
      if (!visiteActive()) return;
      if (ev.key === "Escape") { ev.preventDefault(); finirVisite(); return; }
      if (ev.key === "ArrowRight" && Visite.i < VISITE.length - 1) { ev.preventDefault(); allerEtape(Visite.i + 1); return; }
      if (ev.key === "ArrowLeft" && Visite.i > 0) { ev.preventDefault(); allerEtape(Visite.i - 1); return; }
      if (ev.key !== "Tab") return;
      // Le focus reste dans la bulle tant que la visite est ouverte.
      const f = Array.from(bulle.querySelectorAll("button"));
      const dedans = bulle.contains(document.activeElement);
      if (ev.shiftKey && (!dedans || document.activeElement === f[0])) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && (!dedans || document.activeElement === f[f.length - 1])) { ev.preventDefault(); f[0].focus(); }
    });
    let attente = 0;
    const replacer = () => { cancelAnimationFrame(attente); attente = requestAnimationFrame(placerVisite); };
    window.addEventListener("resize", replacer);
    window.addEventListener("scroll", replacer, { passive: true });
  }

  // La courbe se dessine a la largeur de son conteneur : une section cachee
  // mesure 0, d'ou un nouveau trace a l'ouverture de l'onglet et au redimensionnement.
  function retracerCourbe() {
    if (State.tab !== "chronos" || State.chrono.vue !== "records") return;
    const r = records().find((x) => x.cle === State.chrono.sel);
    if (r) dessinerCourbe(serie(r.ev, r.pool), objectif(r.ev, r.pool));
  }
  let attenteCourbe = 0;
  window.addEventListener("resize", () => {
    clearTimeout(attenteCourbe);
    attenteCourbe = setTimeout(() => { retracerCourbe(); if (State.tab === "year") dessinerVolumeSaison(); }, 150);
  });

  document.querySelectorAll(".tabs .btn").forEach((b) => {
    b.addEventListener("click", () => {
      // L'onglet « Aujourd'hui » ramène toujours à aujourd'hui (un jour passé s'ouvre par les flèches ou par Semaine).
      if (b.dataset.tab === "today") allerJour(State.today);
      State.tab = b.dataset.tab === "bilan" ? State.bilan : b.dataset.tab; renderTabs(); retracerCourbe(); caleAnnee();
      // Barre d'onglets en bas (telephone) : on repart du haut du nouvel ecran.
      window.scrollTo(0, 0);
    });
  });

  document.querySelectorAll("#bilan-switch .btn").forEach((b) => {
    b.addEventListener("click", () => { State.tab = b.dataset.vue; renderTabs(); caleAnnee(); });
  });

  load();
  chargerMascotte();
  loadAccount();
  renderAll();
  wireAccount();
  wireMascotte();
  wireVisite();
  wireReglages();
  renderAccountButton();
  if (Account.token) Sync.run();
  // Premiere ouverture sur cet appareil : la visite se lance d'elle-meme.
  let visiteVue = true;
  try { visiteVue = localStorage.getItem(VKEY) === "1"; } catch (e) { /* stockage indisponible */ }
  if (!visiteVue) lancerVisite();

  // Hors ligne : sw.js garde une copie de la page, des polices et des icones.
  // Seulement en https (ou en local) : ailleurs le navigateur le refuse de toute facon.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sans service worker, Trak marche comme avant */ });
  }
})();
</script>
