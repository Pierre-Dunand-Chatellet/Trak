<style>
  /* Trak, tableau de séance du bord de bassin (2026-11-14) ; la mascotte et ses couleurs restent à Trak. */
  :root {
    --color-bg: #f7f8f6;           /* papier */
    --color-text: #1b1d21;         /* encre */
    --color-neutral-100: #ffffff;  /* surfaces : cartes, champs, boutons */
    --color-neutral-200: #eceef1;
    --color-neutral-300: #d3d7dc;
    --color-neutral-400: #868b94;  /* bordures des boutons et champs : 3,1:1 sur le papier */
    --color-neutral-600: #555b63;  /* texte discret : 5,5:1 sur le papier */
    --color-neutral-700: #3f444b;
    --color-accent-200: #dbe6ff;
    --color-accent-500: #1d4ed8;
    --color-accent-700: #1e40af;  /* bleu foncé pour le texte : 8,2:1 sur le papier */
    --color-accent2-200: #fde3df;
    --color-accent2-300: #f9c3bb;
    --color-accent2-400: #f08f80;
    --color-accent2-500: #d92d20;
    --color-accent2-600: #b42318;
    --color-accent2-800: #8f1d14;
    --color-accent2-900: #5c120c;
    --color-empty-grey: #d3d7dc;
    --color-future-beige: #eceef1;
    --radius-lg: 8px;
    --shadow-sm: 0 1px 2px rgba(22,19,15,.07), 0 1px 8px rgba(22,19,15,.05);
    --font-heading: "Trak Chiffres", "Gochi Hand", "Comic Sans MS", cursive;
    --font-body: "Schibsted Grotesk", system-ui, sans-serif;
    --font-mono: "Schibsted Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--color-accent-700); }
  a:hover { color: var(--color-accent-500); }
  input[type="number"] { -moz-appearance: textfield; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }

  header.app-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px;
    padding: 28px 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  /* La mascotte remplace l'ancien point vert du logo. */
  .brand .mascotte-entete { width: 36px; height: 36px; flex: none; margin: -3px 0; }
  .brand span { font-family: var(--font-heading); font-weight: 800; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--color-neutral-400); background: var(--color-neutral-100);
    color: var(--color-text); border-radius: 999px; padding: 11px 16px;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--color-accent-200); border-color: var(--color-accent-200); }
  .btn.active { background: var(--color-text); border-color: var(--color-text); color: var(--color-neutral-100); }
  .btn-primary {
    background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: var(--color-text);
  }
  .btn-primary:hover { background: var(--color-accent2-600); }
  .btn-ghost { border: none; background: none; padding: 10px 10px; }
  .btn-ghost:hover { background: var(--color-accent-200); }

  .divider { height: 2px; background: var(--color-text); margin-bottom: 30px; }

  .input {
    font-family: var(--font-body); font-size: 14px; border: 1px solid var(--color-neutral-400);
    border-radius: 999px; padding: 10px 16px; background: var(--color-neutral-100); color: var(--color-text);
  }
  .input:focus { outline: 2px solid var(--color-accent2-800); outline-offset: 1px; }
  /* Focus clavier visible sur les boutons, liens et cases (pas au clic souris). */
  :focus-visible { outline: 2px solid var(--color-accent2-800); outline-offset: 2px; }

  .card {
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 20px 22px;
  }
  .card, .habit-row, .mascotte-card, .note-card, .streak-card, .manage-row, .modal, .visite-bulle { border: 1px solid var(--color-neutral-300); }

  /* ---- Today ---- */
  .today-grid { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 40px; align-items: start; }
  .eyebrow { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600); }
  /* Titres faits de chiffres (date, semaine, année) : réglage d'avant le tableau blanc,
     repris plus bas. Les chiffres de Gochi Hand sont remplacés par ceux de Schibsted
     Grotesk partout où sert --font-heading (famille « Trak Chiffres », fonts/fonts.css). */
  h1.big, h1.num, h2.num { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.02em; text-transform: none; }
  h1.big { font-size: 34px; margin: 6px 0 4px; }
  .summary { font-size: 15px; color: var(--color-neutral-700); margin: 0 0 24px; }

  .habit-row { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 14px 18px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
  .habit-row .top { display: flex; align-items: center; gap: 14px; }
  .check {
    width: 34px; height: 34px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 15px; border: 1px solid var(--color-neutral-400); background: transparent; color: transparent;
    transition: background .15s, border-color .15s;
  }
  .check.done { background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: var(--color-accent2-900); }
  .habit-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .habit-meta { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  .note-toggle { margin-left: auto; white-space: nowrap; }
  .note-input { margin-top: 12px; width: 100%; }

  aside.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .stat-card { background: var(--color-accent2-200); border-radius: var(--radius-lg); padding: 22px 24px; }
  .stat-card .eyebrow { color: var(--color-accent2-800); }
  .stat-card .big-num { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; font-size: 46px; line-height: 1; margin-top: 8px; color: var(--color-accent2-900); }

  .goal-item { margin-bottom: 14px; }
  .goal-item:last-child { margin-bottom: 0; }
  .goal-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
  .goal-head .count { color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .goal-bar-bg { height: 8px; border-radius: 999px; background: var(--color-neutral-300); overflow: hidden; }
  .goal-bar { height: 100%; border-radius: 999px; background: var(--color-accent-500); }
  .goal-bar.full { background: var(--color-accent2-500); }

  /* ---- Mascotte ---- */
  /* Les couleurs arrivent par les variables --m-corps / --m-ombre / --m-clair
     posees sur chaque <svg> : un seul dessin pour toutes les teintes. */
  .mascotte { display: block; overflow: visible; }
  .mascotte .m-corps { fill: var(--m-corps); }
  .mascotte .m-ombre { fill: var(--m-ombre); }
  .mascotte .m-clair { fill: var(--m-clair); }
  .mascotte .m-encre { fill: var(--color-text); }
  .mascotte .m-trait { fill: none; stroke: var(--color-text); stroke-linecap: round; stroke-linejoin: round; }
  .mascotte .m-joue { fill: #ef8c7a; opacity: .45; }
  .mascotte.humeur-ravie .m-joue { opacity: .75; }
  .mascotte.humeur-endormie .m-joue { opacity: .3; }
  .mascotte .m-tige { fill: none; stroke: var(--color-accent2-800); stroke-width: 2.4; stroke-linecap: round; }
  .mascotte .m-feuille { fill: var(--color-accent2-400); stroke: var(--color-accent2-800); stroke-width: 1.6; stroke-linejoin: round; }
  /* Balancement lent, clignement rare : on doit a peine le remarquer. */
  .mascotte .m-balance { transform-box: view-box; transform-origin: 50% 94%; animation: m-balance 4.8s ease-in-out infinite; }
  .mascotte.humeur-ravie .m-balance { animation-duration: 3.2s; }
  .mascotte.humeur-endormie .m-balance { animation: m-souffle 3.6s ease-in-out infinite; }
  .mascotte.humeur-contente .m-yeux { transform-box: fill-box; transform-origin: center; animation: m-cligne 5.5s infinite; }
  .mascotte .m-z { opacity: .7; animation: m-z 3.6s ease-in-out infinite; }
  .mascotte .m-etincelle { animation: m-scintille 2.6s ease-in-out infinite; }
  .mascotte .m-etincelle + .m-etincelle { animation-delay: 1.3s; }
  /* Petit saut quand on coche une habitude. */
  .mascotte .m-saut { transform-box: view-box; transform-origin: 50% 96%; }
  .mascotte.saute .m-saut { animation: m-saut .55s cubic-bezier(.3,.7,.4,1); }
  .mascotte.fixe * { animation: none; }
  @keyframes m-balance { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes m-souffle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.975); } }
  @keyframes m-cligne { 0%,90%,96%,100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }
  @keyframes m-z { 0% { opacity: 0; transform: translate(0,4px); } 30%,70% { opacity: .75; } 100% { opacity: 0; transform: translate(4px,-6px); } }
  @keyframes m-scintille { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes m-saut {
    0% { transform: none; }
    25% { transform: translateY(-9px) scale(.96,1.05); }
    50% { transform: translateY(0) scale(1.08,.92); }
    70% { transform: scale(.97,1.03); }
    100% { transform: none; }
  }

  .mascotte-card {
    background: var(--color-neutral-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  }
  .mascotte-card-img { flex: none; width: 120px; height: 120px; }
  .mascotte-card-texte { flex: 1; min-width: 150px; }
  .mascotte-record { font-size: 13px; color: var(--color-neutral-600); margin: 0 0 12px; line-height: 1.4; }

  /* Modale « Personnaliser » */
  .modal.modal-large { max-width: 540px; }
  .mascotte-apercu {
    display: flex; justify-content: center; padding: 14px 0 10px; margin-bottom: 16px;
    background: var(--color-accent2-200); border-radius: var(--radius-lg);
  }
  .mascotte-progression { margin-bottom: 4px; }
  .mascotte-progression .count { white-space: nowrap; }
  .mascotte-note { font-size: 12px; color: var(--color-neutral-600); margin: 6px 0 0; }
  .tenue-groupe { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
  .tenue-groupe legend {
    padding: 0; margin-bottom: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--color-neutral-600);
  }
  .tenue-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tenue-option { position: relative; display: block; cursor: pointer; }
  .tenue-carte {
    display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%;
    padding: 8px 6px 10px; border: 1px solid var(--color-neutral-300); border-radius: 14px;
    text-align: center; transition: background .15s, border-color .15s;
  }
  .tenue-option:hover .tenue-carte { background: var(--color-neutral-200); }
  .tenue-option input:checked + .tenue-carte {
    background: var(--color-accent2-200); border-color: var(--color-accent2-600);
    box-shadow: inset 0 0 0 1px var(--color-accent2-600);
  }
  .tenue-option input:focus-visible + .tenue-carte { outline: 2px solid var(--color-accent2-600); outline-offset: 2px; }
  .tenue-nom { font-size: 13px; font-weight: 600; }
  .tenue-info { font-size: 11px; line-height: 1.3; color: var(--color-neutral-600); }
  .tenue-option.verrouille { cursor: not-allowed; }
  .tenue-option.verrouille:hover .tenue-carte { background: none; }
  .tenue-option.verrouille .mascotte { filter: grayscale(1); opacity: .45; }
  .tenue-option.verrouille .tenue-nom { color: var(--color-neutral-600); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Toast de deblocage */
  .toast-zone {
    position: fixed; left: 0; right: 0; bottom: 20px; z-index: 60;
    display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
  }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 460px;
    background: var(--color-text); color: var(--color-neutral-100);
    border-radius: var(--radius-lg); padding: 10px 10px 10px 12px;
    box-shadow: 0 10px 40px rgba(43,38,32,.22);
    opacity: 0; transform: translateY(12px); transition: opacity .25s, transform .25s;
  }
  .toast.visible { opacity: 1; transform: none; }
  .toast .mascotte { flex: none; }
  .toast-texte { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; }
  .toast-texte strong { display: block; font-size: 14px; }
  .toast-texte span { color: var(--color-neutral-300); }
  .toast .btn-ghost { color: var(--color-neutral-100); font-size: 18px; line-height: 1; padding: 6px 10px; }
  .toast .btn-ghost:hover { color: var(--color-text); }

  /* Visite guidee : un "trou" lumineux autour de l'element explique (son
     ombre geante assombrit tout le reste) et une bulle de texte a cote. */
  .aide-btn { width: 38px; height: 38px; padding: 0; font-size: 15px; display: grid; place-items: center; }
  .visite { position: fixed; inset: 0; z-index: 70; }
  .visite[hidden] { display: none; }
  .visite.sans-cible { background: rgba(43,38,32,.55); }
  .visite-trou {
    position: fixed; border-radius: var(--radius-lg); pointer-events: none;
    box-shadow: 0 0 0 3px var(--color-accent-500), 0 0 0 9999px rgba(43,38,32,.55);
    transition: top .3s ease, left .3s ease, width .3s ease, height .3s ease;
  }
  .visite.sans-cible .visite-trou { display: none; }
  .visite-bulle {
    position: fixed; width: min(360px, calc(100vw - 32px));
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(43,38,32,.28); padding: 20px 20px 16px;
    transition: top .3s ease, left .3s ease;
  }
  .visite-bulle:focus { outline: none; }
  .visite-bulle .mascotte { display: block; margin: -4px auto 8px; }
  .visite-etape { font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 6px; }
  .visite-bulle h2 { font-size: 18px; margin: 0 0 6px; }
  .visite-bulle p.visite-texte { font-size: 14px; line-height: 1.5; color: var(--color-neutral-700); margin: 0; }
  .visite-points { display: flex; gap: 5px; margin: 16px 0 0; }
  .visite-points span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-neutral-300); }
  .visite-points span.actif { background: var(--color-accent-500); width: 16px; border-radius: 3px; }
  .visite-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .visite-actions .spacer { margin-left: auto; }
  .visite-actions .btn-ghost { color: var(--color-neutral-700); }
  @media (max-width: 560px) {
    /* Sur telephone la bulle se pose en bas de l'ecran, pleine largeur. */
    .visite-bulle { left: 16px !important; right: 16px; top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom)); width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .visite-trou, .visite-bulle { transition: none; }
  }

  /* ---- Week ---- */
  .bilan-switch { display: flex; gap: 8px; margin-bottom: 22px; }
  .bilan-switch[hidden] { display: none; }
  .bilan-switch .compte { margin-left: 4px; font-weight: 400; opacity: .7; }
  .histo-plus { margin-top: 8px; }
  /* Safari iPhone donne au champ date une largeur et une hauteur à lui : il débordait sur
     « Contexte » et dépassait les autres champs. On le ramène à la taille des autres. */
  input[type="date"].input { -webkit-appearance: none; appearance: none; min-width: 0; display: block; text-align: left; }
  input[type="date"].input::-webkit-date-and-time-value { text-align: left; margin: 0; }
  .week-head-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .week-head-row h1 { margin: 0; margin-right: auto; }
  .week-table-wrap { overflow-x: auto; }
  .week-table {
    display: grid; grid-template-columns: minmax(130px,1fr) repeat(7, 42px) 64px;
    gap: 8px; align-items: center; min-width: 600px;
  }
  .week-table .colhead { text-align: center; }
  .week-table .colhead .dow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-600); }
  .week-table .colhead .daynum { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .week-table .rowname { font-size: 14px; font-weight: 600; padding-right: 6px; }
  .week-table .total { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--color-neutral-700); }
  .week-cell {
    width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--color-neutral-400);
    background: transparent; color: transparent; cursor: pointer; font-size: 14px;
  }
  .week-cell.done { background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: var(--color-accent2-900); }
  .week-cell.future { border-style: dashed; border-color: var(--color-neutral-300); cursor: default; }
  .week-hint { font-size: 13px; color: var(--color-neutral-600); margin-top: 12px; }

  .note-card { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 14px 18px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 10px; }
  .note-when { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-600); min-width: 100px; }
  .note-name { font-size: 14px; font-weight: 600; }
  .note-text { font-size: 14px; color: var(--color-neutral-700); flex: 1; min-width: 180px; }

  /* ---- Year ---- */
  .year-card { padding: 24px; overflow-x: auto; }
  .year-inner { min-width: 760px; }
  .month-row { display: flex; gap: 3px; margin-bottom: 6px; }
  .month-label { width: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--color-neutral-600); white-space: nowrap; overflow: visible; }
  .year-grid { display: flex; gap: 3px; }
  .year-col { display: flex; flex-direction: column; gap: 3px; }
  .year-cell { width: 12px; height: 12px; border-radius: 4px; background: var(--color-neutral-200); }
  .legend-row { display: flex; align-items: center; gap: 7px; margin-top: 18px; font-size: 12px; color: var(--color-neutral-600); flex-wrap: wrap; }
  .legend-cell { width: 12px; height: 12px; border-radius: 4px; }
  .legend-note { margin-left: 8px; }

  .streak-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; margin-top: 20px; }
  .streak-card { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .streak-card .name { font-size: 14px; font-weight: 600; }
  .streak-card .num { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; font-size: 30px; line-height: 1.1; margin-top: 6px; color: var(--color-accent-700); }
  .streak-card .detail { font-size: 12px; color: var(--color-neutral-600); }

  /* ---- Manage ---- */
  .manage-wrap { max-width: 620px; }
  .manage-row { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .manage-row .input:first-child { flex: 1; min-width: 160px; }
  .manage-row .goal-input { width: 68px; text-align: center; }
  .manage-unit { font-size: 12px; color: var(--color-neutral-600); }
  .manage-add { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .manage-add .input { flex: 1; min-width: 180px; }
  .reset-link { margin-top: 24px; }

  .manage-dist { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-neutral-700); cursor: pointer; }
  .manage-dist input { width: 16px; height: 16px; accent-color: var(--color-accent2-600); margin: 0; }

  /* ---- Natation : metres d'une seance ---- */
  .metres { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--color-neutral-700); }
  .metres .input { width: 96px; padding: 6px 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .stat-card + .stat-card { background: var(--color-accent-200); }
  .stat-card + .stat-card .eyebrow { color: var(--color-accent-700); }
  .stat-card + .stat-card .big-num { color: var(--color-text); }
  .stat-card .stat-detail { font-size: 13px; margin: 8px 0 0; color: var(--color-neutral-700); }

  /* ---- Chronos ---- */
  .chrono-form { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1.1fr); gap: 12px 14px; align-items: end; }
  .chrono-form .field { margin: 0; }
  .chrono-form .field-large { grid-column: span 3; }
  .chrono-form select.input { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--color-text) 50%), linear-gradient(135deg, var(--color-text) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  .chrono-form .chrono-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .chrono-form .form-msg { margin: 0; }
  .temps { font-variant-numeric: tabular-nums; }
  .rp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; }
  .rp-card {
    text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
    background: var(--color-neutral-100); border: 1px solid var(--color-neutral-300); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 16px 18px; transition: border-color .15s, background .15s;
  }
  .rp-card:hover { border-color: var(--color-neutral-400); }
  .rp-card.active { border-color: var(--color-accent2-600); box-shadow: inset 0 0 0 1px var(--color-accent2-600); background: var(--color-accent2-200); }
  .rp-card .name { font-size: 14px; font-weight: 600; }
  .rp-card .bassin { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-600); }
  .rp-card .num { font-weight: 700; letter-spacing: -0.03em; font-size: 28px; line-height: 1.1; margin-top: 6px; color: var(--color-accent2-900); }
  .rp-card .detail { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .gain { color: var(--color-accent2-800); font-weight: 600; }
  .perte { color: var(--color-accent-700); }
  .courbe { position: relative; margin-top: 4px; }
  .courbe svg { display: block; width: 100%; overflow: visible; }
  .courbe .grille { stroke: var(--color-neutral-300); stroke-width: 1; }
  .courbe .axe { font-family: var(--font-mono); font-size: 11px; fill: var(--color-neutral-600); }
  .courbe .ligne { fill: none; stroke: var(--color-accent2-600); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .courbe .point { fill: var(--color-accent2-600); stroke: var(--color-neutral-100); stroke-width: 2; }
  .courbe .point.rp { fill: var(--color-accent2-900); }
  .courbe .cible { fill: transparent; cursor: pointer; }
  .courbe .cible:focus { outline: none; }
  .courbe .cible:focus-visible + .halo, .courbe .halo.on { opacity: 1; }
  .courbe .halo { fill: none; stroke: var(--color-accent2-800); stroke-width: 2; opacity: 0; pointer-events: none; }
  .bulle-courbe {
    position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 12px));
    background: var(--color-text); color: var(--color-neutral-100); border-radius: 8px; padding: 7px 10px;
    font-size: 12px; line-height: 1.35; white-space: nowrap; z-index: 2;
  }
  .bulle-courbe strong { font-size: 14px; font-variant-numeric: tabular-nums; }
  .bulle-courbe[hidden] { display: none; }
  .histo { width: 100%; border-collapse: collapse; font-size: 14px; }
  .histo th { text-align: left; font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-600); padding: 0 10px 8px 0; }
  .histo td { padding: 9px 10px 9px 0; border-top: 1px solid var(--color-neutral-200); vertical-align: middle; }
  .histo td.temps { font-weight: 600; }
  .histo .badge { display: inline-block; margin-left: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; padding: 2px 6px; border-radius: 999px; background: var(--color-accent2-200); color: var(--color-accent2-900); vertical-align: 1px; }
  .histo .btn-ghost { padding: 6px 8px; color: var(--color-accent-700); }
  .histo-wrap { overflow-x: auto; }
  .histo .passages { display: block; font-size: 12px; font-weight: 400; color: var(--color-neutral-600); white-space: normal; margin-top: 2px; }
  .chrono-form .field-passages { grid-column: 1 / -1; }

  /* Objectif de temps */
  .rp-card .objectif { font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-neutral-300); color: var(--color-accent-700); }
  .rp-card .objectif.atteint { color: var(--color-accent2-800); font-weight: 600; }
  .obj-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; }
  .obj-form .field { margin: 0; }
  .obj-form .field .input { width: 140px; height: 42px; }
  .obj-form .form-msg { flex-basis: 100%; margin: 0; }
  .courbe .objectif-ligne { stroke: var(--color-accent-700); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .courbe .objectif-txt { font-family: var(--font-mono); font-size: 11px; fill: var(--color-accent-700); }

  /* Competitions */
  .compet-carte .compet-j { font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; font-size: 40px; line-height: 1; margin-top: 8px; }
  .compet-carte .compet-nom { font-size: 15px; font-weight: 600; margin: 8px 0 2px; }
  .compet-info { font-size: 13px; color: var(--color-neutral-600); margin: 0; }
  .compet-evs { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; }
  .compet-evs li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--color-neutral-200); }
  .compet-evs li .temps { color: var(--color-neutral-700); white-space: nowrap; }
  .compet-liste { padding: 6px 22px; }
  .compet-ligne { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--color-neutral-200); }
  .compet-ligne:first-child { border-top: 0; }
  .compet-j-petit { flex: none; min-width: 64px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .compet-corps { flex: 1; min-width: 0; }
  .compet-corps strong { display: block; font-size: 15px; }
  .compet-ligne .btn-ghost { color: var(--color-accent-700); }
  .compet-ajout { margin-top: 14px; }
  .compet-ajout summary { cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 0; }
  .compet-form { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr) minmax(0,1fr); gap: 12px 14px; margin-top: 16px; align-items: end; }
  .compet-form .field { margin: 0; }
  .compet-form .input { height: 42px; }
  .compet-form .field-nom:last-of-type { grid-column: 1 / -1; }
  .compet-form .chrono-actions { grid-column: 1 / -1; display: flex; }
  .epreuves-choix { grid-column: 1 / -1; border: 0; padding: 0; margin: 0; min-width: 0; }
  .epreuves-choix legend { padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--color-neutral-700); }
  .ev-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .ev-choix { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 10px; border: 1px solid var(--color-neutral-300); border-radius: 999px; cursor: pointer; }
  .ev-choix:hover { background: var(--color-neutral-200); }
  .ev-choix input { width: 16px; height: 16px; margin: 0; accent-color: var(--color-accent2-600); }
  .ev-choix:has(input:checked) { background: var(--color-accent2-200); border-color: var(--color-accent2-600); }
  /* Épreuve qui n'existe pas dans ce bassin (100 m 4 nages en 50 m). */
  .ev-choix:has(input:disabled) { color: var(--color-neutral-600); border-style: dashed; background: none; cursor: not-allowed; text-decoration: line-through; }
  .ev-note { font-size: 13px; color: var(--color-neutral-700); margin: 8px 0 0; }
  .ev-note[hidden] { display: none; }

  /* Fiche pour l'entraineur : invisible a l'ecran, seule visible a l'impression. */
  #fiche { color: #000; background: #fff; font-family: var(--font-body); }
  #fiche h1 { font-size: 22px; text-transform: none; margin: 0 0 4px; }
  #fiche h2 { font-size: 15px; margin: 22px 0 8px; }
  #fiche .fiche-date { font-size: 12px; margin: 0; color: #444; }
  #fiche table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #fiche th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #444; border-bottom: 1.5px solid #000; padding: 4px 6px 4px 0; }
  #fiche td { border-bottom: 1px solid #ccc; padding: 6px 6px 6px 0; vertical-align: top; }
  #fiche ul { font-size: 12px; padding-left: 18px; }
  #fiche table.fiche-vol { width: auto; }
  #fiche table.fiche-vol td { padding-right: 32px; }
  @media print {
    @page { margin: 14mm; }
    body { background: #fff; }
    .wrap, .toast-zone, .modal-backdrop, .visite { display: none !important; }
    #fiche { display: block !important; }
  }
  .histo td { white-space: nowrap; }
  .histo .ctx-mobile { display: none; font-size: 12px; color: var(--color-neutral-600); }
  .chrono-form .input { height: 42px; }

  .pied { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--color-neutral-300);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .pied a { color: var(--color-neutral-700); text-underline-offset: 3px; padding: 7px 0; }
  .pied a:hover { color: var(--color-accent-700); }

  /* ---- Compte & synchronisation ---- */
  .account-btn { display: flex; align-items: center; gap: 8px; }
  .account-btn .who { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-neutral-400); flex: none; }
  .sync-dot.ok { background: var(--color-accent2-500); }
  .sync-dot.busy { background: var(--color-accent-500); animation: sync-pulse 1s ease-in-out infinite; }
  .sync-dot.err { background: #c0532c; }
  @keyframes sync-pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  /* Si le système demande moins d'animations : plus de clignotement pendant la synchro,
     mascotte immobile (ni balancement, ni clignement, ni saut) et toast sans glissement.
     Les transitions de couleur (0,15 s) restent, elles aident à voir ce qui change. */
  @media (prefers-reduced-motion: reduce) {
    .sync-dot.busy { animation: none; opacity: .6; }
    .mascotte, .mascotte * { animation: none !important; }
    .toast { transform: none; transition: opacity .15s; }
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(43,38,32,.42);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(43,38,32,.22); width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto; padding: 24px;
  }
  .modal h2 { font-size: 20px; margin: 0 0 4px; }
  .modal .p-muted { margin-bottom: 18px; }
  .modal-close { position: absolute; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 12px; font-weight: 600; color: var(--color-neutral-700); margin-bottom: 5px; }
  .field .input { width: 100%; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
  .modal-actions .spacer { margin-left: auto; }
  .form-msg { font-size: 13px; line-height: 1.45; margin: 14px 0 0; }
  .form-msg.err { color: #a33f1c; }
  .form-msg.ok { color: var(--color-accent2-800); }
  .switch-mode { font-size: 13px; color: var(--color-neutral-700); margin: 16px 0 0; }
  .switch-mode button {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
    color: var(--color-accent-700); cursor: pointer; text-decoration: underline;
  }
  .sync-line { font-size: 13px; color: var(--color-neutral-700); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .device-list { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .device-list li { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--color-neutral-200); color: var(--color-neutral-700); }
  .device-list li .tag { margin-left: auto; font-size: 11px; color: var(--color-accent2-800); font-weight: 600; }

  h1, h2 { font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1.08; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 34px 0 14px; }
  p { line-height: 1.5; }
  .p-muted { font-size: 14px; color: var(--color-neutral-700); margin: 0 0 22px; }

  /* ---- Responsive ---- */
  @media (max-width: 860px) {
    .today-grid { grid-template-columns: 1fr; }
    aside.side { position: static; }
  }
  /* Avec la carte mascotte, la colonne de droite depasse la hauteur des petits
     ecrans : collee en haut, son bas deviendrait inaccessible. */
  @media (max-height: 760px) {
    aside.side { position: static; }
  }
  @media (max-width: 560px) {
    /* Telephone : les onglets passent dans une barre fixee en bas, a portee de pouce (comme une
       appli), et l'en-tete ne garde que le logo, le compte, les réglages et « ? » : 166 px d'en-tete -> environ 75. */
    .wrap { padding: 0 14px calc(96px + env(safe-area-inset-bottom)); }
    header.app-header { padding: calc(14px + env(safe-area-inset-top)) 0 12px; gap: 10px; flex-wrap: nowrap; }
    .divider { margin-bottom: 20px; }
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: var(--color-bg); border-top: 1px solid var(--color-neutral-300);
      box-shadow: 0 -6px 18px rgba(22,19,15,.07);
    }
    nav.tabs .btn {
      position: relative; min-height: 48px; padding: 8px 0; border: 0; background: none; border-radius: 10px;
      font-family: var(--font-body); font-size: 12.5px; font-weight: 500; letter-spacing: -0.01em; text-transform: none;
      color: var(--color-neutral-600); white-space: nowrap;
    }
    nav.tabs .btn:hover { background: var(--color-neutral-200); border-color: transparent; }
    /* Onglet actif : texte en gras et petit trait de couleur (jaune sous le libellé, voir plus bas ;
       pas de pastille : « Aujourd'hui » n'y tiendrait pas). */
    nav.tabs .btn.active { background: none; color: var(--color-text); font-weight: 700; }
    nav.tabs .btn.active::before {
      content: ""; position: absolute; top: -7px; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px;
      background: var(--color-accent2-600);
    }
    .toast-zone { bottom: calc(76px + env(safe-area-inset-bottom)); }
    .account-btn .who { max-width: 140px; }
    .btn { padding: 11px 14px; letter-spacing: .1em; min-height: 42px; }
    .btn-ghost { min-height: 42px; }
    h1.big, h1 { font-size: 24px; }
    .habit-row, .card { padding: 14px 16px; }
    /* Sous 16 px, Safari iPhone zoome toute la page des qu'on touche un champ. */
    .input { font-size: 16px; }
    /* Cibles tactiles d'au moins 44 px. */
    .check { width: 44px; height: 44px; font-size: 17px; }
    .habit-row { padding: 12px 14px; }
    .habit-row .top { gap: 12px; }
    .note-toggle { padding: 10px 8px; }
    /* Aujourd'hui : les cartes sous les habitudes, plus serrées. */
    aside.side { gap: 12px; }
    .stat-card { padding: 16px; }
    .stat-card .big-num { font-size: 32px; }
    .stat-card .stat-detail { font-size: 12px; }
    .compet-carte .compet-j { font-size: 32px; }
    /* Annee : les series sur deux colonnes. */
    .streak-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .streak-card { padding: 14px 16px; }
    .streak-card .num { font-size: 24px; }
    /* Chronos : records sur deux colonnes, objectif sur une ligne. */
    .rp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .rp-card { padding: 12px 14px; }
    .rp-card .num { font-size: 23px; }
    .rp-card .detail, .rp-card .objectif { font-size: 11.5px; }
    .obj-form .field { flex: 1 1 110px; }
    .obj-form .field .input { width: 100%; }
    .ev-choix { padding: 11px 12px; }
    .compet-ajout summary { padding: 14px 0; }
    .aide-btn { width: 44px; height: 44px; }
    .pied a { padding: 12px 0; }
    .chrono-form { grid-template-columns: 1fr 1fr; }
    .chrono-form .field-large, .chrono-form .field-epreuve { grid-column: 1 / -1; }
    .chrono-form .chrono-actions { grid-column: 1 / -1; }
    /* Telephone : contexte replie sous la date, lieu masque (il reste dans la bulle de la courbe). */
    .histo .col-lieu, .histo .col-ctx { display: none; }
    .compet-form { grid-template-columns: 1fr 1fr; }
    .compet-form .field-nom { grid-column: 1 / -1; }
    .compet-liste { padding: 4px 16px; }
    .compet-ligne { flex-wrap: wrap; gap: 4px 12px; }
    .compet-ligne .btn-ghost { margin-left: auto; }
    .histo .ctx-mobile { display: block; }
    .histo td, .histo th { padding-right: 8px; }
    /* Semaine : le nom de l'habitude au-dessus de ses sept cases, qui prennent toute la largeur. */
    .week-table { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 6px; min-width: 0; }
    .week-table > div:first-child, .week-table .total { display: none; }
    .week-table .rowname { grid-column: 1 / -1; padding: 8px 0 0; }
    .week-cell { width: 100%; max-width: 42px; height: 42px; justify-self: center; font-size: 15px; }
    .year-inner { min-width: 560px; }
    .year-cell { width: 9px; height: 9px; }
    .month-label { width: 9px; font-size: 11px; }
  }

  /* ===== Identité « tableau blanc » (2026-11-14) =====
     Trak se lit comme le tableau de séance du bord de bassin : titres et
     grands nombres au feutre bleu, aimants rouges pour ce qui est fait,
     rebord gris foncé en bas. Le texte courant est en Schibsted Grotesk,
     la police du portfolio. Plus de petites majuscules espacées. */
  /* Graisse 500 : Gochi Hand n'a qu'un 400 (rien n'est épaissi artificiellement sous 600),
     les chiffres Schibsted prennent un trait proche de celui du feutre. */
  h1, h2 { font-family: var(--font-heading); font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--color-accent-500); line-height: 1.05; }
  h1 { font-size: 40px; }
  h2 { font-size: 28px; }
  h1.big, h1.num, h2.num { font-family: var(--font-heading); font-weight: 500; letter-spacing: 0; }
  h1.big { font-size: 46px; }
  .brand span { font-family: var(--font-body); font-weight: 800; text-transform: none; letter-spacing: -0.01em; font-size: 20px; }
  .eyebrow, .btn, .visite-etape, .tenue-groupe legend, .week-table .colhead .dow, .note-when,
  .rp-card .bassin, .histo th, .histo .badge, .compet-ajout summary, .pied, .courbe .axe, .courbe .objectif-txt, .month-label {
    text-transform: none; letter-spacing: 0;
  }

  /* ===== Jours passés et séances multiples (2026-11-16) ===== */

  /* ===== Chronos : Records / Compétitions, modification, compétitions passées (2026-11-16) ===== */

  /* Rappel « Entrez vos temps de … » sur l'écran du jour. */
  .saisie-carte { margin: 0 0 16px; border-color: var(--color-accent2-400); }

  /* ===== Saison : séries en semaines, histogramme du volume (2026-11-16) ===== */
  .saison-tete { margin-bottom: 6px; }

    /* Mascotte : dessin à gauche, texte et bouton à droite. */
    .mascotte-card { align-items: flex-start; padding: 12px 14px; gap: 12px; }
    .mascotte-card-img, .mascotte-card-img .mascotte { width: 56px; height: 56px; }
    .mascotte-card-texte { flex: 1 1 0; }
    .mascotte-card .mascotte-record { margin-bottom: 8px; }
    .mascotte-card-texte .btn { min-height: 44px; }
    .reussite-carte { max-width: none; margin-top: 18px; }
  }
  /* Titres : pas de mot seul sur la dernière ligne (« 25 / m »). */
  h1, h2 { text-wrap: balance; }
  /* iPhone : la page passe sous l'heure et la batterie (viewport-fit=cover), et iOS floute ce qui
     défile dessous. Une bande pleine, de la couleur du fond, couvre cette zone : le contenu
     disparaît net sous la barre d'état au lieu d'y devenir flou. Hauteur nulle ailleurs. */
  .bande-statut {
    position: fixed; top: 0; left: 0; right: 0; z-index: 45; pointer-events: none;
    height: env(safe-area-inset-top, 0px); background: var(--color-bg);
  }
  @media (max-width: 560px) {
    /* Cibles tactiles de 44 px au moins : boutons, champs, cases de la semaine. */
    .btn, .btn-ghost { min-height: 44px; }
    .input { min-height: 44px; }
    .chrono-form .input, .compet-form .input, .obj-form .field .input, .saisie-form .input { height: 44px; }
    .week-table { column-gap: 3px; }
    .week-cell { max-width: 46px; height: 44px; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  // Habitudes de depart d'un nageur. dist = 1 : on y note aussi les metres nages.
  // Identifiants nouveaux (prefixe n-) : Sync.run retire celles qu'on n'a jamais
  // touchees quand on rejoint un compte qui a deja ses habitudes.
  const DEFAULT_HABITS = [
    { id: "n-seance", name: "Séance de natation", goal: 5, dist: 1 },
    { id: "n-prepa", name: "Prépa physique / gainage", goal: 3 },
    { id: "n-etirements", name: "Étirements", goal: 5 }
  ];
  // « Dormir 8 h ou plus » (n-sommeil) et « Boire 1,5 L d'eau » (n-eau) ne sont plus
  // proposées aux nouveaux venus (2026-11-16). Ceux qui les ont gardées les conservent :
  // elles vivent dans leur stockage local et sur le serveur, pas dans cette liste.

  // Epreuves officielles, regroupees par nage. Identifiant = "<distance>-<nage>".
  const NAGES = [
    { id: "nl", nom: "nage libre", distances: [50, 100, 200, 400, 800, 1500] },
    { id: "dos", nom: "dos", distances: [50, 100, 200] },
    { id: "br", nom: "brasse", distances: [50, 100, 200] },
    { id: "pap", nom: "papillon", distances: [50, 100, 200] },
    { id: "4n", nom: "4 nages", distances: [100, 200, 400] }
  ];
  const EPREUVES = [];
  NAGES.forEach((n) => n.distances.forEach((d) => EPREUVES.push({ id: d + "-" + n.id, nage: n.id, nom: d + " m " + n.nom })));
  function nomEpreuve(id) {
    const e = EPREUVES.find((x) => x.id === id);
    return e ? e.nom : id;
  }
  // Le 100 m 4 nages ne se nage qu'en bassin de 25 m : refusé en 50 m.
  const SEUL_25 = ["100-4n"];
  function epreuvePossible(ev, pool) { return !(pool === 50 && SEUL_25.includes(ev)); }
  const MSG_100_4N = "Le 100 m 4 nages n'existe qu'en bassin de 25 m.";
  // Contexte d'un chrono (champ comp) : 1 compétition, 0 entraînement, 2 relais en départ
  // lancé. Un relais n'est pas comparable : il ne compte ni pour le record ni pour l'objectif.
  const CONTEXTES = [[1, "Compétition"], [0, "Entraînement"], [2, "Relais (départ lancé)"]];
  function contexteDe(c) { return c === 2 ? 2 : c ? 1 : 0; }
  function libelleContexte(c) { const k = contexteDe(c); return CONTEXTES.find((x) => x[0] === k)[1]; }
  const DOW = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
  const DOW_LONG = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const KEY = "cadence-vierge.v1";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function ymd(d) {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) {
    const x = new Date(d.getTime());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function nowMs() { return Date.now(); }

  function defaultHabits() {
    return DEFAULT_HABITS.map((h, i) => ({ id: h.id, name: h.name, goal: h.goal, dist: h.dist || 0, pos: i, u: 0 }));
  }

  // --- Temps de course : centiemes <-> texte ------------------------------
  // Accepte « 1:05.32 », « 1'05"32 », « 65,32 », « 32.4 » (dixiemes) ou « 28 ».
  // Le pave numerique de l'iPhone n'a que la virgule : « 1,05,32 » (trois nombres,
  // secondes sur deux chiffres) se lit aussi 1:05.32.
  function parseTemps(s) {
    const brut = String(s || "").trim();
    const m = brut.match(/^(\d{1,2})\s*[:'h.,]\s*(\d{2})\s*[:.,"]\s*(\d{1,2})$/)
      || brut.match(/^(?:(\d{1,2})\s*[:'h]\s*)?(\d{1,2})(?:\s*[.,"]\s*(\d{1,2}))?$/);
    if (!m) return null;
    const min = Number(m[1] || 0), sec = Number(m[2]);
    if (m[1] && sec > 59) return null;
    const cs = m[3] ? (m[3].length === 1 ? Number(m[3]) * 10 : Number(m[3])) : 0;
    const t = (min * 60 + sec) * 100 + cs;
    return t > 0 && t <= 360000 ? t : null;
  }
  function formatTemps(t) {
    const p = (n) => String(n).padStart(2, "0");
    const min = Math.floor(t / 6000), sec = Math.floor((t % 6000) / 100), cs = t % 100;
    return min ? min + ":" + p(sec) + "." + p(cs) : sec + "." + p(cs);
  }
  // Ecart en secondes, signe explicite : « −0.84 s » (plus rapide) ou « +1.20 s ».
  function formatEcart(cs) {
    const s = (Math.abs(cs) / 100).toFixed(2);
    return (cs < 0 ? "−" : cs > 0 ? "+" : "±") + s + " s";
  }
  function formatDistance(m) {
    if (m < 1000) return m + " m";
    return (m / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " km";
  }
  function dateCourte(day) {
    const d = new Date(day + "T12:00:00");
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  const State = {
    tab: "today",
    // Dernier écran ouvert dans l'onglet « Bilan » (Semaine ou Saison, id « year »), rouvert au retour.
    bilan: "week",
    today: ymd(new Date()),
    // Jour affiché par l'écran « Aujourd'hui » : aujourd'hui, ou un jour passé à compléter.
    jour: ymd(new Date()),
    // Sens du dernier changement de jour (-1 ou 1), pour l'entrée du contenu ; consommé au rendu.
    sensJour: 0,
    // « id|jour » de l'habitude où l'on vient d'ouvrir un champ de séance en plus (pas encore rempli).
    seancePlus: null,
    weekOffset: 0,
    // Saison affichée dans Bilan : 0 = en cours (1er septembre → 31 août), -1 = la précédente…
    saisonOffset: 0,
    openNote: null,
    newName: "",
    // Écran « Réglages » (State.tab = "reglages") : l'onglet d'où on l'a ouvert, rouvert par « Retour ».
    avantReglages: "today",
    // Message sous « Sauvegarde » (téléchargée, restaurée, fichier refusé).
    sauvegardeMsg: "", sauvegardeMsgType: "",
    habits: defaultHabits(),
    log: {},
    // Habitudes supprimees : { id: { u } }. Conservees pour que la suppression
    // se propage aux autres appareils au lieu d'etre "reparee" par eux.
    gone: {},
    // Chronos : { id: { ev, pool, t (centiemes), d, comp (0, 1 ou 2 = relais), lieu, sp, cid?, u } } ;
    // { del: 1, u } une fois supprime. cid = identifiant de la competition ou le temps a ete nage.
    // tx = marque locale, jamais envoyee : relais ou cid pas encore gardes par le serveur (ancienne API).
    times: {},
    // Objectifs (k: "obj", data: { t }) et competitions (k: "comp", data: { nom, d, lieu, pool, evs,
    // lim?: { epreuve: temps limite }, fermee?: 1 = rappel « Entrez vos temps » ferme }).
    items: {},
    chrono: { sel: "", ev: "100-nl", pool: 25, comp: 1, msg: "", msgType: "", brouillon: null, objMsg: "", objMsgType: "", compMsg: "", compMsgType: "", compOuvert: false, vuePool: 0, histoTout: false,
      // vue : « records » ou « compets » ; formOuvert : formulaire d'ajout déplié ; edit : id du temps
      // en cours de modification ; compEdit : id de la compétition modifiée ; annuler : { type: "t" | "c",
      // id, avant } pour défaire la dernière modification ; saisie : id de la compétition en saisie rapide.
      vue: "records", formOuvert: false, edit: null, compEdit: null, annuler: null, saisie: null, saisieMsg: "", saisieMsgType: "", saisieB: null },
    // Ce qui reste a envoyer au serveur.
    dirtyH: {},
    dirtyE: {},
    dirtyT: {},
    dirtyI: {}
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.habits && d.log) {
          State.habits = d.habits;
          State.log = d.log;
          State.gone = d.gone || {};
          State.dirtyH = d.dirtyH || {};
          State.dirtyE = d.dirtyE || {};
          State.times = d.times || {};
          State.dirtyT = d.dirtyT || {};
          State.items = d.items || {};
          State.dirtyI = d.dirtyI || {};
          if (!d.v) migrateToSync();
          return;
        }
      }
    } catch (e) { /* stockage indisponible */ }
    State.log = {};
    persist();
  }

  // Donnees enregistrees avant l'arrivee de la synchronisation : on les horodate
  // maintenant et on les marque a envoyer, pour qu'elles remontent au compte.
  function migrateToSync() {
    const t = nowMs();
    State.habits.forEach((h, i) => {
      if (h.pos == null) h.pos = i;
      h.u = t;
      State.dirtyH[h.id] = 1;
    });
    Object.keys(State.log).forEach((k) => { State.log[k].u = t; State.dirtyE[k] = 1; });
    persist();
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        v: 2,
        habits: State.habits, log: State.log, gone: State.gone, times: State.times, items: State.items,
        dirtyH: State.dirtyH, dirtyE: State.dirtyE, dirtyT: State.dirtyT, dirtyI: State.dirtyI
      }));
    } catch (e) { /* ignore */ }
  }

  function findHabit(id) {
    for (let i = 0; i < State.habits.length; i++) if (State.habits[i].id === id) return State.habits[i];
    return null;
  }
  function habitStamp(id) {
    const h = findHabit(id);
    if (h) return h.u || 0;
    return State.gone[id] ? State.gone[id].u || 0 : 0;
  }
  function nextPos() {
    return State.habits.reduce((m, h) => Math.max(m, h.pos || 0), -1) + 1;
  }
  // Marque une habitude comme modifiee localement et programme l'envoi.
  function touchHabit(h) {
    h.u = nowMs();
    State.dirtyH[h.id] = 1;
    persist(); Sync.schedule();
  }

  function isDone(id, day) { const e = State.log[id + "|" + day]; return !!(e && e.done); }

  // Une entrée = une habitude un jour donné : { done, note, m, s?, u }. m est le total
  // des mètres du jour ; s, la liste des mètres de chaque séance, n'existe qu'à partir
  // de deux séances (3 au plus). Les anciens clients et l'ancienne API ne lisent que m.
  const MAX_SEANCES = 3;
  function totalSeances(liste) { return Math.min(100000, liste.reduce((a, x) => a + x, 0)); }
  // Mètres de chaque séance d'une entrée : [] si rien, [m] pour une seule séance.
  function seancesDe(e) {
    if (!e || e.del) return [];
    if (Array.isArray(e.s) && e.s.length > 1) return e.s.slice();
    return e.m ? [e.m] : [];
  }
  // Nettoie une liste reçue (serveur, stockage) : 3 nombres au plus, 0 à 100 000 chacun.
  function nettoyerSeances(s) {
    if (!Array.isArray(s)) return [];
    return s.slice(0, MAX_SEANCES).map((x) => Math.max(0, Math.min(100000, Math.round(Number(x) || 0))));
  }
  // Réécrit l'entrée id|day en gardant ce qu'on ne change pas, et la met en file d'envoi.
  function ecrireEntree(id, day, maj) {
    const k = id + "|" + day;
    const prev = State.log[k] && !State.log[k].del ? State.log[k] : null;
    const e = { done: !!(prev && prev.done), note: prev ? prev.note || "" : "", m: prev ? prev.m || 0 : 0, u: nowMs() };
    if (prev && Array.isArray(prev.s) && prev.s.length > 1) e.s = prev.s.slice();
    Object.assign(e, maj);
    if (!Array.isArray(e.s) || e.s.length < 2) delete e.s;
    State.log[k] = e;
    State.dirtyE[k] = 1;
    return e;
  }
  function toggle(id, day) {
    const e = ecrireEntree(id, day, { done: !isDone(id, day) });
    // La mascotte saute quand on coche, et un palier franchi ici merite un toast.
    Mascotte.action = true;
    Mascotte.saute = e.done;
    persist(); Sync.schedule(); render();
  }
  function setNote(id, day, note) {
    ecrireEntree(id, day, { note: note });
    persist(); Sync.schedule();
  }
  // Distance nagee : une liste de seances (une case par seance). Saisir des metres
  // coche l'habitude ; les effacer ne la decoche pas (on a pu nager sans compter).
  // Une seance videe disparait de la liste.
  function majSeances(id, day, liste) {
    const gardees = liste.map((x) => Math.max(0, Math.min(100000, Math.round(Number(x) || 0)))).filter((x) => x > 0).slice(0, MAX_SEANCES);
    const total = totalSeances(gardees);
    const avant = isDone(id, day);
    ecrireEntree(id, day, { done: avant || total > 0, m: total, s: gardees.length > 1 ? gardees : undefined });
    // Des mètres notés ici peuvent débloquer une tenue (toast) ; la mascotte saute si l'habitude vient d'être cochée.
    Mascotte.action = true;
    if (!avant && total > 0) Mascotte.saute = true;
    persist(); Sync.schedule(); render();
  }
  function setSeance(id, day, i, valeur) {
    const liste = seancesDe(State.log[id + "|" + day]);
    liste[i] = valeur;
    majSeances(id, day, Array.from(liste, (x) => x || 0));
  }
  function retirerSeance(id, day, i) {
    const liste = seancesDe(State.log[id + "|" + day]);
    liste.splice(i, 1);
    majSeances(id, day, liste);
  }
  function metersOf(id, day) { const e = State.log[id + "|" + day]; return e && !e.del && e.m ? e.m : 0; }
  // Nombre de vraies seances avec distance d'une entree (0 sans metres).
  function nbSeances(id, day) {
    const e = State.log[id + "|" + day];
    if (!metersOf(id, day)) return 0;
    return Math.max(1, seancesDe(e).filter((x) => x > 0).length);
  }
  // Metres nages sur [debut, debut + n jours[, toutes habitudes « distance » confondues.
  function volume(debut, n) {
    let total = 0, seances = 0;
    for (let i = 0; i < n; i++) {
      const day = ymd(addDays(debut, i));
      State.habits.forEach((h) => {
        if (!h.dist) return;
        const m = metersOf(h.id, day);
        if (m) { total += m; seances += nbSeances(h.id, day); }
      });
    }
    return { total: total, seances: seances };
  }

  // --- Jour affiché par l'écran « Aujourd'hui » ------------------------------
  function ecartJours(day) {
    return Math.round((new Date(State.today + "T12:00:00") - new Date(day + "T12:00:00")) / 864e5);
  }
  function allerJour(day) {
    if (day > State.today) day = State.today;
    if (day === State.jour) return;
    State.sensJour = day < State.jour ? -1 : 1;
    State.jour = day;
    State.openNote = null;
    State.seancePlus = null;
    renderTabs();
    renderToday();
  }

  // --- Séries et réussite, jugées sur l'objectif de la semaine ----------------
  // Une semaine (lundi → dimanche) est « tenue » quand l'habitude y est cochée au moins
  // goal jours. Un jour de repos prévu ne casse donc rien : 5 jours sur 7 suffisent pour
  // un objectif de 5.
  function compteSemaine(id, lundi) {
    let c = 0;
    for (let i = 0; i < 7; i++) if (isDone(id, ymd(addDays(lundi, i)))) c++;
    return c;
  }
  function objectifDe(h) { return Math.max(1, Math.min(7, Number(h && h.goal) || 1)); }
  function semaineTenue(h, lundi) { return compteSemaine(h.id, lundi) >= objectifDe(h); }
  // Premier jour coché d'une habitude (« AAAA-MM-JJ »), ou "" s'il n'y en a aucun.
  function premiereCoche(id) {
    let min = "";
    const pre = id + "|";
    Object.keys(State.log).forEach((k) => {
      if (k.lastIndexOf(pre, 0) !== 0) return;
      const e = State.log[k];
      if (!e || e.del || !e.done) return;
      const day = k.slice(pre.length);
      if (!min || day < min) min = day;
    });
    return min;
  }
  // Série en cours, en semaines consécutives tenues. La semaine en cours compte dès que
  // l'objectif y est atteint, et ne casse pas la série tant qu'elle n'est pas finie.
  function streak(id) {
    const h = findHabit(id);
    if (!h) return 0;
    let lundi = mondayOf(new Date(State.today + "T12:00:00"));
    let n = semaineTenue(h, lundi) ? 1 : 0;
    for (let k = 0; k < 1000; k++) {
      lundi = addDays(lundi, -7);
      if (!semaineTenue(h, lundi)) break;
      n++;
    }
    return n;
  }
  // Record : la plus longue suite de semaines tenues, semaine en cours comprise si elle l'est.
  function best(id) {
    const h = findHabit(id);
    const debut = h ? premiereCoche(id) : "";
    if (!debut) return 0;
    const fin = mondayOf(new Date(State.today + "T12:00:00"));
    let lundi = mondayOf(new Date(debut + "T12:00:00"));
    let n = 0, m = 0;
    for (let k = 0; k < 1000 && lundi <= fin; k++) {
      if (semaineTenue(h, lundi)) { n++; if (n > m) m = n; } else n = 0;
      lundi = addDays(lundi, 7);
    }
    return m;
  }
  function libelleSemaines(n) { return n + " semaine" + (n > 1 ? "s" : ""); }
  // Objectifs tenus sur les 4 dernières semaines complètes (la semaine en cours n'y est pas) :
  // somme, sur les habitudes, de min(jours cochés, objectif), divisée par la somme des objectifs.
  // Tenir tous ses objectifs donne 100 %, même avec des jours de repos.
  function reussite4Semaines() {
    const lundi = mondayOf(new Date(State.today + "T12:00:00"));
    let tenu = 0, vise = 0;
    for (let k = 1; k <= 4; k++) {
      const debut = addDays(lundi, -7 * k);
      State.habits.forEach((h) => {
        const g = objectifDe(h);
        tenu += Math.min(compteSemaine(h.id, debut), g);
        vise += g;
      });
    }
    return { pct: vise ? Math.round(tenu / vise * 100) : 0, tenu: tenu, vise: vise, du: addDays(lundi, -28), au: addDays(lundi, -1) };
  }
  // « du 19 oct. au 15 nov. », ou « du 3 au 9 nov. » dans un même mois (sans point final ajouté).
  function periodeCourte(a, b) {
    const memeMois = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
    const jour = (d) => d.getDate() === 1 ? "1er" : String(d.getDate());
    return "du " + jour(a) + (memeMois ? "" : " " + MONTHS[a.getMonth()]) + " au " + jour(b) + " " + MONTHS[b.getMonth()];
  }

  // --- Saison sportive : du 1er septembre au 31 août ---------------------------
  // decalage 0 = la saison qui contient aujourd'hui, -1 la précédente, etc.
  function saison(decalage) {
    const t = new Date(State.today + "T12:00:00");
    const an = (t.getMonth() >= 8 ? t.getFullYear() : t.getFullYear() - 1) + (decalage || 0);
    return { an: an, debut: new Date(an, 8, 1, 12), fin: new Date(an + 1, 7, 31, 12), nom: an + "-" + (an + 1) };
  }
  // Mètres nagés (habitudes « Compter les mètres ») du jour du au jour au, inclus (« AAAA-MM-JJ »),
  // en un seul passage sur le journal. Mêmes règles que volume().
  function metresEntre(du, au) {
    const dist = {};
    State.habits.forEach((h) => { if (h.dist) dist[h.id] = 1; });
    let total = 0;
    Object.keys(State.log).forEach((k) => {
      const i = k.lastIndexOf("|");
      const day = k.slice(i + 1);
      if (day < du || day > au || !dist[k.slice(0, i)]) return;
      const e = State.log[k];
      if (e && !e.del && e.m) total += e.m;
    });
    return total;
  }
  // Mètres nagés depuis le début de la saison en cours (1er septembre), aujourd'hui compris.
  function metresSaison() {
    return metresEntre(ymd(saison(0).debut), State.today);
  }
  // Premier jour du journal où quelque chose est noté (coche ou mètres), ou "".
  function premierJourNote() {
    let min = "";
    Object.keys(State.log).forEach((k) => {
      const e = State.log[k];
      if (!e || e.del || !(e.done || e.m)) return;
      const day = k.slice(k.lastIndexOf("|") + 1);
      if (!min || day < min) min = day;
    });
    return min;
  }
  function heatColor(ratio) {
    if (ratio === 0) return "var(--color-empty-grey)";
    if (ratio < 0.34) return "var(--color-accent2-200)";
    if (ratio < 0.67) return "var(--color-accent2-300)";
    if (ratio < 1) return "var(--color-accent2-400)";
    return "var(--color-accent2-600)";
  }

  function renderTabs() {
    // « Bilan » regroupe Semaine et Saison : un seul onglet, un sélecteur en haut de l'écran.
    const bilan = State.tab === "week" || State.tab === "year";
    if (bilan) State.bilan = State.tab;
    document.querySelectorAll(".tabs .btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === State.tab || (bilan && b.dataset.tab === "bilan"));
    });
    const choix = document.getElementById("bilan-switch");
    choix.hidden = !bilan;
    choix.querySelectorAll(".btn").forEach((b) => {
      const actif = b.dataset.vue === State.tab;
      b.classList.toggle("active", actif);
      b.setAttribute("aria-pressed", String(actif));
    });
    // Réglages : un écran ouvert depuis l'en-tête, aucun onglet de la barre n'est alors actif.
    const rg = document.getElementById("reglages-btn");
    rg.classList.toggle("active", State.tab === "reglages");
    rg.setAttribute("aria-pressed", String(State.tab === "reglages"));
    ["today", "week", "year", "chronos", "reglages"].forEach((t) => {
      document.getElementById("view-" + t).style.display = t === State.tab ? "" : "none";
    });
    if (State.tab === "year") caleAnnee(); else SaisonVue.vu = false;
  }

  // Écran « Aujourd'hui » : le jour State.jour (aujourd'hui par défaut, ou un jour passé
  // qu'on complète). Coches, mètres et note s'appliquent à ce jour ; la mascotte et la
  // prochaine compétition restent comptées depuis aujourd'hui.
  // Colonne de côté (sous les habitudes sur téléphone) : compétition, rappel des temps,
  // volume et objectifs de la semaine, puis la mascotte. Les objectifs tenus sur
  // 4 semaines sont dans Bilan > Semaine.
  function renderToday() {
    const el = document.getElementById("view-today");
    if (State.jour > State.today) State.jour = State.today;
    const jour = State.jour;
    const estAuj = jour === State.today;
    const ecart = ecartJours(jour);
    const today = new Date(State.today + "T12:00:00");
    const affiche = new Date(jour + "T12:00:00");
    const doneJour = State.habits.filter((h) => isDone(h.id, jour)).length;
    const weekday = DOW_LONG[(affiche.getDay() + 6) % 7];
    const relatif = ecart === 1 ? ", hier" : ecart > 1 && ecart < 14 ? ", il y a " + ecart + " jours" : "";
    const quand = estAuj ? "aujourd'hui" : ecart === 1 ? "hier" : "ce jour-là";
    const titre = affiche.getDate() + " " + MONTHS[affiche.getMonth()]
      + (affiche.getFullYear() !== today.getFullYear() ? " " + affiche.getFullYear() : "");
    // Après un changement de jour, le contenu entre du côté d'où l'on vient (une seule fois).
    const entree = State.sensJour ? " jour-entre" + (State.sensJour < 0 ? " depuis-gauche" : " depuis-droite") : "";
    State.sensJour = 0;

    // Objectifs et volume : la semaine du jour affiché.
    const monday = mondayOf(affiche);
    const semaineEnCours = ymd(monday) === ymd(mondayOf(today));
    const goalsHtml = State.habits.map((h) => {
      let c = 0;
      for (let i = 0; i < 7; i++) if (isDone(h.id, ymd(addDays(monday, i)))) c++;
      const pct = Math.min(100, Math.round(c / Math.max(1, h.goal) * 100));
      return `<div class="goal-item">
        <div class="goal-head"><span>${esc(h.name)}</span><span class="count">${c} / ${h.goal}</span></div>
        <div class="goal-bar-bg"><div class="goal-bar${pct >= 100 ? " full" : ""}" style="width:${pct}%"></div></div>
      </div>`;
    }).join("");

    const rowsHtml = State.habits.map((h) => {
      const k = h.id + "|" + jour;
      const entry = State.log[k] && !State.log[k].del ? State.log[k] : { done: false, note: "" };
      const st = streak(h.id);
      const meta = st > 0 ? "Série : " + libelleSemaines(st) : best(h.id) > 0 ? "Série interrompue" : "Pas encore de série";
      const noteOpen = State.openNote === h.id || !!entry.note;
      let metres = "";
      if (h.dist) {
        // Une case par séance ; « + séance » ouvre une case vide (pas encore enregistrée).
        const liste = seancesDe(entry);
        const champs = liste.length ? liste.slice() : [0];
        if (State.seancePlus === k && liste.length && liste.length < MAX_SEANCES) champs.push(0);
        const plusieurs = champs.length > 1;
        const cases = champs.map((v, i) => {
          const nom = plusieurs ? "Séance " + (i + 1) : "Distance";
          const retirer = plusieurs
            ? `<button type="button" class="btn btn-ghost seance-retirer" data-action="seance-retirer" data-id="${esc(h.id)}" data-i="${i}" aria-label="Retirer la séance ${i + 1}" title="Retirer la séance ${i + 1}">×</button>`
            : "";
          return `<span class="seance"><label class="metres">${nom} <input class="input" type="number" inputmode="numeric" min="0" max="100000" step="100" placeholder="0" data-action="metres" data-id="${esc(h.id)}" data-i="${i}" value="${v || ""}"> m</label>${retirer}</span>`;
        }).join("");
        const total = liste.length > 1 ? `<span class="seances-total">Total ${formatDistance(entry.m || 0)}</span>` : "";
        const plus = liste.length && champs.length < MAX_SEANCES
          ? `<button type="button" class="btn btn-ghost seance-plus" data-action="seance-plus" data-id="${esc(h.id)}">+ séance</button>`
          : "";
        metres = `<div class="seances">${cases}${total}${plus}</div>`;
      }
      return `<div class="habit-row" data-id="${esc(h.id)}">
        <div class="top">
          <button type="button" class="check${entry.done ? " done" : ""}" data-action="toggle" data-id="${esc(h.id)}" aria-label="Marquer comme fait">${entry.done ? "✓" : ""}</button>
          <div style="flex:1;min-width:0">
            <div class="habit-name">${esc(h.name)}</div>
            <div class="habit-meta">${meta}</div>
          </div>
          <button type="button" class="btn btn-ghost note-toggle" data-action="note-toggle" data-id="${esc(h.id)}">${entry.note ? "Note" : "+ note"}</button>
        </div>
        ${metres}
        ${noteOpen ? `<input class="input note-input" type="text" placeholder="${estAuj ? "Note du jour" : "Note de ce jour"}" data-action="note-input" data-id="${esc(h.id)}" value="${esc(entry.note || "")}">` : ""}
      </div>`;
    }).join("");

    el.innerHTML = `
      <div class="today-grid">
        <div>
          <div class="jour-tete">
            <div class="jour-titre${entree}">
              <p class="eyebrow">${esc(weekday + relatif)}</p>
              <h1 class="big">${titre}</h1>
            </div>
            <div class="jour-nav" role="group" aria-label="Changer de jour">
              <button type="button" class="btn jour-fleche" data-action="jour-prec" aria-label="Jour précédent" title="Jour précédent">←</button>
              <button type="button" class="btn jour-fleche" data-action="jour-suiv" aria-label="Jour suivant" title="Jour suivant"${estAuj ? " disabled" : ""}>→</button>
              ${estAuj ? "" : `<button type="button" class="btn" data-action="jour-auj">Aujourd'hui</button>`}
            </div>
          </div>
          <p class="summary${entree}">${doneJour} sur ${State.habits.length} coché${doneJour > 1 ? "es" : "e"} ${quand}.</p>
          <div class="jour-liste${entree}">${rowsHtml || "<p class=\"p-muted\">Aucune habitude. Ajoutez-en dans les Réglages (la roue dentée en haut).</p>"}</div>
        </div>
        <aside class="side">
          ${competCarte()}
          ${estAuj ? saisieCarte() : ""}
          ${volumeCarte(monday, semaineEnCours)}
          ${goalsHtml ? `<div class="card objectifs-carte">
            <p class="eyebrow">${semaineEnCours ? "Objectifs de la semaine" : "Objectifs, semaine du " + monday.getDate() + " " + MONTHS[monday.getMonth()]}</p>
            ${goalsHtml}
          </div>` : ""}
          <div class="mascotte-card" id="mascotte-carte"></div>
        </aside>
      </div>`;

    // Après une compétition : « Entrer les temps » ouvre la saisie rapide, « Masquer » ferme le rappel.
    el.querySelectorAll('[data-action="saisie-ouvrir"]').forEach((b) => b.addEventListener("click", () => ouvrirSaisie(b.dataset.id)));
    el.querySelectorAll('[data-action="rappel-fermer"]').forEach((b) => b.addEventListener("click", () => fermerRappel(b.dataset.id)));
    // Tous les gestes s'appliquent au jour dessiné (jour), pas à celui qu'on afficherait entre-temps.
    el.querySelectorAll('[data-action="toggle"]').forEach((b) => b.addEventListener("click", () => toggle(b.dataset.id, jour)));
    el.querySelectorAll('[data-action="note-toggle"]').forEach((b) => b.addEventListener("click", () => {
      State.openNote = State.openNote === b.dataset.id ? null : b.dataset.id;
      renderToday();
    }));
    el.querySelectorAll('[data-action="note-input"]').forEach((inp) => {
      inp.addEventListener("change", () => setNote(inp.dataset.id, jour, inp.value));
    });
    el.querySelectorAll('[data-action="metres"]').forEach((inp) => {
      inp.addEventListener("change", () => {
        const id = inp.dataset.id, i = Number(inp.dataset.i) || 0;
        const deja = seancesDe(State.log[id + "|" + jour]).length;
        if (i >= deja && i > 0) {
          // Case d'une séance en plus : rien n'est écrit tant qu'elle reste vide.
          if (!(Number(inp.value) > 0)) return;
          State.seancePlus = null;
        }
        setSeance(id, jour, i, inp.value);
      });
    });
    el.querySelectorAll('[data-action="seance-plus"]').forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.id;
      State.seancePlus = id + "|" + jour;
      renderToday();
      const champs = el.querySelectorAll('.habit-row[data-id="' + CSS.escape(id) + '"] [data-action="metres"]');
      if (champs.length) champs[champs.length - 1].focus();
    }));
    el.querySelectorAll('[data-action="seance-retirer"]').forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.id, i = Number(b.dataset.i) || 0;
      if (i >= seancesDe(State.log[id + "|" + jour]).length) { State.seancePlus = null; renderToday(); }
      else retirerSeance(id, jour, i);
      const reste = el.querySelector('.habit-row[data-id="' + CSS.escape(id) + '"] [data-action="metres"]');
      if (reste) reste.focus();
    }));
    const nav = { "jour-prec": () => ymd(addDays(affiche, -1)), "jour-suiv": () => ymd(addDays(affiche, 1)), "jour-auj": () => State.today };
    el.querySelectorAll(".jour-nav [data-action]").forEach((b) => b.addEventListener("click", () => {
      allerJour(nav[b.dataset.action]());
      // Le bouton a été redessiné : le focus revient sur son remplaçant (ou sur « jour précédent »).
      const suite = el.querySelector('.jour-nav [data-action="' + b.dataset.action + '"]:not([disabled])')
        || el.querySelector('.jour-nav [data-action="jour-prec"]');
      if (suite) suite.focus();
    }));

    // renderToday passe apres chaque changement (coche, ajout, suppression,
    // renommage) : c'est ici qu'on tient la mascotte a jour, carte et en-tete.
    const etat = etatMascotte();
    renderMascotteCarte(etat);
    majMascotte(etat);
  }

  // Carte « Nagé cette semaine », seulement s'il existe une habitude qui compte les metres.
  // Sur un jour passé, c'est la semaine de ce jour (enCours = false).
  function volumeCarte(monday, enCours) {
    if (!State.habits.some((h) => h.dist)) return "";
    const v = volume(monday, 7);
    const avant = volume(addDays(monday, -7), 7).total;
    const comp = avant ? (enCours === false ? "Semaine d'avant : " : "Semaine dernière : ") + formatDistance(avant) + "." : "";
    const titre = enCours === false ? "Nagé la semaine du " + monday.getDate() + " " + MONTHS[monday.getMonth()] : "Nagé cette semaine";
    return `<div class="stat-card volume-carte">
        <p class="eyebrow">${titre}</p>
        <div class="big-num">${formatDistance(v.total)}</div>
        <p class="stat-detail">${v.seances} séance${v.seances > 1 ? "s" : ""} avec distance. ${comp}</p>
      </div>`;
  }

  function renderWeek() {
    const el = document.getElementById("view-week");
    const today = new Date(State.today + "T12:00:00");
    const monday = mondayOf(today);
    const wStart = addDays(monday, State.weekOffset * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) weekDays.push(ymd(addDays(wStart, i)));

    // En-tête de colonne : toucher un jour passé l'ouvre dans l'écran du jour (mètres, note).
    const headsHtml = DOW.map((d, i) => {
      const jd = addDays(wStart, i), day = ymd(jd);
      const dn = jd.getDate();
      if (day > State.today) return `<div class="colhead"><div class="dow">${d}</div><div class="daynum">${dn}</div></div>`;
      return `<button type="button" class="colhead jour-lien" data-action="ouvrir-jour" data-day="${day}" aria-label="Ouvrir le ${DOW_LONG[i]} ${dn} ${MONTHS[jd.getMonth()]}" title="Ouvrir ce jour"><span class="dow">${d}</span><span class="daynum">${dn}</span></button>`;
    }).join("");

    const rowsHtml = State.habits.map((h) => {
      let c = 0;
      const cellsHtml = weekDays.map((day) => {
        const done = isDone(h.id, day);
        if (done) c++;
        const future = day > State.today;
        const cls = done ? "done" : future ? "future" : "";
        const m = h.dist ? metersOf(h.id, day) : 0;
        const ns = m ? nbSeances(h.id, day) : 0;
        return `<button type="button" class="week-cell ${cls}" title="${esc(h.name)}, ${day}${m ? ", " + (ns > 1 ? ns + " séances, " : "") + m + " m" : ""}" ${future ? "disabled" : `data-action="toggle" data-id="${esc(h.id)}" data-day="${day}"`}>${done ? "✓" : ""}</button>`;
      }).join("");
      return `<div class="rowname">${esc(h.name)}</div>${cellsHtml}<div class="total">${c}/7</div>`;
    }).join("");

    const wEnd = addDays(wStart, 6);
    const weekLabel = State.weekOffset === 0 ? "Cette semaine"
      : wStart.getDate() + " " + MONTHS[wStart.getMonth()] + ", " + wEnd.getDate() + " " + MONTHS[wEnd.getMonth()];

    const weekNotes = [];
    weekDays.forEach((day, i) => {
      State.habits.forEach((h) => {
        const e = State.log[h.id + "|" + day];
        if (e && e.note && e.note.trim()) {
          const d = addDays(wStart, i);
          weekNotes.push({ name: h.name, when: DOW[i] + " " + d.getDate() + " " + MONTHS[d.getMonth()], note: e.note });
        }
      });
    });
    const notesHtml = weekNotes.length
      ? weekNotes.map((n) => `<div class="note-card"><span class="note-when">${esc(n.when)}</span><span class="note-name">${esc(n.name)}</span><span class="note-text">${esc(n.note)}</span></div>`).join("")
      : `<p class="p-muted" style="margin:0">Aucune note cette semaine. Cliquez un jour en haut du tableau pour en ajouter une.</p>`;

    // Objectifs tenus sur les 4 dernières semaines complètes (toujours comptées depuis aujourd'hui).
    const reussite = reussite4Semaines();
    const reussiteHtml = State.habits.length ? `<div class="stat-card reussite-carte">
        <p class="eyebrow">Objectifs tenus, 4 dernières semaines</p>
        <div class="big-num">${reussite.pct} %</div>
        <p class="stat-detail">Semaines ${periodeCourte(reussite.du, reussite.au)} : ${reussite.tenu} jours sur ${reussite.vise} visés.</p>
      </div>` : "";

    el.innerHTML = `
      <div class="week-head-row">
        <h1${State.weekOffset === 0 ? "" : ' class="num"'}>${esc(weekLabel)}</h1>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" data-action="week-prev">← Précédente</button>
          <button type="button" class="btn" data-action="week-next">Suivante →</button>
        </div>
      </div>
      <div class="card week-table-wrap">
        <div class="week-table">
          <div></div>
          ${headsHtml}
          <div class="total" style="text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase">Total</div>
          ${rowsHtml}
        </div>
      </div>
      <p class="week-hint">${State.habits.some((h) => h.dist) ? "Nagé : <strong>" + formatDistance(volume(wStart, 7).total) + "</strong>. " : ""}Cliquez une case pour basculer le statut, ou un jour en haut d'une colonne pour y noter les mètres et une note. Les jours à venir restent vides.</p>
      ${reussiteHtml}
      <h2>Notes de la semaine</h2>
      ${notesHtml}`;

    el.querySelectorAll('[data-action="toggle"]').forEach((b) => b.addEventListener("click", () => toggle(b.dataset.id, b.dataset.day)));
    el.querySelectorAll('[data-action="ouvrir-jour"]').forEach((b) => b.addEventListener("click", () => {
      State.tab = "today";
      allerJour(b.dataset.day);
      renderTabs();
      window.scrollTo(0, 0);
      const titre = document.querySelector("#view-today h1");
      if (titre) { titre.setAttribute("tabindex", "-1"); titre.focus({ preventScroll: true }); }
    }));
    el.querySelector('[data-action="week-prev"]').addEventListener("click", () => { State.weekOffset -= 1; renderWeek(); });
    el.querySelector('[data-action="week-next"]').addEventListener("click", () => { State.weekOffset = Math.min(0, State.weekOffset + 1); renderWeek(); });
  }

  // Écran « Saison » (du 1er septembre au 31 août) : une case par jour, le volume nagé
  // par semaine et les séries. State.saisonOffset = 0 pour la saison en cours, -1 la précédente…
  // (l'identifiant interne de l'écran reste « year »).
  function renderYear() {
    const el = document.getElementById("view-year");
    if (State.saisonOffset > 0) State.saisonOffset = 0;
    const s = saison(State.saisonOffset);
    const enCours = State.saisonOffset === 0;
    const du = ymd(s.debut), au = ymd(s.fin);
    const gridStart = mondayOf(s.debut);
    const weeks = Math.round((mondayOf(s.fin) - gridStart) / (7 * 864e5)) + 1;

    let monthsHtml = "";
    let colsHtml = "";
    let lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const colStart = addDays(gridStart, w * 7);
      let cellsHtml = "";
      for (let i = 0; i < 7; i++) {
        const day = ymd(addDays(colStart, i));
        const dansSaison = day >= du && day <= au;
        const future = day > State.today;
        const n = (!dansSaison || future) ? 0 : State.habits.filter((h) => isDone(h.id, day)).length;
        const ratio = State.habits.length ? n / State.habits.length : 0;
        const bg = future ? "var(--color-future-beige)" : heatColor(ratio);
        cellsHtml += dansSaison
          ? `<div class="year-cell${day === State.today ? " auj" : ""}" title="${day}, ${n}/${State.habits.length}" style="background:${bg}"></div>`
          : `<div class="year-cell" style="background:transparent"></div>`;
      }
      colsHtml += `<div class="year-col">${cellsHtml}</div>`;
      // Mois de la colonne : celui de son premier jour dans la saison (la 1re colonne commence en août).
      const m = (colStart < s.debut ? s.debut : colStart).getMonth();
      const show = m !== lastMonth;
      lastMonth = m;
      monthsHtml += `<div class="month-label">${show ? MONTHS[m] : ""}</div>`;
    }

    const legendHtml = [0, 0.3, 0.6, 0.9, 1].map((r) => `<div class="legend-cell" style="background:${heatColor(r)}"></div>`).join("");

    let full = 0;
