  // Le rappel de l'écran Aujourd'hui, fermé pour de bon (sur tous les appareils).
  function fermerRappel(cid) {
    const c = competDe(cid);
    if (!c) return;
    ecrireItem(cid, "comp", Object.assign({}, c.data, { fermee: 1 }));
    renderToday(); renderChronos();
    const suite = document.querySelector('#view-today [data-action="jour-prec"]');
    if (suite) suite.focus();
  }
  function enregistrerSaisie() {
    const C = State.chrono;
    const c = competDe(C.saisie);
    if (!c) return;
    const form = document.getElementById("saisie-form");
    const d = form.querySelector("#sa-date").value;
    const lieuBrut = form.querySelector("#sa-lieu").value;
    const pool = Number(form.querySelector("#sa-pool").value) === 50 ? 50 : 25;
    const lignes = Array.from(form.querySelectorAll(".saisie-ligne[data-ev]")).map((l) => ({
      ev: l.dataset.ev,
      temps: (l.querySelector('[data-role="temps"]') || {}).value || "",
      pass: (l.querySelector('[data-role="pass"]') || {}).value || ""
    }));
    C.saisieB = { d: d, lieu: lieuBrut, pool: pool, lignes: {} };
    lignes.forEach((l) => { C.saisieB.lignes[l.ev] = { temps: l.temps, pass: l.pass }; });
    const erreur = (m, selecteur) => {
      C.saisieMsg = m; C.saisieMsgType = "err"; renderChronos();
      const champ = document.querySelector(selecteur);
      if (champ) champ.focus();
    };
    const champDe = (ev, role) => '#saisie-form .saisie-ligne[data-ev="' + ev + '"] [data-role="' + role + '"]';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > State.today) return erreur("Date invalide (pas dans le futur).", "#sa-date");
    const prets = [];
    for (const l of lignes) {
      const nom = nomEpreuve(l.ev);
      if (!l.temps.trim()) {
        if (l.pass.trim()) return erreur(nom + " : entrez aussi le temps final.", champDe(l.ev, "temps"));
        continue;
      }
      const t = parseTemps(l.temps);
      if (!epreuvePossible(l.ev, pool)) return erreur(MSG_100_4N, "#sa-pool");
      if (!t) return erreur(nom + " : temps illisible. Écrivez par exemple 1:05.32, 1,05,32 ou 31,84.", champDe(l.ev, "temps"));
      const sp = parsePassages(l.pass, l.ev, t);
      if (!sp) return erreur(nom + " : passages illisibles, les temps cumulés tous les 50 m, du plus petit au plus grand.", champDe(l.ev, "pass"));
      prets.push({ ev: l.ev, t: t, sp: sp });
    }
    if (!prets.length) {
      const premier = lignes[0];
      return erreur("Entrez au moins un temps.", premier ? champDe(premier.ev, "temps") : "#sa-date");
    }
    let rps = 0;
    const lieu = lieuBrut.trim().slice(0, 120);
    prets.forEach((x) => {
      const ancien = meilleurTemps(x.ev, pool);
      if (ancien !== null && x.t < ancien) rps++;
      const id = nouvelId("t");
      State.times[id] = { ev: x.ev, pool: pool, t: x.t, d: d, comp: 1, lieu: lieu, sp: x.sp, cid: c.id, u: nowMs() };
      State.dirtyT[id] = 1;
    });
    C.saisieB = null;
    const n = prets.length;
    C.saisieMsg = n + " temps enregistré" + (n > 1 ? "s" : "")
      + (rps ? ", dont " + rps + " record" + (rps > 1 ? "s" : "") + " personnel" + (rps > 1 ? "s" : "") : "") + ".";
    C.saisieMsgType = "ok";
    persist(); Sync.schedule(); renderChronos(); renderToday();
    const suite = document.querySelector('#saisie-form [data-role="temps"]') || document.getElementById("saisie-retour");
    if (suite) suite.focus();
  }

  // Ligne d'une épreuve sur la carte de la prochaine compétition : RP, temps limite et écart
  // (ou l'objectif, sans temps limite).
  function ligneEpreuveCompet(c, ev) {
    const rp = meilleurTemps(ev, c.data.pool), obj = objectif(ev, c.data.pool);
    const lim = c.data.lim && c.data.lim[ev] > 0 ? c.data.lim[ev] : null;
    let detail = rp ? "RP " + formatTemps(rp) : "pas de temps";
    if (lim) {
      detail += " · limite " + formatTemps(lim);
      if (rp) detail += ` · <span class="${rp <= lim ? "sous" : "dessus"}">${formatEcart(rp - lim)}</span>`;
    } else if (obj) detail += " · obj. " + formatTemps(obj);
    return `<li><span>${esc(nomEpreuve(ev))}</span><span class="temps">${detail}</span></li>`;
  }

  // Carte « Prochaine compétition » de l'onglet Aujourd'hui : compte a rebours,
  // et pour chaque epreuve engagee le record, le temps limite (ou l'objectif) dans ce bassin.
  function competCarte() {
    const c = competsAVenir()[0];
    if (!c) return "";
    const evs = (c.data.evs || []).map((ev) => ligneEpreuveCompet(c, ev)).join("");
    return `<div class="card compet-carte">
        <p class="eyebrow">Prochaine compétition</p>
        <div class="compet-j">${libelleJours(joursAvant(c.data.d))}</div>
        <p class="compet-nom">${esc(c.data.nom)}</p>
        <p class="compet-info">${esc(dateCourte(c.data.d))}${c.data.lieu ? " · " + esc(c.data.lieu) : ""} · bassin ${c.data.pool} m</p>
        ${evs ? `<ul class="compet-evs">${evs}</ul>` : ""}
      </div>`;
  }

  // Carte « Entrez vos temps de … » : jusqu'à 7 jours après une compétition.
  function saisieCarte() {
    const c = competASaisir();
    if (!c) return "";
    const manque = epreuvesSansTemps(c);
    const j = -joursAvant(c.data.d);
    return `<div class="card saisie-carte">
        <p class="saisie-titre">Entrez vos temps de ${esc(c.data.nom)}</p>
        <p class="compet-info">${j === 0 ? "Aujourd'hui" : j === 1 ? "Hier" : "Il y a " + j + " jours"} · ${manque.length} épreuve${manque.length > 1 ? "s" : ""} sans temps : ${esc(manque.map(nomEpreuve).join(", "))}</p>
        <div class="saisie-actions">
          <button type="button" class="btn btn-primary" data-action="saisie-ouvrir" data-id="${esc(c.id)}">Entrer les temps</button>
          <button type="button" class="btn btn-ghost" data-action="rappel-fermer" data-id="${esc(c.id)}" aria-label="Masquer le rappel pour ${esc(c.data.nom)}">Masquer</button>
        </div>
      </div>`;
  }

  // --- Pour l'entraineur : CSV et fiche a imprimer --------------------------
  function exporterCSV() {
    // Point-virgule : le separateur qu'attend Excel en francais. Un texte qui commence
    // par = + - @ serait lu comme une formule : on le neutralise d'une apostrophe.
    const cel = (v) => {
      let s = String(v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lignes = [["Date", "Épreuve", "Bassin", "Temps", "Passages", "Contexte", "Compétition", "Lieu", "Record à ce moment"]];
    records().forEach((r) => historique(r.ev, r.pool).forEach((x) => {
      const c = competDe(x.cid);
      lignes.push([x.d, nomEpreuve(x.ev), x.pool + " m", formatTemps(x.t), (x.sp || []).map(formatTemps).join(" "),
        libelleContexte(x.comp), c ? c.data.nom : "", x.lieu || "", x.rp ? "oui" : ""]);
    }));
    const csv = "﻿" + lignes.map((l) => l.map(cel).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "trak-chronos-" + State.today + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function remplirFiche() {
    const recs = records().filter((r) => r.best);
    const lignes = recs.map((r) => {
      const obj = objectif(r.ev, r.pool), gain = r.n > 1 ? r.best.t - r.premier.t : 0;
      return `<tr><td>${esc(nomEpreuve(r.ev))}</td><td>${r.pool} m</td><td class="temps"><strong>${formatTemps(r.best.t)}</strong></td>
        <td>${esc(dateCourte(r.best.d))}${r.best.lieu ? "<br>" + esc(r.best.lieu) : ""}</td>
        <td>${esc(textePassages(r.best)) || "—"}</td>
        <td class="temps">${obj ? formatTemps(obj) + (r.best.t <= obj ? " (atteint)" : " (" + formatEcart(r.best.t - obj) + ")") : "—"}</td>
        <td>${r.n} temps${gain < 0 ? ", " + formatEcart(gain) : ""}</td></tr>`;
    }).join("");
    const compets = competsAVenir().map((c) => `<li><strong>${esc(c.data.nom)}</strong>, ${esc(dateCourte(c.data.d))}${c.data.lieu ? ", " + esc(c.data.lieu) : ""}, bassin ${c.data.pool} m${(c.data.evs || []).length ? " : " + esc(c.data.evs.map(nomEpreuve).join(", ")) : ""}</li>`).join("");
    let vol = "";
    if (State.habits.some((h) => h.dist)) {
      const lundi = mondayOf(new Date(State.today + "T12:00:00"));
      const sem = [3, 2, 1, 0].map((k) => {
        const debut = addDays(lundi, -7 * k), v = volume(debut, 7);
        return `<tr><td>Semaine du ${esc(dateCourte(ymd(debut)))}</td><td class="temps">${formatDistance(v.total)}</td><td>${v.seances} séance${v.seances > 1 ? "s" : ""}</td></tr>`;
      }).join("");
      vol = `<h2>Volume nagé, quatre dernières semaines</h2><table class="fiche-vol"><tbody>${sem}</tbody></table>`
        + `<p>Saison ${esc(saison(0).nom)} : ${formatDistance(metresSaison())} nagés depuis le 1er septembre.</p>`;
    }
    document.getElementById("fiche").innerHTML = `
      <h1>Fiche nageur, records et objectifs</h1>
      <p class="fiche-date">Éditée le ${esc(dateCourte(State.today))} avec Trak.</p>
      <h2>Records personnels</h2>
      ${lignes ? `<table><thead><tr><th>Épreuve</th><th>Bassin</th><th>Record</th><th>Date, lieu</th><th>Passages</th><th>Objectif</th><th>Progression</th></tr></thead><tbody>${lignes}</tbody></table>` : "<p>Aucun temps enregistré.</p>"}
      ${compets ? `<h2>Compétitions à venir</h2><ul>${compets}</ul>` : ""}
      ${vol}`;
  }
  function imprimerFiche() {
    remplirFiche();
    window.print();
  }

  // Liste des compétitions qu'on peut rattacher à un temps nagé le jour d (à 7 jours près),
  // plus celle déjà choisie si elle est plus loin.
  function optionsCompet(d, choisi) {
    const liste = competsProches(d);
    const garde = competDe(choisi);
    if (garde && !liste.some((c) => c.id === choisi)) liste.push(Object.assign({ id: choisi }, garde));
    return `<option value="">${liste.length ? "Aucune" : "Aucune à 7 jours de cette date"}</option>`
      + liste.map((c) => `<option value="${esc(c.id)}"${c.id === choisi ? " selected" : ""}>${esc(c.data.nom)}, ${esc(dateCourte(c.data.d))}</option>`).join("");
  }
  // Compétition du jour même, proposée d'office pour un temps en compétition ou en relais.
  function competDuJour(d) {
    const c = competsProches(d).find((x) => x.data.d === d);
    return c ? c.id : "";
  }

  // Écran Chronos : deux parties, « Records » (ajout d'un temps, records, historique, export)
  // et « Compétitions » (saisie rapide, à venir, ajout ou modification, passées et leurs temps).
  function renderChronos() {
    const el = document.getElementById("view-chronos");
    const C = State.chrono;
    if (C.vue !== "compets") C.vue = "records";
    if (C.edit && !(State.times[C.edit] && !State.times[C.edit].del)) { C.edit = null; C.brouillon = null; }
    if (C.compEdit && !competDe(C.compEdit)) { C.compEdit = null; C.compOuvert = false; }
    if (C.saisie && !competDe(C.saisie)) C.saisie = null;

    const vues = [["records", "Records"], ["compets", "Compétitions"]];
    const aSaisir = competASaisir();
    const tete = `<div class="chronos-tete" id="chronos-tete">
        <h1>Chronos</h1>
        <div class="bilan-switch chronos-switch" role="group" aria-label="Partie de l'écran Chronos">${vues.map(([v, nom]) =>
          `<button type="button" class="btn${v === C.vue ? " active" : ""}" data-action="chronos-vue" data-vue="${v}" aria-pressed="${v === C.vue}">${nom}${v === "compets" && aSaisir ? ' <span class="point-a-saisir" aria-label="(des temps à entrer)"></span>' : ""}</button>`).join("")}</div>
      </div>`;

    el.innerHTML = tete + (C.vue === "compets" ? htmlCompets() : htmlRecords());

    el.querySelectorAll('[data-action="chronos-vue"]').forEach((b) => b.addEventListener("click", () => {
      if (C.vue === b.dataset.vue) return;
      C.vue = b.dataset.vue;
      renderChronos(); retracerCourbe();
      const nb = el.querySelector('[data-action="chronos-vue"][data-vue="' + C.vue + '"]');
      if (nb) nb.focus();
    }));
    if (C.vue === "compets") brancherCompets(el); else brancherRecords(el);
  }

  function htmlRecords() {
    const C = State.chrono;
    const B = C.brouillon || {};
    const tous = records();
    const aucunTemps = !tempsVivants().length;
    if (!tous.some((r) => r.cle === C.sel)) C.sel = tous.length ? tous[0].cle : "";
    // Records séparés par bassin : un seul bassin à l'écran, choisi par le sélecteur 25 m / 50 m.
    // Au départ, celui du record sélectionné.
    if (C.vuePool !== 25 && C.vuePool !== 50) C.vuePool = C.sel ? Number(C.sel.split("|")[1]) : 25;
    const recs = tous.filter((r) => r.pool === C.vuePool);
    if (!recs.some((r) => r.cle === C.sel)) C.sel = recs.length ? recs[0].cle : "";
    const nbPool = (p) => tous.filter((r) => r.pool === p).length;
    const choixPool = tous.length ? `<div class="bilan-switch pool-switch" role="group" aria-label="Bassin des records">${[25, 50].map((p) =>
      `<button type="button" class="btn${p === C.vuePool ? " active" : ""}" data-action="vue-pool" data-pool="${p}" aria-pressed="${p === C.vuePool}">Bassin ${p} m <span class="compte">${nbPool(p)}</span></button>`).join("")}</div>` : "";

    // Formulaire d'ajout replié derrière « Ajouter un temps », sauf tant qu'il n'y a aucun temps.
    const ouvert = !!(C.formOuvert || C.edit || aucunTemps);
    let formulaire = "";
    if (ouvert) {
      const enEdition = C.edit ? State.times[C.edit] : null;
      const options = NAGES.map((n) => `<optgroup label="${esc(n.nom[0].toUpperCase() + n.nom.slice(1))}">${
        EPREUVES.filter((e) => e.nage === n.id).map((e) => `<option value="${e.id}"${e.id === C.ev ? " selected" : ""}>${esc(e.nom)}</option>`).join("")
      }</optgroup>`).join("");
      const d = B.d || State.today;
      const cidChoisi = C.brouillon ? (B.cid || "") : (C.comp ? competDuJour(d) : "");
      const avecCompets = itemsDe("comp").length > 0;
      formulaire = `
      <form class="card chrono-form${avecCompets ? " avec-compet" : ""}" id="chrono-form" novalidate>
        <div class="form-tete">
          <p class="form-titre">${enEdition ? "Modifier le temps du " + esc(dateCourte(enEdition.d)) : "Nouveau temps"}</p>
          ${aucunTemps && !enEdition ? "" : `<button type="button" class="btn btn-ghost" data-action="chrono-form-fermer">${enEdition ? "Annuler" : "Fermer"}</button>`}
        </div>
        <label class="field field-epreuve"><span>Épreuve</span><select class="input" id="ch-ev">${options}</select></label>
        <label class="field"><span>Bassin</span><select class="input" id="ch-pool">
          <option value="25"${C.pool === 25 || !epreuvePossible(C.ev, 50) ? " selected" : ""}>25 m</option><option value="50"${C.pool === 50 && epreuvePossible(C.ev, 50) ? " selected" : ""}${epreuvePossible(C.ev, 50) ? "" : " disabled"}>50 m</option></select></label>
        <label class="field"><span>Temps</span><input class="input temps" id="ch-temps" type="text" inputmode="decimal" autocomplete="off" placeholder="1:05.32" required value="${esc(B.temps || "")}"></label>
        <label class="field field-date"><span>Date</span><input class="input" id="ch-date" type="date" max="${State.today}" value="${esc(d)}" required></label>
        <label class="field field-ctx"><span>Contexte</span><select class="input" id="ch-comp">${CONTEXTES.map(([v, nom]) =>
          `<option value="${v}"${v === contexteDe(C.comp) ? " selected" : ""}>${nom}</option>`).join("")}</select></label>
        ${avecCompets ? `<label class="field field-cid"><span>Compétition (facultatif)</span><select class="input" id="ch-cid">${optionsCompet(d, cidChoisi)}</select></label>` : ""}
        <label class="field field-lieu"><span>Lieu (facultatif)</span><input class="input" id="ch-lieu" type="text" maxlength="120" placeholder="Annecy" value="${esc(B.lieu || "")}"></label>
        <label class="field field-passages"><span>Temps de passage, cumulés tous les 50 m (facultatif)</span><input class="input temps" id="ch-pass" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="31.20 1:06.51 1:42.80" value="${esc(B.pass || "")}"></label>
        <p class="form-msg ch-relais-note" id="ch-relais-note"${contexteDe(C.comp) === 2 ? "" : " hidden"}>Départ lancé : ce temps reste dans l'historique, mais ne compte ni pour le record ni pour l'objectif.</p>
        <div class="chrono-actions">
          <button type="submit" class="btn btn-primary">${enEdition ? "Enregistrer la modification" : "Ajouter le temps"}</button>
          ${enEdition ? `<button type="button" class="btn" data-action="chrono-form-fermer">Annuler</button>
          <button type="button" class="btn btn-ghost chrono-suppr" data-action="chrono-del" data-id="${esc(C.edit)}">Supprimer ce temps</button>` : ""}
          <p class="form-msg" id="ch-bassin-note"${epreuvePossible(C.ev, 50) || (C.msg === MSG_100_4N) ? " hidden" : ""}>${MSG_100_4N}</p>
        </div>
      </form>`;
    } else {
      formulaire = `<button type="button" class="btn btn-primary chrono-ajouter" data-action="chrono-form-ouvrir" aria-expanded="false">Ajouter un temps</button>`;
    }
    const annulable = C.annuler && C.annuler.type === "t";
    const retour = C.msg ? `<div class="chrono-retour" id="chrono-retour" tabindex="-1">
        <p class="form-msg ${C.msgType}" role="status">${esc(C.msg)}</p>
        ${annulable ? `<button type="button" class="btn btn-ghost" data-action="annuler-modif">Annuler la modification</button>` : ""}
      </div>` : "";

    const cartes = recs.map((r) => {
      const obj = objectif(r.ev, r.pool);
      if (!r.best) {
        return `<button type="button" class="rp-card relais-seul${r.cle === C.sel ? " active" : ""}" data-action="chrono-sel" data-cle="${r.cle}" aria-pressed="${r.cle === C.sel}">
          <div class="name">${esc(nomEpreuve(r.ev))}</div>
          <div class="num temps">—</div>
          <div class="detail">${r.relais} temps en relais, sans record</div>
        </button>`;
      }
      const gain = r.n > 1 ? r.best.t - r.premier.t : 0;
      return `<button type="button" class="rp-card${r.cle === C.sel ? " active" : ""}" data-action="chrono-sel" data-cle="${r.cle}" aria-pressed="${r.cle === C.sel}">
          <div class="name">${esc(nomEpreuve(r.ev))}</div>
          <div class="num temps">${formatTemps(r.best.t)}</div>
          <div class="detail">${esc(dateCourte(r.best.d))} · ${r.n} temps${gain < 0 ? ` · <span class="gain">${formatEcart(gain)}</span> depuis le premier` : ""}</div>
          ${obj ? `<div class="objectif${r.best.t <= obj ? " atteint" : ""}">${esc(texteObjectif(r.best.t, obj))}</div>` : ""}
        </button>`;
    }).join("");

    let detail = "";
    const r = recs.find((x) => x.cle === C.sel);
    if (r) {
      const s = serie(r.ev, r.pool);
      const h = historique(r.ev, r.pool);
      const best = r.best ? r.best.t : null;
      const obj = objectif(r.ev, r.pool);
      const HISTO = 5;
      const plusVieux = Math.max(0, h.length - HISTO);
      const lignes = h.slice(C.histoTout ? 0 : plusVieux).reverse().map((x) => {
        const c = competDe(x.cid);
        const relais = x.comp === 2;
        const lieu = [c ? c.data.nom : "", x.lieu || ""].filter(Boolean).join(", ");
        return `<tr${C.edit === x.id ? ' class="en-edition"' : ""}>
          <td>${esc(dateCourte(x.d))}<span class="ctx-mobile">${esc(libelleContexte(x.comp))}${c ? ", " + esc(c.data.nom) : ""}</span></td>
          <td class="temps">${formatTemps(x.t)}${!relais && x.t === best ? '<span class="badge">RP</span>' : ""}${x.sp && x.sp.length ? `<span class="passages">${esc(textePassages(x))}</span>` : ""}</td>
          <td class="temps ${!relais && best && x.t > best ? "perte" : ""}">${relais || !best ? '<span class="hors-rp">hors RP</span>' : x.t === best ? "—" : formatEcart(x.t - best)}</td>
          <td class="col-ctx">${esc(libelleContexte(x.comp))}</td>
          <td class="col-lieu">${esc(lieu)}</td>
          <td class="col-actions"><button type="button" class="btn btn-ghost" data-action="chrono-edit" data-id="${esc(x.id)}" aria-label="Modifier le temps ${formatTemps(x.t)} du ${esc(dateCourte(x.d))}">Modifier</button><button type="button" class="btn btn-ghost col-suppr" data-action="chrono-del" data-id="${esc(x.id)}" aria-label="Supprimer le temps ${formatTemps(x.t)} du ${esc(dateCourte(x.d))}">Supprimer</button></td>
        </tr>`;
      }).join("");
      detail = `
        <h2 class="num">${esc(nomEpreuve(r.ev))}, bassin de ${r.pool}&nbsp;m</h2>
        <div class="card">
          <form class="obj-form" id="obj-form" novalidate>
            <label class="field"><span>Objectif de temps</span><input class="input temps" id="obj-temps" type="text" inputmode="decimal" autocomplete="off" placeholder="1:05.00" value="${obj ? formatTemps(obj) : ""}"></label>
            <button type="submit" class="btn btn-primary">${obj ? "Modifier" : "Fixer l'objectif"}</button>
            ${obj ? `<button type="button" class="btn btn-ghost" data-action="obj-del">Retirer</button>` : ""}
            ${State.chrono.objMsg ? `<p class="form-msg ${State.chrono.objMsgType}" role="status">${esc(State.chrono.objMsg)}</p>`
              : obj && best ? `<p class="form-msg${best <= obj ? " ok" : ""}">${esc(texteObjectif(best, obj))}.</p>` : ""}
          </form>
          ${s.length > 1
            ? `<p class="eyebrow" style="margin:18px 0 6px">Progression, plus haut = plus rapide</p><div class="courbe" id="courbe"></div>`
            : s.length ? `<p class="p-muted" style="margin:16px 0 0">Un seul temps pour l'instant : la courbe de progression apparaît dès le deuxième.</p>`
            : `<p class="p-muted" style="margin:16px 0 0">Seulement des relais pour l'instant : le record et la courbe viennent des temps en départ plongé.</p>`}
        </div>
        <div class="card histo-wrap" style="margin-top:14px">
          <table class="histo">
            <thead><tr><th>Date</th><th>Temps</th><th>Écart au RP</th><th class="col-ctx">Contexte</th><th class="col-lieu">Compétition, lieu</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody>${lignes}</tbody>
          </table>
          ${plusVieux ? `<button type="button" class="btn btn-ghost histo-plus" data-action="histo-tout" aria-expanded="${C.histoTout}">${C.histoTout ? "Ne garder que les " + HISTO + " derniers" : "Voir les " + h.length + " temps"}</button>` : ""}
        </div>`;
    }

    return `
      ${aucunTemps ? `<p class="p-muted">Vos temps en compétition et à l'entraînement. Le meilleur de chaque épreuve, bassin par bassin, devient votre record personnel.</p>` : ""}
      ${formulaire}
      ${retour}
      ${choixPool}
      ${cartes ? `<div class="rp-grid">${cartes}</div>`
        : tous.length ? `<p class="p-muted">Aucun temps en bassin de ${C.vuePool} m pour l'instant.</p>`
        : `<p class="p-muted">Aucun temps pour l'instant. Ajoutez votre dernier chrono ci-dessus.</p>`}
      ${detail}
      ${tous.length ? `
      <h2>Pour l'entraîneur</h2>
      <div class="card">
        <p class="p-muted" style="margin:0 0 14px">Tous vos temps dans un tableur, ou une fiche d'une page (records, passages, objectifs, compétitions, volume) à imprimer ou enregistrer en PDF.</p>
        <div class="chrono-actions">
          <button type="button" class="btn" data-action="export-csv">Télécharger les temps (CSV)</button>
          <button type="button" class="btn" data-action="fiche">Fiche à imprimer (PDF)</button>
        </div>
      </div>` : ""}`;
  }

  function brancherRecords(el) {
    const C = State.chrono;
    const form = el.querySelector("#chrono-form");
    const ouvrir = el.querySelector('[data-action="chrono-form-ouvrir"]');
    if (ouvrir) ouvrir.addEventListener("click", () => {
      C.formOuvert = true; C.msg = ""; C.annuler = null;
      renderChronos(); retracerCourbe();
      const champ = document.getElementById("ch-ev");
      if (champ) champ.focus();
    });
    el.querySelectorAll('[data-action="chrono-form-fermer"]').forEach((b) => b.addEventListener("click", fermerFormTemps));
    if (form) {
      form.addEventListener("submit", (ev) => { ev.preventDefault(); enregistrerTemps(); });
      // 100 m 4 nages choisi : l'option 50 m se grise et le bassin repasse à 25 m.
      el.querySelector("#ch-ev").addEventListener("change", () => {
        const ev = el.querySelector("#ch-ev").value, bassin = el.querySelector("#ch-pool");
        const interdit = !epreuvePossible(ev, 50);
        bassin.querySelector('option[value="50"]').disabled = interdit;
        if (interdit && bassin.value === "50") bassin.value = "25";
        el.querySelector("#ch-bassin-note").hidden = !interdit;
      });
      const ctx = el.querySelector("#ch-comp"), cid = el.querySelector("#ch-cid"), date = el.querySelector("#ch-date"), lieu = el.querySelector("#ch-lieu");
      ctx.addEventListener("change", () => {
        el.querySelector("#ch-relais-note").hidden = Number(ctx.value) !== 2;
        if (cid && !cid.value && Number(ctx.value) !== 0) { const auj = competDuJour(date.value); if (auj) cid.value = auj; }
      });
      if (cid) {
        // La liste suit la date : seules les compétitions à 7 jours près sont proposées.
        date.addEventListener("change", () => {
          let choisi = cid.value;
          if (!choisi && Number(ctx.value) !== 0) choisi = competDuJour(date.value);
          cid.innerHTML = optionsCompet(date.value, choisi);
        });
        // Rattacher à une compétition : contexte « Compétition » et lieu repris s'ils manquent.
        cid.addEventListener("change", () => {
          const c = competDe(cid.value);
          if (!c) return;
          if (Number(ctx.value) === 0) { ctx.value = "1"; el.querySelector("#ch-relais-note").hidden = true; }
          if (!lieu.value.trim() && c.data.lieu) lieu.value = c.data.lieu;
        });
      }
    }
    const annuler = el.querySelector('[data-action="annuler-modif"]');
    if (annuler) annuler.addEventListener("click", annulerModif);
    el.querySelectorAll('[data-action="chrono-sel"]').forEach((b) => b.addEventListener("click", () => {
      C.sel = b.dataset.cle; C.objMsg = ""; C.histoTout = false;
      if (!C.edit) { C.msg = ""; C.annuler = null; }
      renderChronos(); retracerCourbe();
      const nb = document.querySelector(`[data-action="chrono-sel"][data-cle="${C.sel}"]`);
      if (nb) nb.focus();
    }));
    el.querySelectorAll('[data-action="chrono-edit"]').forEach((b) => b.addEventListener("click", () => ouvrirEditionTemps(b.dataset.id)));
    el.querySelectorAll('[data-action="chrono-del"]').forEach((b) => b.addEventListener("click", () => supprimerTemps(b.dataset.id)));
    el.querySelectorAll('[data-action="vue-pool"]').forEach((b) => b.addEventListener("click", () => {
      C.vuePool = Number(b.dataset.pool); C.sel = ""; C.histoTout = false; C.objMsg = "";
      renderChronos(); retracerCourbe();
      const nb = document.querySelector(`[data-action="vue-pool"][data-pool="${C.vuePool}"]`);
      if (nb) nb.focus();
    }));
    const histoTout = el.querySelector('[data-action="histo-tout"]');
    if (histoTout) histoTout.addEventListener("click", () => { C.histoTout = !C.histoTout; renderChronos(); retracerCourbe(); });
    const r = records().find((x) => x.cle === C.sel && x.pool === C.vuePool);
    if (r) {
      el.querySelector("#obj-form").addEventListener("submit", (ev) => { ev.preventDefault(); enregistrerObjectif(r.ev, r.pool); });
      const retirer = el.querySelector('[data-action="obj-del"]');
      if (retirer) retirer.addEventListener("click", () => {
        retirerItem(cleObjectif(r.ev, r.pool));
        C.objMsg = "Objectif retiré."; C.objMsgType = "";
        renderChronos(); retracerCourbe(); renderToday();
      });
    }
    const csv = el.querySelector('[data-action="export-csv"]');
    if (csv) csv.addEventListener("click", exporterCSV);
    const fiche = el.querySelector('[data-action="fiche"]');
    if (fiche) fiche.addEventListener("click", imprimerFiche);
    if (r) dessinerCourbe(serie(r.ev, r.pool), objectif(r.ev, r.pool));
  }

  function htmlCompets() {
    const C = State.chrono;
    // Saisie rapide des temps d'une compétition : une ligne par épreuve engagée.
    let saisie = "";
    const cs = competDe(C.saisie);
    if (cs) {
      const SB = C.saisieB || {};
      const pool = SB.pool || cs.data.pool;
      const faits = tempsDeCompet(C.saisie);
      const lignes = (cs.data.evs || []).map((ev) => {
        const deja = faits.filter((x) => x.ev === ev);
        const nom = esc(nomEpreuve(ev));
        if (deja.length) {
          return `<div class="saisie-ligne saisie-faite"><span class="saisie-ev">${nom}</span>
            <span class="temps">${deja.map((x) => formatTemps(x.t)).join(", ")}</span><span class="saisie-ok">noté</span></div>`;
        }
        const b = (SB.lignes || {})[ev] || {};
        return `<div class="saisie-ligne" data-ev="${ev}"><span class="saisie-ev" id="sa-nom-${ev}">${nom}</span>
          <label class="field"><span>Temps</span><input class="input temps" data-role="temps" type="text" inputmode="decimal" autocomplete="off" placeholder="1:05.32" aria-describedby="sa-nom-${ev}" value="${esc(b.temps || "")}"></label>
          ${Number(ev.split("-")[0]) > 50 ? `<label class="field"><span>Passages (facultatif)</span><input class="input temps" data-role="pass" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="31.20 1:06.51" aria-describedby="sa-nom-${ev}" value="${esc(b.pass || "")}"></label>` : ""}
        </div>`;
      }).join("");
      const d = SB.d || (cs.data.d <= State.today ? cs.data.d : State.today);
      const reste = epreuvesSansTemps(cs).length;
      saisie = `
      <form class="card saisie-form" id="saisie-form" novalidate tabindex="-1">
        <div class="form-tete">
          <p class="form-titre">Vos temps de ${esc(cs.data.nom)}</p>
          <button type="button" class="btn btn-ghost" data-action="saisie-fermer">Fermer</button>
        </div>
        <p class="p-muted saisie-aide">Contexte « Compétition ». Laissez vide une épreuve que vous n'avez pas nagée.</p>
        <div class="saisie-commun">
          <label class="field"><span>Date</span><input class="input" id="sa-date" type="date" max="${State.today}" value="${esc(d)}"></label>
          <label class="field"><span>Bassin</span><select class="input" id="sa-pool"><option value="25"${pool === 25 ? " selected" : ""}>25 m</option><option value="50"${pool === 50 ? " selected" : ""}>50 m</option></select></label>
          <label class="field saisie-lieu"><span>Lieu (facultatif)</span><input class="input" id="sa-lieu" type="text" maxlength="120" value="${esc(SB.lieu !== undefined ? SB.lieu : cs.data.lieu || "")}"></label>
        </div>
        ${lignes ? `<div class="saisie-lignes">${lignes}</div>` : `<p class="p-muted">Aucune épreuve engagée. Modifiez la compétition pour cocher ses épreuves, ou ajoutez vos temps un par un dans Records.</p>`}
        <div class="chrono-actions">
          ${reste ? `<button type="submit" class="btn btn-primary">Enregistrer les temps</button>` : ""}

    const boutons = (c, entrer) => `<div class="compet-boutons">
        ${entrer ? `<button type="button" class="btn" data-action="saisie-ouvrir" data-id="${esc(c.id)}">Entrer les temps</button>` : ""}

      </div>`;
    const info = (c) => `${esc(dateCourte(c.data.d))}${c.data.lieu ? " · " + esc(c.data.lieu) : ""} · bassin ${c.data.pool} m`;

    const aVenir = competsAVenir().map((c) => {
      const lims = (c.data.evs || []).filter((ev) => c.data.lim && c.data.lim[ev] > 0);
      return `<div class="compet-ligne">
        <div class="compet-j-petit">${libelleJours(joursAvant(c.data.d))}</div>
        <div class="compet-corps"><strong>${esc(c.data.nom)}</strong>
          <span class="compet-info">${info(c)}${(c.data.evs || []).length ? " · " + esc(c.data.evs.map(nomEpreuve).join(", ")) : ""}</span>
          ${lims.length ? `<span class="compet-info">Temps limites : ${esc(lims.map((ev) => nomEpreuve(ev) + " " + formatTemps(c.data.lim[ev])).join(", "))}</span>` : ""}</div>
        ${boutons(c, joursAvant(c.data.d) === 0 && epreuvesSansTemps(c).length)}
      </div>`;
    }).join("");

    const passees = competsPassees().map((c) => {
      const rps = new Set();
      const temps = tempsDeCompet(c.id);
      temps.forEach((x) => { if (x.comp !== 2 && serie(x.ev, x.pool).some((y) => y.id === x.id && y.rp)) rps.add(x.id); });
      const lignes = temps.map((x) => {
        const lim = c.data.lim && c.data.lim[x.ev] > 0 && x.comp !== 2 && x.pool === c.data.pool ? c.data.lim[x.ev] : null;
        return `<li><span>${esc(nomEpreuve(x.ev))}${x.pool !== c.data.pool ? " (" + x.pool + " m)" : ""}${x.comp === 2 ? ", relais" : ""}</span>
          <span class="temps">${formatTemps(x.t)}${rps.has(x.id) ? '<span class="badge">RP</span>' : ""}${lim ? ` · limite ${formatTemps(lim)} <span class="${x.t <= lim ? "sous" : "dessus"}">${formatEcart(x.t - lim)}</span>` : ""}</span></li>`;
      }).join("");
      const manque = epreuvesSansTemps(c);
      return `<div class="card compet-passee">
        <div class="compet-passee-tete">
          <div class="compet-corps"><strong>${esc(c.data.nom)}</strong><span class="compet-info">${info(c)}</span></div>
          ${boutons(c, manque.length > 0)}
        </div>
        ${lignes ? `<ul class="compet-evs">${lignes}</ul>` : `<p class="p-muted compet-vide">Aucun temps rattaché${manque.length ? " : " + esc(manque.map(nomEpreuve).join(", ")) + " sans temps" : ""}.</p>`}
      </div>`;
    }).join("");

    // Formulaire d'ajout, ou de modification de C.compEdit (prérempli).
    const enEdition = competDe(C.compEdit);
    const F = enEdition ? enEdition.data : {};
    const coches = new Set(F.evs || []);
    const choix = NAGES.map((n) => EPREUVES.filter((e) => e.nage === n.id).map((e) =>
      `<label class="ev-choix"><input type="checkbox" name="co-ev" value="${e.id}"${coches.has(e.id) ? " checked" : ""}><span>${esc(e.nom)}</span></label>`).join("")).join("");
    const annulable = C.annuler && C.annuler.type === "c";

    return `
      ${saisie}
      <h2>Compétitions à venir</h2>
      ${aVenir ? `<div class="card compet-liste">${aVenir}</div>` : `<p class="p-muted">Aucune compétition prévue. Ajoutez la prochaine : un compte à rebours apparaîtra sur l'écran Aujourd'hui.</p>`}
      ${C.compMsg ? `<div class="chrono-retour" id="compet-retour" tabindex="-1"><p class="form-msg ${C.compMsgType}" role="status">${esc(C.compMsg)}</p>
        ${annulable ? `<button type="button" class="btn btn-ghost" data-action="annuler-modif">Annuler la modification</button>` : ""}</div>` : ""}
      <details class="card compet-ajout${enEdition ? " en-edition" : ""}" id="compet-ajout"${C.compOuvert || enEdition ? " open" : ""}>
        <summary>${enEdition ? "Modifier « " + esc(F.nom) + " »" : "Ajouter une compétition"}</summary>
        <form class="compet-form" id="compet-form" novalidate>
          <label class="field field-nom"><span>Nom</span><input class="input" id="co-nom" type="text" maxlength="80" required placeholder="Championnats régionaux" value="${esc(F.nom || "")}"></label>
          <label class="field"><span>Date</span><input class="input" id="co-date" type="date" required value="${esc(F.d || "")}"></label>
          <label class="field"><span>Bassin</span><select class="input" id="co-pool"><option value="25"${F.pool !== 50 ? " selected" : ""}>25 m</option><option value="50"${F.pool === 50 ? " selected" : ""}>50 m</option></select></label>
          <label class="field field-nom"><span>Lieu (facultatif)</span><input class="input" id="co-lieu" type="text" maxlength="80" placeholder="Annecy" value="${esc(F.lieu || "")}"></label>
          <fieldset class="epreuves-choix"><legend>Épreuves engagées</legend><div class="ev-grille">${choix}</div>
            <p class="ev-note" id="co-note" hidden>${MSG_100_4N}</p></fieldset>
          <fieldset class="epreuves-choix limites" id="co-limites" hidden><legend>Temps limites de qualification (facultatif)</legend>
            <div class="limites-grille" id="co-lim-grille"></div></fieldset>
          <div class="chrono-actions">
            <button type="submit" class="btn btn-primary">${enEdition ? "Enregistrer la modification" : "Ajouter la compétition"}</button>
            ${enEdition ? `<button type="button" class="btn" data-action="compet-annuler">Annuler</button>` : ""}
            <p class="form-msg" id="co-msg" role="status" hidden></p>
          </div>
        </form>
      </details>
      <h2>Compétitions passées</h2>
      ${passees ? `<div class="compet-passees">${passees}</div>` : `<p class="p-muted">Aucune compétition passée pour l'instant. Après une compétition, elle reste ici avec les temps que vous y avez nagés.</p>`}`;
  }

  function brancherCompets(el) {
    const C = State.chrono;
    const saisie = el.querySelector("#saisie-form");
    if (saisie) {
      saisie.addEventListener("submit", (ev) => { ev.preventDefault(); enregistrerSaisie(); });
      saisie.querySelector('[data-action="saisie-fermer"]').addEventListener("click", fermerSaisie);
    }
    el.querySelectorAll('[data-action="saisie-ouvrir"]').forEach((b) => b.addEventListener("click", () => ouvrirSaisie(b.dataset.id)));
    el.querySelectorAll('[data-action="compet-edit"]').forEach((b) => b.addEventListener("click", () => ouvrirEditionCompet(b.dataset.id)));
    el.querySelectorAll('[data-action="compet-del"]').forEach((b) => b.addEventListener("click", () => supprimerCompet(b.dataset.id)));
    const annuler = el.querySelector('[data-action="annuler-modif"]');
    if (annuler) annuler.addEventListener("click", annulerModif);
    const annulerEdition = el.querySelector('[data-action="compet-annuler"]');
    if (annulerEdition) annulerEdition.addEventListener("click", fermerEditionCompet);

    const form = el.querySelector("#compet-form");
    form.addEventListener("submit", (ev) => { ev.preventDefault(); enregistrerCompet(); });
    el.querySelector("#compet-ajout").addEventListener("toggle", (ev) => {
      C.compOuvert = ev.target.open;
      // Replier le formulaire pendant une modification revient à l'annuler.
      if (!ev.target.open && C.compEdit) fermerEditionCompet();
    });
    // Temps limites : un champ par épreuve cochée, valeurs tapées gardées quand la liste change.
    const enEdition = competDe(C.compEdit);
    const limInit = enEdition && enEdition.data.lim ? enEdition.data.lim : {};
    const majLimites = () => {
      const deja = {};
      form.querySelectorAll("[data-lim]").forEach((i) => { deja[i.dataset.lim] = i.value; });
      const evs = Array.from(form.querySelectorAll('input[name="co-ev"]:checked')).map((i) => i.value);
      form.querySelector("#co-lim-grille").innerHTML = evs.map((ev) => {
        const v = ev in deja ? deja[ev] : limInit[ev] > 0 ? formatTemps(limInit[ev]) : "";
        return `<label class="field limite"><span>${esc(nomEpreuve(ev))}</span><input class="input temps" type="text" inputmode="decimal" autocomplete="off" placeholder="1:05.00" data-lim="${ev}" value="${esc(v)}"></label>`;
      }).join("");
      form.querySelector("#co-limites").hidden = !evs.length;
    };
    // Compétition en 50 m : les épreuves qui n'y existent pas ne se cochent plus.
    const coPool = el.querySelector("#co-pool");
    const majEpreuvesCompet = () => {
      const pool = Number(coPool.value) === 50 ? 50 : 25;
      let bloque = false;
      form.querySelectorAll('input[name="co-ev"]').forEach((c) => {
        const ok = epreuvePossible(c.value, pool);
        c.disabled = !ok;
        if (!ok) { bloque = true; c.checked = false; }
      });
      el.querySelector("#co-note").hidden = !bloque;
      majLimites();
    };
    coPool.addEventListener("change", majEpreuvesCompet);
    form.querySelectorAll('input[name="co-ev"]').forEach((c) => c.addEventListener("change", majLimites));
    majEpreuvesCompet();
  }

  // Courbe SVG dessinee a la largeur reelle du conteneur (le texte garde sa
  // taille sur telephone). Axe vertical inverse : un temps plus court monte.
  // obj (facultatif) : ligne pointillee de l'objectif.
  function dessinerCourbe(s, obj) {
    const box = document.getElementById("courbe");
    if (!box || s.length < 2) return;
    const W = Math.max(260, box.clientWidth || 600), H = 220;
    const g = { l: 52, r: 14, t: 14, b: 28 };
    const jours = s.map((x) => new Date(x.d + "T12:00:00").getTime());
    let x0 = Math.min.apply(null, jours), x1 = Math.max.apply(null, jours);
    if (x1 === x0) { x0 -= 864e5; x1 += 864e5; }
    const ts = s.map((x) => x.t).concat(obj ? [obj] : []);
    let lo = Math.min.apply(null, ts), hi = Math.max.apply(null, ts);
    const marge = Math.max(10, (hi - lo) * 0.1);
    lo -= marge; hi += marge;
    // Graduations rondes (0,5 s, 1 s, 2 s...) : 4 intervalles au plus, bornes calees dessus.
    const pas = [10, 20, 25, 50, 100, 200, 500, 1000, 2000, 3000, 6000, 12000, 30000].find((p) => (hi - lo) / p <= 4) || 60000;
    lo = Math.floor(lo / pas) * pas; hi = Math.ceil(hi / pas) * pas;
    const graduation = (t) => (pas % 100 === 0 ? formatTemps(t).replace(/\.00$/, "") : formatTemps(t));
    const X = (ms) => g.l + (ms - x0) / (x1 - x0) * (W - g.l - g.r);
    const Y = (t) => g.t + (t - lo) / (hi - lo) * (H - g.t - g.b);   // petit temps = haut

    let grille = "";
    for (let t = lo; t <= hi; t += pas) {
      const y = Y(t).toFixed(1);
      grille += `<line class="grille" x1="${g.l}" x2="${W - g.r}" y1="${y}" y2="${y}"/><text class="axe" x="${g.l - 8}" y="${y}" dy="4" text-anchor="end">${graduation(t)}</text>`;
    }
    const cible = obj ? `<line class="objectif-ligne" x1="${g.l}" x2="${W - g.r}" y1="${Y(obj).toFixed(1)}" y2="${Y(obj).toFixed(1)}"/>`
      + `<text class="objectif-txt" x="${W - g.r}" y="${(Y(obj) - 6).toFixed(1)}" text-anchor="end">objectif ${formatTemps(obj)}</text>` : "";
    const dates = [s[0], s[s.length - 1]].map((x, i) =>
      `<text class="axe" x="${X(jours[i ? s.length - 1 : 0]).toFixed(1)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}">${esc(dateCourte(x.d))}</text>`).join("");
    const pts = s.map((x, i) => X(jours[i]).toFixed(1) + "," + Y(x.t).toFixed(1));
    const points = s.map((x, i) => {
      const cx = X(jours[i]).toFixed(1), cy = Y(x.t).toFixed(1);
      return `<circle class="point${x.rp ? " rp" : ""}" cx="${cx}" cy="${cy}" r="4.5"/>`
        + `<circle class="cible" cx="${cx}" cy="${cy}" r="14" tabindex="0" data-i="${i}" role="img" aria-label="${esc(dateCourte(x.d))} : ${formatTemps(x.t)}${x.rp ? ", record à ce moment" : ""}"/>`
        + `<circle class="halo" cx="${cx}" cy="${cy}" r="8"/>`;
    }).join("");

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" aria-label="Progression des temps${obj ? ", objectif " + formatTemps(obj) : ""}">${grille}${cible}${dates}`
      + `<polyline class="ligne" points="${pts.join(" ")}"/>${points}</svg><div class="bulle-courbe" hidden></div>`;

    const bulle = box.querySelector(".bulle-courbe");
    const montrer = (c) => {
      const x = s[Number(c.dataset.i)];
      box.querySelectorAll(".halo.on").forEach((h) => h.classList.remove("on"));
      c.nextElementSibling.classList.add("on");
      bulle.innerHTML = `<strong>${formatTemps(x.t)}</strong>${x.rp ? " · RP" : ""}<br>${esc(dateCourte(x.d))}${x.lieu ? " · " + esc(x.lieu) : ""}`
        + (x.sp && x.sp.length ? "<br>" + esc(textePassages(x)) : "");
      bulle.style.left = Math.min(Math.max(c.cx.baseVal.value, 90), W - 90) + "px";
      bulle.style.top = c.cy.baseVal.value + "px";
      bulle.hidden = false;
    };
    const cacher = () => { bulle.hidden = true; box.querySelectorAll(".halo.on").forEach((h) => h.classList.remove("on")); };
    box.querySelectorAll(".cible").forEach((c) => {
      c.addEventListener("mouseenter", () => montrer(c));
      c.addEventListener("focus", () => montrer(c));
      c.addEventListener("click", () => montrer(c));
      c.addEventListener("mouseleave", cacher);
      c.addEventListener("blur", cacher);
    });
  }
  function render() { renderAll(); }

  /* =========================================================================
     Mascotte : petite creature ronde, heritiere du point vert du logo.
     Ses tenues se débloquent avec les kilomètres nagés depuis le début de la
     saison (1er septembre, metresSaison), recalculés depuis le journal, donc
     ils suivent la synchro. Ce qui est débloqué le reste sur cet appareil, même
     la saison suivante (dernierPalier) ; la tenue choisie aussi est propre à l'appareil.
     ========================================================================= */

  const MKEY = "trak.mascotte.v1";

  // palier = kilomètres nagés dans la saison (en semaines de série avant le 2026-11-16) ;
  // « le » sert aux phrases du toast. De 10 km (un mois tranquille) à 1 000 km (saison d'un nageur de club très assidu).
  const M_COULEURS = [
    { id: "vert", nom: "Vert", adj: "verte", palier: 0, le: "le vert",
      corps: "#6fb559", ombre: "#58994a", clair: "#9ed08d" },
    { id: "peche", nom: "Pêche", adj: "pêche", palier: 10, le: "la couleur pêche",
      corps: "#f0a860", ombre: "#d4843a", clair: "#f8cc97" },
    { id: "bleuet", nom: "Bleuet", adj: "bleuet", palier: 100, le: "la couleur bleuet",
      corps: "#72a6d9", ombre: "#5186bd", clair: "#abcaec" },
    { id: "lavande", nom: "Lavande", adj: "lavande", palier: 250, le: "la couleur lavande",
      corps: "#a88cd4", ombre: "#8a6dbb", clair: "#cbb9ea" },
    { id: "dore", nom: "Doré", adj: "dorée", palier: 400, le: "la teinte dorée",
      corps: "#e8b93a", ombre: "#c7962a", clair: "#f6dc85" }

  const M_ACCESSOIRES = [
    { id: "aucun", nom: "Aucun", palier: 0, avec: "", le: "" },
    { id: "echarpe", nom: "Écharpe", palier: 25, avec: "une écharpe", le: "l'écharpe" },
    { id: "lunettes", nom: "Lunettes", palier: 50, avec: "des lunettes", le: "les lunettes" },
    { id: "chapeau", nom: "Chapeau", palier: 150, avec: "un chapeau", le: "le chapeau" },
    { id: "couronne", nom: "Couronne", palier: 600, avec: "une couronne", le: "la couronne" },
    { id: "cape", nom: "Cape", palier: 1000, avec: "une cape", le: "la cape" }
  ];
  // « 1 000 km » (espace des milliers à la française, « km » jamais seul en début de ligne).
  function kmPalier(n) { return n.toLocaleString("fr-FR") + " km"; }
  // Tous les paliers, couleurs et accessoires melanges, du plus proche au plus lointain.
  const M_PALIERS = M_COULEURS.map((c) => Object.assign({ type: "couleur" }, c))
    .concat(M_ACCESSOIRES.map((a) => Object.assign({ type: "accessoire" }, a)))
    .filter((p) => p.palier > 0)
    .sort((a, b) => a.palier - b.palier);
  const M_HUMEURS = { endormie: 1, contente: 1, ravie: 1 };

  const Mascotte = {
    couleur: "vert", accessoire: "aucun",
    dernierPalier: null,           // plus haut palier atteint sur cet appareil, en km (ne redescend jamais, même à la saison suivante)
    action: false, saute: false,   // poses par toggle(), consommes par majMascotte()
    cleEntete: "", retourFocus: null, toastTimer: null
  };

  function trouverTenue(liste, id) {
    for (let i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i];
    return null;
  }

  // Dessin en SVG inline, viewBox 100 x 100 : lisible de 30 a 140 px.
  // o = { humeur, couleur, accessoire, taille, saute, fixe (sans animation), decoratif (cache aux lecteurs d'ecran) }
  function mascotteSVG(o) {
    o = o || {};
    const humeur = M_HUMEURS[o.humeur] ? o.humeur : "contente";
    const coul = trouverTenue(M_COULEURS, o.couleur) || M_COULEURS[0];
    const acc = trouverTenue(M_ACCESSOIRES, o.accessoire) || M_ACCESSOIRES[0];
    const taille = o.taille || 120;
    // En tout petit (en-tete), zzz, etincelles et ombre au sol ne seraient que du bruit.
    const details = taille >= 60;
    const surLaTete = acc.id === "chapeau" || acc.id === "couronne";

    // Derriere le corps : cape, bras et pieds (seuls les bouts depassent).
    let derriere = "";
    if (acc.id === "cape") {
      derriere += `<path d="M27 50 Q13 76 10 95 Q50 101 90 95 Q87 76 73 50 Z" fill="#c2502f"/>`
        + `<path d="M31 58 Q21 78 19 93 Q50 98 81 93 Q79 78 69 58 Z" fill="#93361f"/>`;
    }
    derriere += `<ellipse class="m-ombre" cx="14" cy="66" rx="6" ry="8" transform="rotate(20 14 66)"/>`
      + `<ellipse class="m-ombre" cx="86" cy="66" rx="6" ry="8" transform="rotate(-20 86 66)"/>`
      + `<ellipse class="m-ombre" cx="37" cy="92" rx="10" ry="5.5"/>`
      + `<ellipse class="m-ombre" cx="63" cy="92" rx="10" ry="5.5"/>`;

    // Corps : un disque d'ombre decale sous le disque principal donne le volume,
    // puis le ventre plus clair et le petit reflet en haut a gauche.
    const corps = `<circle class="m-ombre" cx="50" cy="58" r="37.5"/>`
      + `<circle class="m-corps" cx="50" cy="56" r="36.5"/>`
      + `<ellipse class="m-clair" cx="50" cy="75" rx="19" ry="12" opacity=".55"/>`
      + `<ellipse cx="35" cy="35" rx="8.5" ry="5.5" fill="#fff" opacity=".45" transform="rotate(-35 35 35)"/>`
      + `<circle cx="46.5" cy="27.5" r="2.4" fill="#fff" opacity=".5"/>`;

    // Une pousse sur le crane, sauf si un chapeau ou une couronne prend la place.
    const pousse = surLaTete ? ""
      : `<path class="m-tige" d="M50 21 Q49 15 52 10"/><path class="m-feuille" d="M52 11 Q57 3 66 5 Q62 13 52 11 Z"/>`;

    let yeux, bouche;
    if (humeur === "endormie") {
