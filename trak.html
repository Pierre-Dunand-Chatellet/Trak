<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trak — suivi d'habitudes</title>
<meta name="description" content="Trak, application de suivi d'habitudes : cochez vos journées, suivez vos séries et vos records, synchronisez vos appareils avec un compte.">
<!-- Icone : la mascotte (Image/favicon.svg), avec des PNG pour les navigateurs
     sans SVG et pour l'ecran d'accueil des iPhone. -->
<link rel="icon" type="image/svg+xml" href="Image/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="Image/favicon-32.png">
<link rel="apple-touch-icon" href="Image/apple-touch-icon.png">
<meta name="theme-color" content="#faf7f0">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --color-bg: #faf7f0;
    --color-text: #2b2620;
    --color-neutral-100: #ffffff;
    --color-neutral-200: #f1ece2;
    --color-neutral-300: #e4dcce;
    --color-neutral-400: #cfc4ae;
    --color-neutral-600: #8a7f6c;
    --color-neutral-700: #675e4e;
    --color-accent-200: #ffe3b0;
    --color-accent-500: #e79a3a;
    --color-accent-700: #a6641a;
    --color-accent2-200: #d9ecd3;
    --color-accent2-300: #bfe0b4;
    --color-accent2-400: #9ed08d;
    --color-accent2-500: #6fb559;
    --color-accent2-600: #58994a;
    --color-accent2-800: #315e2c;
    --color-accent2-900: #21401e;
    --color-empty-grey: #d6d6d6;
    --color-future-beige: #f1ece2;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(43,38,32,.06), 0 1px 8px rgba(43,38,32,.05);
    --font-heading: "Caprasimo", serif;
    --font-body: "Figtree", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--color-accent-700); }
  a:hover { color: var(--color-accent-500); }
  input[type="number"] { -moz-appearance: textfield; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }

  header.app-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px;
    padding: 28px 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  /* La mascotte remplace l'ancien point vert du logo. */
  .brand .mascotte-entete { width: 36px; height: 36px; flex: none; margin: -3px 0; }
  .brand span { font-family: var(--font-heading); font-size: 20px; letter-spacing: -0.02em; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    border: 1px solid var(--color-neutral-400); background: var(--color-neutral-100);
    color: var(--color-text); border-radius: 999px; padding: 9px 16px;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--color-accent-200); border-color: var(--color-accent-200); }
  .btn.active { background: var(--color-text); border-color: var(--color-text); color: var(--color-neutral-100); }
  .btn-primary {
    background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: #fff;
  }
  .btn-primary:hover { background: var(--color-accent2-600); }
  .btn-ghost { border: none; background: none; padding: 8px 10px; }
  .btn-ghost:hover { background: var(--color-accent-200); }

  .divider { height: 1px; background: var(--color-neutral-300); margin-bottom: 30px; }

  .input {
    font-family: var(--font-body); font-size: 14px; border: 1px solid var(--color-neutral-400);
    border-radius: 999px; padding: 10px 16px; background: var(--color-neutral-100); color: var(--color-text);
  }
  .input:focus { outline: 2px solid var(--color-accent2-400); outline-offset: 1px; }
  /* Focus clavier visible sur les boutons, liens et cases (pas au clic souris). */
  :focus-visible { outline: 2px solid var(--color-accent2-600); outline-offset: 2px; }

  .card {
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 20px 22px;
  }

  /* ---- Today ---- */
  .today-grid { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 40px; align-items: start; }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-600); }
  h1.big { font-family: var(--font-body); font-size: 36px; margin: 6px 0 4px; font-weight: 700; }
  .summary { font-size: 15px; color: var(--color-neutral-700); margin: 0 0 24px; }

  .habit-row { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 14px 18px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
  .habit-row .top { display: flex; align-items: center; gap: 14px; }
  .check {
    width: 34px; height: 34px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 15px; border: 1px solid var(--color-neutral-400); background: transparent; color: transparent;
    transition: background .15s, border-color .15s;
  }
  .check.done { background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: #fff; }
  .habit-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .habit-meta { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  .note-toggle { margin-left: auto; white-space: nowrap; }
  .note-input { margin-top: 12px; width: 100%; }

  aside.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .stat-card { background: var(--color-accent2-200); border-radius: var(--radius-lg); padding: 22px 24px; }
  .stat-card .eyebrow { color: var(--color-accent2-800); }
  .stat-card .big-num { font-family: var(--font-heading); font-size: 46px; line-height: 1; margin-top: 8px; color: var(--color-accent2-900); }

  .goal-item { margin-bottom: 14px; }
  .goal-item:last-child { margin-bottom: 0; }
  .goal-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
  .goal-head .count { color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .goal-bar-bg { height: 8px; border-radius: 999px; background: var(--color-neutral-300); overflow: hidden; }
  .goal-bar { height: 100%; border-radius: 999px; background: var(--color-accent-500); }
  .goal-bar.full { background: var(--color-accent2-500); }

  /* ---- Mascotte ---- */
  /* Les couleurs arrivent par les variables --m-corps / --m-ombre / --m-clair
     posees sur chaque <svg> : un seul dessin pour toutes les teintes. */
  .mascotte { display: block; overflow: visible; }
  .mascotte .m-corps { fill: var(--m-corps); }
  .mascotte .m-ombre { fill: var(--m-ombre); }
  .mascotte .m-clair { fill: var(--m-clair); }
  .mascotte .m-encre { fill: var(--color-text); }
  .mascotte .m-trait { fill: none; stroke: var(--color-text); stroke-linecap: round; stroke-linejoin: round; }
  .mascotte .m-joue { fill: #ef8c7a; opacity: .45; }
  .mascotte.humeur-ravie .m-joue { opacity: .75; }
  .mascotte.humeur-endormie .m-joue { opacity: .3; }
  .mascotte .m-tige { fill: none; stroke: var(--color-accent2-800); stroke-width: 2.4; stroke-linecap: round; }
  .mascotte .m-feuille { fill: var(--color-accent2-400); stroke: var(--color-accent2-800); stroke-width: 1.6; stroke-linejoin: round; }
  /* Balancement lent, clignement rare : on doit a peine le remarquer. */
  .mascotte .m-balance { transform-box: view-box; transform-origin: 50% 94%; animation: m-balance 4.8s ease-in-out infinite; }
  .mascotte.humeur-ravie .m-balance { animation-duration: 3.2s; }
  .mascotte.humeur-endormie .m-balance { animation: m-souffle 3.6s ease-in-out infinite; }
  .mascotte.humeur-contente .m-yeux { transform-box: fill-box; transform-origin: center; animation: m-cligne 5.5s infinite; }
  .mascotte .m-z { opacity: .7; animation: m-z 3.6s ease-in-out infinite; }
  .mascotte .m-etincelle { animation: m-scintille 2.6s ease-in-out infinite; }
  .mascotte .m-etincelle + .m-etincelle { animation-delay: 1.3s; }
  /* Petit saut quand on coche une habitude. */
  .mascotte .m-saut { transform-box: view-box; transform-origin: 50% 96%; }
  .mascotte.saute .m-saut { animation: m-saut .55s cubic-bezier(.3,.7,.4,1); }
  .mascotte.fixe * { animation: none; }
  @keyframes m-balance { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes m-souffle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.975); } }
  @keyframes m-cligne { 0%,90%,96%,100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }
  @keyframes m-z { 0% { opacity: 0; transform: translate(0,4px); } 30%,70% { opacity: .75; } 100% { opacity: 0; transform: translate(4px,-6px); } }
  @keyframes m-scintille { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes m-saut {
    0% { transform: none; }
    25% { transform: translateY(-9px) scale(.96,1.05); }
    50% { transform: translateY(0) scale(1.08,.92); }
    70% { transform: scale(.97,1.03); }
    100% { transform: none; }
  }

  .mascotte-card {
    background: var(--color-neutral-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  }
  .mascotte-card-img { flex: none; width: 120px; height: 120px; }
  .mascotte-card-texte { flex: 1; min-width: 150px; }
  .mascotte-phrase { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 6px 0 4px; }
  .mascotte-record { font-size: 13px; color: var(--color-neutral-600); margin: 0 0 12px; line-height: 1.4; }

  /* Modale « Personnaliser » */
  .modal.modal-large { max-width: 540px; }
  .mascotte-apercu {
    display: flex; justify-content: center; padding: 14px 0 10px; margin-bottom: 16px;
    background: var(--color-accent2-200); border-radius: var(--radius-lg);
  }
  .mascotte-progression { margin-bottom: 4px; }
  .mascotte-progression .count { white-space: nowrap; }
  .mascotte-note { font-size: 12px; color: var(--color-neutral-600); margin: 6px 0 0; }
  .tenue-groupe { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
  .tenue-groupe legend {
    padding: 0; margin-bottom: 10px; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--color-neutral-600);
  }
  .tenue-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tenue-option { position: relative; display: block; cursor: pointer; }
  .tenue-carte {
    display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%;
    padding: 8px 6px 10px; border: 1px solid var(--color-neutral-300); border-radius: 14px;
    text-align: center; transition: background .15s, border-color .15s;
  }
  .tenue-option:hover .tenue-carte { background: var(--color-neutral-200); }
  .tenue-option input:checked + .tenue-carte {
    background: var(--color-accent2-200); border-color: var(--color-accent2-600);
    box-shadow: inset 0 0 0 1px var(--color-accent2-600);
  }
  .tenue-option input:focus-visible + .tenue-carte { outline: 2px solid var(--color-accent2-600); outline-offset: 2px; }
  .tenue-nom { font-size: 13px; font-weight: 600; }
  .tenue-info { font-size: 11px; line-height: 1.3; color: var(--color-neutral-600); }
  .tenue-option.verrouille { cursor: not-allowed; }
  .tenue-option.verrouille:hover .tenue-carte { background: none; }
  .tenue-option.verrouille .mascotte { filter: grayscale(1); opacity: .45; }
  .tenue-option.verrouille .tenue-nom { color: var(--color-neutral-600); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Toast de deblocage */
  .toast-zone {
    position: fixed; left: 0; right: 0; bottom: 20px; z-index: 60;
    display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
  }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 460px;
    background: var(--color-text); color: var(--color-neutral-100);
    border-radius: var(--radius-lg); padding: 10px 10px 10px 12px;
    box-shadow: 0 10px 40px rgba(43,38,32,.22);
    opacity: 0; transform: translateY(12px); transition: opacity .25s, transform .25s;
  }
  .toast.visible { opacity: 1; transform: none; }
  .toast .mascotte { flex: none; }
  .toast-texte { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; }
  .toast-texte strong { display: block; font-size: 14px; }
  .toast-texte span { color: var(--color-neutral-300); }
  .toast .btn-ghost { color: var(--color-neutral-100); font-size: 18px; line-height: 1; padding: 6px 10px; }
  .toast .btn-ghost:hover { color: var(--color-text); }

  /* Visite guidee : un "trou" lumineux autour de l'element explique (son
     ombre geante assombrit tout le reste) et une bulle de texte a cote. */
  .aide-btn { width: 38px; height: 38px; padding: 0; font-size: 15px; display: grid; place-items: center; }
  .visite { position: fixed; inset: 0; z-index: 70; }
  .visite[hidden] { display: none; }
  .visite.sans-cible { background: rgba(43,38,32,.55); }
  .visite-trou {
    position: fixed; border-radius: var(--radius-lg); pointer-events: none;
    box-shadow: 0 0 0 3px var(--color-accent-500), 0 0 0 9999px rgba(43,38,32,.55);
    transition: top .3s ease, left .3s ease, width .3s ease, height .3s ease;
  }
  .visite.sans-cible .visite-trou { display: none; }
  .visite-bulle {
    position: fixed; width: min(360px, calc(100vw - 32px));
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(43,38,32,.28); padding: 20px 20px 16px;
    transition: top .3s ease, left .3s ease;
  }
  .visite-bulle:focus { outline: none; }
  .visite-bulle .mascotte { display: block; margin: -4px auto 8px; }
  .visite-etape { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 6px; }
  .visite-bulle h2 { font-size: 18px; margin: 0 0 6px; }
  .visite-bulle p.visite-texte { font-size: 14px; line-height: 1.5; color: var(--color-neutral-700); margin: 0; }
  .visite-points { display: flex; gap: 5px; margin: 16px 0 0; }
  .visite-points span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-neutral-300); }
  .visite-points span.actif { background: var(--color-accent-500); width: 16px; border-radius: 3px; }
  .visite-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .visite-actions .spacer { margin-left: auto; }
  .visite-actions .btn-ghost { color: var(--color-neutral-700); }
  @media (max-width: 560px) {
    /* Sur telephone la bulle se pose en bas de l'ecran, pleine largeur. */
    .visite-bulle { left: 16px !important; right: 16px; top: auto !important; bottom: 16px; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .visite-trou, .visite-bulle { transition: none; }
  }

  /* ---- Week ---- */
  .week-head-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .week-head-row h1 { margin: 0; margin-right: auto; }
  .week-table-wrap { overflow-x: auto; }
  .week-table {
    display: grid; grid-template-columns: minmax(130px,1fr) repeat(7, 42px) 64px;
    gap: 8px; align-items: center; min-width: 600px;
  }
  .week-table .colhead { text-align: center; }
  .week-table .colhead .dow { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-600); }
  .week-table .colhead .daynum { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .week-table .rowname { font-size: 14px; font-weight: 600; padding-right: 6px; }
  .week-table .total { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--color-neutral-700); }
  .week-cell {
    width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--color-neutral-400);
    background: transparent; color: transparent; cursor: pointer; font-size: 14px;
  }
  .week-cell.done { background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: #fff; }
  .week-cell.future { border-style: dashed; border-color: var(--color-neutral-300); cursor: default; }
  .week-hint { font-size: 13px; color: var(--color-neutral-600); margin-top: 12px; }

  .note-card { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 14px 18px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 10px; }
  .note-when { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-600); min-width: 100px; }
  .note-name { font-size: 14px; font-weight: 600; }
  .note-text { font-size: 14px; color: var(--color-neutral-700); flex: 1; min-width: 180px; }

  /* ---- Year ---- */
  .year-card { padding: 24px; overflow-x: auto; }
  .year-inner { min-width: 760px; }
  .month-row { display: flex; gap: 3px; margin-bottom: 6px; }
  .month-label { width: 12px; font-size: 10px; color: var(--color-neutral-600); white-space: nowrap; overflow: visible; }
  .year-grid { display: flex; gap: 3px; }
  .year-col { display: flex; flex-direction: column; gap: 3px; }
  .year-cell { width: 12px; height: 12px; border-radius: 4px; background: var(--color-neutral-200); }
  .legend-row { display: flex; align-items: center; gap: 7px; margin-top: 18px; font-size: 12px; color: var(--color-neutral-600); flex-wrap: wrap; }
  .legend-cell { width: 12px; height: 12px; border-radius: 4px; }
  .legend-note { margin-left: 8px; }

  .streak-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; margin-top: 20px; }
  .streak-card { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .streak-card .name { font-size: 14px; font-weight: 600; }
  .streak-card .num { font-family: var(--font-heading); font-size: 30px; line-height: 1.1; margin-top: 6px; color: var(--color-accent-700); }
  .streak-card .detail { font-size: 12px; color: var(--color-neutral-600); }

  /* ---- Manage ---- */
  .manage-wrap { max-width: 620px; }
  .manage-row { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .manage-row .input:first-child { flex: 1; min-width: 160px; }
  .manage-row .goal-input { width: 68px; text-align: center; }
  .manage-unit { font-size: 12px; color: var(--color-neutral-600); }
  .manage-add { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .manage-add .input { flex: 1; min-width: 180px; }
  .reset-link { margin-top: 24px; }

  /* ---- Compte & synchronisation ---- */
  .account-btn { display: flex; align-items: center; gap: 8px; }
  .account-btn .who { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-neutral-400); flex: none; }
  .sync-dot.ok { background: var(--color-accent2-500); }
  .sync-dot.busy { background: var(--color-accent-500); animation: sync-pulse 1s ease-in-out infinite; }
  .sync-dot.err { background: #c0532c; }
  @keyframes sync-pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  /* Si le système demande moins d'animations : plus de clignotement pendant la synchro,
     mascotte immobile (ni balancement, ni clignement, ni saut) et toast sans glissement.
     Les transitions de couleur (0,15 s) restent, elles aident à voir ce qui change. */
  @media (prefers-reduced-motion: reduce) {
    .sync-dot.busy { animation: none; opacity: .6; }
    .mascotte, .mascotte * { animation: none !important; }
    .toast { transform: none; transition: opacity .15s; }
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(43,38,32,.42);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(43,38,32,.22); width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto; padding: 24px;
  }
  .modal h2 { font-size: 20px; margin: 0 0 4px; }
  .modal .p-muted { margin-bottom: 18px; }
  .modal-close { position: absolute; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 12px; font-weight: 600; color: var(--color-neutral-700); margin-bottom: 5px; }
  .field .input { width: 100%; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
  .modal-actions .spacer { margin-left: auto; }
  .form-msg { font-size: 13px; line-height: 1.45; margin: 14px 0 0; }
  .form-msg.err { color: #a33f1c; }
  .form-msg.ok { color: var(--color-accent2-800); }
  .switch-mode { font-size: 13px; color: var(--color-neutral-700); margin: 16px 0 0; }
  .switch-mode button {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
    color: var(--color-accent-700); cursor: pointer; text-decoration: underline;
  }
  .sync-line { font-size: 13px; color: var(--color-neutral-700); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .device-list { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .device-list li { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--color-neutral-200); color: var(--color-neutral-700); }
  .device-list li .tag { margin-left: auto; font-size: 11px; color: var(--color-accent2-800); font-weight: 600; }

  h1, h2 { font-weight: 700; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 34px 0 14px; }
  p { line-height: 1.5; }
  .p-muted { font-size: 14px; color: var(--color-neutral-700); margin: 0 0 22px; }

  /* ---- Responsive ---- */
  @media (max-width: 860px) {
    .today-grid { grid-template-columns: 1fr; }
    aside.side { position: static; }
  }
  /* Avec la carte mascotte, la colonne de droite depasse la hauteur des petits
     ecrans : collee en haut, son bas deviendrait inaccessible. */
  @media (max-height: 760px) {
    aside.side { position: static; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 14px 60px; }
    header.app-header { padding: 20px 0 16px; }
    .btn { font-size: 12px; padding: 7px 12px; }
    h1.big, h1 { font-size: 26px; }
    .habit-row, .card { padding: 14px 16px; }
    .week-table { grid-template-columns: minmax(80px,1fr) repeat(7, 30px); min-width: 0; }
    .week-table .total { display: none; }
    .week-cell { width: 28px; height: 28px; font-size: 12px; }
    .year-inner { min-width: 560px; }
    .year-cell { width: 9px; height: 9px; }
    .month-label { width: 9px; font-size: 8px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="app-header">
    <div class="brand"><div class="mascotte-entete" id="mascotte-entete"></div><span>Trak</span></div>
    <nav class="tabs">
      <button type="button" class="btn" data-tab="today">Aujourd'hui</button>
      <button type="button" class="btn" data-tab="week">Semaine</button>
      <button type="button" class="btn" data-tab="year">Année</button>
      <button type="button" class="btn" data-tab="manage">Habitudes</button>
    </nav>
    <button type="button" class="btn account-btn" id="account-btn">
      <span class="sync-dot" id="sync-dot"></span><span class="who" id="account-label">Se connecter</span>
    </button>
    <button type="button" class="btn aide-btn" id="aide-btn" aria-label="Revoir la visite guidée" title="Revoir la visite guidée">?</button>
  </header>
  <div class="divider"></div>

  <section id="view-today"></section>
  <section id="view-week" style="display:none"></section>
  <section id="view-year" style="display:none"></section>
  <section id="view-manage" style="display:none"></section>

</div>

<div class="modal-backdrop" id="account-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="account-title">
    <div id="account-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="mascotte-modal" hidden>
  <div class="modal modal-large" role="dialog" aria-modal="true" aria-labelledby="mascotte-title">
    <div id="mascotte-body"></div>
  </div>
</div>

<div class="visite" id="visite" hidden>
  <div class="visite-trou" id="visite-trou"></div>
  <div class="visite-bulle" id="visite-bulle" role="dialog" aria-modal="true" aria-labelledby="visite-titre" tabindex="-1"></div>
</div>

<div class="toast-zone" id="mascotte-toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  const DEFAULT_HABITS = [
    { id: "eau", name: "Boire de l'eau", goal: 7 },
    { id: "lecture", name: "Lire 10 minutes", goal: 5 },
    { id: "sport", name: "Faire du sport", goal: 3 },
    { id: "marche", name: "Marcher 30 minutes", goal: 5 },
    { id: "sommeil", name: "Se coucher avant 23 h", goal: 5 }
  ];
  const DOW = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
  const DOW_LONG = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const KEY = "cadence-vierge.v1";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function ymd(d) {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) {
    const x = new Date(d.getTime());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function nowMs() { return Date.now(); }

  function defaultHabits() {
    return DEFAULT_HABITS.map((h, i) => ({ id: h.id, name: h.name, goal: h.goal, pos: i, u: 0 }));
  }

  const State = {
    tab: "today",
    today: ymd(new Date()),
    weekOffset: 0,
    openNote: null,
    newName: "",
    habits: defaultHabits(),
    log: {},
    // Habitudes supprimees : { id: { u } }. Conservees pour que la suppression
    // se propage aux autres appareils au lieu d'etre "reparee" par eux.
    gone: {},
    // Ce qui reste a envoyer au serveur.
    dirtyH: {},
    dirtyE: {}
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.habits && d.log) {
          State.habits = d.habits;
          State.log = d.log;
          State.gone = d.gone || {};
          State.dirtyH = d.dirtyH || {};
          State.dirtyE = d.dirtyE || {};
          if (!d.v) migrateToSync();
          return;
        }
      }
    } catch (e) { /* stockage indisponible */ }
    State.log = {};
    persist();
  }

  // Donnees enregistrees avant l'arrivee de la synchronisation : on les horodate
  // maintenant et on les marque a envoyer, pour qu'elles remontent au compte.
  function migrateToSync() {
    const t = nowMs();
    State.habits.forEach((h, i) => {
      if (h.pos == null) h.pos = i;
      h.u = t;
      State.dirtyH[h.id] = 1;
    });
    Object.keys(State.log).forEach((k) => { State.log[k].u = t; State.dirtyE[k] = 1; });
    persist();
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        v: 2,
        habits: State.habits, log: State.log, gone: State.gone,
        dirtyH: State.dirtyH, dirtyE: State.dirtyE
      }));
    } catch (e) { /* ignore */ }
  }

  function findHabit(id) {
    for (let i = 0; i < State.habits.length; i++) if (State.habits[i].id === id) return State.habits[i];
    return null;
  }
  function habitStamp(id) {
    const h = findHabit(id);
    if (h) return h.u || 0;
    return State.gone[id] ? State.gone[id].u || 0 : 0;
  }
  function nextPos() {
    return State.habits.reduce((m, h) => Math.max(m, h.pos || 0), -1) + 1;
  }
  // Marque une habitude comme modifiee localement et programme l'envoi.
  function touchHabit(h) {
    h.u = nowMs();
    State.dirtyH[h.id] = 1;
    persist(); Sync.schedule();
  }

  function isDone(id, day) { const e = State.log[id + "|" + day]; return !!(e && e.done); }
  function toggle(id, day) {
    const k = id + "|" + day;
    const prev = State.log[k];
    State.log[k] = { done: !(prev && prev.done), note: prev ? prev.note || "" : "", u: nowMs() };
    State.dirtyE[k] = 1;
    // La mascotte saute quand on coche, et un palier franchi ici merite un toast.
    Mascotte.action = true;
    Mascotte.saute = State.log[k].done;
    persist(); Sync.schedule(); render();
  }
  function setNote(id, day, note) {
    const k = id + "|" + day;
    const prev = State.log[k] || { done: false, note: "" };
    State.log[k] = { done: prev.done, note: note, u: nowMs() };
    State.dirtyE[k] = 1;
    persist(); Sync.schedule();
  }

  function streak(id) {
    const t = new Date(State.today + "T12:00:00");
    let n = 0;
    let start = isDone(id, ymd(t)) ? 0 : 1;
    if (start === 1 && !isDone(id, ymd(addDays(t, -1)))) return 0;
    for (let i = start; i < 400; i++) {
      if (isDone(id, ymd(addDays(t, -i)))) n++; else break;
    }
    return n;
  }
  function best(id) {
    const t = new Date(State.today + "T12:00:00");
    let n = 0, m = 0;
    for (let i = 365; i >= 0; i--) {
      if (isDone(id, ymd(addDays(t, -i)))) { n++; if (n > m) m = n; } else n = 0;
    }
    return m;
  }
  function heatColor(ratio) {
    if (ratio === 0) return "var(--color-empty-grey)";
    if (ratio < 0.34) return "var(--color-accent2-200)";
    if (ratio < 0.67) return "var(--color-accent2-300)";
    if (ratio < 1) return "var(--color-accent2-400)";
    return "var(--color-accent2-600)";
  }

  function renderTabs() {
    document.querySelectorAll(".tabs .btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === State.tab);
    });
    ["today", "week", "year", "manage"].forEach((t) => {
      document.getElementById("view-" + t).style.display = t === State.tab ? "" : "none";
    });
  }

  function renderToday() {
    const el = document.getElementById("view-today");
    const today = new Date(State.today + "T12:00:00");
    const doneToday = State.habits.filter((h) => isDone(h.id, State.today)).length;
    const weekday = DOW_LONG[(today.getDay() + 6) % 7];

    let hit = 0, tot = 0;
    for (let i = 0; i < 30; i++) {
      const day = ymd(addDays(today, -i));
      State.habits.forEach((h) => { tot++; if (isDone(h.id, day)) hit++; });
    }
    const pct30 = (tot ? Math.round(hit / tot * 100) : 0) + " %";

    const monday = mondayOf(today);
    const goalsHtml = State.habits.map((h) => {
      let c = 0;
      for (let i = 0; i < 7; i++) if (isDone(h.id, ymd(addDays(monday, i)))) c++;
      const pct = Math.min(100, Math.round(c / Math.max(1, h.goal) * 100));
      return `<div class="goal-item">
        <div class="goal-head"><span>${esc(h.name)}</span><span class="count">${c} / ${h.goal}</span></div>
        <div class="goal-bar-bg"><div class="goal-bar${pct >= 100 ? " full" : ""}" style="width:${pct}%"></div></div>
      </div>`;
    }).join("");

    const rowsHtml = State.habits.map((h) => {
      const entry = State.log[h.id + "|" + State.today] || { done: false, note: "" };
      const st = streak(h.id);
      const meta = st > 0 ? "Série de " + st + " jour" + (st > 1 ? "s" : "") : "Série interrompue";
      const noteOpen = State.openNote === h.id || !!entry.note;
      return `<div class="habit-row" data-id="${esc(h.id)}">
        <div class="top">
          <button type="button" class="check${entry.done ? " done" : ""}" data-action="toggle" data-id="${esc(h.id)}" aria-label="Marquer comme fait">${entry.done ? "✓" : ""}</button>
          <div style="flex:1;min-width:0">
            <div class="habit-name">${esc(h.name)}</div>
            <div class="habit-meta">${meta}</div>
          </div>
          <button type="button" class="btn btn-ghost note-toggle" data-action="note-toggle" data-id="${esc(h.id)}">${entry.note ? "Note" : "+ note"}</button>
        </div>
        ${noteOpen ? `<input class="input note-input" type="text" placeholder="Note du jour" data-action="note-input" data-id="${esc(h.id)}" value="${esc(entry.note || "")}">` : ""}
      </div>`;
    }).join("");

    el.innerHTML = `
      <div class="today-grid">
        <div>
          <p class="eyebrow">${esc(weekday)}</p>
          <h1 class="big">${today.getDate()} ${MONTHS[today.getMonth()]}</h1>
          <p class="summary">${doneToday} sur ${State.habits.length} coché${doneToday > 1 ? "es" : "e"} aujourd'hui.</p>
          <div>${rowsHtml || "<p class=\"p-muted\">Aucune habitude. Ajoutez-en depuis l'onglet Habitudes.</p>"}</div>
        </div>
        <aside class="side">
          <div class="mascotte-card" id="mascotte-carte"></div>
          <div class="stat-card">
            <p class="eyebrow">Réussite, 30 derniers jours</p>
            <div class="big-num">${pct30}</div>
          </div>
          <div class="card">
            <p class="eyebrow" style="margin:0 0 16px">Objectifs de la semaine</p>
            ${goalsHtml || "<p class=\"p-muted\" style=\"margin:0\">—</p>"}
          </div>
        </aside>
      </div>`;

    el.querySelectorAll('[data-action="toggle"]').forEach((b) => b.addEventListener("click", () => toggle(b.dataset.id, State.today)));
    el.querySelectorAll('[data-action="note-toggle"]').forEach((b) => b.addEventListener("click", () => {
      State.openNote = State.openNote === b.dataset.id ? null : b.dataset.id;
      renderToday();
    }));
    el.querySelectorAll('[data-action="note-input"]').forEach((inp) => {
      inp.addEventListener("change", () => setNote(inp.dataset.id, State.today, inp.value));
    });

    // renderToday passe apres chaque changement (coche, ajout, suppression,
    // renommage) : c'est ici qu'on tient la mascotte a jour, carte et en-tete.
    const etat = etatMascotte();
    renderMascotteCarte(etat);
    majMascotte(etat);
  }

  function renderWeek() {
    const el = document.getElementById("view-week");
    const today = new Date(State.today + "T12:00:00");
    const monday = mondayOf(today);
    const wStart = addDays(monday, State.weekOffset * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) weekDays.push(ymd(addDays(wStart, i)));

    const headsHtml = DOW.map((d, i) => {
      const dn = addDays(wStart, i).getDate();
      return `<div class="colhead"><div class="dow">${d}</div><div class="daynum">${dn}</div></div>`;
    }).join("");

    const rowsHtml = State.habits.map((h) => {
      let c = 0;
      const cellsHtml = weekDays.map((day) => {
        const done = isDone(h.id, day);
        if (done) c++;
        const future = day > State.today;
        const cls = done ? "done" : future ? "future" : "";
        return `<button type="button" class="week-cell ${cls}" title="${esc(h.name)} — ${day}" ${future ? "disabled" : `data-action="toggle" data-id="${esc(h.id)}" data-day="${day}"`}>${done ? "✓" : ""}</button>`;
      }).join("");
      return `<div class="rowname">${esc(h.name)}</div>${cellsHtml}<div class="total">${c}/7</div>`;
    }).join("");

    const wEnd = addDays(wStart, 6);
    const weekLabel = State.weekOffset === 0 ? "Cette semaine"
      : wStart.getDate() + " " + MONTHS[wStart.getMonth()] + " – " + wEnd.getDate() + " " + MONTHS[wEnd.getMonth()];

    const weekNotes = [];
    weekDays.forEach((day, i) => {
      State.habits.forEach((h) => {
        const e = State.log[h.id + "|" + day];
        if (e && e.note && e.note.trim()) {
          const d = addDays(wStart, i);
          weekNotes.push({ name: h.name, when: DOW[i] + " " + d.getDate() + " " + MONTHS[d.getMonth()], note: e.note });
        }
      });
    });
    const notesHtml = weekNotes.length
      ? weekNotes.map((n) => `<div class="note-card"><span class="note-when">${esc(n.when)}</span><span class="note-name">${esc(n.name)}</span><span class="note-text">${esc(n.note)}</span></div>`).join("")
      : `<p class="p-muted" style="margin:0">Aucune note cette semaine. Ajoutez-en depuis l'écran Aujourd'hui.</p>`;

    el.innerHTML = `
      <div class="week-head-row">
        <h1>${esc(weekLabel)}</h1>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" data-action="week-prev">← Précédente</button>
          <button type="button" class="btn" data-action="week-next">Suivante →</button>
        </div>
      </div>
      <div class="card week-table-wrap">
        <div class="week-table">
          <div></div>
          ${headsHtml}
          <div class="total" style="text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase">Total</div>
          ${rowsHtml}
        </div>
      </div>
      <p class="week-hint">Cliquez une case pour basculer le statut. Les jours à venir restent vides.</p>
      <h2>Notes de la semaine</h2>
      ${notesHtml}`;

    el.querySelectorAll('[data-action="toggle"]').forEach((b) => b.addEventListener("click", () => toggle(b.dataset.id, b.dataset.day)));
    el.querySelector('[data-action="week-prev"]').addEventListener("click", () => { State.weekOffset -= 1; renderWeek(); });
    el.querySelector('[data-action="week-next"]').addEventListener("click", () => { State.weekOffset = Math.min(0, State.weekOffset + 1); renderWeek(); });
  }

  function renderYear() {
    const el = document.getElementById("view-year");
    const today = new Date(State.today + "T12:00:00");
    const year = today.getFullYear();
    const jan1 = new Date(year, 0, 1, 12);
    const dec31 = new Date(year, 11, 31, 12);
    const gridStart = mondayOf(jan1);
    const weeks = Math.round((mondayOf(dec31) - gridStart) / (7 * 24 * 3600 * 1000)) + 1;

    let monthsHtml = "";
    let colsHtml = "";
    let lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const colStart = addDays(gridStart, w * 7);
      let cellsHtml = "";
      for (let i = 0; i < 7; i++) {
        const d = addDays(colStart, i);
        const inYear = d.getFullYear() === year;
        const day = ymd(d);
        const future = day > State.today;
        const n = (!inYear || future) ? 0 : State.habits.filter((h) => isDone(h.id, day)).length;
        const ratio = State.habits.length ? n / State.habits.length : 0;
        const bg = future ? "var(--color-future-beige)" : heatColor(ratio);
        cellsHtml += inYear
          ? `<div class="year-cell" title="${day} — ${n}/${State.habits.length}" style="background:${bg}"></div>`
          : `<div class="year-cell" style="background:transparent"></div>`;
      }
      colsHtml += `<div class="year-col">${cellsHtml}</div>`;
      const m = colStart.getMonth();
      const show = m !== lastMonth && colStart.getFullYear() === year;
      lastMonth = m;
      monthsHtml += `<div class="month-label">${show ? MONTHS[m] : ""}</div>`;
    }

    const legendHtml = [0, 0.3, 0.6, 0.9, 1].map((r) => `<div class="legend-cell" style="background:${heatColor(r)}"></div>`).join("");

    let full = 0;
    for (let d = new Date(jan1.getTime()); d.getFullYear() === year && ymd(d) <= State.today; d = addDays(d, 1)) {
      const day = ymd(d);
      if (State.habits.length && State.habits.every((h) => isDone(h.id, day))) full++;
    }

    const streakHtml = State.habits.map((h) => `
      <div class="streak-card">
        <div class="name">${esc(h.name)}</div>
        <div class="num">${streak(h.id)} j</div>
        <div class="detail">Record : ${best(h.id)} jours</div>
      </div>`).join("");

    el.innerHTML = `
      <h1>${year}</h1>
      <p class="p-muted">${full} jours parfaits en ${year}.</p>
      <div class="card year-card">
        <div class="year-inner">
          <div class="month-row">${monthsHtml}</div>
          <div class="year-grid">${colsHtml}</div>
        </div>
      </div>
      <div class="legend-row">
        <span>Aucune</span>${legendHtml}<span>Toutes</span>
        <span class="legend-note">Une case par jour : plus le vert est foncé, plus vous avez coché d'habitudes ce jour-là.</span>
      </div>
      <div class="streak-grid">${streakHtml || "<p class=\"p-muted\">—</p>"}</div>`;
  }

  function renderManage() {
    const el = document.getElementById("view-manage");
    const rowsHtml = State.habits.map((h) => `
      <div class="manage-row" data-id="${esc(h.id)}">
        <input class="input" type="text" data-action="name" data-id="${esc(h.id)}" value="${esc(h.name)}">
        <input class="input goal-input" type="number" min="1" max="7" data-action="goal" data-id="${esc(h.id)}" value="${h.goal}">
        <span class="manage-unit">j/sem.</span>
        <button type="button" class="btn btn-ghost" data-action="delete" data-id="${esc(h.id)}" style="color:var(--color-accent-700)">Supprimer</button>
      </div>`).join("");

    el.innerHTML = `
      <div class="manage-wrap">
        <h1>Habitudes</h1>
        <p class="p-muted">Le nom et l'objectif hebdomadaire, en jours par semaine.</p>
        <div>${rowsHtml || "<p class=\"p-muted\">Aucune habitude pour l'instant.</p>"}</div>
        <div class="manage-add">
          <input class="input" type="text" id="new-habit-name" placeholder="Nouvelle habitude" value="${esc(State.newName)}">
          <button type="button" class="btn btn-primary" data-action="add">Ajouter</button>
        </div>
        <button type="button" class="btn btn-ghost reset-link" style="color:var(--color-neutral-700);padding-left:0" data-action="reset">Vider toutes les données</button>
      </div>`;

    el.querySelectorAll('[data-action="name"]').forEach((inp) => inp.addEventListener("change", () => {
      const h = findHabit(inp.dataset.id);
      if (!h) return;
      h.name = inp.value;
      touchHabit(h); renderToday(); renderWeek(); renderYear();
    }));
    el.querySelectorAll('[data-action="goal"]').forEach((inp) => inp.addEventListener("change", () => {
      const h = findHabit(inp.dataset.id);
      if (!h) return;
      const v = Math.max(1, Math.min(7, Number(inp.value) || 1));
      h.goal = v;
      inp.value = v;
      touchHabit(h); renderToday();
    }));
    el.querySelectorAll('[data-action="delete"]').forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.id;
      const idx = State.habits.findIndex((h) => h.id === id);
      if (idx < 0) return;
      State.habits.splice(idx, 1);
      State.gone[id] = { u: nowMs() };
      State.dirtyH[id] = 1;
      persist(); Sync.schedule(); renderManage(); renderToday(); renderWeek(); renderYear();
    }));
    el.querySelector('[data-action="add"]').addEventListener("click", () => {
      const nameInput = document.getElementById("new-habit-name");
      const n = nameInput.value.trim();
      if (!n) return;
      // Identifiant aleatoire : deux appareils peuvent creer une habitude
      // en meme temps sans se retrouver avec le meme id.
      const id = "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const h = { id: id, name: n, goal: 5, pos: nextPos(), u: nowMs() };
      State.habits.push(h);
      State.newName = "";
      touchHabit(h); renderManage(); renderToday(); renderWeek(); renderYear();
    });
    el.querySelector('[data-action="reset"]').addEventListener("click", () => {
      const warning = Account.token
        ? "Vider toutes les donnees de votre compte Trak ? Cela effacera aussi vos autres appareils synchronises."
        : "Vider toutes les donnees enregistrees sur cet appareil ?";
      if (!window.confirm(warning)) return;
      wipeAll();
    });
  }

  function wipeAll() {
    const t = nowMs();
    State.habits.forEach((h) => { State.gone[h.id] = { u: t }; State.dirtyH[h.id] = 1; });
    Object.keys(State.log).forEach((k) => {
      State.log[k] = { done: false, note: "", del: 1, u: t };
      State.dirtyE[k] = 1;
    });
    State.habits = defaultHabits();
    State.habits.forEach((h) => { h.u = t; delete State.gone[h.id]; State.dirtyH[h.id] = 1; });
    persist(); Sync.schedule(200); renderAll();
  }

  function renderAll() {
    renderTabs();
    renderToday();
    renderWeek();
    renderYear();
    renderManage();
    placerVisite();
  }
  function render() { renderAll(); }

  /* =========================================================================
     Mascotte : petite creature ronde, heritiere du point vert du logo.
     Ses tenues se debloquent avec le record de serie (meilleure serie, toutes
     habitudes confondues). Le record se recalcule depuis le journal, donc suit
     la synchro ; la tenue choisie, elle, reste propre a cet appareil.
     ========================================================================= */

  const MKEY = "trak.mascotte.v1";

  // palier = record (en jours) necessaire ; « le » sert aux phrases du toast.
  const M_COULEURS = [
    { id: "vert", nom: "Vert", adj: "verte", palier: 0, le: "le vert",
      corps: "var(--color-accent2-500)", ombre: "var(--color-accent2-600)", clair: "var(--color-accent2-400)" },
    { id: "peche", nom: "Pêche", adj: "pêche", palier: 3, le: "la couleur pêche",
      corps: "#f0a860", ombre: "#d4843a", clair: "#f8cc97" },
    { id: "bleuet", nom: "Bleuet", adj: "bleuet", palier: 21, le: "la couleur bleuet",
      corps: "#72a6d9", ombre: "#5186bd", clair: "#abcaec" },
    { id: "lavande", nom: "Lavande", adj: "lavande", palier: 45, le: "la couleur lavande",
      corps: "#a88cd4", ombre: "#8a6dbb", clair: "#cbb9ea" },
    { id: "dore", nom: "Doré", adj: "dorée", palier: 60, le: "la teinte dorée",
      corps: "#e8b93a", ombre: "#c7962a", clair: "#f6dc85" }
  ];
  const M_ACCESSOIRES = [
    { id: "aucun", nom: "Aucun", palier: 0, avec: "", le: "" },
    { id: "echarpe", nom: "Écharpe", palier: 7, avec: "une écharpe", le: "l'écharpe" },
    { id: "lunettes", nom: "Lunettes", palier: 14, avec: "des lunettes", le: "les lunettes" },
    { id: "chapeau", nom: "Chapeau", palier: 30, avec: "un chapeau", le: "le chapeau" },
    { id: "couronne", nom: "Couronne", palier: 100, avec: "une couronne", le: "la couronne" },
    { id: "cape", nom: "Cape", palier: 365, avec: "une cape", le: "la cape" }
  ];
  // Tous les paliers, couleurs et accessoires melanges, du plus proche au plus lointain.
  const M_PALIERS = M_COULEURS.map((c) => Object.assign({ type: "couleur" }, c))
    .concat(M_ACCESSOIRES.map((a) => Object.assign({ type: "accessoire" }, a)))
    .filter((p) => p.palier > 0)
    .sort((a, b) => a.palier - b.palier);
  const M_HUMEURS = { endormie: 1, contente: 1, ravie: 1 };

  const Mascotte = {
    couleur: "vert", accessoire: "aucun",
    dernierPalier: null,           // plus haut palier deja fete (ne redescend jamais)
    action: false, saute: false,   // poses par toggle(), consommes par majMascotte()
    cleEntete: "", retourFocus: null, toastTimer: null
  };

  function trouverTenue(liste, id) {
    for (let i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i];
    return null;
  }

  // Dessin en SVG inline, viewBox 100 x 100 : lisible de 30 a 140 px.
  // o = { humeur, couleur, accessoire, taille, saute, fixe (sans animation), decoratif (cache aux lecteurs d'ecran) }
  function mascotteSVG(o) {
    o = o || {};
    const humeur = M_HUMEURS[o.humeur] ? o.humeur : "contente";
    const coul = trouverTenue(M_COULEURS, o.couleur) || M_COULEURS[0];
    const acc = trouverTenue(M_ACCESSOIRES, o.accessoire) || M_ACCESSOIRES[0];
    const taille = o.taille || 120;
    // En tout petit (en-tete), zzz, etincelles et ombre au sol ne seraient que du bruit.
    const details = taille >= 60;
    const surLaTete = acc.id === "chapeau" || acc.id === "couronne";

    // Derriere le corps : cape, bras et pieds (seuls les bouts depassent).
    let derriere = "";
    if (acc.id === "cape") {
      derriere += `<path d="M27 50 Q13 76 10 95 Q50 101 90 95 Q87 76 73 50 Z" fill="#c2502f"/>`
        + `<path d="M31 58 Q21 78 19 93 Q50 98 81 93 Q79 78 69 58 Z" fill="#93361f"/>`;
    }
    derriere += `<ellipse class="m-ombre" cx="14" cy="66" rx="6" ry="8" transform="rotate(20 14 66)"/>`
      + `<ellipse class="m-ombre" cx="86" cy="66" rx="6" ry="8" transform="rotate(-20 86 66)"/>`
      + `<ellipse class="m-ombre" cx="37" cy="92" rx="10" ry="5.5"/>`
      + `<ellipse class="m-ombre" cx="63" cy="92" rx="10" ry="5.5"/>`;

    // Corps : un disque d'ombre decale sous le disque principal donne le volume,
    // puis le ventre plus clair et le petit reflet en haut a gauche.
    const corps = `<circle class="m-ombre" cx="50" cy="58" r="37.5"/>`
      + `<circle class="m-corps" cx="50" cy="56" r="36.5"/>`
      + `<ellipse class="m-clair" cx="50" cy="75" rx="19" ry="12" opacity=".55"/>`
      + `<ellipse cx="35" cy="35" rx="8.5" ry="5.5" fill="#fff" opacity=".45" transform="rotate(-35 35 35)"/>`
      + `<circle cx="46.5" cy="27.5" r="2.4" fill="#fff" opacity=".5"/>`;

    // Une pousse sur le crane, sauf si un chapeau ou une couronne prend la place.
    const pousse = surLaTete ? ""
      : `<path class="m-tige" d="M50 21 Q49 15 52 10"/><path class="m-feuille" d="M52 11 Q57 3 66 5 Q62 13 52 11 Z"/>`;

    let yeux, bouche;
    if (humeur === "endormie") {
      yeux = `<path class="m-trait" stroke-width="3" d="M33 53 Q38 58 43 53 M57 53 Q62 58 67 53"/>`;
      bouche = `<ellipse class="m-encre" cx="50" cy="65" rx="2.6" ry="2.1" opacity=".75"/>`;
    } else if (humeur === "ravie") {
      yeux = `<path class="m-trait" stroke-width="3.4" d="M33 55 Q38 47 43 55 M57 55 Q62 47 67 55"/>`;
      bouche = `<path class="m-encre" d="M42.5 61 L57.5 61 Q57.5 72 50 72 Q42.5 72 42.5 61 Z"/>`
        + `<ellipse cx="50" cy="68.8" rx="3.8" ry="2.4" fill="#ef8c7a"/>`;
    } else {
      yeux = `<ellipse class="m-encre" cx="38" cy="53" rx="4.3" ry="5.6"/><ellipse class="m-encre" cx="62" cy="53" rx="4.3" ry="5.6"/>`
        + `<circle cx="39.6" cy="51" r="1.6" fill="#fff"/><circle cx="63.6" cy="51" r="1.6" fill="#fff"/>`;
      bouche = `<path class="m-trait" stroke-width="2.8" d="M45 62 Q50 67 55 62"/>`;
    }
    const visage = `<ellipse class="m-joue" cx="28" cy="64" rx="6" ry="3.6"/><ellipse class="m-joue" cx="72" cy="64" rx="6" ry="3.6"/>`
      + `<g class="m-yeux">${yeux}</g>${bouche}`;

    // Devant le corps : l'accessoire.
    let devant = "";
    if (acc.id === "echarpe") {
      devant = `<path d="M15 68 Q50 86 85 68 L86.5 77 Q50 96 13.5 77 Z" fill="#d9573b"/>`
        + `<path d="M29 74.5 L28.5 83.5 M50 77.5 L50 86.5 M71 74.5 L71.5 83.5" stroke="#f6c7a4" stroke-width="2.6" stroke-linecap="round"/>`
        + `<path d="M60 82 L71 79.5 L74 95 L63.5 97 Z" fill="#b8452f"/>`
        + `<path d="M64.5 97 L64 99.5 M68.8 96.2 L68.8 98.7 M73 95.3 L73.3 97.8" stroke="#b8452f" stroke-width="1.6" stroke-linecap="round"/>`;
    } else if (acc.id === "lunettes") {
      devant = `<g fill="#fff" fill-opacity=".18" stroke="#2b2620" stroke-width="2.6" stroke-linecap="round">`
        + `<circle cx="38" cy="53" r="9"/><circle cx="62" cy="53" r="9"/>`
        + `<path fill="none" d="M47 52 Q50 49.5 53 52 M29.2 51 L16 47 M70.8 51 L84 47"/></g>`;
    } else if (acc.id === "chapeau") {
      devant = `<g transform="rotate(-8 50 22)">`
        + `<ellipse cx="50" cy="23" rx="23" ry="5" fill="#2b2620"/>`
        + `<path d="M37 22 L39 4 Q50 1 61 4 L63 22 Q50 25 37 22 Z" fill="#40382f"/>`
        + `<path d="M37.6 15.5 Q50 18.5 62.4 15.5 L63 22 Q50 25 37 22 Z" fill="#e79a3a"/>`
        + `<path class="m-feuille" d="M58 17 Q63 10 70 12 Q66 18 58 17 Z"/></g>`;
    } else if (acc.id === "couronne") {
      devant = `<g stroke="#b8861a" stroke-width="1.5" stroke-linejoin="round" fill="#f2c230">`
        + `<path d="M32 27 L30 10 L40.5 18.5 L50 6 L59.5 18.5 L70 10 L68 27 Q50 30.5 32 27 Z"/>`
        + `<circle cx="30" cy="10" r="2.6"/><circle cx="50" cy="6" r="2.8"/><circle cx="70" cy="10" r="2.6"/></g>`
        + `<circle cx="50" cy="21.5" r="3" fill="#d9573b"/>`
        + `<circle cx="40" cy="23" r="1.9" fill="#72a6d9"/><circle cx="60" cy="23" r="1.9" fill="#72a6d9"/>`;
    } else if (acc.id === "cape") {
      devant = `<path d="M20 69 Q50 84 80 69" fill="none" stroke="#93361f" stroke-width="2.6" stroke-linecap="round"/>`
        + `<circle cx="50" cy="76.5" r="3.8" fill="#f2c230" stroke="#b8861a" stroke-width="1.3"/>`;
    }

    // Autour : zzz si elle dort, etincelles si elle est doree (grandes tailles seulement).
    let autour = "";
    if (details && humeur === "endormie") {
      autour += `<g class="m-z"><path class="m-trait" stroke-width="2.2" d="M76 18 H83 L76 26 H83"/>`
        + `<path class="m-trait" stroke-width="1.8" d="M86 6 H91 L86 12 H91"/></g>`;
    }
    if (details && coul.id === "dore") {
      autour += `<path class="m-etincelle" d="M90 24.4 L91.6 28.4 L95.6 30 L91.6 31.6 L90 35.6 L88.4 31.6 L84.4 30 L88.4 28.4 Z" fill="#f6dc85" stroke="#c7962a" stroke-width=".8"/>`
        + `<path class="m-etincelle" d="M10 35.8 L11.2 38.8 L14.2 40 L11.2 41.2 L10 44.2 L8.8 41.2 L5.8 40 L8.8 38.8 Z" fill="#f6dc85" stroke="#c7962a" stroke-width=".8"/>`;
    }
    const sol = details ? `<ellipse cx="50" cy="97" rx="27" ry="3" fill="#2b2620" opacity=".1"/>` : "";

    const label = "Mascotte " + coul.adj + " " + humeur + (acc.avec ? ", avec " + acc.avec : "");
    const a11y = o.decoratif ? `aria-hidden="true" focusable="false"` : `role="img" aria-label="${esc(label)}"`;
    const cls = "mascotte humeur-" + humeur + (o.fixe ? " fixe" : "") + (o.saute ? " saute" : "");
    return `<svg class="${cls}" viewBox="0 0 100 100" width="${taille}" height="${taille}" ${a11y}`
      + ` style="--m-corps:${coul.corps};--m-ombre:${coul.ombre};--m-clair:${coul.clair}">`
      + `${sol}<g class="m-saut"><g class="m-balance">${derriere}${corps}${pousse}${visage}${devant}</g></g>${autour}</svg>`;
  }

  function recordGlobal() {
    return State.habits.reduce((m, h) => Math.max(m, best(h.id)), 0);
  }
  function palierAtteint(record) {
    let p = 0;
    M_PALIERS.forEach((x) => { if (x.palier <= record) p = x.palier; });
    return p;
  }
  function prochainPalier(record) {
    for (let i = 0; i < M_PALIERS.length; i++) if (M_PALIERS[i].palier > record) return M_PALIERS[i];
    return null;
  }
  function etatMascotte() {
    const total = State.habits.length;
    const fait = State.habits.filter((h) => isDone(h.id, State.today)).length;
    const humeur = !total || !fait ? "endormie" : fait === total ? "ravie" : "contente";
    return { total: total, fait: fait, humeur: humeur, record: recordGlobal() };
  }
  // Ce qui est reellement porte. Un choix verrouille (record retombe, donnees pas
  // encore synchronisees...) laisse place au defaut, sans que le choix soit oublie.
  function tenueEffective(record) {
    const c = trouverTenue(M_COULEURS, Mascotte.couleur);
    const a = trouverTenue(M_ACCESSOIRES, Mascotte.accessoire);
    return {
      couleur: c && c.palier <= record ? c : M_COULEURS[0],
      accessoire: a && a.palier <= record ? a : M_ACCESSOIRES[0]
    };
  }

  function chargerMascotte() {
    try {
      const d = JSON.parse(localStorage.getItem(MKEY) || "null");
      if (d && typeof d === "object") {
        if (trouverTenue(M_COULEURS, d.couleur)) Mascotte.couleur = d.couleur;
        if (trouverTenue(M_ACCESSOIRES, d.accessoire)) Mascotte.accessoire = d.accessoire;
        if (typeof d.dernierPalier === "number" && isFinite(d.dernierPalier)) Mascotte.dernierPalier = d.dernierPalier;
      }
    } catch (e) { /* stockage illisible : on repart du defaut */ }
    // Premiere visite depuis l'arrivee de la mascotte : les paliers deja acquis
    // sont notes sans toast, sinon on feterait d'un coup des mois de series.
    if (Mascotte.dernierPalier === null) {
      Mascotte.dernierPalier = palierAtteint(recordGlobal());
      sauverMascotte();
    }
  }
  function sauverMascotte() {
    try {
      localStorage.setItem(MKEY, JSON.stringify({
        couleur: Mascotte.couleur, accessoire: Mascotte.accessoire, dernierPalier: Mascotte.dernierPalier
      }));
    } catch (e) { /* ignore */ }
  }

  // Appelee a chaque renderToday. Le toast ne part que si le palier vient d'une
  // coche faite ici : ce qui arrive par la synchro ou au chargement est note en
  // silence (le toast a deja eu lieu sur l'appareil ou l'on a coche).
  function majMascotte(etat) {
    const atteint = palierAtteint(etat.record);
    if (atteint > Mascotte.dernierPalier) {
      const nouveaux = M_PALIERS.filter((p) => p.palier > Mascotte.dernierPalier && p.palier <= etat.record);
      Mascotte.dernierPalier = atteint;
      sauverMascotte();
      if (Mascotte.action && nouveaux.length) afficherToast(nouveaux, etat.record);
    }
    majMascotteEntete(etat);
    Mascotte.action = false;
    Mascotte.saute = false;
  }

  // En-tete : hors des sections, donc jamais recree par les rendus. On ne remplace
  // le SVG que si l'humeur ou la tenue change, pour ne pas relancer ses animations.
  function majMascotteEntete(etat) {
    const el = document.getElementById("mascotte-entete");
    const t = tenueEffective(etat.record);
    const cle = etat.humeur + "|" + t.couleur.id + "|" + t.accessoire.id;
    if (cle !== Mascotte.cleEntete) {
      Mascotte.cleEntete = cle;
      el.innerHTML = mascotteSVG({ humeur: etat.humeur, couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 36, saute: Mascotte.saute });
    } else if (Mascotte.saute && el.firstElementChild) {
      rejouerSaut(el.firstElementChild);
    }
  }
  function rejouerSaut(svg) {
    svg.classList.remove("saute");
    void svg.getBoundingClientRect(); // oblige le navigateur a oublier l'ancien saut
    svg.classList.add("saute");
  }

  function phraseMascotte(etat) {
    if (!etat.total) return "Elle attend une première habitude pour se réveiller.";
    if (etat.humeur === "endormie") return "Elle somnole. Cochez une habitude pour la réveiller.";
    if (etat.humeur === "ravie") return "Journée parfaite : elle est aux anges !";
    const reste = etat.total - etat.fait;
    return "Encore " + reste + " habitude" + (reste > 1 ? "s" : "") + " et la journée est parfaite.";
  }

  // Carte de l'onglet Aujourd'hui, au-dessus de « Réussite, 30 derniers jours ».
  function renderMascotteCarte(etat) {
    const el = document.getElementById("mascotte-carte");
    if (!el) return;
    etat = etat || etatMascotte();
    const t = tenueEffective(etat.record);
    const suivant = prochainPalier(etat.record);
    const recordTxt = "Record : " + etat.record + " jour" + (etat.record > 1 ? "s" : "") + ". "
      + (suivant ? "Prochain cadeau : " + suivant.le + " à " + suivant.palier + " jours." : "Tout est débloqué.");
    el.innerHTML = `
      <div class="mascotte-card-img">${mascotteSVG({ humeur: etat.humeur, couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 120, saute: Mascotte.saute })}</div>
      <div class="mascotte-card-texte">
        <p class="eyebrow">Votre mascotte</p>
        <p class="mascotte-phrase">${esc(phraseMascotte(etat))}</p>
        <p class="mascotte-record">${esc(recordTxt)}</p>
        <button type="button" class="btn" data-action="mascotte-perso">Personnaliser</button>
      </div>`;
    el.querySelector('[data-action="mascotte-perso"]').addEventListener("click", ouvrirMascotte);
  }

  // --- Modale « Personnaliser » -------------------------------------------
  function isMascotteOuverte() { return !document.getElementById("mascotte-modal").hidden; }

  function ouvrirMascotte() {
    if (isModalOpen()) closeAccount();
    Mascotte.retourFocus = document.activeElement;
    masquerToast();
    document.getElementById("mascotte-modal").hidden = false;
    renderMascotteModal();
    const cible = document.querySelector("#mascotte-body input:checked") || document.querySelector("#mascotte-body button");
    if (cible) cible.focus();
  }
  function fermerMascotte() {
    document.getElementById("mascotte-modal").hidden = true;
    // Le bouton d'origine a pu etre redessine (ou le toast avoir disparu) :
    // on retombe alors sur le bouton de la carte, s'il est visible.
    let cible = Mascotte.retourFocus;
    if (!cible || !document.body.contains(cible) || !cible.offsetParent) {
      cible = document.querySelector('[data-action="mascotte-perso"]');
    }
    if (cible && cible.offsetParent) cible.focus();
    Mascotte.retourFocus = null;
  }

  function dessinVignette(couleur, accessoire) {
    return mascotteSVG({ humeur: "contente", couleur: couleur, accessoire: accessoire, taille: 52, fixe: true, decoratif: true });
  }
  function optionTenue(nom, item, choisi, record, dessin, dataAttr) {
    const verrou = item.palier > record;
    const info = verrou ? "Série de " + item.palier + " jours requise" : item.palier ? item.palier + " jours" : "Dès le départ";
    return `<label class="tenue-option${verrou ? " verrouille" : ""}">
        <input class="sr-only" type="radio" name="${nom}" value="${item.id}"${choisi ? " checked" : ""}${verrou ? " disabled" : ""}>
        <span class="tenue-carte">
          <span ${dataAttr}>${dessin}</span>
          <span class="tenue-nom">${esc(item.nom)}</span>
          <span class="tenue-info">${info}</span>
        </span>
      </label>`;
  }

  function renderMascotteModal() {
    const el = document.getElementById("mascotte-body");
    const etat = etatMascotte();
    const t = tenueEffective(etat.record);
    const suivant = prochainPalier(etat.record);

    let progression;
    if (suivant) {
      const pct = Math.min(100, Math.round(etat.record / suivant.palier * 100));
      const manque = suivant.palier - etat.record;
      progression = `
        <div class="goal-head"><span>Prochain : ${esc(suivant.le)}</span><span class="count">${etat.record} / ${suivant.palier} j</span></div>
        <div class="goal-bar-bg" role="progressbar" aria-label="Record vers le prochain palier" aria-valuemin="0" aria-valuemax="${suivant.palier}" aria-valuenow="${etat.record}"><div class="goal-bar" style="width:${pct}%"></div></div>
        <p class="mascotte-note">Il manque ${manque} jour${manque > 1 ? "s" : ""} à votre record pour le débloquer.</p>`;
    } else {
      progression = `<p class="mascotte-note">Tout est débloqué : une série de 365 jours, chapeau bas.</p>`;
    }

    const couleursHtml = M_COULEURS.map((c) =>
      optionTenue("m-couleur", c, c.id === t.couleur.id, etat.record, dessinVignette(c.id, "aucun"), "")).join("");
    const accessoiresHtml = M_ACCESSOIRES.map((a) =>
      optionTenue("m-accessoire", a, a.id === t.accessoire.id, etat.record, dessinVignette(t.couleur.id, a.id), `data-acc="${a.id}"`)).join("");

    el.innerHTML = `
      <h2 id="mascotte-title">Personnaliser la mascotte</h2>
      <p class="p-muted">Les tenues se débloquent avec votre meilleure série, toutes habitudes confondues (record : ${etat.record} jour${etat.record > 1 ? "s" : ""}). Votre choix reste propre à cet appareil.</p>
      <div class="mascotte-apercu" id="mascotte-apercu">${mascotteSVG({ humeur: "contente", couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 140 })}</div>
      <div class="mascotte-progression">${progression}</div>
      <fieldset class="tenue-groupe"><legend>Couleur</legend><div class="tenue-grille">${couleursHtml}</div></fieldset>
      <fieldset class="tenue-groupe"><legend>Accessoire</legend><div class="tenue-grille">${accessoiresHtml}</div></fieldset>
      <div class="modal-actions"><button type="button" class="btn btn-primary" data-act="fermer">Terminé</button></div>`;

    el.querySelectorAll('input[type="radio"]').forEach((inp) => inp.addEventListener("change", () => {
      if (inp.name === "m-couleur") Mascotte.couleur = inp.value; else Mascotte.accessoire = inp.value;
      sauverMascotte();
      majApresChoix(inp.name === "m-couleur");
    }));
    el.querySelector('[data-act="fermer"]').addEventListener("click", fermerMascotte);
  }

  // Apres un choix : on ne redessine que l'apercu, les vignettes d'accessoires
  // (si la couleur a change) et la mascotte hors modale — le focus reste en place.
  function majApresChoix(couleurChangee) {
    const etat = etatMascotte();
    const t = tenueEffective(etat.record);
    document.getElementById("mascotte-apercu").innerHTML =
      mascotteSVG({ humeur: "contente", couleur: t.couleur.id, accessoire: t.accessoire.id, taille: 140 });
    if (couleurChangee) {
      document.querySelectorAll("#mascotte-body [data-acc]").forEach((s) => {
        s.innerHTML = dessinVignette(t.couleur.id, s.dataset.acc);
      });
    }
    renderMascotteCarte(etat);
    majMascotteEntete(etat);
  }

  // --- Toast de deblocage --------------------------------------------------
  function listeFr(mots) {
    if (mots.length < 2) return mots.join("");
    return mots.slice(0, -1).join(", ") + " et " + mots[mots.length - 1];
  }

  function afficherToast(nouveaux, record) {
    const zone = document.getElementById("mascotte-toast");
    const t = tenueEffective(record);
    // Apercu : la tenue actuelle avec les nouveautes enfilees.
    const essai = { couleur: t.couleur.id, accessoire: t.accessoire.id };
    nouveaux.forEach((p) => { essai[p.type] = p.id; });
    const titre = (nouveaux.length > 1 ? "Débloqués : " : "Débloqué : ") + listeFr(nouveaux.map((p) => p.le));
    const palier = nouveaux[nouveaux.length - 1].palier;

    zone.innerHTML = `
      <div class="toast">
        ${mascotteSVG({ humeur: "ravie", couleur: essai.couleur, accessoire: essai.accessoire, taille: 48, decoratif: true })}
        <div class="toast-texte"><strong>${esc(titre)}</strong><span>Série de ${palier} jours atteinte.</span></div>
        <button type="button" class="btn" data-act="essayer">Essayer</button>
        <button type="button" class="btn btn-ghost" data-act="fermer" aria-label="Fermer">×</button>
      </div>`;
    const toast = zone.firstElementChild;
    toast.querySelector('[data-act="essayer"]').addEventListener("click", () => {
      Mascotte.couleur = essai.couleur;
      Mascotte.accessoire = essai.accessoire;
      sauverMascotte();
      const etat = etatMascotte();
      renderMascotteCarte(etat);
      majMascotteEntete(etat);
      ouvrirMascotte();
    });
    toast.querySelector('[data-act="fermer"]').addEventListener("click", masquerToast);
    // Pas de disparition pendant qu'on le survole ou qu'on y est au clavier.
    const pause = () => clearTimeout(Mascotte.toastTimer);
    const reprise = () => { clearTimeout(Mascotte.toastTimer); Mascotte.toastTimer = setTimeout(masquerToast, 4000); };
    toast.addEventListener("mouseenter", pause);
    toast.addEventListener("focusin", pause);
    toast.addEventListener("mouseleave", reprise);
    toast.addEventListener("focusout", reprise);

    requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add("visible")));
    clearTimeout(Mascotte.toastTimer);
    Mascotte.toastTimer = setTimeout(masquerToast, 8000);
  }
  function masquerToast() {
    clearTimeout(Mascotte.toastTimer);
    const zone = document.getElementById("mascotte-toast");
    const toast = zone.firstElementChild;
    if (!toast) return;
    toast.classList.remove("visible");
    setTimeout(() => { if (zone.firstElementChild === toast) zone.innerHTML = ""; }, 300);
  }

  function wireMascotte() {
    const modal = document.getElementById("mascotte-modal");
    modal.addEventListener("click", (ev) => { if (ev.target === modal) fermerMascotte(); });
    document.addEventListener("keydown", (ev) => {
      if (!isMascotteOuverte()) return;
      if (ev.key === "Escape") { ev.preventDefault(); fermerMascotte(); return; }
      if (ev.key !== "Tab") return;
      // Le focus tourne dans la modale au lieu de filer vers la page derriere.
      // Un groupe de boutons radio ne compte qu'une fois : son bouton coche.
      const f = Array.from(modal.querySelectorAll('button:not([disabled]), input[type="radio"]:checked:not([disabled])'));
      if (!f.length) return;
      const dedans = modal.contains(document.activeElement);
      if (ev.shiftKey && (!dedans || document.activeElement === f[0])) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && (!dedans || document.activeElement === f[f.length - 1])) { ev.preventDefault(); f[0].focus(); }
    });
    // Le saut fini, on retire la classe pour pouvoir le rejouer a la prochaine coche.
    document.addEventListener("animationend", (ev) => {
      if (ev.animationName !== "m-saut") return;
      const svg = ev.target.closest ? ev.target.closest("svg") : null;
      if (svg) svg.classList.remove("saute");
    });
  }

  /* =========================================================================
     Compte et synchronisation multi-appareils
     ========================================================================= */

  // Le compte vit dans sa propre cle : « Vider toutes les données » efface les
  // habitudes, pas la session.
  const AKEY = "trak.account.v1";

  const Account = { base: "", token: "", email: "", lastEmail: "", lastSync: 0 };

  // Adresse du serveur. Laissée vide, l'application prend le dossier api/ placé
  // à côté de cette page — le cas normal une fois le site en ligne. À remplir
  // seulement pour ouvrir ce fichier en local (file://) tout en synchronisant,
  // par exemple : "https://exemple.fr/trak/api/".
  const SERVER_URL = "";

  function defaultApiBase() {
    if (SERVER_URL) return SERVER_URL;
    if (location.protocol === "http:" || location.protocol === "https:") {
      return location.href.split(/[?#]/)[0].replace(/[^/]*$/, "") + "api/";
    }
    return "";
  }

  function loadAccount() {
    try {
      const d = JSON.parse(localStorage.getItem(AKEY) || "null");
      if (d) {
        Account.base = d.base || "";
        Account.token = d.token || "";
        Account.email = d.email || "";
        Account.lastEmail = d.lastEmail || "";
        Account.lastSync = d.lastSync || 0;
      }
    } catch (e) { /* ignore */ }
    if (!Account.base) Account.base = defaultApiBase();
  }
  function saveAccount() {
    try { localStorage.setItem(AKEY, JSON.stringify(Account)); } catch (e) { /* ignore */ }
  }
  function forgetSession() {
    Account.token = "";
    Account.email = "";
    Account.lastSync = 0;
    saveAccount();
  }

  async function api(file, payload) {
    if (!Account.base) throw new Error("Adresse du serveur non renseignée.");
    let res;
    try {
      res = await fetch(Account.base.replace(/\/?$/, "/") + file, {
        method: "POST",
        headers: Object.assign(
          { "Content-Type": "application/json" },
          Account.token ? { Authorization: "Bearer " + Account.token } : {}
        ),
        // Le jeton part aussi dans le corps : beaucoup d'hebergements Apache ne
        // transmettent pas l'en-tete Authorization a PHP, et la synchro echouerait
        // silencieusement apres une connexion pourtant reussie.
        body: JSON.stringify(Account.token ? Object.assign({ token: Account.token }, payload) : payload)
      });
    } catch (e) {
      throw new Error("Serveur injoignable. Vérifiez votre connexion ou l'adresse du serveur.");
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* réponse illisible */ }
    if (!res.ok || !data || data.ok !== true) {
      const err = new Error((data && data.error) || ("Erreur du serveur (" + res.status + ")."));
      err.code = (data && data.code) || String(res.status);
      throw err;
    }
    return data;
  }

  // --- Conversion état local <-> format d'échange -------------------------
  function payloadHabit(id) {
    const h = findHabit(id);
    if (h) return { id: h.id, name: h.name, goal: h.goal, pos: h.pos || 0, del: 0, u: h.u || 0 };
    const g = State.gone[id];
    if (g) return { id: id, name: "", goal: 5, pos: 0, del: 1, u: g.u || 0 };
    return null;
  }
  function payloadEntry(k) {
    const i = k.indexOf("|");
    if (i < 0) return null;
    const e = State.log[k];
    const base = { h: k.slice(0, i), d: k.slice(i + 1) };
    if (!e) return { h: base.h, d: base.d, done: 0, note: "", del: 1, u: nowMs() };
    return { h: base.h, d: base.d, done: e.done ? 1 : 0, note: e.note || "", del: e.del ? 1 : 0, u: e.u || 0 };
  }

  // Applique ce que renvoie le serveur. Le serveur a déjà tranché les conflits ;
  // on ne garde le local que s'il est plus récent (modifié pendant l'aller-retour).
  function applyRemote(data) {
    const appliedH = {}, appliedE = {};
    let touched = false;

    (data.habits || []).forEach((rh) => {
      const local = findHabit(rh.id);
      const known = local || State.gone[rh.id];
      if (known && (local ? local.u || 0 : State.gone[rh.id].u || 0) > rh.u) return;
      appliedH[rh.id] = 1; touched = true;
      if (rh.del) {
        if (local) State.habits.splice(State.habits.indexOf(local), 1);
        State.gone[rh.id] = { u: rh.u };
      } else {
        delete State.gone[rh.id];
        if (local) { local.name = rh.name; local.goal = rh.goal; local.pos = rh.pos; local.u = rh.u; }
        else State.habits.push({ id: rh.id, name: rh.name, goal: rh.goal, pos: rh.pos, u: rh.u });
      }
    });

    (data.entries || []).forEach((re) => {
      const k = re.h + "|" + re.d;
      const local = State.log[k];
      if (local && (local.u || 0) > re.u) return;
      appliedE[k] = 1; touched = true;
      if (re.del) delete State.log[k];
      else State.log[k] = { done: !!re.done, note: re.note || "", u: re.u };
    });

    if (touched) {
      State.habits.sort((a, b) => ((a.pos || 0) - (b.pos || 0)) || String(a.id).localeCompare(String(b.id)));
    }
    return { habits: appliedH, entries: appliedE };
  }

  // --- Moteur de synchronisation ------------------------------------------
  const Sync = {
    state: "idle",     // idle | busy | ok | err
    message: "",
    at: 0,
    timer: null,
    running: false,
    again: false
  };

  // Un redessin complet réinitialise les champs de saisie : on attend que
  // l'utilisateur ait fini de taper avant d'afficher ce qui vient du serveur.
  function renderAfterSync() {
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) {
      clearTimeout(Sync.renderTimer);
      Sync.renderTimer = setTimeout(renderAfterSync, 2000);
      return;
    }
    renderAll();
  }

  Sync.setState = function (state, message) {
    Sync.state = state;
    Sync.message = message || "";
    renderAccountButton();
    if (isModalOpen()) renderAccountModal();
  };

  Sync.schedule = function (delay) {
    if (!Account.token) return;
    clearTimeout(Sync.timer);
    Sync.timer = setTimeout(() => { Sync.run(); }, delay == null ? 1200 : delay);
  };

  Sync.run = async function () {
    if (!Account.token) return;
    if (Sync.running) { Sync.again = true; return; }
    Sync.running = true;
    clearTimeout(Sync.timer);
    Sync.setState("busy");

    const sentH = Object.keys(State.dirtyH);
    const sentE = Object.keys(State.dirtyE);
    const stampH = {}, stampE = {};
    sentH.forEach((id) => { stampH[id] = habitStamp(id); });
    sentE.forEach((k) => { stampE[k] = State.log[k] ? State.log[k].u || 0 : 0; });

    try {
      const data = await api("sync.php", {
        since: Account.lastSync,
        habits: sentH.map(payloadHabit).filter(Boolean),
        entries: sentE.map(payloadEntry).filter(Boolean)
      });

      const applied = applyRemote(data);

      // On ne retire de la file d'envoi que ce qui n'a pas rebougé entre-temps.
      sentH.forEach((id) => {
        if (applied.habits[id] || habitStamp(id) === stampH[id]) delete State.dirtyH[id];
      });
      sentE.forEach((k) => {
        const cur = State.log[k] ? State.log[k].u || 0 : 0;
        if (applied.entries[k] || cur === stampE[k]) delete State.dirtyE[k];
      });

      // Compte tout neuf et vide côté serveur : on y envoie les habitudes de
      // cet appareil, sinon elles ne quitteraient jamais le navigateur.
      if (data.first && (data.habits || []).length === 0 && State.habits.length) {
        const t = nowMs();
        State.habits.forEach((h) => { if (!h.u) h.u = t; State.dirtyH[h.id] = 1; });
      }

      // Compte qui a déjà ses habitudes : celles par défaut de cet appareil,
      // jamais touchées (u = 0, aucune coche), sont retirées. Avant, elles
      // portaient les mêmes identifiants que celles du compte et se fondaient
      // dedans ; depuis le changement de la liste par défaut, elles
      // s'ajouteraient en double à celles d'un compte plus ancien.
      if (data.first && (data.habits || []).length) {
        const cochees = new Set(Object.keys(State.log).map((k) => k.split("|")[0]));
        State.habits = State.habits.filter((h) => h.u || State.dirtyH[h.id] || cochees.has(h.id));
        // Celles qu'on garde parce qu'elles ont des coches partent au serveur,
        // sinon ces coches arriveraient sur les autres appareils sans habitude.
        const t = nowMs();
        State.habits.forEach((h) => { if (!h.u) { h.u = t; State.dirtyH[h.id] = 1; } });
      }

      // Les suppressions parties au serveur n'ont plus besoin d'occuper le
      // stockage local : le serveur porte désormais la trace.
      Object.keys(State.log).forEach((k) => {
        if (State.log[k].del && !State.dirtyE[k]) delete State.log[k];
      });

      Account.lastSync = data.now;
      Account.lastEmail = Account.email;
      saveAccount(); persist();
      if (Object.keys(applied.habits).length || Object.keys(applied.entries).length) renderAfterSync();
      Sync.at = Date.now();
      Sync.setState("ok");

      if (Object.keys(State.dirtyH).length || Object.keys(State.dirtyE).length) Sync.schedule(500);
    } catch (e) {
      if (e.code === "unauthorized") {
        forgetSession();
        Sync.setState("err", "Session expirée, reconnectez-vous.");
        renderAccountButton();
      } else {
        Sync.setState("err", e.message);
      }
    } finally {
      Sync.running = false;
      if (Sync.again) { Sync.again = false; Sync.schedule(400); }
    }
  };

  // --- Interface du compte -------------------------------------------------
  const AccountUI = { mode: "login", msg: "", msgType: "", busy: false, devices: null, showServer: false };

  function isModalOpen() { return !document.getElementById("account-modal").hidden; }

  function openAccount(mode) {
    AccountUI.mode = mode || (Account.token ? "account" : "login");
    AccountUI.msg = ""; AccountUI.msgType = ""; AccountUI.busy = false;
    AccountUI.showServer = false;
    document.getElementById("account-modal").hidden = false;
    renderAccountModal();
    if (Account.token) loadDevices();
    const first = document.querySelector("#account-body input");
    if (first) first.focus();
  }
  function closeAccount() {
    document.getElementById("account-modal").hidden = true;
    AccountUI.devices = null;
  }

  function agoText(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 10) return "à l'instant";
    if (s < 60) return "il y a " + s + " s";
    if (s < 3600) return "il y a " + Math.round(s / 60) + " min";
    if (s < 86400) return "il y a " + Math.round(s / 3600) + " h";
    return "il y a " + Math.round(s / 86400) + " j";
  }

  function pendingCount() {
    return Object.keys(State.dirtyH).length + Object.keys(State.dirtyE).length;
  }

  function syncText() {
    if (!Account.token) return "Non connecté";
    if (Sync.state === "busy") return "Synchronisation…";
    if (Sync.state === "err") return Sync.message || "Échec de la synchronisation";
    const pending = pendingCount();
    if (pending) return pending + " modification" + (pending > 1 ? "s" : "") + " en attente";
    if (Sync.at) return "À jour, synchronisé " + agoText(Sync.at);
    return "Connecté";
  }
