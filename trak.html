<style>
  /* Trak — même famille que le portfolio (papier / encre, Syne, Geist, JetBrains Mono) ; la mascotte et ses couleurs restent à Trak. */
  :root {
    --color-bg: #e7e2d7;           /* papier */
    --color-text: #16130f;         /* encre */
    --color-neutral-100: #f3efe6;  /* surfaces : cartes, champs, boutons */
    --color-neutral-200: #ddd7ca;
    --color-neutral-300: #cdc6b5;
    --color-neutral-400: #857e6e;  /* bordures des boutons et champs : 3,1:1 sur le papier */
    --color-neutral-600: #5f5849;  /* texte discret : 5,5:1 sur le papier */
    --color-neutral-700: #4a4438;
    --color-accent-200: #ffe3b0;
    --color-accent-500: #e79a3a;
    --color-accent-700: #8a4f10;  /* orange foncé pour le texte : 5,1:1 sur le papier */
    --color-accent2-200: #d9ecd3;
    --color-accent2-300: #bfe0b4;
    --color-accent2-400: #9ed08d;
    --color-accent2-500: #6fb559;
    --color-accent2-600: #58994a;
    --color-accent2-800: #315e2c;
    --color-accent2-900: #21401e;
    --color-empty-grey: #cfc8b8;
    --color-future-beige: #ddd7ca;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(22,19,15,.07), 0 1px 8px rgba(22,19,15,.05);
    --font-heading: "Syne", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Geist", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--color-accent-700); }
  a:hover { color: var(--color-accent-500); }
  input[type="number"] { -moz-appearance: textfield; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }

  header.app-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px;
    padding: 28px 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  /* La mascotte remplace l'ancien point vert du logo. */
  .brand .mascotte-entete { width: 36px; height: 36px; flex: none; margin: -3px 0; }
  .brand span { font-family: var(--font-heading); font-weight: 800; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--color-neutral-400); background: var(--color-neutral-100);
    color: var(--color-text); border-radius: 999px; padding: 11px 16px;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: var(--color-accent-200); border-color: var(--color-accent-200); }
  .btn.active { background: var(--color-text); border-color: var(--color-text); color: var(--color-neutral-100); }
  .btn-primary {
    background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: var(--color-text);
  }
  .btn-primary:hover { background: var(--color-accent2-600); }
  .btn-ghost { border: none; background: none; padding: 10px 10px; }
  .btn-ghost:hover { background: var(--color-accent-200); }

  .divider { height: 2px; background: var(--color-text); margin-bottom: 30px; }

  .input {
    font-family: var(--font-body); font-size: 14px; border: 1px solid var(--color-neutral-400);
    border-radius: 999px; padding: 10px 16px; background: var(--color-neutral-100); color: var(--color-text);
  }
  .input:focus { outline: 2px solid var(--color-accent2-800); outline-offset: 1px; }
  /* Focus clavier visible sur les boutons, liens et cases (pas au clic souris). */
  :focus-visible { outline: 2px solid var(--color-accent2-800); outline-offset: 2px; }

  .card {
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 20px 22px;
  }
  .card, .habit-row, .mascotte-card, .note-card, .streak-card, .manage-row, .modal, .visite-bulle { border: 1px solid var(--color-neutral-300); }

  /* ---- Today ---- */
  .today-grid { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 40px; align-items: start; }
  .eyebrow { margin: 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-600); }
  /* Pas de chiffres en Syne (son « 1 » ressemble a un « I ») : ces titres passent en Geist. */
  h1.big, h1.num, h2.num { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.02em; text-transform: none; }
  h1.big { font-size: 34px; margin: 6px 0 4px; }
  .summary { font-size: 15px; color: var(--color-neutral-700); margin: 0 0 24px; }

  .habit-row { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 14px 18px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
  .habit-row .top { display: flex; align-items: center; gap: 14px; }
  .check {
    width: 34px; height: 34px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 15px; border: 1px solid var(--color-neutral-400); background: transparent; color: transparent;
    transition: background .15s, border-color .15s;
  }
  .check.done { background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: var(--color-accent2-900); }
  .habit-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .habit-meta { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  .note-toggle { margin-left: auto; white-space: nowrap; }
  .note-input { margin-top: 12px; width: 100%; }

  aside.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .stat-card { background: var(--color-accent2-200); border-radius: var(--radius-lg); padding: 22px 24px; }
  .stat-card .eyebrow { color: var(--color-accent2-800); }
  .stat-card .big-num { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; font-size: 46px; line-height: 1; margin-top: 8px; color: var(--color-accent2-900); }

  .goal-item { margin-bottom: 14px; }
  .goal-item:last-child { margin-bottom: 0; }
  .goal-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
  .goal-head .count { color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .goal-bar-bg { height: 8px; border-radius: 999px; background: var(--color-neutral-300); overflow: hidden; }
  .goal-bar { height: 100%; border-radius: 999px; background: var(--color-accent-500); }
  .goal-bar.full { background: var(--color-accent2-500); }

  /* ---- Mascotte ---- */
  /* Les couleurs arrivent par les variables --m-corps / --m-ombre / --m-clair
     posees sur chaque <svg> : un seul dessin pour toutes les teintes. */
  .mascotte { display: block; overflow: visible; }
  .mascotte .m-corps { fill: var(--m-corps); }
  .mascotte .m-ombre { fill: var(--m-ombre); }
  .mascotte .m-clair { fill: var(--m-clair); }
  .mascotte .m-encre { fill: var(--color-text); }
  .mascotte .m-trait { fill: none; stroke: var(--color-text); stroke-linecap: round; stroke-linejoin: round; }
  .mascotte .m-joue { fill: #ef8c7a; opacity: .45; }
  .mascotte.humeur-ravie .m-joue { opacity: .75; }
  .mascotte.humeur-endormie .m-joue { opacity: .3; }
  .mascotte .m-tige { fill: none; stroke: var(--color-accent2-800); stroke-width: 2.4; stroke-linecap: round; }
  .mascotte .m-feuille { fill: var(--color-accent2-400); stroke: var(--color-accent2-800); stroke-width: 1.6; stroke-linejoin: round; }
  /* Balancement lent, clignement rare : on doit a peine le remarquer. */
  .mascotte .m-balance { transform-box: view-box; transform-origin: 50% 94%; animation: m-balance 4.8s ease-in-out infinite; }
  .mascotte.humeur-ravie .m-balance { animation-duration: 3.2s; }
  .mascotte.humeur-endormie .m-balance { animation: m-souffle 3.6s ease-in-out infinite; }
  .mascotte.humeur-contente .m-yeux { transform-box: fill-box; transform-origin: center; animation: m-cligne 5.5s infinite; }
  .mascotte .m-z { opacity: .7; animation: m-z 3.6s ease-in-out infinite; }
  .mascotte .m-etincelle { animation: m-scintille 2.6s ease-in-out infinite; }
  .mascotte .m-etincelle + .m-etincelle { animation-delay: 1.3s; }
  /* Petit saut quand on coche une habitude. */
  .mascotte .m-saut { transform-box: view-box; transform-origin: 50% 96%; }
  .mascotte.saute .m-saut { animation: m-saut .55s cubic-bezier(.3,.7,.4,1); }
  .mascotte.fixe * { animation: none; }
  @keyframes m-balance { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes m-souffle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.975); } }
  @keyframes m-cligne { 0%,90%,96%,100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }
  @keyframes m-z { 0% { opacity: 0; transform: translate(0,4px); } 30%,70% { opacity: .75; } 100% { opacity: 0; transform: translate(4px,-6px); } }
  @keyframes m-scintille { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes m-saut {
    0% { transform: none; }
    25% { transform: translateY(-9px) scale(.96,1.05); }
    50% { transform: translateY(0) scale(1.08,.92); }
    70% { transform: scale(.97,1.03); }
    100% { transform: none; }
  }

  .mascotte-card {
    background: var(--color-neutral-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  }
  .mascotte-card-img { flex: none; width: 120px; height: 120px; }
  .mascotte-card-texte { flex: 1; min-width: 150px; }
  .mascotte-phrase { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 6px 0 4px; }
  .mascotte-record { font-size: 13px; color: var(--color-neutral-600); margin: 0 0 12px; line-height: 1.4; }

  /* Modale « Personnaliser » */
  .modal.modal-large { max-width: 540px; }
  .mascotte-apercu {
    display: flex; justify-content: center; padding: 14px 0 10px; margin-bottom: 16px;
    background: var(--color-accent2-200); border-radius: var(--radius-lg);
  }
  .mascotte-progression { margin-bottom: 4px; }
  .mascotte-progression .count { white-space: nowrap; }
  .mascotte-note { font-size: 12px; color: var(--color-neutral-600); margin: 6px 0 0; }
  .tenue-groupe { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
  .tenue-groupe legend {
    padding: 0; margin-bottom: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--color-neutral-600);
  }
  .tenue-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tenue-option { position: relative; display: block; cursor: pointer; }
  .tenue-carte {
    display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%;
    padding: 8px 6px 10px; border: 1px solid var(--color-neutral-300); border-radius: 14px;
    text-align: center; transition: background .15s, border-color .15s;
  }
  .tenue-option:hover .tenue-carte { background: var(--color-neutral-200); }
  .tenue-option input:checked + .tenue-carte {
    background: var(--color-accent2-200); border-color: var(--color-accent2-600);
    box-shadow: inset 0 0 0 1px var(--color-accent2-600);
  }
  .tenue-option input:focus-visible + .tenue-carte { outline: 2px solid var(--color-accent2-600); outline-offset: 2px; }
  .tenue-nom { font-size: 13px; font-weight: 600; }
  .tenue-info { font-size: 11px; line-height: 1.3; color: var(--color-neutral-600); }
  .tenue-option.verrouille { cursor: not-allowed; }
  .tenue-option.verrouille:hover .tenue-carte { background: none; }
  .tenue-option.verrouille .mascotte { filter: grayscale(1); opacity: .45; }
  .tenue-option.verrouille .tenue-nom { color: var(--color-neutral-600); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Toast de deblocage */
  .toast-zone {
    position: fixed; left: 0; right: 0; bottom: 20px; z-index: 60;
    display: flex; justify-content: center; padding: 0 16px; pointer-events: none;
  }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 460px;
    background: var(--color-text); color: var(--color-neutral-100);
    border-radius: var(--radius-lg); padding: 10px 10px 10px 12px;
    box-shadow: 0 10px 40px rgba(43,38,32,.22);
    opacity: 0; transform: translateY(12px); transition: opacity .25s, transform .25s;
  }
  .toast.visible { opacity: 1; transform: none; }
  .toast .mascotte { flex: none; }
  .toast-texte { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; }
  .toast-texte strong { display: block; font-size: 14px; }
  .toast-texte span { color: var(--color-neutral-300); }
  .toast .btn-ghost { color: var(--color-neutral-100); font-size: 18px; line-height: 1; padding: 6px 10px; }
  .toast .btn-ghost:hover { color: var(--color-text); }

  /* Visite guidee : un "trou" lumineux autour de l'element explique (son
     ombre geante assombrit tout le reste) et une bulle de texte a cote. */
  .aide-btn { width: 38px; height: 38px; padding: 0; font-size: 15px; display: grid; place-items: center; }
  .visite { position: fixed; inset: 0; z-index: 70; }
  .visite[hidden] { display: none; }
  .visite.sans-cible { background: rgba(43,38,32,.55); }
  .visite-trou {
    position: fixed; border-radius: var(--radius-lg); pointer-events: none;
    box-shadow: 0 0 0 3px var(--color-accent-500), 0 0 0 9999px rgba(43,38,32,.55);
    transition: top .3s ease, left .3s ease, width .3s ease, height .3s ease;
  }
  .visite.sans-cible .visite-trou { display: none; }
  .visite-bulle {
    position: fixed; width: min(360px, calc(100vw - 32px));
    background: var(--color-neutral-100); border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(43,38,32,.28); padding: 20px 20px 16px;
    transition: top .3s ease, left .3s ease;
  }
  .visite-bulle:focus { outline: none; }
  .visite-bulle .mascotte { display: block; margin: -4px auto 8px; }
  .visite-etape { font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 6px; }
  .visite-bulle h2 { font-size: 18px; margin: 0 0 6px; }
  .visite-bulle p.visite-texte { font-size: 14px; line-height: 1.5; color: var(--color-neutral-700); margin: 0; }
  .visite-points { display: flex; gap: 5px; margin: 16px 0 0; }
  .visite-points span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-neutral-300); }
  .visite-points span.actif { background: var(--color-accent-500); width: 16px; border-radius: 3px; }
  .visite-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .visite-actions .spacer { margin-left: auto; }
  .visite-actions .btn-ghost { color: var(--color-neutral-700); }
  @media (max-width: 560px) {
    /* Sur telephone la bulle se pose en bas de l'ecran, pleine largeur. */
    .visite-bulle { left: 16px !important; right: 16px; top: auto !important; bottom: calc(16px + env(safe-area-inset-bottom)); width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .visite-trou, .visite-bulle { transition: none; }
  }

  /* ---- Week ---- */
  .week-head-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .week-head-row h1 { margin: 0; margin-right: auto; }
  .week-table-wrap { overflow-x: auto; }
  .week-table {
    display: grid; grid-template-columns: minmax(130px,1fr) repeat(7, 42px) 64px;
    gap: 8px; align-items: center; min-width: 600px;
  }
  .week-table .colhead { text-align: center; }
  .week-table .colhead .dow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-600); }
  .week-table .colhead .daynum { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .week-table .rowname { font-size: 14px; font-weight: 600; padding-right: 6px; }
  .week-table .total { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--color-neutral-700); }
  .week-cell {
    width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--color-neutral-400);
    background: transparent; color: transparent; cursor: pointer; font-size: 14px;
  }
  .week-cell.done { background: var(--color-accent2-500); border-color: var(--color-accent2-600); color: var(--color-accent2-900); }
  .week-cell.future { border-style: dashed; border-color: var(--color-neutral-300); cursor: default; }
  .week-hint { font-size: 13px; color: var(--color-neutral-600); margin-top: 12px; }

  .note-card { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 14px 18px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 10px; }
  .note-when { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-600); min-width: 100px; }
  .note-name { font-size: 14px; font-weight: 600; }
  .note-text { font-size: 14px; color: var(--color-neutral-700); flex: 1; min-width: 180px; }

  /* ---- Year ---- */
  .year-card { padding: 24px; overflow-x: auto; }
  .year-inner { min-width: 760px; }
  .month-row { display: flex; gap: 3px; margin-bottom: 6px; }
  .month-label { width: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--color-neutral-600); white-space: nowrap; overflow: visible; }
  .year-grid { display: flex; gap: 3px; }
  .year-col { display: flex; flex-direction: column; gap: 3px; }
  .year-cell { width: 12px; height: 12px; border-radius: 4px; background: var(--color-neutral-200); }
  .legend-row { display: flex; align-items: center; gap: 7px; margin-top: 18px; font-size: 12px; color: var(--color-neutral-600); flex-wrap: wrap; }
  .legend-cell { width: 12px; height: 12px; border-radius: 4px; }
  .legend-note { margin-left: 8px; }

  .streak-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; margin-top: 20px; }
  .streak-card { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .streak-card .name { font-size: 14px; font-weight: 600; }
  .streak-card .num { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; font-size: 30px; line-height: 1.1; margin-top: 6px; color: var(--color-accent-700); }
  .streak-card .detail { font-size: 12px; color: var(--color-neutral-600); }

  /* ---- Manage ---- */
  .manage-wrap { max-width: 620px; }
  .manage-row { background: var(--color-neutral-100); border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .manage-row .input:first-child { flex: 1; min-width: 160px; }
  .manage-row .goal-input { width: 68px; text-align: center; }
  .manage-unit { font-size: 12px; color: var(--color-neutral-600); }

  /* Objectif de temps */

  /* Competitions */
  .compet-carte .compet-j { font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; font-size: 40px; line-height: 1; margin-top: 8px; }

  .compet-form .input { height: 42px; }
  .compet-form .field-nom:last-of-type { grid-column: 1 / -1; }

  .ev-choix { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 10px; border: 1px solid var(--color-neutral-300); border-radius: 999px; cursor: pointer; }
  .ev-choix:hover { background: var(--color-neutral-200); }
  .ev-choix input { width: 16px; height: 16px; margin: 0; accent-color: var(--color-accent2-600); }
  .ev-choix:has(input:checked) { background: var(--color-accent2-200); border-color: var(--color-accent2-600); }

  /* Fiche pour l'entraineur : invisible a l'ecran, seule visible a l'impression. */
  #fiche { color: #000; background: #fff; font-family: var(--font-body); }

  #fiche td { border-bottom: 1px solid #ccc; padding: 6px 6px 6px 0; vertical-align: top; }

  .histo td { white-space: nowrap; }

  .pied { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--color-neutral-300);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

  /* ---- Compte & synchronisation ---- */
  .account-btn { display: flex; align-items: center; gap: 8px; }
  .account-btn .who { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--color-neutral-400); flex: none; }
  .sync-dot.ok { background: var(--color-accent2-500); }
  .sync-dot.busy { background: var(--color-accent-500); animation: sync-pulse 1s ease-in-out infinite; }
  .sync-dot.err { background: #c0532c; }
  @keyframes sync-pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  /* Si le système demande moins d'animations : plus de clignotement pendant la synchro,
     mascotte immobile (ni balancement, ni clignement, ni saut) et toast sans glissement.
     Les transitions de couleur (0,15 s) restent, elles aident à voir ce qui change. */
  @media (prefers-reduced-motion: reduce) {
    .sync-dot.busy { animation: none; opacity: .6; }
    .mascotte, .mascotte * { animation: none !important; }
    .toast { transform: none; transition: opacity .15s; }
  }

  .modal-backdrop {

  .field .input { width: 100%; }

  .form-msg { font-size: 13px; line-height: 1.45; margin: 14px 0 0; }

  .form-msg.ok { color: var(--color-accent2-800); }
  .switch-mode { font-size: 13px; color: var(--color-neutral-700); margin: 16px 0 0; }
  .switch-mode button {
    background: none; border: 0; padding: 0; font: inherit; font-weight: 600;
    color: var(--color-accent-700); cursor: pointer; text-decoration: underline;
  }
  .sync-line { font-size: 13px; color: var(--color-neutral-700); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .device-list { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .device-list li { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--color-neutral-200); color: var(--color-neutral-700); }

  h1, h2 { font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1.08; }

  h2 { font-size: 20px; margin: 34px 0 14px; }

  /* ---- Responsive ---- */
  @media (max-width: 860px) {
    .today-grid { grid-template-columns: 1fr; }
    aside.side { position: static; }
  }
  /* Avec la carte mascotte, la colonne de droite depasse la hauteur des petits

  @media (max-height: 760px) {
    aside.side { position: static; }
  }
  @media (max-width: 560px) {
    /* Telephone : les onglets passent dans une barre fixee en bas, a portee de pouce (comme une

    .wrap { padding: 0 14px calc(96px + env(safe-area-inset-bottom)); }
    header.app-header { padding: calc(14px + env(safe-area-inset-top)) 0 12px; gap: 10px; flex-wrap: nowrap; }
    .divider { margin-bottom: 20px; }

      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0;

      color: var(--color-neutral-600); white-space: nowrap;

    /* Onglet actif : texte en encre et en gras, petit trait vert au-dessus (pas de pastille : « Aujourd'hui » n'y tiendrait pas). */
    nav.tabs .btn.active { background: none; color: var(--color-text); font-weight: 700; }
    nav.tabs .btn.active::before {

      background: var(--color-accent2-600);

    .stat-card { padding: 16px; }
    .stat-card .big-num { font-size: 32px; }
    .stat-card .stat-detail { font-size: 12px; }
    .compet-carte .compet-j { font-size: 32px; }
    /* Annee : les series sur deux colonnes. */
    .streak-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  }

<script>
(function () {
  "use strict";

  // Habitudes de depart d'un nageur. dist = 1 : on y note aussi les metres nages.
  // Identifiants nouveaux (prefixe n-) : Sync.run retire celles qu'on n'a jamais
  // touchees quand on rejoint un compte qui a deja ses habitudes.
  const DEFAULT_HABITS = [
    { id: "n-seance", name: "Séance de natation", goal: 5, dist: 1 },
    { id: "n-prepa", name: "Prépa physique / gainage", goal: 3 },
    { id: "n-etirements", name: "Étirements", goal: 5 },
    { id: "n-sommeil", name: "Dormir 8 h ou plus", goal: 6 },
    { id: "n-eau", name: "Boire 1,5 L d'eau", goal: 7 }
  ];

  // Epreuves officielles, regroupees par nage. Identifiant = "<distance>-<nage>".
  const NAGES = [
    { id: "nl", nom: "nage libre", distances: [50, 100, 200, 400, 800, 1500] },
    { id: "dos", nom: "dos", distances: [50, 100, 200] },
    { id: "br", nom: "brasse", distances: [50, 100, 200] },
    { id: "pap", nom: "papillon", distances: [50, 100, 200] },
    { id: "4n", nom: "4 nages", distances: [100, 200, 400] }
  ];
  const EPREUVES = [];
  NAGES.forEach((n) => n.distances.forEach((d) => EPREUVES.push({ id: d + "-" + n.id, nage: n.id, nom: d + " m " + n.nom })));
  function nomEpreuve(id) {
    const e = EPREUVES.find((x) => x.id === id);
    return e ? e.nom : id;
  }
  const DOW = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
  const DOW_LONG = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const KEY = "cadence-vierge.v1";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function ymd(d) {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) {
    const x = new Date(d.getTime());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function nowMs() { return Date.now(); }

  function defaultHabits() {
    return DEFAULT_HABITS.map((h, i) => ({ id: h.id, name: h.name, goal: h.goal, dist: h.dist || 0, pos: i, u: 0 }));
  }

  // --- Temps de course : centiemes <-> texte ------------------------------
  // Accepte « 1:05.32 », « 1'05"32 », « 65,32 », « 32.4 » (dixiemes) ou « 28 ».
  function parseTemps(s) {
    const m = String(s || "").trim().match(/^(?:(\d{1,2})\s*[:'h]\s*)?(\d{1,2})(?:\s*[.,"]\s*(\d{1,2}))?$/);
    if (!m) return null;
    const min = Number(m[1] || 0), sec = Number(m[2]);
    if (m[1] && sec > 59) return null;
    const cs = m[3] ? (m[3].length === 1 ? Number(m[3]) * 10 : Number(m[3])) : 0;
    const t = (min * 60 + sec) * 100 + cs;
    return t > 0 && t <= 360000 ? t : null;
  }
  function formatTemps(t) {
    const p = (n) => String(n).padStart(2, "0");
    const min = Math.floor(t / 6000), sec = Math.floor((t % 6000) / 100), cs = t % 100;
    return min ? min + ":" + p(sec) + "." + p(cs) : sec + "." + p(cs);
  }
  // Ecart en secondes, signe explicite : « −0.84 s » (plus rapide) ou « +1.20 s ».
  function formatEcart(cs) {
    const s = (Math.abs(cs) / 100).toFixed(2);
    return (cs < 0 ? "−" : cs > 0 ? "+" : "±") + s + " s";
  }
  function formatDistance(m) {
    if (m < 1000) return m + " m";
    return (m / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " km";
  }
  function dateCourte(day) {
    const d = new Date(day + "T12:00:00");
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }

  const State = {
    tab: "today",
    today: ymd(new Date()),
    weekOffset: 0,
    openNote: null,
    newName: "",
    habits: defaultHabits(),
    log: {},
    // Habitudes supprimees : { id: { u } }. Conservees pour que la suppression
    // se propage aux autres appareils au lieu d'etre "reparee" par eux.
    gone: {},
    // Chronos : { id: { ev, pool, t (centiemes), d, comp, lieu, u } } ; { del: 1, u } une fois supprime.
    times: {},
    // Objectifs (k: "obj", data: { t }) et competitions (k: "comp", data: { nom, d, lieu, pool, evs }).
    items: {},
    chrono: { sel: "", ev: "100-nl", pool: 25, comp: 1, msg: "", msgType: "", brouillon: null, objMsg: "", objMsgType: "", compMsg: "", compOuvert: false },
    // Ce qui reste a envoyer au serveur.
    dirtyH: {},
    dirtyE: {},
    dirtyT: {},
    dirtyI: {}
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.habits && d.log) {
          State.habits = d.habits;
          State.log = d.log;
          State.gone = d.gone || {};
          State.dirtyH = d.dirtyH || {};
          State.dirtyE = d.dirtyE || {};
          State.times = d.times || {};
          State.dirtyT = d.dirtyT || {};
          State.items = d.items || {};
          State.dirtyI = d.dirtyI || {};
          if (!d.v) migrateToSync();
          return;
        }
      }
    } catch (e) { /* stockage indisponible */ }
    State.log = {};
    persist();
  }

  // Donnees enregistrees avant l'arrivee de la synchronisation : on les horodate
  // maintenant et on les marque a envoyer, pour qu'elles remontent au compte.
  function migrateToSync() {
    const t = nowMs();
    State.habits.forEach((h, i) => {
      if (h.pos == null) h.pos = i;
      h.u = t;
      State.dirtyH[h.id] = 1;
    });
    Object.keys(State.log).forEach((k) => { State.log[k].u = t; State.dirtyE[k] = 1; });
    persist();
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        v: 2,
        habits: State.habits, log: State.log, gone: State.gone, times: State.times, items: State.items,
        dirtyH: State.dirtyH, dirtyE: State.dirtyE, dirtyT: State.dirtyT, dirtyI: State.dirtyI
      }));
    } catch (e) { /* ignore */ }
  }

  function findHabit(id) {
    for (let i = 0; i < State.habits.length; i++) if (State.habits[i].id === id) return State.habits[i];
    return null;
  }
  function habitStamp(id) {
    const h = findHabit(id);
    if (h) return h.u || 0;
    return State.gone[id] ? State.gone[id].u || 0 : 0;
  }
  function nextPos() {
    return State.habits.reduce((m, h) => Math.max(m, h.pos || 0), -1) + 1;
  }
  // Marque une habitude comme modifiee localement et programme l'envoi.
  function touchHabit(h) {
    h.u = nowMs();
    State.dirtyH[h.id] = 1;
    persist(); Sync.schedule();
  }

  function isDone(id, day) { const e = State.log[id + "|" + day]; return !!(e && e.done); }
  function toggle(id, day) {
    const k = id + "|" + day;
    const prev = State.log[k];
    State.log[k] = { done: !(prev && prev.done), note: prev ? prev.note || "" : "", m: prev ? prev.m || 0 : 0, u: nowMs() };
    State.dirtyE[k] = 1;
    // La mascotte saute quand on coche, et un palier franchi ici merite un toast.
    Mascotte.action = true;
    Mascotte.saute = State.log[k].done;
    persist(); Sync.schedule(); render();
  }
  function setNote(id, day, note) {
    const k = id + "|" + day;
    const prev = State.log[k] || { done: false, note: "" };
    State.log[k] = { done: prev.done, note: note, m: prev.m || 0, u: nowMs() };
    State.dirtyE[k] = 1;
    persist(); Sync.schedule();
  }
  // Distance nagee d'une seance. Saisir des metres coche la seance ; les effacer
  // ne la decoche pas (on a pu nager sans compter).
  function setMeters(id, day, m) {
    const k = id + "|" + day;
    const prev = State.log[k] || { done: false, note: "" };
    const metres = Math.max(0, Math.min(100000, Math.round(Number(m) || 0)));
    const coche = !prev.done && metres > 0;
    State.log[k] = { done: prev.done || metres > 0, note: prev.note || "", m: metres, u: nowMs() };
    State.dirtyE[k] = 1;
    if (coche) { Mascotte.action = true; Mascotte.saute = true; }
    persist(); Sync.schedule(); render();
  }
  function metersOf(id, day) { const e = State.log[id + "|" + day]; return e && e.m ? e.m : 0; }
  // Metres nages sur [debut, debut + n jours[, toutes habitudes « distance » confondues.
  function volume(debut, n) {
    let total = 0, seances = 0;
    for (let i = 0; i < n; i++) {
      const day = ymd(addDays(debut, i));
      State.habits.forEach((h) => {
        if (!h.dist) return;
        const m = metersOf(h.id, day);
        if (m) { total += m; seances++; }
      });
    }
    return { total: total, seances: seances };
  }

  function streak(id) {
    const t = new Date(State.today + "T12:00:00");
    let n = 0;
    let start = isDone(id, ymd(t)) ? 0 : 1;
    if (start === 1 && !isDone(id, ymd(addDays(t, -1)))) return 0;
    for (let i = start; i < 400; i++) {
      if (isDone(id, ymd(addDays(t, -i)))) n++; else break;
    }
    return n;
  }
  function best(id) {
    const t = new Date(State.today + "T12:00:00");
    let n = 0, m = 0;
    for (let i = 365; i >= 0; i--) {
      if (isDone(id, ymd(addDays(t, -i)))) { n++; if (n > m) m = n; } else n = 0;
    }
    return m;
  }
  function heatColor(ratio) {
    if (ratio === 0) return "var(--color-empty-grey)";
    if (ratio < 0.34) return "var(--color-accent2-200)";
    if (ratio < 0.67) return "var(--color-accent2-300)";
    if (ratio < 1) return "var(--color-accent2-400)";
    return "var(--color-accent2-600)";
  }

  function renderTabs() {
    document.querySelectorAll(".tabs .btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === State.tab);
    });
    ["today", "week", "year", "chronos", "manage"].forEach((t) => {
      document.getElementById("view-" + t).style.display = t === State.tab ? "" : "none";
    });
    if (State.tab === "year") caleAnnee();
  }

  function renderToday() {
    const el = document.getElementById("view-today");
    const today = new Date(State.today + "T12:00:00");
    const doneToday = State.habits.filter((h) => isDone(h.id, State.today)).length;
    const weekday = DOW_LONG[(today.getDay() + 6) % 7];

    let hit = 0, tot = 0;
    for (let i = 0; i < 30; i++) {
      const day = ymd(addDays(today, -i));
      State.habits.forEach((h) => { tot++; if (isDone(h.id, day)) hit++; });
    }
    const pct30 = (tot ? Math.round(hit / tot * 100) : 0) + " %";

    const monday = mondayOf(today);
    const goalsHtml = State.habits.map((h) => {
      let c = 0;
      for (let i = 0; i < 7; i++) if (isDone(h.id, ymd(addDays(monday, i)))) c++;
      const pct = Math.min(100, Math.round(c / Math.max(1, h.goal) * 100));
      return `<div class="goal-item">
        <div class="goal-head"><span>${esc(h.name)}</span><span class="count">${c} / ${h.goal}</span></div>
        <div class="goal-bar-bg"><div class="goal-bar${pct >= 100 ? " full" : ""}" style="width:${pct}%"></div></div>
      </div>`;
    }).join("");

    const rowsHtml = State.habits.map((h) => {
      const entry = State.log[h.id + "|" + State.today] || { done: false, note: "" };
      const st = streak(h.id);
      const meta = st > 0 ? "Série de " + st + " jour" + (st > 1 ? "s" : "") : "Série interrompue";
      const noteOpen = State.openNote === h.id || !!entry.note;
      const metres = h.dist
        ? `<label class="metres">Distance <input class="input" type="number" inputmode="numeric" min="0" max="100000" step="100" placeholder="0" data-action="metres" data-id="${esc(h.id)}" value="${entry.m || ""}"> m</label>`
        : "";
      return `<div class="habit-row" data-id="${esc(h.id)}">
        <div class="top">
          <button type="button" class="check${entry.done ? " done" : ""}" data-action="toggle" data-id="${esc(h.id)}" aria-label="Marquer comme fait">${entry.done ? "✓" : ""}</button>
          <div style="flex:1;min-width:0">
            <div class="habit-name">${esc(h.name)}</div>
            <div class="habit-meta">${meta}</div>
            ${metres}
          </div>
          <button type="button" class="btn btn-ghost note-toggle" data-action="note-toggle" data-id="${esc(h.id)}">${entry.note ? "Note" : "+ note"}</button>
        </div>
        ${noteOpen ? `<input class="input note-input" type="text" placeholder="Note du jour" data-action="note-input" data-id="${esc(h.id)}" value="${esc(entry.note || "")}">` : ""}
      </div>`;
    }).join("");

    el.innerHTML = `
      <div class="today-grid">
        <div>
          <p class="eyebrow">${esc(weekday)}</p>
          <h1 class="big">${today.getDate()} ${MONTHS[today.getMonth()]}</h1>
          <p class="summary">${doneToday} sur ${State.habits.length} coché${doneToday > 1 ? "es" : "e"} aujourd'hui.</p>
          <div>${rowsHtml || "<p class=\"p-muted\">Aucune habitude. Ajoutez-en depuis l'onglet Habitudes.</p>"}</div>
        </div>
        <aside class="side">
          <div class="mascotte-card" id="mascotte-carte"></div>
          ${competCarte()}
          <div class="stat-card">
            <p class="eyebrow">Réussite, 30 derniers jours</p>
            <div class="big-num">${pct30}</div>
          </div>
          ${volumeCarte(monday)}
          <div class="card">
            <p class="eyebrow" style="margin:0 0 16px">Objectifs de la semaine</p>
            ${goalsHtml || "<p class=\"p-muted\" style=\"margin:0\">—</p>"}
          </div>
        </aside>
      </div>`;

    el.querySelectorAll('[data-action="toggle"]').forEach((b) => b.addEventListener("click", () => toggle(b.dataset.id, State.today)));
    el.querySelectorAll('[data-action="note-toggle"]').forEach((b) => b.addEventListener("click", () => {
      State.openNote = State.openNote === b.dataset.id ? null : b.dataset.id;
      renderToday();
    }));
    el.querySelectorAll('[data-action="note-input"]').forEach((inp) => {
      inp.addEventListener("change", () => setNote(inp.dataset.id, State.today, inp.value));
    });
    el.querySelectorAll('[data-action="metres"]').forEach((inp) => {
      inp.addEventListener("change", () => setMeters(inp.dataset.id, State.today, inp.value));
    });

    // renderToday passe apres chaque changement (coche, ajout, suppression,
    // renommage) : c'est ici qu'on tient la mascotte a jour, carte et en-tete.
    const etat = etatMascotte();
    renderMascotteCarte(etat);
    majMascotte(etat);
  }

  // Carte « Nagé cette semaine », seulement s'il existe une habitude qui compte les metres.
  function volumeCarte(monday) {
    if (!State.habits.some((h) => h.dist)) return "";
    const v = volume(monday, 7);
    const avant = volume(addDays(monday, -7), 7).total;
    const comp = avant ? "Semaine dernière : " + formatDistance(avant) + "." : "";
    return `<div class="stat-card">
        <p class="eyebrow">Nagé cette semaine</p>
        <div class="big-num">${formatDistance(v.total)}</div>
        <p class="stat-detail">${v.seances} séance${v.seances > 1 ? "s" : ""} avec distance. ${comp}</p>
      </div>`;
  }

  function renderWeek() {
    const el = document.getElementById("view-week");
    const today = new Date(State.today + "T12:00:00");
    const monday = mondayOf(today);
    const wStart = addDays(monday, State.weekOffset * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) weekDays.push(ymd(addDays(wStart, i)));

    const headsHtml = DOW.map((d, i) => {
      const dn = addDays(wStart, i).getDate();
      return `<div class="colhead"><div class="dow">${d}</div><div class="daynum">${dn}</div></div>`;
    }).join("");

    const rowsHtml = State.habits.map((h) => {
      let c = 0;
      const cellsHtml = weekDays.map((day) => {
        const done = isDone(h.id, day);
        if (done) c++;
        const future = day > State.today;
        const cls = done ? "done" : future ? "future" : "";
        const m = h.dist ? metersOf(h.id, day) : 0;
        return `<button type="button" class="week-cell ${cls}" title="${esc(h.name)} — ${day}${m ? " — " + m + " m" : ""}" ${future ? "disabled" : `data-action="toggle" data-id="${esc(h.id)}" data-day="${day}"`}>${done ? "✓" : ""}</button>`;
      }).join("");
      return `<div class="rowname">${esc(h.name)}</div>${cellsHtml}<div class="total">${c}/7</div>`;
    }).join("");

    const wEnd = addDays(wStart, 6);
    const weekLabel = State.weekOffset === 0 ? "Cette semaine"
      : wStart.getDate() + " " + MONTHS[wStart.getMonth()] + " – " + wEnd.getDate() + " " + MONTHS[wEnd.getMonth()];

    const weekNotes = [];
    weekDays.forEach((day, i) => {
      State.habits.forEach((h) => {
        const e = State.log[h.id + "|" + day];
        if (e && e.note && e.note.trim()) {
          const d = addDays(wStart, i);
          weekNotes.push({ name: h.name, when: DOW[i] + " " + d.getDate() + " " + MONTHS[d.getMonth()], note: e.note });
        }
      });
    });
    const notesHtml = weekNotes.length
      ? weekNotes.map((n) => `<div class="note-card"><span class="note-when">${esc(n.when)}</span><span class="note-name">${esc(n.name)}</span><span class="note-text">${esc(n.note)}</span></div>`).join("")
      : `<p class="p-muted" style="margin:0">Aucune note cette semaine. Ajoutez-en depuis l'écran Aujourd'hui.</p>`;

    el.innerHTML = `
      <div class="week-head-row">
        <h1${State.weekOffset === 0 ? "" : ' class="num"'}>${esc(weekLabel)}</h1>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" data-action="week-prev">← Précédente</button>
          <button type="button" class="btn" data-action="week-next">Suivante →</button>
        </div>
      </div>
      <div class="card week-table-wrap">
        <div class="week-table">
          <div></div>
          ${headsHtml}
          <div class="total" style="text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase">Total</div>
          ${rowsHtml}
        </div>
      </div>
      <p class="week-hint">${State.habits.some((h) => h.dist) ? "Nagé : <strong>" + formatDistance(volume(wStart, 7).total) + "</strong>. " : ""}Cliquez une case pour basculer le statut. Les jours à venir restent vides.</p>
      <h2>Notes de la semaine</h2>
      ${notesHtml}`;

    el.querySelectorAll('[data-action="toggle"]').forEach((b) => b.addEventListener("click", () => toggle(b.dataset.id, b.dataset.day)));
    el.querySelector('[data-action="week-prev"]').addEventListener("click", () => { State.weekOffset -= 1; renderWeek(); });
    el.querySelector('[data-action="week-next"]').addEventListener("click", () => { State.weekOffset = Math.min(0, State.weekOffset + 1); renderWeek(); });
  }

  function renderYear() {
    const el = document.getElementById("view-year");
    const today = new Date(State.today + "T12:00:00");
    const year = today.getFullYear();
    const jan1 = new Date(year, 0, 1, 12);
    const dec31 = new Date(year, 11, 31, 12);
    const gridStart = mondayOf(jan1);
    const weeks = Math.round((mondayOf(dec31) - gridStart) / (7 * 24 * 3600 * 1000)) + 1;

    let monthsHtml = "";
    let colsHtml = "";
    let lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const colStart = addDays(gridStart, w * 7);
      let cellsHtml = "";
      for (let i = 0; i < 7; i++) {
        const d = addDays(colStart, i);
        const inYear = d.getFullYear() === year;
        const day = ymd(d);
        const future = day > State.today;
        const n = (!inYear || future) ? 0 : State.habits.filter((h) => isDone(h.id, day)).length;
        const ratio = State.habits.length ? n / State.habits.length : 0;
        const bg = future ? "var(--color-future-beige)" : heatColor(ratio);
        cellsHtml += inYear
          ? `<div class="year-cell${day === State.today ? " auj" : ""}" title="${day} — ${n}/${State.habits.length}" style="background:${bg}"></div>`
          : `<div class="year-cell" style="background:transparent"></div>`;
      }
      colsHtml += `<div class="year-col">${cellsHtml}</div>`;
      const m = colStart.getMonth();
      const show = m !== lastMonth && colStart.getFullYear() === year;
      lastMonth = m;
      monthsHtml += `<div class="month-label">${show ? MONTHS[m] : ""}</div>`;
    }

    const legendHtml = [0, 0.3, 0.6, 0.9, 1].map((r) => `<div class="legend-cell" style="background:${heatColor(r)}"></div>`).join("");

    let full = 0;
    for (let d = new Date(jan1.getTime()); d.getFullYear() === year && ymd(d) <= State.today; d = addDays(d, 1)) {
      const day = ymd(d);
      if (State.habits.length && State.habits.every((h) => isDone(h.id, day))) full++;
    }

    const streakHtml = State.habits.map((h) => `
      <div class="streak-card">
        <div class="name">${esc(h.name)}</div>
        <div class="num">${streak(h.id)} j</div>
        <div class="detail">Record : ${best(h.id)} jours</div>
      </div>`).join("");

    el.innerHTML = `
      <h1 class="num">${year}</h1>
      <p class="p-muted">${full} jours parfaits en ${year}.${State.habits.some((h) => h.dist)
        ? " " + formatDistance(volume(jan1, Math.round((addDays(today, 1) - jan1) / 864e5)).total) + " nagés depuis le 1er janvier." : ""}</p>
      <div class="card year-card">
        <div class="year-inner">
          <div class="month-row">${monthsHtml}</div>
          <div class="year-grid">${colsHtml}</div>
        </div>
      </div>

      </div>
      <div class="streak-grid">${streakHtml || "<p class=\"p-muted\">—</p>"}</div>`;
    caleAnnee();
  }

  // Sur un ecran etroit la grille de l'annee defile de cote : on l'ouvre sur les
  // dernieres semaines (aujourd'hui aux trois quarts) plutot que sur janvier.
  // Sans effet tant que l'onglet est cache (largeur nulle) : rappele a l'ouverture.
  function caleAnnee() {
    const carte = document.querySelector("#view-year .year-card");
    const auj = carte && carte.querySelector(".year-cell.auj");
    if (!carte || !auj || !carte.clientWidth) return;
    const x = auj.getBoundingClientRect().left - carte.getBoundingClientRect().left + carte.scrollLeft;
    carte.scrollLeft = Math.max(0, x - carte.clientWidth * 0.75);
  }

        <input class="input goal-input" type="number" min="1" max="7" data-action="goal" data-id="${esc(h.id)}" value="${h.goal}">

    el.querySelectorAll('[data-action="name"]').forEach((inp) => inp.addEventListener("change", () => {

  function wipeAll() {
    const t = nowMs();
    State.habits.forEach((h) => { State.gone[h.id] = { u: t }; State.dirtyH[h.id] = 1; });
    Object.keys(State.log).forEach((k) => {
      State.log[k] = { done: false, note: "", del: 1, u: t };
      State.dirtyE[k] = 1;
    });
    Object.keys(State.times).forEach((id) => { State.times[id] = { del: 1, u: t }; State.dirtyT[id] = 1; });
    Object.keys(State.items).forEach((id) => { State.items[id] = { del: 1, u: t }; State.dirtyI[id] = 1; });
    State.chrono.sel = "";
    State.habits = defaultHabits();
    State.habits.forEach((h) => { h.u = t; delete State.gone[h.id]; State.dirtyH[h.id] = 1; });
    persist(); Sync.schedule(200); renderAll();
  }

  function renderAll() {
    renderTabs();
    renderToday();
    renderWeek();
    renderYear();
    renderChronos();
    renderManage();
    placerVisite();

  /* =========================================================================
     Chronos : les temps realises, par epreuve et par bassin (25 et 50 m ne se
     comparent pas). Le meilleur temps d'un couple epreuve + bassin est le
     record personnel (RP) ; la courbe montre la progression.
     ========================================================================= */
  function tempsVivants() {
    return Object.keys(State.times).map((id) => Object.assign({ id: id }, State.times[id])).filter((x) => !x.del);
  }
  // Temps d'une epreuve dans un bassin, du plus ancien au plus recent ; chacun
  // marque rp s'il battait tous ceux d'avant (le premier compte comme RP).
  function serie(ev, pool) {
    const liste = tempsVivants().filter((x) => x.ev === ev && x.pool === pool)
      .sort((a, b) => a.d.localeCompare(b.d) || a.u - b.u);
    let meilleur = Infinity;
    liste.forEach((x) => { x.rp = x.t < meilleur; if (x.rp) meilleur = x.t; });
    return liste;
  }
  function records() {
    const groupes = {};
    tempsVivants().forEach((x) => { const k = x.ev + "|" + x.pool; (groupes[k] = groupes[k] || []).push(x); });
    return Object.keys(groupes).map((k) => {
      const [ev, pool] = [k.split("|")[0], Number(k.split("|")[1])];
      const s = serie(ev, pool);
      const best = s.reduce((m, x) => (x.t < m.t ? x : m), s[0]);
      return { cle: k, ev: ev, pool: pool, best: best, n: s.length, premier: s[0], dernier: s[s.length - 1] };
    }).sort((a, b) => {
      const ia = EPREUVES.findIndex((e) => e.id === a.ev), ib = EPREUVES.findIndex((e) => e.id === b.ev);
      return ia - ib || a.pool - b.pool;
    });
  }

  // --- Objectifs et competitions : « items » synchronises ------------------
  function itemsDe(kind) {
    return Object.keys(State.items).map((id) => Object.assign({ id: id }, State.items[id]))
      .filter((x) => !x.del && x.k === kind && x.data);
  }
  function ecrireItem(id, k, data) {
    State.items[id] = { k: k, data: data, u: nowMs() };
    State.dirtyI[id] = 1;
    persist(); Sync.schedule();
  }
  function retirerItem(id) {
    if (!State.items[id]) return;
    State.items[id] = { del: 1, u: nowMs() };
    State.dirtyI[id] = 1;
    persist(); Sync.schedule();
  }
  function cleObjectif(ev, pool) { return "obj:" + ev + ":" + pool; }
  function objectif(ev, pool) {
    const x = State.items[cleObjectif(ev, pool)];
    return x && !x.del && x.data && x.data.t > 0 ? x.data.t : null;
  }
  // « Objectif 1:05.00 · encore 1.51 s », ou « atteint ».
  function texteObjectif(best, obj) {
    if (!obj) return "";
    return best <= obj ? "Objectif " + formatTemps(obj) + " atteint"
      : "Objectif " + formatTemps(obj) + " · encore " + ((best - obj) / 100).toFixed(2) + " s";
  }
  function meilleurTemps(ev, pool) {
    const s = serie(ev, pool);
    return s.length ? Math.min.apply(null, s.map((x) => x.t)) : null;
  }
  function competsAVenir() {
    return itemsDe("comp").filter((c) => c.data.d >= State.today).sort((a, b) => a.data.d.localeCompare(b.data.d));
  }
  function joursAvant(d) {
    return Math.round((new Date(d + "T12:00:00") - new Date(State.today + "T12:00:00")) / 864e5);
  }
  function libelleJours(n) { return n === 0 ? "Aujourd'hui" : n === 1 ? "Demain" : "J-" + n; }

  // --- Temps de passage ---------------------------------------------------
  // Temps cumules tous les 50 m, separes par des espaces, « ; » ou « / » (la virgule
  // sert aussi de decimale : « 31,20, 1:06,51 » marche grace a l'espace qui suit).
  // Le temps final peut etre repete en dernier : il est retire. null = illisible.
  function parsePassages(texte, ev, t) {
    const brut = String(texte || "").trim();
    if (!brut) return [];
    const morceaux = brut.replace(/,\s+/g, " ").split(/[\s;/|]+/).filter(Boolean);
    const sp = [];
    for (let i = 0; i < morceaux.length; i++) {
      const x = parseTemps(morceaux[i]);
      if (!x) return null;
      sp.push(x);
    }
    if (sp[sp.length - 1] === t) sp.pop();
    if (sp.length > Number(ev.split("-")[0]) / 50 - 1) return null;
    for (let i = 0; i < sp.length; i++) if (sp[i] >= t || (i && sp[i] <= sp[i - 1])) return null;
    return sp;
  }
  // Passages complets : le temps de chaque 50 m ; incomplets : les cumules tels quels.
  function textePassages(x) {
    if (!x.sp || !x.sp.length) return "";
    if (x.sp.length === Number(x.ev.split("-")[0]) / 50 - 1) {
      const tous = x.sp.concat([x.t]);
      return "Par 50 m : " + tous.map((v, i) => formatTemps(v - (i ? tous[i - 1] : 0))).join(" · ");
    }
    return "Passages : " + x.sp.map(formatTemps).join(" · ");
  }

  function ajouterTemps() {
    const C = State.chrono;
    const val = (id) => document.getElementById(id).value;
    const ev = val("ch-ev");
    const pool = Number(val("ch-pool")) === 50 ? 50 : 25;
    const d = val("ch-date");
    const comp = val("ch-comp") === "1" ? 1 : 0;
    const lieu = val("ch-lieu").trim().slice(0, 120);
    C.ev = ev; C.pool = pool; C.comp = comp;
    // Ce qui a ete tape survit au redessin en cas d'erreur.
    C.brouillon = { temps: val("ch-temps"), d: d, lieu: val("ch-lieu"), pass: val("ch-pass") };
    const erreur = (m, champ) => {
      C.msg = m; C.msgType = "err"; renderChronos();
      const c = document.getElementById(champ);
      if (c) c.focus();
    };
    const t = parseTemps(C.brouillon.temps);
    if (!t) return erreur("Temps illisible. Écrivez par exemple 1:05.32 ou 31.84.", "ch-temps");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > State.today) return erreur("Date invalide (pas dans le futur).", "ch-date");
    const sp = parsePassages(C.brouillon.pass, ev, t);
    if (!sp) return erreur("Passages illisibles : les temps cumulés tous les 50 m, du plus petit au plus grand, par exemple 31.20 1:06.51.", "ch-pass");

    const ancienRp = meilleurTemps(ev, pool);
    const id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    State.times[id] = { ev: ev, pool: pool, t: t, d: d, comp: comp, lieu: lieu, sp: sp, u: nowMs() };
    State.dirtyT[id] = 1;
    C.sel = ev + "|" + pool;
    C.brouillon = null;
    const nom = nomEpreuve(ev) + " (" + pool + " m)";
    if (ancienRp === null) { C.msg = "Premier temps sur " + nom + " : " + formatTemps(t) + "."; C.msgType = "ok"; }
    else if (t < ancienRp) { C.msg = "Record personnel sur " + nom + " : " + formatTemps(t) + " (" + formatEcart(t - ancienRp) + ")."; C.msgType = "ok"; }
    else { C.msg = formatTemps(t) + " noté. Record : " + formatTemps(ancienRp) + " (" + formatEcart(t - ancienRp) + ")."; C.msgType = ""; }
    const obj = objectif(ev, pool);
    if (obj && t <= obj && (ancienRp === null || ancienRp > obj)) C.msg += " Objectif de " + formatTemps(obj) + " atteint !";
    persist(); Sync.schedule(); renderChronos(); renderToday();
    const champ = document.getElementById("ch-temps");
    if (champ) champ.focus();
  }

  function supprimerTemps(id) {
    const x = State.times[id];
    if (!x || x.del) return;
    if (!window.confirm("Supprimer le temps " + formatTemps(x.t) + " du " + dateCourte(x.d) + " ?")) return;
    State.times[id] = { del: 1, u: nowMs() };
    State.dirtyT[id] = 1;
    State.chrono.msg = "";
    persist(); Sync.schedule(); renderChronos(); renderToday();
  }

  function enregistrerObjectif(ev, pool) {
    const C = State.chrono;
    const brut = document.getElementById("obj-temps").value;
    const t = parseTemps(brut);
    if (!t) {
      C.objMsg = "Objectif illisible, par exemple 1:05.00."; C.objMsgType = "err"; renderChronos();
      const c = document.getElementById("obj-temps");
      if (c) { c.value = brut; c.focus(); }
      return;
    }
    ecrireItem(cleObjectif(ev, pool), "obj", { t: t });
    C.objMsg = "Objectif enregistré."; C.objMsgType = "ok";
    renderChronos(); renderToday();
  }

  function ajouterCompet() {
    const C = State.chrono;
    const val = (id) => document.getElementById(id).value;
    const nom = val("co-nom").trim().slice(0, 80);
    const d = val("co-date");
    if (!nom || !/^\d{4}-\d{2}-\d{2}$/.test(d) || d < State.today) return;   // le navigateur a deja signale le champ
    const evs = Array.from(document.querySelectorAll('#compet-form input[name="co-ev"]:checked')).map((i) => i.value);

    ecrireItem(id, "comp", { nom: nom, d: d, lieu: val("co-lieu").trim().slice(0, 80), pool: Number(val("co-pool")) === 50 ? 50 : 25, evs: evs });
    C.compOuvert = false;
    C.compMsg = "« " + nom + " » ajoutée.";
    renderChronos(); renderToday();
  }
  function supprimerCompet(id) {
    const c = State.items[id];
    if (!c || c.del) return;
    if (!window.confirm("Supprimer la compétition « " + c.data.nom + " » ?")) return;
    retirerItem(id);
    State.chrono.compMsg = "";
    renderChronos(); renderToday();
  }

  // Carte « Prochaine compétition » de l'onglet Aujourd'hui : compte a rebours,
  // et pour chaque epreuve engagee le record et l'objectif dans ce bassin.
  function competCarte() {
    const c = competsAVenir()[0];
    if (!c) return "";
    const evs = (c.data.evs || []).map((ev) => {
      const rp = meilleurTemps(ev, c.data.pool), obj = objectif(ev, c.data.pool);
      return `<li><span>${esc(nomEpreuve(ev))}</span><span class="temps">${rp ? "RP " + formatTemps(rp) : "pas de temps"}${obj ? " · obj. " + formatTemps(obj) : ""}</span></li>`;
    }).join("");
    return `<div class="card compet-carte">
        <p class="eyebrow">Prochaine compétition</p>
        <div class="compet-j">${libelleJours(joursAvant(c.data.d))}</div>
        <p class="compet-nom">${esc(c.data.nom)}</p>
        <p class="compet-info">${esc(dateCourte(c.data.d))}${c.data.lieu ? " · " + esc(c.data.lieu) : ""} · bassin ${c.data.pool} m</p>
        ${evs ? `<ul class="compet-evs">${evs}</ul>` : ""}
      </div>`;
  }

  // --- Pour l'entraineur : CSV et fiche a imprimer --------------------------
  function exporterCSV() {
    // Point-virgule : le separateur qu'attend Excel en francais. Un texte qui commence
    // par = + - @ serait lu comme une formule : on le neutralise d'une apostrophe.
    const cel = (v) => {
      let s = String(v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lignes = [["Date", "Épreuve", "Bassin", "Temps", "Passages", "Contexte", "Lieu", "Record à ce moment"]];
    records().forEach((r) => serie(r.ev, r.pool).forEach((x) => lignes.push([
      x.d, nomEpreuve(x.ev), x.pool + " m", formatTemps(x.t), (x.sp || []).map(formatTemps).join(" "),
      x.comp ? "Compétition" : "Entraînement", x.lieu || "", x.rp ? "oui" : ""])));
    const csv = "﻿" + lignes.map((l) => l.map(cel).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "trak-chronos-" + State.today + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function remplirFiche() {
    const recs = records();
    const lignes = recs.map((r) => {
      const obj = objectif(r.ev, r.pool), gain = r.n > 1 ? r.best.t - r.premier.t : 0;
      return `<tr><td>${esc(nomEpreuve(r.ev))}</td><td>${r.pool} m</td><td class="temps"><strong>${formatTemps(r.best.t)}</strong></td>
        <td>${esc(dateCourte(r.best.d))}${r.best.lieu ? "<br>" + esc(r.best.lieu) : ""}</td>
        <td>${esc(textePassages(r.best)) || "—"}</td>
        <td class="temps">${obj ? formatTemps(obj) + (r.best.t <= obj ? " (atteint)" : " (" + formatEcart(r.best.t - obj) + ")") : "—"}</td>
        <td>${r.n} temps${gain < 0 ? ", " + formatEcart(gain) : ""}</td></tr>`;
    }).join("");
    const compets = competsAVenir().map((c) => `<li><strong>${esc(c.data.nom)}</strong> — ${esc(dateCourte(c.data.d))}${c.data.lieu ? ", " + esc(c.data.lieu) : ""}, bassin ${c.data.pool} m${(c.data.evs || []).length ? " : " + esc(c.data.evs.map(nomEpreuve).join(", ")) : ""}</li>`).join("");
    let vol = "";
    if (State.habits.some((h) => h.dist)) {

      }).join("");
      vol = `<h2>Volume nagé, quatre dernières semaines</h2><table class="fiche-vol"><tbody>${sem}</tbody></table>`;
    }
    document.getElementById("fiche").innerHTML = `
      <h1>Fiche nageur — records et objectifs</h1>
      <p class="fiche-date">Éditée le ${esc(dateCourte(State.today))} avec Trak.</p>
      <h2>Records personnels</h2>
      ${lignes ? `<table><thead><tr><th>Épreuve</th><th>Bassin</th><th>Record</th><th>Date, lieu</th><th>Passages</th><th>Objectif</th><th>Progression</th></tr></thead><tbody>${lignes}</tbody></table>` : "<p>Aucun temps enregistré.</p>"}
      ${compets ? `<h2>Compétitions à venir</h2><ul>${compets}</ul>` : ""}
      ${vol}`;
  }
  function imprimerFiche() {
    remplirFiche();
    window.print();
  }

  function renderChronos() {
    const el = document.getElementById("view-chronos");
    const C = State.chrono;
    const B = C.brouillon || {};
    const recs = records();
    if (!recs.some((r) => r.cle === C.sel)) C.sel = recs.length ? recs[0].cle : "";

    const options = NAGES.map((n) => `<optgroup label="${esc(n.nom[0].toUpperCase() + n.nom.slice(1))}">${
      EPREUVES.filter((e) => e.nage === n.id).map((e) => `<option value="${e.id}"${e.id === C.ev ? " selected" : ""}>${esc(e.nom)}</option>`).join("")
    }</optgroup>`).join("");

    const cartes = recs.map((r) => {
      const gain = r.n > 1 ? r.best.t - r.premier.t : 0;
      const obj = objectif(r.ev, r.pool);
      return `<button type="button" class="rp-card${r.cle === C.sel ? " active" : ""}" data-action="chrono-sel" data-cle="${r.cle}" aria-pressed="${r.cle === C.sel}">
          <div class="name">${esc(nomEpreuve(r.ev))}</div>
          <div class="bassin">Bassin ${r.pool} m</div>
          <div class="num temps">${formatTemps(r.best.t)}</div>
          <div class="detail">${esc(dateCourte(r.best.d))} · ${r.n} temps${gain < 0 ? ` · <span class="gain">${formatEcart(gain)}</span> depuis le premier` : ""}</div>
          ${obj ? `<div class="objectif${r.best.t <= obj ? " atteint" : ""}">${esc(texteObjectif(r.best.t, obj))}</div>` : ""}
        </button>`;
    }).join("");

    let detail = "";
    const r = recs.find((x) => x.cle === C.sel);
    if (r) {
      const s = serie(r.ev, r.pool);
      const obj = objectif(r.ev, r.pool);
      const lignes = s.slice().reverse().map((x) => `<tr>

  // Courbe SVG dessinee a la largeur reelle du conteneur (le texte garde sa
  // taille sur telephone). Axe vertical inverse : un temps plus court monte.
  // obj (facultatif) : ligne pointillee de l'objectif.
  function dessinerCourbe(s, obj) {
    const box = document.getElementById("courbe");
    if (!box || s.length < 2) return;
    const W = Math.max(260, box.clientWidth || 600), H = 220;
    const g = { l: 52, r: 14, t: 14, b: 28 };
    const jours = s.map((x) => new Date(x.d + "T12:00:00").getTime());
    let x0 = Math.min.apply(null, jours), x1 = Math.max.apply(null, jours);
    if (x1 === x0) { x0 -= 864e5; x1 += 864e5; }
    const ts = s.map((x) => x.t).concat(obj ? [obj] : []);
    let lo = Math.min.apply(null, ts), hi = Math.max.apply(null, ts);
    const marge = Math.max(10, (hi - lo) * 0.1);
    lo -= marge; hi += marge;
    // Graduations rondes (0,5 s, 1 s, 2 s...) : 4 intervalles au plus, bornes calees dessus.
    const pas = [10, 20, 25, 50, 100, 200, 500, 1000, 2000, 3000, 6000, 12000, 30000].find((p) => (hi - lo) / p <= 4) || 60000;
    lo = Math.floor(lo / pas) * pas; hi = Math.ceil(hi / pas) * pas;
    const graduation = (t) => (pas % 100 === 0 ? formatTemps(t).replace(/\.00$/, "") : formatTemps(t));
    const X = (ms) => g.l + (ms - x0) / (x1 - x0) * (W - g.l - g.r);
    const Y = (t) => g.t + (t - lo) / (hi - lo) * (H - g.t - g.b);   // petit temps = haut

    let grille = "";
    for (let t = lo; t <= hi; t += pas) {
      const y = Y(t).toFixed(1);
      grille += `<line class="grille" x1="${g.l}" x2="${W - g.r}" y1="${y}" y2="${y}"/><text class="axe" x="${g.l - 8}" y="${y}" dy="4" text-anchor="end">${graduation(t)}</text>`;
    }
    const cible = obj ? `<line class="objectif-ligne" x1="${g.l}" x2="${W - g.r}" y1="${Y(obj).toFixed(1)}" y2="${Y(obj).toFixed(1)}"/>`
      + `<text class="objectif-txt" x="${W - g.r}" y="${(Y(obj) - 6).toFixed(1)}" text-anchor="end">objectif ${formatTemps(obj)}</text>` : "";
    const dates = [s[0], s[s.length - 1]].map((x, i) =>
      `<text class="axe" x="${X(jours[i ? s.length - 1 : 0]).toFixed(1)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}">${esc(dateCourte(x.d))}</text>`).join("");
    const pts = s.map((x, i) => X(jours[i]).toFixed(1) + "," + Y(x.t).toFixed(1));
    const points = s.map((x, i) => {
      const cx = X(jours[i]).toFixed(1), cy = Y(x.t).toFixed(1);
      return `<circle class="point${x.rp ? " rp" : ""}" cx="${cx}" cy="${cy}" r="4.5"/>`
        + `<circle class="cible" cx="${cx}" cy="${cy}" r="14" tabindex="0" data-i="${i}" role="img" aria-label="${esc(dateCourte(x.d))} : ${formatTemps(x.t)}${x.rp ? ", record à ce moment" : ""}"/>`
        + `<circle class="halo" cx="${cx}" cy="${cy}" r="8"/>`;
    }).join("");

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" aria-label="Progression des temps${obj ? ", objectif " + formatTemps(obj) : ""}">${grille}${cible}${dates}`
      + `<polyline class="ligne" points="${pts.join(" ")}"/>${points}</svg><div class="bulle-courbe" hidden></div>`;

    const bulle = box.querySelector(".bulle-courbe");
    const montrer = (c) => {
      const x = s[Number(c.dataset.i)];
      box.querySelectorAll(".halo.on").forEach((h) => h.classList.remove("on"));
      c.nextElementSibling.classList.add("on");
      bulle.innerHTML = `<strong>${formatTemps(x.t)}</strong>${x.rp ? " · RP" : ""}<br>${esc(dateCourte(x.d))}${x.lieu ? " · " + esc(x.lieu) : ""}`
        + (x.sp && x.sp.length ? "<br>" + esc(textePassages(x)) : "");
      bulle.style.left = Math.min(Math.max(c.cx.baseVal.value, 90), W - 90) + "px";
      bulle.style.top = c.cy.baseVal.value + "px";
      bulle.hidden = false;
    };
    const cacher = () => { bulle.hidden = true; box.querySelectorAll(".halo.on").forEach((h) => h.classList.remove("on")); };
    box.querySelectorAll(".cible").forEach((c) => {
      c.addEventListener("mouseenter", () => montrer(c));
      c.addEventListener("focus", () => montrer(c));
      c.addEventListener("click", () => montrer(c));
      c.addEventListener("mouseleave", cacher);
      c.addEventListener("blur", cacher);
    });
  }
  function render() { renderAll(); }

  /* =========================================================================
     Mascotte : petite creature ronde, heritiere du point vert du logo.
     Ses tenues se debloquent avec le record de serie (meilleure serie, toutes
     habitudes confondues). Le record se recalcule depuis le journal, donc suit

     ========================================================================= */

  const MKEY = "trak.mascotte.v1";

  // palier = record (en jours) necessaire ; « le » sert aux phrases du toast.
  const M_COULEURS = [
    { id: "vert", nom: "Vert", adj: "verte", palier: 0, le: "le vert",

  ];
  const M_ACCESSOIRES = [
    { id: "aucun", nom: "Aucun", palier: 0, avec: "", le: "" },
    { id: "echarpe", nom: "Écharpe", palier: 7, avec: "une écharpe", le: "l'écharpe" },
    { id: "lunettes", nom: "Lunettes", palier: 14, avec: "des lunettes", le: "les lunettes" },

  ];
  // Tous les paliers, couleurs et accessoires melanges, du plus proche au plus lointain.
  const M_PALIERS = M_COULEURS.map((c) => Object.assign({ type: "couleur" }, c))
    .concat(M_ACCESSOIRES.map((a) => Object.assign({ type: "accessoire" }, a)))
    .filter((p) => p.palier > 0)
    .sort((a, b) => a.palier - b.palier);
  const M_HUMEURS = { endormie: 1, contente: 1, ravie: 1 };

  const Mascotte = {

    cleEntete: "", retourFocus: null, toastTimer: null
  };

  function trouverTenue(liste, id) {
    for (let i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i];
    return null;

  // Dessin en SVG inline, viewBox 100 x 100 : lisible de 30 a 140 px.
  // o = { humeur, couleur, accessoire, taille, saute, fixe (sans animation), decoratif (cache aux lecteurs d'ecran) }
  function mascotteSVG(o) {
    o = o || {};

    const coul = trouverTenue(M_COULEURS, o.couleur) || M_COULEURS[0];
    const acc = trouverTenue(M_ACCESSOIRES, o.accessoire) || M_ACCESSOIRES[0];
    const taille = o.taille || 120;
    // En tout petit (en-tete), zzz, etincelles et ombre au sol ne seraient que du bruit.
    const details = taille >= 60;
    const surLaTete = acc.id === "chapeau" || acc.id === "couronne";

    // Derriere le corps : cape, bras et pieds (seuls les bouts depassent).
    let derriere = "";
    if (acc.id === "cape") {
      derriere += `<path d="M27 50 Q13 76 10 95 Q50 101 90 95 Q87 76 73 50 Z" fill="#c2502f"/>`
        + `<path d="M31 58 Q21 78 19 93 Q50 98 81 93 Q79 78 69 58 Z" fill="#93361f"/>`;
    }
    derriere += `<ellipse class="m-ombre" cx="14" cy="66" rx="6" ry="8" transform="rotate(20 14 66)"/>`
      + `<ellipse class="m-ombre" cx="86" cy="66" rx="6" ry="8" transform="rotate(-20 86 66)"/>`
      + `<ellipse class="m-ombre" cx="37" cy="92" rx="10" ry="5.5"/>`
      + `<ellipse class="m-ombre" cx="63" cy="92" rx="10" ry="5.5"/>`;

    // Corps : un disque d'ombre decale sous le disque principal donne le volume,

    const corps = `<circle class="m-ombre" cx="50" cy="58" r="37.5"/>`

      + `<ellipse class="m-clair" cx="50" cy="75" rx="19" ry="12" opacity=".55"/>`
      + `<ellipse cx="35" cy="35" rx="8.5" ry="5.5" fill="#fff" opacity=".45" transform="rotate(-35 35 35)"/>`

    // Une pousse sur le crane, sauf si un chapeau ou une couronne prend la place.
    const pousse = surLaTete ? ""
